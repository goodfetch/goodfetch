# cargo-hakari's settings for `goodfetch-workspace-hack` and
# `goodfetch-dev-workspace-hack` (ADR 0094, #2089 and 2026-11-27 note),
# which ci/workspace-hack.sh writes and `just lint` checks:
# `goodfetch-workspace-hack` keeps the build-dependency tables in
# `[dependencies]`, and `goodfetch-dev-workspace-hack` keeps the code-side
# tables in `[dev-dependencies]` (see the script).
# https://docs.rs/cargo-hakari/latest/cargo_hakari/config
hakari-package = "goodfetch-workspace-hack"
dep-format-version = "4"
# The workspace's resolver is "3", which hakari reads as "2".
resolver = "2"
# The hosts that build: the gate server and the owner's Mac. Each gets the
# platform-specific lines only it needs.
platforms = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# The build side's own features stay separate from the code side's: release
# and `--bin` builds take only `goodfetch-workspace-hack` (build side), while
# test and `--all-targets` builds also take `goodfetch-dev-workspace-hack`
# (code side).
unify-target-host = "none"
# `goodfetch-workspace-hack.workspace = true` in each member, as every
# dependency is declared (STYLE.md, Dependencies).
workspace-hack-line-style = "workspace-dotted"
# `goodfetch-dev-workspace-hack` holds the previous code-side output; exclude
# it from traversal so stale entries cannot feed back into regeneration.
[traversal-excludes]
workspace-members = ["goodfetch-dev-workspace-hack"]
# The Kennel's workspace (ADR 0141), with its own lockfile, links
# `goodfetch-protocol` by path: kept out, so the Kennel takes none of the
# workspace-hack's lines. `goodfetch-dev-workspace-hack` has no build script
# or proc-macros of its own.
[final-excludes]
workspace-members = ["goodfetch-protocol", "goodfetch-dev-workspace-hack"]
