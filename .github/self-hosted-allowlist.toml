# Every job that may reach a self-hosted runner (ADRs 0108 and 0135), with its
# workflow (a file name under .github/workflows/), its events, the patterns
# of GITHUB_REF it runs on (`*` matches any text) and its exact `if:`.
#
# `xtask self-hosted check` (Quick suite) refuses any job naming a
# self-hosted runner off this list or differing from its entry. The owner
# installs a copy on the machine with `just runner-install <folder>`; the
# pre-job script checks every job against that copy, and fails a pull-request
# job whose head is not a branch of this repository.
repository = "goodfetch/goodfetch"

# The pull-request tier runs on GitHub's standard hosted runners (ADR 0135's
# amendment of 2026-11-22), so none of its jobs is here.
[[job]]
workflow = "lab.yml"
job = "lab"
events = ["pull_request"]
refs = ["refs/pull/*/merge"]
if = "github.event.pull_request.head.repo.full_name == github.repository"

# The only writer of Reference screenshots (ADR 0073), dispatched by hand on a
# pull request's branch, never on `main`. Only those with write access can
# dispatch it. Admitted by the owner's decision of 2026-10-19 (ADRs 0108 and
# 0135): the repository is private, only the owner pushes branches, and forks
# are refused.
[[job]]
workflow = "update-screenshots.yml"
job = "update"
events = ["workflow_dispatch"]
refs = ["refs/heads/*"]
if = "github.ref != 'refs/heads/main'"

# The diagnostic runs of a failed macOS cell of a Release run on `main`, run
# where the cell ran (ADRs 0064 and 0108). `workflow_run` runs on the default
# branch. Admitted by the owner's decision of 2026-10-19 (ADRs 0108 and 0135).
[[job]]
workflow = "diagnostic.yml"
job = "rerun-owner-machine"
events = ["workflow_run"]
refs = ["refs/heads/main"]
if = "github.event.workflow_run.head_branch == 'main' && needs.select.outputs.owner-machine-count != '0'"

# The cache-warming job, on pushes to `main` (ADR 0135).
[[job]]
workflow = "cache-warming.yml"
job = "warm"
events = ["push"]
refs = ["refs/heads/main"]
if = "github.ref == 'refs/heads/main'"

# The Release suite's macOS cells and the visual projects beside them, on a
# manual dispatch on `main` only, testing a commit of `main` (ADR 0108). They
# run even when the ceiling held the hosted cells back, so their `if:` starts
# with `!cancelled()`. Their diagnostic jobs (ADR 0064) are diagnostic.yml's
# `rerun-owner-machine`, above.
[[job]]
workflow = "release-suite.yml"
job = "macos-arm64"
events = ["workflow_dispatch"]
refs = ["refs/heads/main"]
if = "!cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.plan.outputs.commit != '' && contains(fromJSON(needs.plan.outputs.cells), 'macos-arm64')"

[[job]]
workflow = "release-suite.yml"
job = "macos-x64"
events = ["workflow_dispatch"]
refs = ["refs/heads/main"]
if = "!cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.plan.outputs.commit != '' && contains(fromJSON(needs.plan.outputs.cells), 'macos-x64')"

[[job]]
workflow = "release-suite.yml"
job = "visual"
events = ["workflow_dispatch"]
refs = ["refs/heads/main"]
if = "!cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.plan.outputs.commit != '' && contains(fromJSON(needs.plan.outputs.cells), 'macos-arm64')"
