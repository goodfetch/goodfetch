# The cache-warming job (ADRs 0061 and 0071): after each push to `main`, it
# builds the pull-request tier's dependencies, tests and benchmark targets
# with the tier's profiles, without running them, in the hosted tier's job
# container on a standard hosted runner (ci/hosted/start.sh, #3385). The
# build cache holds each commit's four test listings too, which the stress
# run of a pull request whose base it is reads (ADR 0064). It saves nothing
# yet: what goes into GitHub's 10 GB cache is chosen from the sizes the first
# hosted Pre-merge run logs (ADR 0061's note of 2026-11-23, #3378), and the
# save steps land with that choice. The workflow stays disabled until then.
# One run at a time: a newer waiting run replaces an older one.
name: cache warming

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: cache-warming
  cancel-in-progress: false

jobs:
  warm:
    name: warm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the CI image of the tree's Containerfile
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/goodfetch/ci-image
          key: pull-request-ci-image-Linux-${{ hashFiles('ci/image/Containerfile') }}
      - name: Start the job's container
        run: ci/hosted/start.sh
      - name: Build the tier's targets
        run: ci/hosted/exec.sh just warm
