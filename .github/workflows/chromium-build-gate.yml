# The Chromium build gate (ADR 0074; ticket #400): one required check on every
# pull request (to `main` or a release branch) and the merge queue, never
# path-filtered. Until the gate's free design is decided in #445 and the first
# digest manifest is committed under `chromium/manifest.json`, the fast path
# passes and builds nothing. In the merge queue, any attestation or HTTP
# profile mismatch fails immediately.
#
# Kept disabled in the repository's Actions settings until the hosted-CI spec
# (#3373) turns workflows on (AGENTS.md, Merging).
name: Chromium build gate

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: chromium-build-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromium-build-gate:
    name: Chromium build gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute input tree hashes and check fast path
        run: >-
          cargo run --quiet --locked --bin xtask --
          chromium gate check
          --event "${{ github.event_name }}"
          --junit target/junit/chromium-build.xml
      - name: Record the job's context beside its JUnit files
        if: always()
        run: ci/junit-context.sh
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-chromium-chromium-build-linux-x64-1
          path: target/junit/
          if-no-files-found: ignore
