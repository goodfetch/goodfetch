# Diagnostic runs (ADR 0064; TESTING.md, After merge): after a failed run of
# a test-health job or a manual-dispatch Release run (the release suite,
# #145), each test that failed runs 20 more times on the same commit and the
# same OS, in a job of its own, 10 minutes at most. Any pass marks it flaky,
# which the scan finds once this run is ingested (results.yml); 20 failures
# mark it broken, an ordinary failure. A diagnostic run never changes a
# verdict: the failed run stays red. The merge queue, the nightly tier and the
# release pipeline join the trigger as they come; the Chromium build gate's
# diagnostic jobs (60 minutes, ADR 0074) come with its first build (#445).
#
# While the repository is private, a hosted diagnostic run counts toward test
# health's 1,000 minutes and is skipped once the month leaves no room for the
# 10 minutes of each of its hosted Linux jobs (ADRs 0064 and 0108). A failed
# macOS cell is rerun on the standard hosted macOS label it ran on, outside
# the ceiling as that cell is (#3385). Failures of the Release suite's Linux arm64 and Windows
# cells get no diagnostic job yet, and a hosted rerun takes the host-tools
# action's default runtimes, ci/runtimes.toml's pre-merge set, not a musl
# cell's or each Node.js line's.
name: diagnostic

# `workflow_run` is what follows a finished run. The runs it follows start only
# on schedule or by hand, never from a fork's pull request, and the jobs that
# run their code hold no secret.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [test health, release suite]
    types: [completed]

permissions: {}

jobs:
  select:
    name: select
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      admitted: ${{ steps.ceiling.outputs.admitted }}
      hosted-count: ${{ steps.hosted.outputs.count }}
      hosted: ${{ steps.hosted.outputs.matrix }}
      macos-arm64-count: ${{ steps.macos-arm64.outputs.count }}
      macos-arm64: ${{ steps.macos-arm64.outputs.matrix }}
      macos-x64-count: ${{ steps.macos-x64.outputs.count }}
      macos-x64: ${{ steps.macos-x64.outputs.matrix }}
    steps:
      - name: Check out main's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the results store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/test-results
          token: ${{ secrets.TEST_RESULTS_TOKEN }}
          path: test-results
          persist-credentials: false
      - name: Build xtask
        uses: ./.github/actions/xtask # zizmor: ignore[self-repository] actionlint lacks the $/ form
      - name: Download the failed run's JUnit files
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: >-
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --dir target/artifacts --pattern 'junit-*'
          || echo "The run uploaded no JUnit file."
      - name: Choose the failed tests of hosted Linux x64
        id: hosted
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          cargo run --quiet --locked --bin xtask -- results failed --repository "$GITHUB_REPOSITORY"
          --run-id "$RUN" --attempt "$ATTEMPT" --artifacts target/artifacts --os linux --arch x64
          | tee -a "$GITHUB_OUTPUT"
      - name: Choose the failed tests of macOS arm64
        id: macos-arm64
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          cargo run --quiet --locked --bin xtask -- results failed --repository "$GITHUB_REPOSITORY"
          --run-id "$RUN" --attempt "$ATTEMPT" --artifacts target/artifacts --os macos --arch arm64
          | tee -a "$GITHUB_OUTPUT"
      - name: Choose the failed tests of macOS x64
        id: macos-x64
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          cargo run --quiet --locked --bin xtask -- results failed --repository "$GITHUB_REPOSITORY"
          --run-id "$RUN" --attempt "$ATTEMPT" --artifacts target/artifacts --os macos --arch x64
          | tee -a "$GITHUB_OUTPUT"
      # Room for every hosted job's 10-minute timeout, or none starts.
      - name: Check the month's minutes against the ceiling
        id: ceiling
        env:
          HOSTED_COUNT: ${{ steps.hosted.outputs.count }}
          # This run's repository visibility decides which minutes bill.
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          cargo run --quiet --locked --bin xtask -- results ceiling --store test-results
          --run diagnostic --jobs "$HOSTED_COUNT" --today "$(date -u +%F)"
          --summary "$GITHUB_STEP_SUMMARY"
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          | tee -a "$GITHUB_OUTPUT"
      - name: Name the failed tests left undiagnosed
        env:
          HOSTED_LEFT_OUT: ${{ steps.hosted.outputs.left_out }}
          MACOS_ARM64_LEFT_OUT: ${{ steps.macos-arm64.outputs.left_out }}
          MACOS_X64_LEFT_OUT: ${{ steps.macos-x64.outputs.left_out }}
        run: |
          left_out=$((HOSTED_LEFT_OUT + MACOS_ARM64_LEFT_OUT + MACOS_X64_LEFT_OUT))
          if [[ $left_out -gt 0 ]]; then
            echo "### $left_out failed tests past the first 20 get no diagnostic run" >>"$GITHUB_STEP_SUMMARY"
          fi

  rerun:
    name: rerun
    needs: select
    if: needs.select.outputs.admitted == 'true' && needs.select.outputs.hosted-count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.hosted) }}
    permissions:
      contents: read
    steps:
      - name: Check out the commit the failed run tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Install the tools and dependencies
        uses: ./.github/actions/host-tools # zizmor: ignore[self-repository] actionlint lacks the $/ form
        with:
          target: x86_64-unknown-linux-gnu
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: the failed test, 20 times"
        env:
          TEST: ${{ matrix.test }}
        run: ci/egress/under-deny.sh just repeat 20 --test "$TEST"
      - name: Check that the deny refused nothing else
        if: always()
        run: ci/egress/egress.sh check
      - name: Record the job's context beside its JUnit files
        if: always()
        run: ci/junit-context.sh 20
      - name: Summarize the failed tests
        if: always()
        run: ci/junit-summary.sh
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.suite }}-diagnostic-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.runtime && format('-{0}', matrix.runtime) || '' }}-${{ strategy.job-index }}
          path: target/junit/
          if-no-files-found: ignore

  # A failed macOS cell is diagnosed on the standard hosted label it ran on,
  # outside the deny as that cell runs (ADR 0043's amendment of 2026-11-22,
  # #3385).
  rerun-macos-arm64:
    name: rerun (macOS arm64)
    needs: select
    if: needs.select.outputs.macos-arm64-count != '0'
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.macos-arm64) }}
    permissions:
      contents: read
    env:
      # As the Release suite's macOS cells (issue 3224).
      GOODFETCH_TEST_NO_GUI_SESSION: "1"
    steps:
      - name: Check out the commit the failed run tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Install the tools and dependencies
        uses: ./.github/actions/host-tools # zizmor: ignore[self-repository] actionlint lacks the $/ form
        with:
          target: aarch64-apple-darwin
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: "Test: the failed test, 20 times"
        env:
          TEST: ${{ matrix.test }}
        run: just repeat 20 --test "$TEST"
      - name: Record the job's context beside its JUnit files
        if: always()
        run: ci/junit-context.sh 20
      - name: Summarize the failed tests
        if: always()
        run: ci/junit-summary.sh
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.suite }}-diagnostic-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.runtime && format('-{0}', matrix.runtime) || '' }}-${{ strategy.job-index }}
          path: target/junit/
          if-no-files-found: ignore

  rerun-macos-x64:
    name: rerun (macOS x64)
    needs: select
    if: needs.select.outputs.macos-x64-count != '0'
    runs-on: macos-15-intel
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.macos-x64) }}
    permissions:
      contents: read
    env:
      # As the Release suite's macOS cells (issue 3224).
      GOODFETCH_TEST_NO_GUI_SESSION: "1"
    steps:
      - name: Check out the commit the failed run tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Install the tools and dependencies
        uses: ./.github/actions/host-tools # zizmor: ignore[self-repository] actionlint lacks the $/ form
        with:
          target: x86_64-apple-darwin
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: "Test: the failed test, 20 times"
        env:
          TEST: ${{ matrix.test }}
        run: just repeat 20 --test "$TEST"
      - name: Record the job's context beside its JUnit files
        if: always()
        run: ci/junit-context.sh 20
      - name: Summarize the failed tests
        if: always()
        run: ci/junit-summary.sh
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.suite }}-diagnostic-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.runtime && format('-{0}', matrix.runtime) || '' }}-${{ strategy.job-index }}
          path: target/junit/
          if-no-files-found: ignore
