          path: target/smoke-chromium
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: signed-bundle smoke on Linux"
        run: >-
          ci/egress/under-deny.sh ci/release/smoke-signed-chromium.sh
          target/smoke-chromium
          target/smoke-binaries/x86_64-unknown-linux-gnu/goodfetch-collie
          target/smoke-binaries/x86_64-unknown-linux-gnu/goodfetch-proving-ground
      - name: Check that the deny refused nothing else
        if: always()
        run: ci/egress/egress.sh check

