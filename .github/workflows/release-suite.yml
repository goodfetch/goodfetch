# The Release suite while the repository is private (ADRs 0061, 0094 and
# 0108): dispatched by hand with `just release-ci`, never on a pull request.
# It must pass on a commit of `main` before each milestone's owner test and
# before any release; a passing run is every cell green on one commit of
# `main`, from one or more dispatches (`xtask release-suite verdict`).
#
# The matrix (ADR 0108), every cell on a standard GitHub-hosted runner
# under the ceiling of 600 minutes that bill a month, which the `plan` job
# checks before any of them starts (#3383):
#   - linux-x64-gnu, linux-x64-musl, linux-arm64-gnu, linux-arm64-musl and
#     windows-x64;
#   - macos-arm64 on `macos-15` and macos-x64 natively on `macos-15-intel`,
#     on `main` only, with the visual projects in the pinned Playwright image
#     (ADR 0073) on `ubuntu-24.04` beside them;
#   - Windows arm64 first runs in the release pipeline's own Release run.
# A dispatch off `main` runs the other cells alone, on the branch's pushed
# head. On `main` it tests the commit the `commit` input names, `main`'s
# head by default, and the `plan` job refuses a commit off `main`'s history
# before any job checks it out.
#
# Each cell is one job: it builds the target's tests once (`cargo nextest
# archive`) and both Products' executables from one invocation (ADR 0094),
# saves the target's size report keyed by the tested tree (on `main`), then
# runs every runner under ADR 0043's deny: nextest by `--partition hash:k/n`,
# Vitest and Playwright by `--shard k/n`, pytest by pytest-xdist, never by
# timings. While private, a cell holds one shard: a second job per cell
# would spend setup minutes under the ceiling and pass the archive through
# the account's Actions storage. A cell that breaches its 45-minute budget
# is split into a build job and shard jobs named `<cell> shard <k>/<n>`.
# Runtimes (ADR 0069): each job installs a set of ci/runtimes.toml, every
# runtime on linux-x64-gnu (release-linux-x64-gnu), the oldest and newest
# lines with Bun, Deno 2 and free-threaded CPython on the other Linux cells
# (release-linux), and the same without free-threaded CPython on Windows and
# macOS (release-other). The suites of other areas (every Sink's suite on
# Foxhound's executable, browser conformance on Collie's, skew and upgrades
# from released artifacts, the security suites, the resident-memory
# ceilings) join each cell as steps, or through
# `just test release`, as their areas add them.
#
# A step whose name starts with "Test" is a test step (ADR 0064): a cell
# with a failed test step in any attempt leaves its commit red. Every job is
# declared in ci/egress/endpoints.toml.
name: release suite

on:
  workflow_dispatch:
    inputs:
      cells:
        description: "The cells to run: all, or names separated by commas (linux-x64-gnu, linux-x64-musl, linux-arm64-gnu, linux-arm64-musl, windows-x64, macos-arm64, macos-x64)"
        type: string
        default: all
      commit:
        description: "On main only: the commit of main to test, its head when empty"
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A one-minute Linux job (ADR 0108): it checks the commit, then counts the
  # month's Release jobs in Linux-equivalent minutes (Linux 1, Windows 2,
  # macOS 11), estimates this run from its cells' last recorded durations
  # (270 before any) and starts no hosted cell when the run would pass 600.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      cells: ${{ steps.plan.outputs.cells }}
      linux-x64: ${{ steps.plan.outputs.linux-x64 }}
      linux-arm64: ${{ steps.plan.outputs.linux-arm64 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-suite-plan
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Choose the cells under the ceiling
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELLS: ${{ inputs.cells }}
          COMMIT: ${{ inputs.commit }}
        run: >-
          cargo run --quiet --locked --bin xtask -- release-suite plan
          --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --ref "$GITHUB_REF"
          --cells "$CELLS" --commit "$COMMIT"
          --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Fail when the ceiling holds the hosted cells back
        if: steps.plan.outputs.held == 'true'
        env:
          NEEDED: ${{ steps.plan.outputs.needed }}
          MONTH_TURNS: ${{ steps.plan.outputs.month-turns }}
        run: |
          echo "::error::No hosted cell started: the run needs $NEEDED minutes that bill, past the ceiling of 600; the month turns on $MONTH_TURNS (ADR 0108)."
          exit 1

  linux-x64:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.linux-x64 != '[]'
    runs-on: ubuntu-24.04
    # The hard cap that stops a hang (ADR 0061, amended 2026-10-23): a
    # 2-vCPU hosted runner needs past 90 minutes for this cell's steps,
    # as measured on 2026-10-23's run (TESTING.md, Time budgets).
    timeout-minutes: ${{ matrix.cell == 'linux-x64-gnu' && 300 || 120 }}
    permissions:
      contents: read
      # `xtask perf` reads the "Performance change" section of the pull
      # request that merged the commit (ADR 0071).
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux-x64) }}
    env:
      CELL: ${{ matrix.cell }}
      TARGET: ${{ matrix.target }}
      SHARD: 1/1
      # A hosted Ubuntu runner's AppArmor refuses unprivileged user
      # namespaces, so `DnsNamespace` comes up through `sudo` (ADR 0067);
      # declared, a fallback to another way fails.
      GOODFETCH_TEST_DNS_NAMESPACE: sudo
      # xtask's own `dev` build with line tables only, as the `ci-test`
      # profile's: a third less of the runner's disk (3.0 to 2.1 GB).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          # `xtask perf`'s base is the commit's first parent.
          fetch-depth: 2
      # The runner's disk holds toolchains the suite never uses, and the
      # cell's builds need the room (ci/host/free-disk.sh).
      - name: Free the runner's disk
        run: ci/host/free-disk.sh
      # The tests' copy of the pinned Chrome for Testing build, which `just
      # fetch` downloads on a miss; saved below on `main` only, for these
      # cells and the pull-request tier's Pre-merge jobs (#3380).
      - name: Read the pinned Chrome for Testing build
        id: chrome-for-testing
        run: echo "build=$(jq -r .chrome_for_testing.build crates/goodfetch-collie/src/pins.json)" >>"$GITHUB_OUTPUT"
      - name: Restore the tests' copy of Chrome for Testing
        id: chrome-for-testing-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/goodfetch/chrome-for-testing
          key: chrome-for-testing-${{ steps.chrome-for-testing.outputs.build }}-linux64
      - name: Install the toolchains, tools and runtimes
        uses: ./.github/actions/host-tools
        with:
          target: ${{ matrix.target }}
          runtimes: ${{ matrix.runtimes }}
      - name: Save the tests' copy of Chrome for Testing
        if: github.ref == 'refs/heads/main' && steps.chrome-for-testing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/goodfetch/chrome-for-testing
          key: chrome-for-testing-${{ steps.chrome-for-testing.outputs.build }}-linux64
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-suite-${{ matrix.cell }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the tests and both executables once
        run: ci/release/cell.sh build
      - name: Measure both Products' sizes
        id: size
        run: ci/release/cell.sh size
      # The counted performance gates on the gnu cells (ADR 0071).
      - name: Install Valgrind and gungraun's runner
        if: endsWith(matrix.cell, '-gnu')
        run: ci/host/perf-tools.sh
      - name: Build the base's and the commit's benchmarks
        if: endsWith(matrix.cell, '-gnu')
        run: ci/release/perf.sh build
      - name: Read the merging pull request's Performance change section
        if: endsWith(matrix.cell, '-gnu')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/release/perf.sh pull-request
      # TLC on every TLA+ model (ADR 0060), on one cell: its outcome does
      # not depend on the target. The runner's own Java runs it.
      - name: Fetch the pinned TLA+ tools
        if: matrix.cell == 'linux-x64-gnu'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just tlc-fetch
      # ADR 0067's Release-suite security jobs, on Linux x64 glibc: the
      # AddressSanitizer run of every crate that opts into `unsafe`, on the
      # nightly of ci/sanitizer-toolchain.toml (its standard library rebuilt,
      # so its build fetches before the deny); the V8 memory-corruption
      # scripts on the test V8 build fetched by digest, a slot until its
      # subject exists (ci/v8-corruption.sh).
      - name: Install the sanitizer toolchain
        if: matrix.cell == 'linux-x64-gnu'
        run: >-
          rustup toolchain install
          "$(sed -n 's/^toolchain = "\(.*\)"$/\1/p' ci/sanitizer-toolchain.toml)"
          --profile minimal --component rust-src
      - name: Build the AddressSanitizer tests
        if: matrix.cell == 'linux-x64-gnu'
        run: just asan build
      - name: Fetch the test V8 build by its digest
        if: matrix.cell == 'linux-x64-gnu'
        run: just v8-corruption fetch
      # The LazyFS power cuts (ADR 0060), on one cell: FUSE from the runner's
      # packages, LazyFS from its pinned source archives.
      - name: Build the pinned LazyFS
        if: matrix.cell == 'linux-x64-gnu'
        run: ci/host/lazyfs.sh
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      # The pinned Alpine image the wheels install into on Linux
      # (goodfetch_test_support.install), pulled by its digest before the deny.
      - name: Pull the install harness's Alpine image
        run: ci/alpine/fetch.sh
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: Rust"
        run: ci/egress/under-deny.sh ci/release/cell.sh rust
      - name: "Test: TypeScript on each Node line"
        run: ci/egress/under-deny.sh ci/release/cell.sh typescript
      - name: "Test: Python on each CPython line"
        run: ci/egress/under-deny.sh ci/release/cell.sh python
      # ADR 0072's exercise audit over the Rust tests the cell ran: every
      # test but the quarantined ones (ADR 0064) and those that cannot run
      # on the cell, which leave no record. With the justfile's
      # `exercise_audit` at `gate`, a declaring test that never reached its
      # Feature fails it, so it is a test step (ADR 0064).
      - name: "Test: audit what each declaring test reached"
        run: ci/egress/under-deny.sh just features-audit
      # The resident-memory check on both Products' executables (ADRs 0071,
      # 0094 and 0134); it gates nothing until ci/rss-ceilings.toml exists.
      - name: "Test: resident memory"
        run: ci/egress/under-deny.sh ci/release/cell.sh rss
      - name: "Test: TLC on every model"
        if: matrix.cell == 'linux-x64-gnu'
        run: ci/egress/under-deny.sh just tlc --all
      - name: "Test: the sample's broken variant fails TLC"
        if: matrix.cell == 'linux-x64-gnu'
        run: ci/egress/under-deny.sh just tlc-self-test
      # loom over the modules ci/loom.toml lists, at 2 preemptions (ADR 0060).
      - name: "Test: loom on the modules that opt in"
        if: matrix.cell == 'linux-x64-gnu'
        run: ci/egress/under-deny.sh just loom
      - name: "Test: AddressSanitizer on the crates that opt into unsafe"
        if: matrix.cell == 'linux-x64-gnu'
        run: ci/egress/under-deny.sh just asan test
      - name: "Test: the V8 memory-corruption scripts"
        if: matrix.cell == 'linux-x64-gnu'
        run: ci/egress/under-deny.sh just v8-corruption test
      - name: "Test: LazyFS power cuts"
        if: matrix.cell == 'linux-x64-gnu'
        run: ci/egress/under-deny.sh ci/release/cell.sh lazyfs
      - name: Measure the base, then the commit, against the Performance budget
        if: endsWith(matrix.cell, '-gnu')
        run: ci/egress/under-deny.sh ci/release/perf.sh run
      - name: Check that the deny refused nothing else
        if: always()
        run: ci/egress/egress.sh check
      - name: Record the job's context beside its JUnit files
        if: always()
        shell: bash
        run: ci/junit-context.sh
      - name: Summarize the failed tests
        if: always()
        run: ci/junit-summary.sh
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit/ target/release-suite/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-release-dispatch-${{ matrix.cell }}-1
          path: target/junit/
          if-no-files-found: ignore
      - name: Save the size report keyed by the tested tree
        if: always() && github.ref == 'refs/heads/main' && steps.size.outcome == 'success' && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report-${{ steps.size.outputs.tree }}-${{ matrix.target }}
          path: target/release-suite/size-report-*.json
          retention-days: 90

  linux-arm64:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.linux-arm64 != '[]'
    runs-on: ubuntu-24.04-arm
    # The hard cap that stops a hang (ADR 0061, amended 2026-10-23): a
    # 2-vCPU hosted runner needs past 90 minutes for this cell's steps,
    # as measured on 2026-10-23's run (TESTING.md, Time budgets).
    timeout-minutes: ${{ matrix.cell == 'linux-arm64-gnu' && 210 || 120 }}
    permissions:
      contents: read
      # `xtask perf` reads the "Performance change" section of the pull
      # request that merged the commit (ADR 0071).
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux-arm64) }}
    env:
      CELL: ${{ matrix.cell }}
      TARGET: ${{ matrix.target }}
      SHARD: 1/1
      # A hosted Ubuntu runner's AppArmor refuses unprivileged user
      # namespaces, so `DnsNamespace` comes up through `sudo` (ADR 0067);
      # declared, a fallback to another way fails.
      GOODFETCH_TEST_DNS_NAMESPACE: sudo
      # xtask's own `dev` build with line tables only, as the `ci-test`
      # profile's: a third less of the runner's disk (3.0 to 2.1 GB).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          # `xtask perf`'s base is the commit's first parent.
          fetch-depth: 2
      # The runner's disk holds toolchains the suite never uses, and the
      # cell's builds need the room (ci/host/free-disk.sh).
      - name: Free the runner's disk
        run: ci/host/free-disk.sh
      - name: Install the toolchains, tools and runtimes
        uses: ./.github/actions/host-tools
        with:
          target: ${{ matrix.target }}
          runtimes: ${{ matrix.runtimes }}
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-suite-${{ matrix.cell }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the tests and both executables once
        run: ci/release/cell.sh build
      - name: Measure both Products' sizes
        id: size
        run: ci/release/cell.sh size
      # The counted performance gates on the gnu cells (ADR 0071).
      - name: Install Valgrind and gungraun's runner
        if: endsWith(matrix.cell, '-gnu')
        run: ci/host/perf-tools.sh
      - name: Build the base's and the commit's benchmarks
        if: endsWith(matrix.cell, '-gnu')
        run: ci/release/perf.sh build
      - name: Read the merging pull request's Performance change section
        if: endsWith(matrix.cell, '-gnu')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/release/perf.sh pull-request
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      # The pinned Alpine image the wheels install into on Linux
      # (goodfetch_test_support.install), pulled by its digest before the deny.
      - name: Pull the install harness's Alpine image
        run: ci/alpine/fetch.sh
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: Rust"
        run: ci/egress/under-deny.sh ci/release/cell.sh rust
      - name: "Test: TypeScript on each Node line"
        run: ci/egress/under-deny.sh ci/release/cell.sh typescript
      - name: "Test: Python on each CPython line"
        run: ci/egress/under-deny.sh ci/release/cell.sh python
      # ADR 0072's exercise audit over the Rust tests the cell ran: every
      # test but the quarantined ones (ADR 0064) and those that cannot run
      # on the cell, which leave no record. With the justfile's
      # `exercise_audit` at `gate`, a declaring test that never reached its
      # Feature fails it, so it is a test step (ADR 0064).
      - name: "Test: audit what each declaring test reached"
        run: ci/egress/under-deny.sh just features-audit
      # The resident-memory check on both Products' executables (ADRs 0071,
      # 0094 and 0134); it gates nothing until ci/rss-ceilings.toml exists.
      - name: "Test: resident memory"
        run: ci/egress/under-deny.sh ci/release/cell.sh rss
      - name: Measure the base, then the commit, against the Performance budget
        if: endsWith(matrix.cell, '-gnu')
        run: ci/egress/under-deny.sh ci/release/perf.sh run
      - name: Check that the deny refused nothing else
        if: always()
        run: ci/egress/egress.sh check
      - name: Record the job's context beside its JUnit files
        if: always()
        shell: bash
        run: ci/junit-context.sh
      - name: Summarize the failed tests
        if: always()
        run: ci/junit-summary.sh
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit/ target/release-suite/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-release-dispatch-${{ matrix.cell }}-1
          path: target/junit/
          if-no-files-found: ignore
      - name: Save the size report keyed by the tested tree
        if: always() && github.ref == 'refs/heads/main' && steps.size.outcome == 'success' && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report-${{ steps.size.outputs.tree }}-${{ matrix.target }}
          path: target/release-suite/size-report-*.json
          retention-days: 90

  windows-x64:
    name: windows-x64
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.cells), 'windows-x64')
    runs-on: windows-2025
    # The hard cap that stops a hang (ADR 0061, amended 2026-10-23): a
    # 2-vCPU hosted runner needs past 90 minutes for this cell's steps,
    # as measured on 2026-10-23's run (TESTING.md, Time budgets).
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CELL: windows-x64
      TARGET: x86_64-pc-windows-msvc
      SHARD: 1/1
      # xtask's own `dev` build with line tables only, as on Linux.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # The runner's Git converts LF to CRLF on checkout, which the build
      # scripts and tests that read a file's bytes do not expect: the tree
      # keeps the bytes Linux and macOS check out (ADR 0067).
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Install the toolchains, tools and runtimes
        uses: ./.github/actions/host-tools
        with:
          target: x86_64-pc-windows-msvc
          runtimes: release-other
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-suite-windows-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `target` is a junction to the Dev Drive, a VHDX file on D: that
      # host-tools creates; the toolchains and caches sit on C:.
      - name: "Show the free space on C:, D: and the Dev Drive"
        run: df -h
      - name: Build the tests and both executables once
        run: ci/release/cell.sh build
      - name: Measure both Products' sizes
        id: size
        run: ci/release/cell.sh size
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: Rust"
        run: ci/egress/under-deny.sh ci/release/cell.sh rust
      - name: "Test: TypeScript on each Node line"
        run: ci/egress/under-deny.sh ci/release/cell.sh typescript
      - name: "Test: Python on each CPython line"
        run: ci/egress/under-deny.sh ci/release/cell.sh python
      # ADR 0072's exercise audit over the Rust tests the cell ran: every
      # test but the quarantined ones (ADR 0064) and those that cannot run
      # on the cell, which leave no record. With the justfile's
      # `exercise_audit` at `gate`, a declaring test that never reached its
      # Feature fails it, so it is a test step (ADR 0064).
      - name: "Test: audit what each declaring test reached"
        run: ci/egress/under-deny.sh just features-audit
      # The resident-memory check on both Products' executables (ADRs 0071,
      # 0094 and 0134); it gates nothing until ci/rss-ceilings.toml exists.
      - name: "Test: resident memory"
        run: ci/egress/under-deny.sh ci/release/cell.sh rss
      - name: Check that the deny refused nothing else
        if: always()
        run: ci/egress/egress.sh check
      - name: Record the job's context beside its JUnit files
        if: always()
        shell: bash
        run: ci/junit-context.sh
      - name: Summarize the failed tests
        if: always()
        run: ci/junit-summary.sh
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        shell: bash
        run: ci/leaks.sh target/junit/ target/release-suite/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-release-dispatch-windows-x64-1
          path: target/junit/
          if-no-files-found: ignore
      - name: Save the size report keyed by the tested tree
        if: always() && github.ref == 'refs/heads/main' && steps.size.outcome == 'success' && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report-${{ steps.size.outputs.tree }}-x86_64-pc-windows-msvc
          path: target/release-suite/size-report-*.json
          retention-days: 90

  # The macOS cells, on `main` only (ADR 0108), on explicit labels of one OS
  # release, so an OS change is a visible commit (#3383).
  macos-arm64:
    name: macos-arm64
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.plan.outputs.cells), 'macos-arm64')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CELL: macos-arm64
      TARGET: aarch64-apple-darwin
      SHARD: 1/1
      # Without a GUI session the full build cannot start headless: the
      # tests launch the headless shell, and those that need the full build
      # skip, naming why (issue 3224). It stays set until a hosted run shows
      # a GUI session and a login keychain, recorded on #3373.
      GOODFETCH_TEST_NO_GUI_SESSION: "1"
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Install the toolchains, tools and runtimes
        uses: ./.github/actions/host-tools
        with:
          target: aarch64-apple-darwin
          runtimes: release-other
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-suite-macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the tests and both executables once
        run: ci/release/cell.sh build
      - name: Measure both Products' sizes
        id: size
        run: ci/release/cell.sh size
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: "Test: Rust"
        run: ci/release/cell.sh rust
      - name: "Test: TypeScript on each Node line"
        run: ci/release/cell.sh typescript
      - name: "Test: Python on each CPython line"
        run: ci/release/cell.sh python
      # ADR 0072's exercise audit over the Rust tests the cell ran: every
      # test but the quarantined ones (ADR 0064) and those that cannot run
      # on the cell, which leave no record. With the justfile's
      # `exercise_audit` at `gate`, a declaring test that never reached its
      # Feature fails it, so it is a test step (ADR 0064).
      - name: "Test: audit what each declaring test reached"
        run: just features-audit
      # The resident-memory check on both Products' executables (ADRs 0071,
      # 0094 and 0134); it gates nothing until ci/rss-ceilings.toml exists.
      - name: "Test: resident memory"
        run: ci/release/cell.sh rss
      - name: Record the job's context beside its JUnit files
        if: always()
        shell: bash
        run: ci/junit-context.sh
      - name: Summarize the failed tests
        if: always()
        run: ci/junit-summary.sh
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit/ target/release-suite/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-release-dispatch-macos-arm64-1
          path: target/junit/
          if-no-files-found: ignore
      - name: Save the size report keyed by the tested tree
        if: always() && steps.size.outcome == 'success' && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report-${{ steps.size.outputs.tree }}-aarch64-apple-darwin
          path: target/release-suite/size-report-*.json
          retention-days: 90

  # The x86-64 macOS build, built and tested natively on Intel.
  macos-x64:
    name: macos-x64
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.plan.outputs.cells), 'macos-x64')
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CELL: macos-x64
      TARGET: x86_64-apple-darwin
      SHARD: 1/1
      # As in the macos-arm64 cell (issue 3224).
      GOODFETCH_TEST_NO_GUI_SESSION: "1"
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Install the toolchains, tools and runtimes
        uses: ./.github/actions/host-tools
        with:
          target: x86_64-apple-darwin
          runtimes: release-other
      - name: Restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-suite-macos-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the tests and both executables once
        run: ci/release/cell.sh build
      - name: Measure both Products' sizes
        id: size
        run: ci/release/cell.sh size
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: "Test: Rust"
        run: ci/release/cell.sh rust
      - name: "Test: TypeScript on each Node line"
        run: ci/release/cell.sh typescript
      - name: "Test: Python on each CPython line"
        run: ci/release/cell.sh python
      # ADR 0072's exercise audit over the Rust tests the cell ran: every
      # test but the quarantined ones (ADR 0064) and those that cannot run
      # on the cell, which leave no record. With the justfile's
      # `exercise_audit` at `gate`, a declaring test that never reached its
      # Feature fails it, so it is a test step (ADR 0064).
      - name: "Test: audit what each declaring test reached"
        run: just features-audit
      # The resident-memory check on both Products' executables (ADRs 0071,
      # 0094 and 0134); it gates nothing until ci/rss-ceilings.toml exists.
      - name: "Test: resident memory"
        run: ci/release/cell.sh rss
      - name: Record the job's context beside its JUnit files
        if: always()
        shell: bash
        run: ci/junit-context.sh
      - name: Summarize the failed tests
        if: always()
        run: ci/junit-summary.sh
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit/ target/release-suite/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-release-dispatch-macos-x64-1
          path: target/junit/
          if-no-files-found: ignore
      - name: Save the size report keyed by the tested tree
        if: always() && steps.size.outcome == 'success' && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report-${{ steps.size.outputs.tree }}-x86_64-apple-darwin
          path: target/release-suite/size-report-*.json
          retention-days: 90

  # The visual projects of the Release suite (ADR 0073): only inside the
  # Playwright image pinned in ci/visual/image.toml, on Linux x86-64, on a
  # standard hosted runner beside the hosted tier's job container (#3383).
  # It belongs to the macos-arm64 cell's dispatch, whose name it carries, so
  # the verdict counts it there.
  visual:
    name: macos-arm64 visual
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && contains(fromJSON(needs.plan.outputs.cells), 'macos-arm64')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Start the job's container
        run: ci/hosted/start.sh
      - name: Set up the OS services the tests use
        run: ci/hosted/exec.sh ci/os-services.sh setup
      - name: Install the visual projects' packages in the pinned image
        run: ci/hosted/visual.sh install
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: the visual projects in the pinned image"
        # Firefox's and WebKit's visual projects run in the Release suite only.
        env:
          GOODFETCH_TEST_SUITE: release
        run: ci/hosted/visual.sh test
      - name: Check that every Reference screenshot was read
        run: ci/hosted/exec.sh cargo run --quiet --locked --bin xtask -- screenshots orphans
      - name: Check that the deny refused nothing else
        if: always()
        run: ci/egress/egress.sh check
      - name: Record the job's context beside its JUnit files
        if: always()
        shell: bash
        run: ci/junit-context.sh
      - name: Summarize the failed tests
        if: always()
        run: ci/junit-summary.sh container
      - name: Scan the job's outputs for secrets before they upload
        id: leaks
        if: always()
        run: ci/hosted/exec.sh ci/leaks.sh target/junit/ target/vitest-attachments/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-visual-dispatch-linux-x64-1
          path: target/junit/
          if-no-files-found: ignore
      - name: Upload the expected, actual and diff images
        if: failure() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-differences-release-dispatch
          path: |
            target/junit/playwright/
            target/vitest-attachments/
          if-no-files-found: ignore

  # Cache priority within GitHub's 10 GB (ADR 0061): once the repository's
  # caches pass 9 GB, the least recently used ones that are not the
  # pull-request tier's Linux caches are deleted until they fit. While the
  # repository is private, Release runs on `main` save the caches hosted
  # jobs restore, and the cache-warming job's token holds no write scope on
  # the owner's machine (ADR 0135), so the eviction runs here, after the
  # cells have saved theirs.
  caches:
    name: caches
    needs: [plan, linux-x64, linux-arm64, windows-x64, macos-arm64, macos-x64, visual]
    if: "!cancelled() && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Deleting a cache needs `actions: write`.
      actions: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build xtask
        uses: ./.github/actions/xtask # zizmor: ignore[self-repository] actionlint lacks the $/ form
      - name: Evict caches past 9 GB
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --quiet --locked --bin xtask -- evict-caches --repository "$GITHUB_REPOSITORY"

  # The budget check (ADR 0061; TESTING.md, Time budgets) at the end of every
  # manual-dispatch Release run, where spec #325 places it: each job's median
  # of its last 20 runs in its own tier, from the results store, against
  # TESTING.md's table, opening or updating one needs-triage issue per
  # breached suite or job. It never fails a run, so its step is no test step.
  # While ADR 0135 keeps the ingest off, the store holds only the runs
  # ingested before. It needs the Actions secret TEST_RESULTS_TOKEN, a
  # fine-grained token on the `<owner>/test-results` repository with
  # Contents: Read, the least it needs (only the ingest, which pushes, needs
  # Read and write); the owner creates that repository and adds the secret
  # (TESTING.md, the results store; ADR 0135's amendment of 2026-10-22).
  # `github.token` cannot read another private repository, so nothing falls
  # back to it: without the secret the job fails on its first step, naming it,
  # never a silent pass. It runs after every cell and is none, so it leaves
  # their verdict as it is.
  budgets:
    name: budgets
    needs: [plan, linux-x64, linux-arm64, windows-x64, macos-arm64, macos-x64, visual, caches]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The breach issues.
      issues: write
    steps:
      - name: Require the results store's token
        env:
          TEST_RESULTS_TOKEN: ${{ secrets.TEST_RESULTS_TOKEN }}
        run: |
          if [[ -z "$TEST_RESULTS_TOKEN" ]]; then
            echo "::error::The results store $GITHUB_REPOSITORY_OWNER/test-results or its TEST_RESULTS_TOKEN secret is missing (ADR 0064): budgets not checked."
            exit 1
          fi
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the results store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/test-results
          token: ${{ secrets.TEST_RESULTS_TOKEN }}
          path: test-results
          persist-credentials: false
      - name: Build xtask
        uses: ./.github/actions/xtask # zizmor: ignore[self-repository] actionlint lacks the $/ form
      - name: Check the time budgets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          cargo run --quiet --locked --bin xtask -- budgets --store test-results
          --repository "$GITHUB_REPOSITORY"
