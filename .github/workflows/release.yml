# Stable, release-candidate and patch release pipeline (spec #130, issue 144;
# ADRs 0030, 0032, 0039, 0043, 0051, 0057, 0061, 0066, 0069, 0074, 0090, 0094
# and 0095).
#
# Stays disabled in the repository's Actions settings on merge until the owner
# enables hosted release publishing and configures trusted publishers.
#
# `0.1.0` is published by the first preview's spec, never through this workflow
# (owner decision, grilling G-18 Q5/Q6).
#
# Fixed order:
#   1. `validate-version`: parses the release tag/input, refuses `0.1.0` and
#      `-dev.*` nightlies, classifies RC vs stable/patch, and computes npm
#      dist-tag (`next`, `latest`, or `latest-<major>`) and OCI moving tag.
#   2. `release-suite`: runs the Release suite on the release commit before
#      any gate (ADR 0061).
#   3. `build`: calls `release-build.yml` (Proving ground -> Platform signing ->
#      Chromium fetch by digest -> build both Products per target -> Platform
#      signing & signature gate -> signed-bundle smoke -> package & digests).
#   4. `attest-and-sign`: GitHub artifact attestations and keyless Sigstore
#      signatures over every release asset, wheel, OCI image, chart and SBOM.
#   5. `verify-bytes-{linux,windows,macos}`: runs every file of both Products
#      from its own bytes on its target OS before any publish.
#   6. `release-gate`: verifies Platform signatures, `gh attestation verify`,
#      identical executable digests across channels, API breakage per Product,
#      compat check, Size budget ceilings, and that no bare `goodfetch` package
#      is published (ADRs 0090 and 0094).
#   7. `draft-github-release`: creates a draft GitHub Release with both
#      Products' assets so `[package.metadata.binstall]` URLs are staged before
#      crates.io publish (ADR 0094).
#   8. `publish-crates`, `publish-npm`, `publish-pypi`, `publish-oci`:
#      publishes both Products via OIDC trusted publishing with provenance.
#   9. `publish-github-release`: publishes the immutable GitHub Release ONLY
#      once every registry publish of both Products succeeded (both-or-neither,
#      ADR 0094).
#  10. `publish-homebrew-and-installers`: stable/patch only; updates both
#      formulas in `goodfetch/homebrew-tap` and attaches `install/*.{sh,ps1}`.
#  11. `post-release-pr`: stable/patch only; runs `xtask compat freeze` and
#      opens the post-release PR updating `compat/releases.toml`.
#  12. `smoke-channels-{linux,windows,macos}`: smoke installs each Product from
#      published channels under ADR 0043's outbound-traffic deny.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Product version to release (semver: x.y.z or x.y.0-rc.N; never 0.1.0)"
        required: true
        type: string
      accounts_open:
        description: "Whether Apple Developer ID and Azure Artifact Signing accounts are open (ADR 0039)"
        required: false
        default: false
        type: boolean
      previous_major:
        description: "True when releasing a patch for the previous supported major (publishes latest-<major> instead of latest)"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: validate-version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      stage: ${{ steps.parse.outputs.stage }}
      npm_tag: ${{ steps.parse.outputs.npm_tag }}
      oci_moving_tag: ${{ steps.parse.outputs.oci_moving_tag }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - name: Validate release version and compute channel tags
        id: parse
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PREVIOUS_MAJOR: ${{ inputs.previous_major == true }}
        run: |
          raw="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          version="${raw#v}"
          if [[ "$version" == "0.1.0" ]]; then
            echo "error: 0.1.0 is published by the first preview's spec, not release.yml (grilling G-18 Q5/Q6)" >&2
            exit 1
          fi
          if [[ "$version" == *-dev.* ]]; then
            echo "error: nightly versions publish through release-nightly.yml, not release.yml" >&2
            exit 1
          fi
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.0-rc\.([1-9][0-9]*)$ ]]; then
            stage="rc"
            npm_tag="next"
            oci_moving_tag=""
            is_prerelease="true"
          elif [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            stage="stable"
            is_prerelease="false"
            if [[ "$PREVIOUS_MAJOR" == "true" ]]; then
              npm_tag="latest-${major}"
              oci_moving_tag="latest-${major}"
            else
              npm_tag="latest"
              oci_moving_tag="latest"
            fi
          else
            echo "error: unsupported release version '${version}' (expected x.y.z or x.y.0-rc.N)" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "stage=${stage}"
            echo "npm_tag=${npm_tag}"
            echo "oci_moving_tag=${oci_moving_tag}"
            echo "is_prerelease=${is_prerelease}"
          } >>"$GITHUB_OUTPUT"

  release-suite:
    name: release-suite
    needs: [validate-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run the Release suite on the release commit before gates (ADR 0061)
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: ci/nightly/release-suite.sh

  build:
    name: build
    needs: [validate-version, release-suite]
    uses: ./.github/workflows/release-build.yml # zizmor: ignore[self-repository] actionlint lacks the $/ form
    with:
      version: ${{ needs.validate-version.outputs.version }}
      accounts_open: ${{ inputs.accounts_open == true }}

  attest-and-sign:
    name: attest-and-sign
    needs: [build, validate-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download packaged release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packaged
          path: target/release-packaged
      - name: Install xtask
        uses: ./.github/actions/xtask # zizmor: ignore[self-repository] actionlint lacks the $/ form
      - name: Install gitleaks
        run: ci/host/gitleaks.sh
      - name: Stage release installers into assets
        run: |
          cp install/collie.sh install/collie.ps1 install/foxhound.sh install/foxhound.ps1 \
            target/release-packaged/assets/
          cargo run --quiet --locked --bin xtask -- release assets \
            --folder target/release-packaged/assets
      - name: Install cosign for keyless Sigstore signatures
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Attest release assets, SBOMs, debug symbols, wheels, OCI images, charts and catalog
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release-packaged/assets/*
            target/release-packaged/wheels/*.whl
            target/release-packaged/oci/images/*.oci.tar
            target/release-packaged/oci/images/*.cdx.json
      - name: Sign release assets with keyless Sigstore bundles
        run: |
          for file in target/release-packaged/assets/* target/release-packaged/wheels/*.whl; do
            [[ -f "$file" ]] || continue
            [[ "$file" == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
      - name: Scan attested release outputs for secrets
        id: leaks
        if: always()
        run: ci/leaks.sh target/release-packaged
      - name: Upload attested release outputs
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attested
          path: target/release-packaged
          if-no-files-found: error

  verify-bytes-linux:
    name: verify-bytes-linux
    needs: [attest-and-sign, validate-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchains, tools and runtimes
        uses: ./.github/actions/host-tools # zizmor: ignore[self-repository] actionlint lacks the $/ form
        with:
          target: x86_64-unknown-linux-gnu
          runtimes: release-linux
      - name: Download attested release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: verify every Linux file of both Products from its own bytes"
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          ci/egress/under-deny.sh ci/release/verify-bytes.sh \
            target/release-attested x86_64-unknown-linux-musl "$RELEASE_VERSION"
          ci/egress/under-deny.sh ci/release/verify-bytes.sh \
            target/release-attested x86_64-unknown-linux-gnu "$RELEASE_VERSION"
      - name: Check that the deny refused nothing else
        if: always()
        run: ci/egress/egress.sh check

  verify-bytes-windows:
    name: verify-bytes-windows
    needs: [attest-and-sign, validate-version]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchains, tools and runtimes
        uses: ./.github/actions/host-tools # zizmor: ignore[self-repository] actionlint lacks the $/ form
        with:
          target: x86_64-pc-windows-msvc
          runtimes: release-other
      - name: Download attested release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: verify every Windows file of both Products from its own bytes"
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: >-
          ci/egress/under-deny.sh ci/release/verify-bytes.sh
          target/release-attested x86_64-pc-windows-msvc "$RELEASE_VERSION"
      - name: Check that the deny refused nothing else
        if: always()
        run: ci/egress/egress.sh check

  verify-bytes-macos:
    name: verify-bytes-macos
    needs: [attest-and-sign, validate-version]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchains, tools and runtimes
        uses: ./.github/actions/host-tools # zizmor: ignore[self-repository] actionlint lacks the $/ form
        with:
          target: aarch64-apple-darwin
          runtimes: release-other
      - name: Download attested release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: "Test: verify every macOS file of both Products from its own bytes"
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: >-
          ci/release/verify-bytes.sh
          target/release-attested aarch64-apple-darwin "$RELEASE_VERSION"

  release-gate:
    name: release-gate
    needs:
      [
        attest-and-sign,
        validate-version,
        verify-bytes-linux,
        verify-bytes-windows,
        verify-bytes-macos,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install xtask
        uses: ./.github/actions/xtask # zizmor: ignore[self-repository] actionlint lacks the $/ form
      - name: Install gitleaks
        run: ci/host/gitleaks.sh
      - name: Download signed binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-binaries
          path: target/release-binaries
      - name: Download attested release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Run cross-channel digest, attestation, API breakage and compat gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          cargo run --quiet --locked --bin xtask -- release channel-gate \
            --version "$RELEASE_VERSION" \
            --binaries target/release-binaries \
            --packaged target/release-attested \
            --channels crates.io,npm,pypi,oci,github,homebrew \
            --verify-attestations \
            --repository "$GITHUB_REPO"
          cargo run --quiet --locked --bin xtask -- api-check
          cargo run --quiet --locked --bin xtask -- sdk-api
          cargo run --quiet --locked --bin xtask -- compat check
          # Guard ADR 0090: no bare `goodfetch` package is ever packaged or published.
          if [[ -d target/release-attested/npm/goodfetch ]]; then
            echo "error: bare 'goodfetch' npm package must never be published (ADR 0090)" >&2
            exit 1
          fi
      - name: Check Size budget ceilings (issue 203) and render release size table
        run: |
          cargo run --quiet --locked --bin xtask -- release size-manifest \
            --binaries target/release-binaries \
            --packaged target/release-attested \
            --out target/release-size-files.toml
          cargo run --quiet --locked --bin xtask -- size ceilings \
            --files target/release-size-files.toml > target/release-size-table.md
      - name: Scan release size table for secrets
        id: leaks
        if: always()
        run: ci/leaks.sh target/release-size-table.md
      - name: Upload release size table for release notes
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-size-table
          path: target/release-size-table.md
          if-no-files-found: error

  draft-github-release:
    name: draft-github-release
    needs: [release-gate, validate-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download attested release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Download release size table
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-size-table
          path: target/release-size-table
      - name: Stage draft GitHub Release with both Products' assets before registry publishes (ADR 0094)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate-version.outputs.is_prerelease }}
        run: |
          {
            printf 'Goodfetch Collie and Goodfetch Foxhound v%s.\n\n' "$RELEASE_VERSION"
            printf '## Sizes\n\n'
            cat target/release-size-table/release-size-table.md
          } > target/release-notes.md
          extra_flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            extra_flags+=(--prerelease)
          fi
          gh release create "v${RELEASE_VERSION}" \
            --draft \
            --target "$GITHUB_SHA" \
            "${extra_flags[@]}" \
            --title "v${RELEASE_VERSION}" \
            --notes-file target/release-notes.md \
            target/release-attested/assets/* \
            target/release-attested/wheels/*.whl

  publish-crates:
    name: publish-crates
    needs: [draft-github-release, validate-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        uses: ./.github/actions/host-tools # zizmor: ignore[self-repository] actionlint lacks the $/ form
        with:
          target: x86_64-unknown-linux-gnu
      - name: Download attested release outputs for archive digests (ADR 0051)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Publish workspace crates and both Products to crates.io via OIDC
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          cargo run --quiet --locked --bin xtask -- release digests \
            --version "$RELEASE_VERSION" \
            --assets target/release-attested/assets
          jwt=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io" | jq -r .value)
          CARGO_REGISTRY_TOKEN=$(curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -d "{\"jwt\":\"${jwt}\"}" \
            "https://crates.io/api/v1/trusted_publishing/tokens" | jq -r .token)
          export CARGO_REGISTRY_TOKEN
          # Strip goodfetch-workspace-hack on publish (ADR 0094 note 2026-11-06)
          # and publish in dependency order from xtask release plan.
          cargo run --quiet --locked --bin xtask -- release plan \
            --version "$RELEASE_VERSION" \
            --assets target/release-attested/assets \
            --json \
            | jq -r '.[] | select(.registry == "crates.io" and .state == "publish") | .name' \
            | while IFS= read -r crate; do
                [[ -n "$crate" ]] || continue
                ci/tool.sh cargo-hakari cargo hakari publish -- --locked -p "$crate"
              done

  publish-npm:
    name: publish-npm
    needs: [draft-github-release, validate-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download attested release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Publish Collie client, platform packages and both root packages to npm with provenance
        env:
          NPM_TAG: ${{ needs.validate-version.outputs.npm_tag }}
        run: |
          order=(
            collie-client
            collie-darwin-arm64 collie-darwin-x64 collie-linux-arm64 collie-linux-x64 collie-win32-arm64 collie-win32-x64
            collie
            foxhound-darwin-arm64 foxhound-darwin-x64 foxhound-linux-arm64 foxhound-linux-x64 foxhound-win32-arm64 foxhound-win32-x64
            foxhound
          )
          for pkg in "${order[@]}"; do
            npm publish "target/release-attested/npm/$pkg" --provenance --access public --tag "$NPM_TAG"
          done

  publish-pypi:
    name: publish-pypi
    needs: [draft-github-release, validate-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: ./.github/actions/host-tools # zizmor: ignore[self-repository] actionlint lacks the $/ form
        with:
          target: x86_64-unknown-linux-gnu
      - name: Download attested release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Publish Collie client and both Products' wheels to PyPI via OIDC trusted publishing
        run: uv publish --trusted-publishing always target/release-attested/wheels/*.whl

  publish-oci:
    name: publish-oci
    needs: [draft-github-release, validate-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install xtask
        uses: ./.github/actions/xtask # zizmor: ignore[self-repository] actionlint lacks the $/ form
      - name: Install gitleaks
        run: ci/host/gitleaks.sh
      - name: Install cosign for keyless OCI signatures
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Download attested release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Push and sign both Products' OCI images, Helm charts and first-party Plugins on GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OCI_REGISTRY: ghcr.io
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          OCI_MOVING_TAG: ${{ needs.validate-version.outputs.oci_moving_tag }}
        run: |
          mkdir -p target/oci-digests
          echo "$GITHUB_TOKEN" | docker login "$OCI_REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          for plugin_dir in target/release-attested/oci/plugins/*; do
            [[ -d "$plugin_dir" ]] || continue
            plugin=$(basename "$plugin_dir")
            digest_file="target/oci-digests/plugin-${plugin}.digest"
            cargo run --quiet --locked --bin xtask -- release oci-push \
              --layout "$plugin_dir" \
              --registry "https://${OCI_REGISTRY}" \
              --repository "goodfetch/$plugin" \
              --tag "$RELEASE_VERSION" \
              --digest-out "$digest_file"
            digest=$(cat "$digest_file")
            cosign sign --yes "${OCI_REGISTRY}/goodfetch/${plugin}@${digest}"
          done
          for product in collie foxhound; do
            for variant in "" -slim -full -node -python; do
              oci_tar="target/release-attested/oci/images/${product}-${RELEASE_VERSION}${variant}.oci.tar"
              if [[ -f "$oci_tar" ]]; then
                digest_file="target/oci-digests/${product}${variant}.digest"
                cargo run --quiet --locked --bin xtask -- release oci-push \
                  --layout "$oci_tar" \
                  --registry "https://${OCI_REGISTRY}" \
                  --repository "goodfetch/${product}" \
                  --tag "${RELEASE_VERSION}${variant}" \
                  --digest-out "$digest_file"
                if [[ -n "$OCI_MOVING_TAG" && -z "$variant" ]]; then
                  cargo run --quiet --locked --bin xtask -- release oci-push \
                    --layout "$oci_tar" \
                    --registry "https://${OCI_REGISTRY}" \
                    --repository "goodfetch/${product}" \
                    --tag "$OCI_MOVING_TAG"
                fi
                digest=$(cat "$digest_file")
                cosign sign --yes "${OCI_REGISTRY}/goodfetch/${product}@${digest}"
              fi
            done
            chart_dir="target/release-attested/oci/charts/${product}"
            if [[ -d "$chart_dir" ]]; then
              digest_file="target/oci-digests/chart-${product}.digest"
              cargo run --quiet --locked --bin xtask -- release oci-push \
                --layout "$chart_dir" \
                --registry "https://${OCI_REGISTRY}" \
                --repository "goodfetch/charts/${product}" \
                --tag "$RELEASE_VERSION" \
                --digest-out "$digest_file"
              if [[ -n "$OCI_MOVING_TAG" ]]; then
                cargo run --quiet --locked --bin xtask -- release oci-push \
                  --layout "$chart_dir" \
                  --registry "https://${OCI_REGISTRY}" \
                  --repository "goodfetch/charts/${product}" \
                  --tag "$OCI_MOVING_TAG"
              fi
              digest=$(cat "$digest_file")
              cosign sign --yes "${OCI_REGISTRY}/goodfetch/charts/${product}@${digest}"
            fi
          done
      - name: Scan OCI digest outputs for secrets
        id: leaks
        if: always()
        run: ci/leaks.sh target/oci-digests
      - name: Upload pushed OCI image digests
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-oci-digests
          path: target/oci-digests
          if-no-files-found: ignore

  publish-github-release:
    name: publish-github-release
    needs:
      [
        validate-version,
        draft-github-release,
        publish-crates,
        publish-npm,
        publish-pypi,
        publish-oci,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Publish immutable GitHub Release once both Products succeeded on every channel (ADR 0094)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: gh release edit "v${RELEASE_VERSION}" --draft=false

  publish-homebrew-and-installers:
    name: publish-homebrew-and-installers
    if: needs.validate-version.outputs.stage == 'stable'
    needs: [validate-version, publish-github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download attested release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attested
          path: target/release-attested
      - name: Render and push both Products' Homebrew formulas to goodfetch/homebrew-tap
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          ci/release/render-homebrew-formulas.sh \
            "$RELEASE_VERSION" \
            target/release-attested/assets/SHA256SUMS \
            target/homebrew-tap
          auth=$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="Authorization: basic ${auth}"
          git clone "https://github.com/goodfetch/homebrew-tap.git" target/tap-checkout
          mkdir -p target/tap-checkout/Formula
          cp target/homebrew-tap/Formula/goodfetch-collie.rb target/tap-checkout/Formula/
          cp target/homebrew-tap/Formula/goodfetch-foxhound.rb target/tap-checkout/Formula/
          cd target/tap-checkout
          git config user.name "goodfetch-release-bot"
          git config user.email "release@goodfetch.dev"
          git add Formula/goodfetch-collie.rb Formula/goodfetch-foxhound.rb
          if ! git diff --cached --quiet; then
            git commit -s -m "Update goodfetch-collie and goodfetch-foxhound to v${RELEASE_VERSION}"
            git push origin HEAD:main
          fi

  post-release-pr:
    name: post-release-pr
    if: needs.validate-version.outputs.stage == 'stable'
    needs: [validate-version, publish-github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main with release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install xtask
        uses: ./.github/actions/xtask # zizmor: ignore[self-repository] actionlint lacks the $/ form
      - name: Freeze compatibility corpus for released tag (ADR 0066)
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/post-v${RELEASE_VERSION}"
          git checkout -b "$branch"
          cargo run --quiet --locked --bin xtask -- compat freeze --tag "v${RELEASE_VERSION}"
          git config user.name "goodfetch-release-bot"
          git config user.email "release@goodfetch.dev"
          git add compat/
          if ! git diff --cached --quiet; then
            git commit -s -m "chore(release): freeze compat corpus for v${RELEASE_VERSION}"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="Authorization: basic ${auth}"
            git push origin "$branch"
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Post-release corpus freeze for v${RELEASE_VERSION}" \
              --body "Freezes the compatibility corpus and release record for v${RELEASE_VERSION} (ADR 0066)."
          fi

  smoke-channels-linux:
    name: smoke-channels-linux
    needs: [validate-version, publish-github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchains, tools and runtimes
        uses: ./.github/actions/host-tools # zizmor: ignore[self-repository] actionlint lacks the $/ form
        with:
          target: x86_64-unknown-linux-gnu
          runtimes: release-linux
      - name: Download pushed OCI image digests before outbound-traffic deny
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-oci-digests
          path: target/smoke-staged/oci-digests
      - name: Stage published release channels before the deny
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          mkdir -p target/smoke-staged/github target/smoke-staged/wheels target/smoke-staged/npm target/smoke-staged/oci
          gh release download "v${RELEASE_VERSION}" --dir target/smoke-staged/github \
            --pattern 'goodfetch-*-x86_64-unknown-linux-musl.tar.xz'
          gh release download "v${RELEASE_VERSION}" --dir target/smoke-staged/wheels \
            --pattern '*.whl'
          npm pack --pack-destination target/smoke-staged/npm \
            "@goodfetch/collie-client@${RELEASE_VERSION}" \
            "@goodfetch/collie-linux-x64@${RELEASE_VERSION}" \
            "@goodfetch/collie@${RELEASE_VERSION}" \
            "@goodfetch/foxhound-linux-x64@${RELEASE_VERSION}" \
            "@goodfetch/foxhound@${RELEASE_VERSION}"
          for product in collie foxhound; do
            digest=$(cat "target/smoke-staged/oci-digests/${product}.digest")
            image_ref="ghcr.io/goodfetch/${product}@${digest}"
            docker pull "$image_ref"
            docker save -o "target/smoke-staged/oci/goodfetch-${product}.tar" "$image_ref"
          done
      - name: Set up the OS services the tests use
        run: ci/os-services.sh setup
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: smoke-install Linux release channels under outbound deny"
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: ci/egress/under-deny.sh ci/release/smoke-channel.sh target/smoke-staged "$RELEASE_VERSION"
      - name: Check that the deny refused nothing else
        if: always()
        run: ci/egress/egress.sh check

  smoke-channels-windows:
    name: smoke-channels-windows
