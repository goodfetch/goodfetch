# The virtual root manifest of Goodfetch's one Cargo workspace (STYLE.md, ADR 0087).
#
# Members live under `crates/` and `crates/foxhound/` (every crate only
# Foxhound links), plus `proving-ground/` (the Proving ground's crate, ADR
# 0032) and `xtask/`; the sink processes will live under
# `crates/foxhound/sinks/`, whose glob the Sinks area adds with the first of
# them (Cargo fails on a glob whose folder does not exist). Every crate's
# folder is named after the crate, `goodfetch-*`, so the globs never match
# the grouping folder `crates/foxhound`, which holds no manifest. (Cargo's `exclude` cannot
# drop them: it excludes every path under an excluded folder, members of a
# glob included.)
[workspace]
resolver = "3"
members = [
  "crates/goodfetch-*",
  "crates/foxhound/goodfetch-*",
  "proving-ground",
  "xtask",
]
# Goodfetch's forks of `reqwest`, `wreq`, `wreq-util`, `dom_smoothie`,
# `rs-trafilatura` and the two crates rs-trafilatura reads trees with, which
# `[patch.crates-io]` below carries: crates of their own, not members. The
# Kennel's workspace, `kennel/`, has its own lockfile and toolchain (ADR 0141).
exclude = [
  "kennel",
  "vendor/dom_smoothie",
  "vendor/html-cleaning",
  "vendor/quick_html2md",
  "vendor/reqwest",
  "vendor/rs-trafilatura",
  "vendor/wreq",
  "vendor/wreq-util",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# ADR 0030: the MSRV is the latest stable minus two; #133 builds it in CI.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goodfetch/goodfetch"
publish = false

# Every shared dependency sits here with `default-features = false`; each
# crate turns on what it uses (STYLE.md, Dependencies).
[workspace.dependencies]
# Brave's adblock-rust, unmodified (MPL-2.0, ADRs 0018 and 0047): the Filter
# lists' network and cosmetic rules. Without its `single-thread` feature, so
# one `Engine` is `Send + Sync` and every Session shares it (ADR 0047).
# With its `css-validation` feature, as Brave builds it: a cosmetic rule
# whose selector does not parse, or whose style holds `url(`, `image-set(`,
# `\` or `/*`, is refused, so a list cannot make a page fetch a URL.
adblock = { version = "0.13.3", default-features = false, features = ["css-validation", "embedded-domain-resolver", "full-regex-handling"] }
aho-corasick = { version = "1.1.5", default-features = false, features = ["std", "perf-literal"] }
# The encrypted local file, `secretfile:` (spec #564): an age file encrypted
# to an X25519 identity, read binary or armored. The 0.11 line, which age
# still fixes (0.11.5 has 0.12.1's armor fixes): 0.12 adds the `tag`
# recipients, which take p256 0.13 and hpke 0.12 and through them
# crypto-bigint 0.5, with RUSTSEC-2026-0387 (timing variability), fixed only
# in crypto-bigint 0.7.6, which p256 0.14 takes and no age release does
# (#1785). Move to age's newest line once a release takes p256 0.14.
age = { version = "0.11.5", default-features = false, features = ["armor"] }
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
# The OS keychain, `keychain:` (ADR 0015): keyring-core's API and its
# stores for the login keychain on macOS and the Credential Manager on
# Windows; on Linux the Secret Service over zbus, pure Rust, which static
# musl builds link (keyring-core's Secret Service stores still use zbus 5,
# whose split crates are unmaintained).
apple-native-keyring-store = { version = "1.0.2", default-features = false }
keyring-core = { version = "1.0.1", default-features = false }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
zbus = { version = "6.0.0", default-features = false }
# Commands with a cleared environment in tests (goodfetch-test-support, ADR 0062).
assert_cmd = { version = "2.2.2", default-features = false }
# Brotli bodies the response limits' tests decode (goodfetch-engine).
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
# The build scripts of goodfetch-test-support and goodfetch-engine generate
# SQLite's VFS bindings, loading libclang at run time where the OS keeps it.
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }
# A test's own seeded draws, such as a kill's moment (TESTING.md, Randomness:
# chacha20, portable across versions).
chacha20 = { version = "0.10.2", default-features = false, features = ["rng"] }
# Run state's field encryption (ADR 0015, spec #564): XChaCha20-Poly1305
# under each Run's data key, which HKDF-SHA256 of the key-encryption key
# wraps; the versions age already links.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12.4", default-features = false }
# The CLI helper's pseudo-terminal runs on every OS, ConPTY on Windows
# (goodfetch-test-support, ADR 0069).
expectrl = { version = "0.9.0", default-features = false }
# The main-content step and the Markdown converter of the page formats
# (ADR 0007): dom-smoothie finds a document's main content and htmd writes
# it as Markdown, from the html5ever tree markup5ever_rcdom holds, which
# goodfetch-extractor's own htmd handlers read.
# Carried as Goodfetch's fork (the `[patch.crates-io]` below).
dom_smoothie = { version = "0.18.2", default-features = false }
# dom-smoothie's own tree, on which the main-content step reads what it found.
# `atomic`: its tendrils are atomic, so a page's tree is `Send` and can live
# on one owner task (#1918; #2109).
dom_query = { version = "0.28.0", default-features = false, features = ["atomic"] }
# Its CSS tokenizer, on which the fetch tiers find the selector extensions
# dom_query reads and a browser refuses; the version dom_query links.
cssparser = { version = "0.37.0", default-features = false }
# The caches a selector match reuses across the elements of one walk, which
# the Clean-up rules' removal holds (spec #2164): dom_query takes this type
# and does not re-export it; the version dom_query links.
selectors = { version = "0.38.0", default-features = false }
htmd = { version = "0.5.6", default-features = false }
# Chrome's `<meta>` prescan of a crawl page's document tokenizes it as
# Blink's HTMLMetaCharsetParser does, with the HTML standard's tokenizer
# (ADR 0119); the version dom_query already links.
html5ever = { version = "0.39.0", default-features = false }
markup5ever_rcdom = { version = "0.38.0", default-features = false }
# The names of markup5ever_rcdom's tree, into which the Markdown converter
# walks the page's own tree for htmd (ADR 0138); the version htmd links.
markup5ever_htmd = { package = "markup5ever", version = "0.38.0", default-features = false }
# The page formats' streaming pass over a document for its links, images and
# media (spec #580; ADR 0007): no tree, one pass.
lol_html = { version = "3.0.2", default-features = false }
# An html5ever tree with CSS selectors, which Foxhound's own readers use.
scraper = { version = "0.27.0", default-features = false }
# The other built-in main-content step, `content.extractor = "trafilatura"`
# (ADR 0007; #788): rs-trafilatura, pinned to the release the lab reviewed
# (`rnd/lab/adapters/extract-rust`), carried as Goodfetch's fork (the
# `[patch.crates-io]` below).
rs-trafilatura = { version = "=0.2.2", default-features = false }
# The page formats' telephone numbers in E.164 (spec #580; #787):
# libphonenumber's metadata and parser, so a national number written with
# its region's trunk prefix converts as the region dials it.
phonenumber = { version = "0.3.10", default-features = false }
# The Proving ground's oracle reads a submitted Markdown value as its
# structure with pulldown-cmark, resolving its links with the url crate
# below (ADR 0007).
pulldown-cmark = { version = "0.13.4", default-features = false }
# The CSV reader the CSV Exports are read back with in tests (spec #582,
# pitfall D07).
csv = { version = "1.4.0", default-features = false }
# The Arrow IPC and Parquet Exports' columns, batches and writers (spec #582,
# ADR 0026). Parquet without its default features: they turn on flate2's
# zlib-rs backend, which changes the Proving ground's compressed bodies in a
# shared build; its codecs here are zstd and Snappy only.
arrow-array = { version = "60.0.0", default-features = false }
arrow-ipc = { version = "60.0.0", default-features = false }
arrow-schema = { version = "60.0.0", default-features = false }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap", "zstd"] }
# The Avro reader the Avro Exports are read back with in tests (spec #582).
apache-avro = { version = "0.22.0", default-features = false }
# The embedded Clean-up rules, serialized and compressed at build time and
# decompressed once when loaded (ADR 0057).
zstd = { version = "0.14.0", default-features = false }
# The OS generator that seeds `Entropy` in production (ADR 0059).
getrandom = { version = "0.3.4", default-features = false }
# Endpoint tokens compared in constant time (ADR 0017).
subtle = { version = "2.6.1", default-features = false }
# The Feature scanner expands an rstest `#[files]` glob as rstest does
# (xtask).
glob = { version = "0.3.4", default-features = false }
# The pinned Chromium's CDP bindings and the client's connection (spec #577).
goodfetch-cdp = { path = "crates/goodfetch-cdp" }
# The Clean-up rules and their matching (spec #577, ADR 0047).
goodfetch-clean-up-rules = { path = "crates/goodfetch-clean-up-rules" }
goodfetch-collie = { path = "crates/goodfetch-collie" }
# Counted work (ADR 0140): the counts, and each primitive's counted function.
goodfetch-counted-work = { path = "crates/goodfetch-counted-work" }
# The conformance harness; the Stub gateway's tests run its gateway cases.
goodfetch-conformance = { path = "crates/goodfetch-conformance" }
# Foxhound's crawl; only crates under `crates/foxhound/` and `xtask` take it (ADR 0087).
goodfetch-crawl = { path = "crates/foxhound/goodfetch-crawl" }
goodfetch-dataset = { path = "crates/foxhound/goodfetch-dataset" }
goodfetch-engine = { path = "crates/goodfetch-engine" }
# The page formats read from a document (spec #580, ADR 0007).
goodfetch-extractor = { path = "crates/goodfetch-extractor" }
# Foxhound's fetch tiers; only crates under `crates/foxhound/` and `xtask` take it (ADR 0087).
goodfetch-fetch-tier = { path = "crates/foxhound/goodfetch-fetch-tier" }
# Foxhound's Frontier, its per-domain queues; only crates under `crates/foxhound/` and `xtask` take it (ADR 0087).
goodfetch-frontier = { path = "crates/foxhound/goodfetch-frontier" }
# Collie's pages, Sessions and browsers (spec #577).
goodfetch-page = { path = "crates/goodfetch-page" }
goodfetch-protocol = { path = "crates/goodfetch-protocol" }
# The page's recording navigation gate, lease check and response observer, a
# test adapter: only ever a dev-dependency (ADR 0125).
goodfetch-recording-gate = { path = "crates/goodfetch-recording-gate" }
# The built-in external Secret providers, which each Product's composition registers (spec #564).
goodfetch-secret-providers = { path = "crates/goodfetch-secret-providers" }
# Foxhound's Session pool; only crates under `crates/foxhound/` and `xtask` take it (ADR 0087).
goodfetch-session-pool = { path = "crates/foxhound/goodfetch-session-pool" }
# Foxhound's SQL tab, DuckDB's read path; only crates under `crates/foxhound/` and `xtask` take it (ADR 0087).
goodfetch-sql-tab = { path = "crates/foxhound/goodfetch-sql-tab" }
# The protocol-aware test helpers; only ever a dev-dependency (ADR 0062's note
# of 2026-11-07; `xtask dependency-direction`).
goodfetch-test-client = { path = "crates/goodfetch-test-client" }
# Only ever a dev-dependency (ADR 0062; `xtask dependency-direction`).
goodfetch-test-support = { path = "crates/goodfetch-test-support" }
# One feature resolution of the build side for every package selection
# (ADR 0094, #2089); every member takes it, `ci/workspace-hack.sh` writes it.
goodfetch-workspace-hack = { path = "crates/goodfetch-workspace-hack" }
# ADR 0071; its runner, gungraun-runner, is installed at the same version.
# Its benchmark API sits behind its `default` feature, named explicitly.
gungraun = { version = "=0.20.0", default-features = false, features = ["default"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# The base32 (RFC 4648) of the Proving ground's TOTP secrets.
# The data folder of the OS's usual folders, which each Product's `main`
# resolves when `GOODFETCH_HOME` is unset (ADR 0059).
dirs = { version = "7.0.0", default-features = false }
# DuckDB, for Foxhound's SQL tab and search across runs (ADRs 0031, 0057);
# Collie's cargo-deny list bans it (ADR 0088).
duckdb = { version = "1.20000.0", default-features = false }
data-encoding = { version = "2.11.1", default-features = false, features = ["alloc"] }
# The cookie jar of a Session's own HTTP transport (issue 1605): RFC 6265's
# storage model; the public suffix rule is the fetch tier's, over `psl`.
cookie_store = { version = "0.22.1", default-features = false }
# The Proving ground's login forms (application/x-www-form-urlencoded).
form_urlencoded = { version = "1.2.2", default-features = false, features = ["alloc"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
# The HTTP fetch tier's transport in `standard` and `identified` Sessions
# (spec #579): HTTP/1.1 and HTTP/2 over the engine's own rustls
# configuration (no provider of its own, no system proxy), with none of its
# content decoding, which the fetch driver does as Chrome does (ADR 0119).
reqwest = { version = "0.13.5", default-features = false }
# The HTTP fetch tier's transport in HTTP-only `stealth` Sessions (spec #579,
# ADR 0020): BoringSSL through `btls` and the `http2` fork, which send a
# browser's TLS ClientHello and HTTP/2 settings, with its emulation profiles
# from `wreq-util` until area 8's captured ones (M3). Pinned exactly: its
# transport's translation point reads its failures (ADR 0127), and a test
# beside it fails when the pin moves. None of its content decoding, which
# the fetch driver does as Chrome does (ADR 0119).
wreq = { version = "=0.16.1", default-features = false, features = ["tokio-rt"] }
wreq-util = { version = "=0.2.0", default-features = false, features = ["emulation"] }
# The forks under `wreq` whose failures its translation point reads, pinned
# at the versions `wreq` takes: BoringSSL's `btls`, `http2` (h2's) and
# `wreq-proto` (hyper's).
btls = { version = "=0.5.6", default-features = false }
# Collie's TLS relay's async streams over `btls` (ADR 0124), at the same
# version, for its terminating mode.
tokio-btls = { version = "=0.5.6", default-features = false }
# BoringSSL's own functions that `btls` has no method for, at the same
# version: the relay's request of the browser's trust anchor IDs, its ALPS
# payload and its resumed sessions.
btls-sys = { version = "=0.5.6", default-features = false }
# The trait whose `as_ptr` gives BoringSSL's own pointer of a `btls` value,
# at the version `btls` takes.
foreign-types = { version = "=0.5.0", default-features = false }
http2 = { version = "=0.5.20", default-features = false }
wreq-proto = { version = "=0.2.6", default-features = false }
# Mozilla's root certificates whole, which BoringSSL's certificate store
# takes in the `wreq` transport (rustls takes `webpki-roots`' anchors).
webpki-root-certs = { version = "1.0.11", default-features = false }
# Brotli's decoder alone, for the fetch driver's `br` (ADR 0119).
brotli-decompressor = { version = "6.0.1", default-features = false, features = ["std"] }
# HMAC-SHA-1, from which the Proving ground and its tests compute TOTP codes
# (RFC 6238).
hmac = { version = "0.12.1", default-features = false }
# The Proving ground's encodings family writes each page in its legacy
# encoding with the WHATWG Encoding standard's encoders (ADRs 0073, 0119), and
# its ZIP download's checksum is CRC-32.
crc32fast = { version = "1.5.2", default-features = false }
encoding_rs = { version = "0.8.42", default-features = false, features = ["alloc"] }
# The Proving ground's page server (area 2): hyper's HTTP/1.1 and HTTP/2
# server on Tokio, behind rustls with ring (the provider ureq already brings).
# Its observations decode each HTTP/2 header block with loona-hpack, which
# keeps the fields in the order they were sent (h2 keeps its decoder private
# and hands out a map). h2 is the tests' HTTP/2 client.
h2 = { version = "0.4.19", default-features = false }
# The Proving ground's forward proxy (spec #152) reads each request head with
# httparse, which hyper already brings.
httparse = { version = "1.10.1", default-features = false, features = ["std"] }
# A `Retry-After`'s HTTP-date in RFC 9110's three formats (ADR 0118), which
# hyper already brings.
httpdate = { version = "1.0.3", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
loona-hpack = { version = "0.4.3", default-features = false }
# The Proving ground's certificate authority, made from its seed (ADR 0059):
# rcgen writes the certificates, p256 derives the keys and signs (RFC 6979).
p256 = { version = "0.14.0", default-features = false }
rcgen = { version = "0.14.10", default-features = false }
rustls = { version = "0.23.46", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false }
# The Proving ground's identity site verifies Web Bot Auth signatures with
# Cloudflare's own verifier, as the lab's did with its npm package (#162).
web-bot-auth = { version = "0.7.0", default-features = false }
# The identity site's tests sign as an agent would: web-bot-auth's signer
# takes its covered components as an `IndexMap` and its keys as Ed25519.
ed25519-dalek = { version = "2.2.0", default-features = false }
indexmap = { version = "2.14.2", default-features = false }
insta = { version = "1.49.0", default-features = false }
# The engine's own DNS resolver (ADRs 0024, 0044): the static musl
# executables have no libc resolver to call, and Sessions with a local
# address ask it on every OS. `system-config` reads the system's resolver
# configuration.
hickory-resolver = { version = "0.26.3", default-features = false }
# The engine's scan of a message's nesting, which crosses a string a word
# at a time (ADR 0140's E1). The engine's masking benchmark finds its
# stream's line ends with it (ADR 0071), as the log writers are handed whole
# lines; aho-corasick already takes it.
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
# The executables' global allocator (ADR 0024), and the Callgrind
# benchmarks' (ADR 0071).
mimalloc = { version = "0.1.48", default-features = false }
# The engine's bounded cache of compiled selectors, regular expressions
# and globs (ADRs 0138 and 0140), in goodfetch-counted-work: concurrent, so
# a lookup takes no lock around a page's others. hickory-resolver already
# links it with the same feature.
moka = { version = "0.12.16", default-features = false, features = ["sync"] }
# `xtask rss`'s peak reader: getrusage on Linux and macOS (ADR 0071); and
# goodfetch-test-support's `NoExec`, which installs its seccomp filter and
# starts its child with raw system calls on Linux (ADR 0067).
libc = { version = "0.2.191", default-features = false }
# A local address's interface, read on every OS (ADR 0044).
netdev = { version = "0.46.3", default-features = false }
jiff = { version = "0.2.35", default-features = false, features = ["std", "serde"] }
# `xtask journeys check` validates each Journey file against its committed
# JSON Schema (ADR 0063), and goodfetch-test-support's own tests validate the
# test-env description against its committed schema; no remote or file
# references are resolved.
jsonschema = { version = "0.59.0", default-features = false }
# Property tests of parsers and stateful rules (TESTING.md); `std` reads
# regex strategies.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Model-based tests of run state and delivery (ADR 0060).
proptest-state-machine = { version = "0.9.0", default-features = false, features = ["std"] }
# The full Public Suffix List, private entries included, compiled in: a
# crawl's domain keys (ADR 0004).
psl = { version = "2.1.244", default-features = false, features = ["helpers"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
quick-xml = { version = "0.41", default-features = false }
quote = { version = "1.0.47", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
# The parser behind `regex`, read for the construct a refused URL pattern
# uses (ADR 0081).
regex-syntax = { version = "0.8.11", default-features = false, features = ["std"] }
rstest = { version = "0.27.0", default-features = false }
# Run state, the Usage ledger and the Politeness file (ADR 0057), on the
# SQLite it bundles. goodfetch-test-support's crash VFS (ADR 0060) registers
# with that same SQLite through sqlite-plugin, whose build script runs
# bindgen (libclang) and downloads nothing.
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled", "cache", "hooks", "serialize"] }
sqlite-plugin = { version = "0.11.0", default-features = false, features = ["static"] }
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }
# Credentials held as `SecretString`, zeroized when dropped (STYLE.md).
secrecy = { version = "0.10.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# RFC 8785, which a Proving ground task's digest and each Audit log entry's
# hash serialize in (ADRs 0063 and 0016).
serde_json_canonicalizer = { version = "0.3.2", default-features = false }
sha1 = { version = "0.10.6", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
# The Proving ground's stop test shrinks the buffers of the socket `serve`
# writes its first line to, so the line's end waits until the test reads it.
socket2 = { version = "0.6.5", default-features = false }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing"] }
tar = { version = "0.4.46", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
# rcgen's dates; the Proving ground's leaf certificates are dated from its
# clock.
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
# The HTTP fetch tier's mark on each connection reqwest opens, which tells
# a reused connection from a new one (ADR 0118): tower's two traits alone.
tower-layer = { version = "0.3.3", default-features = false }
tower-service = { version = "0.3.3", default-features = false }
# The protocol over WebSocket, an Exposed Daemon's carriage for edge and
# serverless Clients (ADR 0049): tungstenite's handshake and framing, on
# Tokio in the engine, and blocking in the endpoint table's runner.
# futures-util drives its stream of messages and its sink.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# The settings files, which a rewrite keeps byte for byte but for the
# value it writes (ADRs 0028, 0098).
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt"] }
# The executables' opt-in OTLP export of the engine's spans (RT-18, ADR
# 0132): tracing-opentelemetry turns spans into OpenTelemetry's, which the
# SDK's batch processor exports over OTLP/HTTP in protobuf on its own thread,
# through the engine's own HTTP client, the collector an Operator-configured
# endpoint (ADR 0017). The engine's
# metrics, instrumented once with OpenTelemetry's API (ADR 0050): the
# executables' SDK exports them through the Prometheus exporter their ops
# listener serves, and over OTLP/HTTP from the periodic reader's own thread.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
opentelemetry-prometheus = { version = "0.33.1", default-features = false }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
prometheus = { version = "0.14.0", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
async-trait = { version = "0.1.92", default-features = false }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
# A UTF-8 string held as `Bytes`: a fetched document's text read in place
# (issue 2187).
bytestring = { version = "1.6.0", default-features = false }
http = { version = "1.5.0", default-features = false, features = ["std"] }
prost = { version = "0.14.1", default-features = false, features = ["std"] }
# Run IDs, from the Clock and Entropy (ADRs 0036 and 0059).
ulid = { version = "3.0.0", default-features = false }
# The Feature scanner keeps the characters rstest keeps in a case name
# (xtask).
unicode-ident = { version = "1.0.27", default-features = false }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
# The WHATWG URL Standard's parser, IDNA included: every URL a crawl's
# Frontier meets (ADR 0120), and a URL glob resolved as Playwright resolves
# one (ADR 0081).
url = { version = "2.5.8", default-features = false, features = ["std"] }
# Whether a name from outside input is in Unicode's composed form, as APFS
# compares names (ADR 0067), with the data `url`'s IDNA already takes.
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# CLDR's printed forms of numbers, dates and times, which a code-free
# field's Value transform learns by printing known values under its locale
# and reads text back against (ADR 0123): ICU4X formats but does not parse.
fixed_decimal = { version = "0.7.3", default-features = false }
icu_calendar = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.4.0", default-features = false }
writeable = { version = "0.6.4", default-features = false }
# Mozilla's root certificates, which the Browser cache's pinned downloads
# trust (ADR 0043), as ureq's rustls already does.
webpki-roots = { version = "1.0.9", default-features = false }
# `xtask rss`'s peak reader: GetProcessMemoryInfo on Windows (ADR 0071).
windows-sys = { version = "0.61.2", default-features = false }
# The archives the Browser cache unpacks: Chrome for Testing ships ZIPs.
zip = { version = "9.0.5", default-features = false }

# STYLE.md, Lints, formatting and toolchain; `unsafe`; Async and concurrency.
# `missing_docs` warns on `goodfetch-collie-client`, `goodfetch-collie`,
# `goodfetch-foxhound` and `goodfetch-protocol`: Cargo cannot add a lint to
# `lints.workspace = true`, so each of those crates opens its `lib.rs` with
# `#![warn(missing_docs)]` when it is added.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(goodfetch_loom)", "cfg(tokio_unstable)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The short allow-list of `pedantic` (never `too_many_lines` or
# `too_many_arguments`, ADR 0126).
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
exit = "deny"
iter_over_hash_type = "deny"
undocumented_unsafe_blocks = "deny"

# Goodfetch's fork of `wreq` 0.16.1 (spec #565, ADR 0042), carried in
# `vendor/wreq` as version `0.16.1+goodfetch.1`: upstream's commit
# 63429b4229f88adf6f1a71d7c3ffa62b5947f38c (its `.cargo_vcs_info.json`) plus
# one change, `ClientBuilder::tls_custom_verify`, a per-client certificate
# verification run during the handshake (`SSL_CTX_set_custom_verify`), with
# which the stealth HTTP tier checks a pin before any request is sent. The
# change is offered upstream. Drop this patch, the folder and the `exclude`
# above when a `wreq` release contains it, and move the `wreq` pin to that
# release. `goodfetch-fetch-tier`'s fuzz crate carries the same patch.
#
# Both forks declare `rust-version = "1.97"`, the workspace's MSRV (ADR 0030),
# where upstream declares 1.98: they compile on 1.97, as `just msrv` proves.
#
# And of `wreq-util` 0.2.0, carried in `vendor/wreq-util` as version
# `0.2.0+goodfetch.1`: upstream's commit
# de0dc6349bc2d4d1bd0bbbaa059b45ab1df3b0fd (its `.cargo_vcs_info.json`) with
# its `zstd` requirement at 0.14.3, as upstream's 4d21e3b65d (wreq-util#130)
# has it, for zstd 0.13's RUSTSEC-2026-0391 and zstd-safe 7's
# RUSTSEC-2026-0395 to RUSTSEC-2026-0406 (#1785); its examples and tests are
# left out. Drop this patch, the folder and its `exclude` above when a
# `wreq-util` release takes zstd 0.14.3 or newer, and move the `wreq-util`
# pin to that release. The fuzz crate carries this patch too.
#
# And of `rs-trafilatura` 0.2.2 (#1916, folding in #1634), carried in
# `vendor/rs-trafilatura` as version `0.2.2+goodfetch.1`: upstream's commit
# a20bb0d58ee17f0315d2e5f7d2a7119560aecd06 plus a document entry,
# `extract_document_with_options`, which reads a tree the caller parsed, so
# `content.extractor = "trafilatura"` reads the Page analysis's tree with no
# parse of its own (ADR 0138). Its `dom_query` is this workspace's, so the
# tree is the one type every reader shares; `html-cleaning` 0.3.0 (upstream's
# 5dad3bc6e85739091e260a47055ed731bc184afa) and `quick_html2md` 0.2.1
# (b7b8fcb195436059bd8011800063cbbe48a525dc), the crates it hands that tree
# to, are carried beside it in `vendor/` as `+goodfetch.1` for that version
# alone. Their binaries, examples, tests and benchmarks are left out. Drop
# these three patches, their folders and their `exclude` entries above when
# an rs-trafilatura release takes a tree and links this workspace's
# `dom_query`, and move the `rs-trafilatura` pin to that release. The fuzz
# crates that link goodfetch-extractor carry these patches too.
#
# And of `dom_smoothie` 0.18.2, carried in `vendor/dom_smoothie` as version
# `0.18.2+goodfetch.1`: upstream's commit
# 51c7f93e0218e406057d5a49a0935c2bb6f62726 (its `.cargo_vcs_info.json`) with
# one line of `src/helpers.rs` changed, `get_node_matching_string`'s
# `push_tendril` of an attribute's value to `push_slice`, so it builds under
# `dom_query`'s `atomic` feature (#2109; 0.19.0 has the same line); its tests
# are left out. Drop this patch, the folder and its `exclude` above when a
# `dom_smoothie` release builds under `atomic`, and move the `dom_smoothie`
# pin to that release. The fuzz crates that link goodfetch-extractor carry
# this patch too.
#
# And of `reqwest` 0.13.5 (issue 2326, ADR 0042), carried in `vendor/reqwest`
# as version `0.13.5+goodfetch.1`: upstream's commit
# de55373434f07f42926599dbb5a88550d8e55112 (its `.cargo_vcs_info.json`) plus
# one change, `ClientBuilder::tcp_connector`, the service the client opens
# its TCP connections through in place of its own, with which the HTTP tier
# connects through the engine's connection race (ADR 0118), as `wreq` does
# through the same hook in its fork. `vendor/reqwest.patch` is the change,
# against the published crate. Its tests, examples and lockfile are left out.
# Neither open upstream pull request is that hook: seanmonstar/reqwest#2879
# replaces the TCP, TLS and proxy steps together, as one connector, so the
# client's own TLS and proxy handling would be the caller's, and #3081 only
# sets hyper-util's Happy Eyeballs timeout, which leaves the race, the
# lookups and the attempt order the library's. Drop this patch, the folder,
# the patch file and the `exclude` above when a `reqwest` release takes a
# TCP connector, and move the `reqwest` pin to that release. The fuzz crate
# and `proving-ground` link reqwest; the fuzz crate carries this patch too.
[patch.crates-io]
dom_smoothie = { path = "vendor/dom_smoothie" }
html-cleaning = { path = "vendor/html-cleaning" }
quick_html2md = { path = "vendor/quick_html2md" }
reqwest = { path = "vendor/reqwest" }
rs-trafilatura = { path = "vendor/rs-trafilatura" }
wreq = { path = "vendor/wreq" }
wreq-util = { path = "vendor/wreq-util" }

# Build profiles (ADRs 0057, 0061 and 0071). `dev` and `test` stay Cargo's,
# but for SHA-256: every launch checks its browser build's digest, some
# 400 MB, which unoptimized takes tens of seconds and optimized well under
# one (#695).
#
# Debug information stays in the object files, beside the executables
# (`.dwo` on Linux, the `.o` files on macOS), instead of being linked into
# each test binary: backtraces still read file and line from them, and the
# links write and the target holds less (#2089). `ci-test` turns it off
# below, since its archived test binaries run away from the objects.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.sha2]
opt-level = 3

# Build scripts, proc-macros and the crates they use get line tables, as the
# workspace's other crates get them in `ci-test` and in the gate host's
# local builds (`CARGO_PROFILE_DEV_DEBUG`); Cargo's default gives them none.
# Cargo builds a crate that both the build and the code use once when the
# two settings match, and once for each when they differ, so with the
# default whether it was shared, and with it every crate above it, hung on
# what else a command built: `cargo run --bin xtask` and the test tools'
# build compiled the engine, Page and Collie apart, and the test tools' and
# the Quick suite's builds DuckDB apart. With them matching, those builds
# share them.
[profile.dev.build-override]
debug = "line-tables-only"

# And for literal search: the reset gate searches every file of a Goodfetch
# home for each Secret canary in a dozen encodings, the Browser cache's
# 400 MB build included, which unoptimized takes some 26 s a search and
# optimized 0.5 s (fix-queue 124).
[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

# DuckDB's C++ sources, which the `duckdb` crate builds through
# `libduckdb-sys`'s build script: unoptimized, a query of the SQL tab's
# tests takes minutes, so its tests and a debug Foxhound run them optimized;
# without debug information, which made each build of it 4 to 8 GB of target/.
[profile.dev.package.libduckdb-sys]
debug = false
opt-level = 3

# rs-trafilatura writes its debug notes to stderr whenever debug assertions
# are on: off for it, so a debug engine's stderr stays the `tracing`
# subscriber's alone (STYLE.md; #788). The other profiles have them off.
[profile.dev.package.rs-trafilatura]
debug-assertions = false

# And for the work a crawl does on each page: HTML parsing and its DOM,
# clean-up's selector matching and Filter-list engine, readability, JSON and
# JSON Schema validation, and the C sources `cc` builds at the profile's
# opt-level, the allocator's, SQLite's and zstd's. Unoptimized, they took
# most of the Foxhound Daemon soak's CPU, about 33 ms a page, so its time
# followed the host's load up to its five-minute kill (#2050). Like those
# above, they reach `dev` and the profiles that inherit it (`test`,
# `ci-test`), never `release`, `ci` or `bench`, which every counted and
# compared figure builds with (ADR 0061's note of 2026-11-04).
[profile.dev.package.dom_query]
opt-level = 3

[profile.dev.package.selectors]
opt-level = 3

[profile.dev.package.cssparser]
opt-level = 3

[profile.dev.package.html5ever]
opt-level = 3

[profile.dev.package.markup5ever]
opt-level = 3

[profile.dev.package.tendril]
opt-level = 3

[profile.dev.package.string_cache]
opt-level = 3

[profile.dev.package.adblock]
opt-level = 3

[profile.dev.package.dom_smoothie]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.jsonschema]
opt-level = 3

[profile.dev.package.libmimalloc-sys]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

#
# Release: fat LTO, one codegen unit, unwinding on panic, debug information
# split out beside each executable (`.dwp` on Linux, `.dSYM` on macOS, `.pdb`
# on Windows) and stripped from the executable itself.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

# Pull-request and merge-queue builds: the release profile with thin LTO.
[profile.ci]
inherits = "release"
lto = "thin"

# CI test builds: `test` with line tables only, so backtraces keep file and line.
[profile.ci-test]
inherits = "test"
debug = "line-tables-only"
split-debuginfo = "off"

# Their dependencies optimized once, as on 2026-10-23's hosted Release run the
# Proving ground's tests spent most of the Rust step in unoptimized
# dependencies (49 of 74 test-minutes): its slowest tests ran 4.5 times as
# fast, for twice the dependencies' build time. Debug assertions and overflow
# checks stay on; the workspace's own crates stay unoptimized.
[profile.ci-test.package."*"]
opt-level = 1

# Benchmarks (gungraun needs the line tables in the binary): the release
# settings with thin LTO and nothing split out or stripped.
[profile.bench]
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "off"
strip = "none"
