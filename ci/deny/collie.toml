# What Collie's executable ships (ADRs 0087, 0088, 0124 and 0125):
# cargo-deny's bans, rooted at Collie's executable crate with `--all-features`
# and `--exclude-dev` (ci/deny/products.sh). The workspace-wide rules are
# deny.toml's.
#
# Collie ships none of Foxhound's crates (the region `xtask codegen` writes
# at the end) and none of the third-party crates only Foxhound's capabilities
# use. A third-party crate that only Foxhound's crates use joins this list in
# the pull request that adds it, and the fresh review checks it (ADR 0087).

# DuckDB, for Datasets, search across runs and the SQL tab (ADR 0088).
[[bans.deny]]
crate = "duckdb"
reason = "only Foxhound's Datasets use DuckDB (ADR 0088)"

[[bans.deny]]
crate = "libduckdb-sys"
reason = "only Foxhound's Datasets use DuckDB (ADR 0088)"

# Apache Arrow, which the `duckdb` crate takes for its Arrow results.
[[bans.deny]]
crate = "arrow"
reason = "exists for DuckDB, which only Foxhound's SQL tab uses (ADR 0088)"

# wreq, for the impersonated HTTP fetch tier, and the crates that exist for
# it; not its BoringSSL, which Collie's TLS relay links (ADR 0124).
[[bans.deny]]
crate = "wreq"
reason = "only Foxhound's HTTP fetch tiers use wreq (ADRs 0088 and 0124)"

[[bans.deny]]
crate = "wreq-proto"
reason = "exists for wreq, which only Foxhound uses (ADR 0124)"

[[bans.deny]]
crate = "wreq-rt"
reason = "exists for wreq, which only Foxhound uses (ADR 0124)"

[[bans.deny]]
crate = "wreq-util"
reason = "exists for wreq, which only Foxhound uses (ADR 0124)"

[[bans.deny]]
crate = "http2"
reason = "wreq's HTTP/2 fork, which only Foxhound uses (ADR 0124)"

# What wreq and wreq-util bring that nothing else uses: wreq's connection
# cache, wreq-util's options builder, and the Brotli crate wreq-util reads
# compressed TLS certificates with (spec #579).
[[bans.deny]]
crate = "lru"
reason = "exists in the graph for wreq, which only Foxhound uses (spec #579, ADR 0124)"

[[bans.deny]]
crate = "typed-builder"
reason = "exists in the graph for wreq-util, which only Foxhound uses (spec #579, ADR 0124)"

[[bans.deny]]
crate = "brotli"
reason = "exists in the graph for wreq-util's certificate compression, which only Foxhound uses (spec #579, ADR 0124)"

# BoringSSL, through the fork wreq uses, only for the TLS relay (ADR 0124):
# each under the listed direct parents only. The relay is the egress relay's
# terminating mode in `goodfetch-page`, which Collie's Rust SDK crate links
# with no Cargo feature (#635).
[[bans.deny]]
crate = "tokio-btls"
wrappers = ["goodfetch-page"]
reason = "in Collie, only the TLS relay's crate takes BoringSSL (ADR 0124)"

[[bans.deny]]
crate = "btls"
wrappers = ["goodfetch-page", "tokio-btls"]
reason = "in Collie, only the TLS relay's crate takes BoringSSL (ADR 0124)"

[[bans.deny]]
crate = "btls-sys"
wrappers = ["btls", "goodfetch-page"]
reason = "in Collie, only the TLS relay's crate takes BoringSSL (ADR 0124)"

# reqwest, the HTTP fetch tier's transport: Foxhound's alone (spec #579,
# ADR 0088). The Brotli decoder is no longer Foxhound's alone: Collie's
# engine decodes `br` bodies under the response limits (SC-05, #644).
[[bans.deny]]
crate = "reqwest"
reason = "only Foxhound's HTTP fetch tier uses reqwest (spec #579, ADR 0088)"

# Paid fetches (ADR 0045), Foxhound's alone (ADR 0088).
[[bans.deny]]
crate = "x402-rs"
reason = "only Foxhound's Paid fetches use x402 (ADR 0088)"

[[bans.deny]]
crate = "alloy"
reason = "only Foxhound's Paid fetches use alloy (ADR 0088)"

# The in-binary Sinks' database and object-store drivers (ADRs 0026 and
# 0088). SQLite is not one: Collie's Run index uses it. The SFTP and FTP
# Sinks' drivers join once their tickets choose the crates; webhooks, SMTP
# and the Notification channels are not banned, since Collie carries them.
[[bans.deny]]
crate = "object_store"
reason = "only Foxhound's object-store Sinks use it (ADRs 0026 and 0088)"

[[bans.deny]]
crate = "tokio-postgres"
reason = "only Foxhound's PostgreSQL Sinks use it (ADRs 0026 and 0088)"

[[bans.deny]]
crate = "postgres"
reason = "only Foxhound's PostgreSQL Sinks use it (ADRs 0026 and 0088)"

[[bans.deny]]
crate = "sqlx-postgres"
reason = "only Foxhound's PostgreSQL Sinks use it (ADRs 0026 and 0088)"

[[bans.deny]]
crate = "pgvector"
reason = "only Foxhound's pgvector Sink uses it (ADRs 0026 and 0088)"

[[bans.deny]]
crate = "mysql_async"
reason = "only Foxhound's MySQL and MariaDB Sinks use it (ADRs 0026 and 0088)"

[[bans.deny]]
crate = "mysql"
reason = "only Foxhound's MySQL and MariaDB Sinks use it (ADRs 0026 and 0088)"

[[bans.deny]]
crate = "sqlx-mysql"
reason = "only Foxhound's MySQL and MariaDB Sinks use it (ADRs 0026 and 0088)"

# hashlink is not banned: it is rusqlite's statement cache (its `cache`
# feature), which the run file's connections, Collie's engine's among them,
# keep every statement prepared in (ADR 0138).

