# What Foxhound's executable ships (ADRs 0087 and 0125): cargo-deny's bans,
# rooted at Foxhound's executable crate with `--all-features` and
# `--exclude-dev` (ci/deny/products.sh). Foxhound contains Collie, so only the
# test-only crates are banned here; the workspace-wide rules are deny.toml's.

# The test-only crates, which no Product ships (ADRs 0062, 0069, 0087 and
# 0125): the shared helpers, the test adapters and the test executables.
[[bans.deny]]
crate = "goodfetch-test-support"
reason = "test-only: tests take it, no Product ships it (ADR 0062)"

[[bans.deny]]
crate = "goodfetch-test-client"
reason = "test-only: the protocol-aware test helpers, which tests take and no Product ships (ADR 0062)"

[[bans.deny]]
crate = "goodfetch-simulation"
reason = "test-only: turmoil's network adapter (ADRs 0087 and 0125)"

[[bans.deny]]
crate = "goodfetch-scripted-model"
reason = "test-only adapter (ADR 0125)"

[[bans.deny]]
crate = "goodfetch-recording-gate"
reason = "test-only adapter of the page's value and response observer (ADR 0125)"

[[bans.deny]]
crate = "goodfetch-scripted-engine"
reason = "test-only executable (ADR 0069)"

[[bans.deny]]
crate = "goodfetch-test-env"
reason = "test-only executable (ADR 0062)"

[[bans.deny]]
crate = "goodfetch-stub-gateway"
reason = "test-only adapter: the Stub gateway, a stand-in of Goodfetch Cloud's gateway (ADRs 0096 and 0125)"
