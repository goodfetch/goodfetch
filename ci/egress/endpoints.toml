[[deny]]
job = "nightly.yml#free-threaded-windows"

[[outside]]
job = "nightly.yml#free-threaded-macos"
reason = "As the Release suite's macOS cells, which run the same tests outside the deny (ADR 0043's amendment of 2026-11-22)."

[[outside]]
job = "nightly.yml#scorecard"
reason = "OpenSSF Scorecard reads the repository through GitHub's interface, and its Live check reads Scorecard's results; it runs none of the product."

# ADR 0043's named jobs. Each area adds the endpoints its Live checks reach
# in the pull request that adds them: the Sinks' free-tier accounts (ADR
# 0076), the Paid fetch testnets and the real vendors are not chosen yet.
[[named]]
job = "nightly.yml#sinks"
exception = "saas-sinks"
endpoints = []

[[named]]
job = "nightly.yml#testnets"
exception = "testnets"
endpoints = []

[[named]]
job = "nightly.yml#releases"
exception = "unpinned-releases"
endpoints = ["registry.npmjs.org:443", "pypi.org:443", "files.pythonhosted.org:443"]

[[named]]
job = "nightly.yml#models"
exception = "model"
endpoints = ["ai-gateway.vercel.sh:443"]

[[named]]
job = "live.yml#vendors"
exception = "vendor-conformance"
endpoints = []

[[named]]
job = "live.yml#provider"
exception = "model"
endpoints = ["ai-gateway.vercel.sh:443"]

[[outside]]
job = "record-models.yml#gate"
reason = "Runs bench's live-gate check on repository variable and worst-case USD from committed bench/live-ai-caps.json; makes zero network calls and runs none of the product (ADR 0065, #415)."

[[named]]
job = "record-models.yml#record"
exception = "model"
endpoints = ["ai-gateway.vercel.sh:443"]

# ADRs 0070 and 0076's real-account Integration checks behind a Cloudflare
# Quick Tunnel (`cloudflared tunnel --url`, off until the owner sets the
# repository variable at M4). Each platform's API host joins this list when
# area 11 adds its Live check.
[[named]]
job = "live.yml#integration-accounts"
exception = "integration-account"
endpoints = [
  "api.trycloudflare.com:443",
  "region1.v2.argotunnel.com:7844",
  "region2.v2.argotunnel.com:7844",
]

