# ADR 0043's outbound-traffic deny in CI: the one place that says what each
# job may reach. `xtask egress check` (Quick suite) fails on a workflow job
# missing here, and `ci/egress/egress.sh` builds each job's deny from it.
#
# - [[deny]]: a job that runs Goodfetch's product. Under the deny it reaches
#   only the fixtures, local to its VM. It denies after its installs, cache
#   restores and pinned downloads (`just fetch`, run when the VM starts, and
#   the pinned artifact mirror's downloads) and before its first test step,
#   runs the Egress canary right after, and fails on any other connection.
# - [[named]]: a job ADR 0043 names, under the deny but also reaching its own
#   `endpoints` ("<host>:<port>"). Its `exception` says which of ADR 0043's
#   jobs it is: saas-sinks, benchmark, testnets, vendor-conformance,
#   clean-up-rules-daily, cloud-run-deploy, model, integration-account,
#   unpinned-releases or fixture-licence.
# - [[outside]]: a job that runs none of the product, or one ADR 0043 lets run
#   it without the deny, with the reason.

# The Egress canary's forbidden connection: a public address no job may reach.
canary = "1.1.1.1:443"

# The pinned artifact mirror (ADR 0043's digest-pinned downloads: the test V8
# build, ADR 0067, and Goodfetch's own releases from every `url` of
# compat/releases.toml, ADR 0066, among them) is no endpoint here: a job
# fetches what it needs before its deny, so a denied step that reaches
# GitHub fails the job (owner decision of 2026-10-19).

# The hosted tier's gate steps, in the job's container on a standard hosted
# runner (ADR 0135's amendment of 2026-11-22): the image builds and `just
# fetch` runs before the deny, which applies in the container's network
# namespace. Lint, which reads GitHub, has its own job outside it.
[[deny]]
job = "pull-request.yml#quick"

[[outside]]
job = "pull-request.yml#lint"
reason = "It runs lint, whose zizmor runs the online audits and whose quarantine-list check reads GitHub's issues, and runs none of the product."

# A batch's hosted Pre-merge suite (issue 3378): the build of the archive
# comes before the deny, and its doctests and each shard's tests run under
# it; the record job reads the shards' results and GitHub's records.
[[deny]]
job = "pull-request.yml#pre-merge-build"

[[deny]]
job = "pull-request.yml#pre-merge-shard"

[[outside]]
job = "pull-request.yml#pre-merge-record"
reason = "It judges the shards' results, runs the exercise audit over their records and records the step's result, after downloading the hosted records GitHub holds, and runs none of the product's tests."

[[deny]]
job = "update-screenshots.yml#update"

# The Release suite's cells (ADR 0108). The hosted Linux cells deny in a
# network namespace, the Windows cell with firewall rules on the product's
# programs, and the visual job in the hosted tier's container, whose network
# namespace the pinned Playwright image's container shares (ci/egress/egress.sh,
# ci/hosted/visual.sh). The macOS cells run outside the deny (ADR 0043's
# amendment of 2026-11-22).
[[deny]]
job = "release-suite.yml#linux-x64"

[[deny]]
job = "release-suite.yml#linux-arm64"

[[deny]]
job = "release-suite.yml#windows-x64"

[[outside]]
job = "release-suite.yml#macos-arm64"
reason = "On macOS itself, the runner's standard user has no deny but a sandbox profile, under which the browser's and Plugins' own Seatbelt sandboxes cannot start; the Linux cells run the same tests under the deny (ADR 0043's amendment of 2026-11-22)."

[[outside]]
job = "release-suite.yml#macos-x64"
reason = "As the macos-arm64 cell, on an Intel runner (ADR 0043's amendment of 2026-11-22)."

[[deny]]
job = "release-suite.yml#visual"

[[outside]]
job = "pull-request.yml#chromium-build-gate"
reason = "Until its first build lands (#445) it builds and runs nothing. Then its fetches come before the deny and its tests run under it (ADR 0074)."

[[outside]]
job = "pull-request.yml#plan"
reason = "It plans the hosted steps from the change's files and the hosted records GitHub holds, and runs none of the product."

[[outside]]
job = "pull-request.yml#all-green"
reason = "It judges the run through GitHub's API and runs none of the product."

[[outside]]
job = "lab.yml#lab"
reason = "It runs the frozen R&D lab under rnd/, which is no Product."

[[outside]]
job = "cache-warming.yml#warm"
reason = "It fetches and builds the tier's targets without running them, and saves the build cache."

# Test health (ADR 0064): the jobs that run tests deny; those that read and
# write the results store, GitHub's interface and the ceiling run none of the
# product.
[[deny]]
job = "test-health.yml#quarantined"

[[deny]]
job = "test-health.yml#constrained"

[[outside]]
job = "test-health.yml#report"
reason = "It scans the results store, keeps the flaky-test and live-check issues, checks the performance figures for drift and builds the Allure report; it runs none of the product (ADRs 0064 and 0071)."

[[outside]]
job = "test-health.yml#budget"
reason = "It counts the month's minutes from the results store; it runs none of the product."

# The coverage job (ADR 0072): its tests run the instrumented product under
# the deny; `budget` only counts the month's minutes, and `compare` only reads
# the reports and keeps its issue.
[[deny]]
job = "coverage.yml#coverage"

[[outside]]
job = "coverage.yml#compare"
reason = "It compares the job's reports with the Quality register and opens its issue through GitHub's API (ADR 0072); it runs none of the product."

[[outside]]
job = "coverage.yml#budget"
reason = "It counts the month's minutes from the results store; it runs none of the product."

[[deny]]
job = "diagnostic.yml#rerun"

[[outside]]
job = "diagnostic.yml#rerun-owner-machine"
reason = "It runs a failed macOS cell's tests again on the owner's machine, as that cell runs them: outside the deny (ADR 0043's amendment of 2026-11-22)."

[[outside]]
job = "diagnostic.yml#select"
reason = "It reads the failed run's JUnit files and the results store to choose the tests to run again; it runs none of the product."

[[outside]]
job = "results.yml#ingest"
reason = "The ingest copies JUnit files into the results store and runs none of the product (ADR 0064)."

[[outside]]
job = "results.yml#daily"
reason = "The daily ingest copies JUnit files into the results store and runs none of the product (ADRs 0064 and 0135)."

[[outside]]
job = "release-suite.yml#plan"
reason = "It reads and writes the Release runs' records through GitHub's API to choose the cells, and runs none of the product."

[[outside]]
job = "release-suite.yml#budgets"
reason = "It reads the results store and opens budget issues through GitHub's API (ADR 0061), and runs none of the product."

[[outside]]
job = "release-suite.yml#caches"
reason = "It lists and deletes the repository's caches through GitHub's API (ADR 0061), and runs none of the product."

[[outside]]
job = "watchlist.yml#watchlist"
reason = "It reads the vendor names of the two public watchlists, webappanalyzer and Scrapfly's Antibot-Detector, and opens issues through GitHub's API; it runs none of the product (ADRs 0035 and 0043)."

[[outside]]
job = "codeql.yml#analyze"
reason = "CodeQL reads the sources without building them (`build-mode: none`) and runs none of the product (ADR 0067); it is skipped while the repository is private."
