# gitleaks' own rules, as CI's secret scans read them (ADR 0067): over each
# job's outputs before they upload (ci/leaks.sh) and over each pull request's
# commits while the repository is private (ci/commit-leaks.sh). Each scan
# also runs the Secret canaries' rule, test-support/fixtures/canaries/
# gitleaks.toml, on its own: gitleaks extends one configuration only, either
# its defaults or a file.
#
# The allowlists name only values committed on purpose that look like
# secrets and are not: each entry says why.
title = "Goodfetch"

[extend]
useDefault = true

[[allowlists]]
description = "The Proving ground's seeded test accounts, fake by construction (ADR 0063's task lists), and the canaries' own fixtures"
paths = [
  '''(^|/)journeys/tasks/seed-[0-9]+\.json$''',
  '''(^|/)test-support/fixtures/canaries/''',
]

[[allowlists]]
description = "The certificate_file fuzz target's seeds and dictionary (ADR 0067): keys made once for the seeds, which sign nothing and guard nothing, and the PEM markers it mutates around"
paths = [
  '''(^|/)crates/goodfetch-engine/fuzz/certificate_file/seeds/''',
  '''(^|/)crates/goodfetch-engine/fuzz/certificate_file/dictionary\.dict$''',
]

[[allowlists]]
description = "Third-party filter lists vendored as published (ADR 0047, #713): their comments cite upstream commit IDs, which match token rules"
paths = [
  '''(^|/)crates/goodfetch-clean-up-rules/rules/[^/]+\.txt$''',
]

[[allowlists]]
description = "RFC 6455's sample Sec-WebSocket-Key, which the Proving ground's WebSocket tests send"
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']

[[allowlists]]
description = "The made-up private key a TLS settings test pastes where a Secret reference belongs (#626), in its first and its final form: 57 and 53 characters, not base64, no key at all"
regexes = ['''AgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg''']

[[allowlists]]
description = "The made-up token the Kennel's Text tests mask where the truncation cuts it (spec #2052): sixteen hex digits counting up, no key at all"
regexes = ['''0123456789abcdef''']

[[allowlists]]
description = "The name of the environment variable the Proving ground's online copy reads its Anubis signing key from (#168), in its module docs and settings: a variable's name, not its value"
regexes = ['''PROVING_GROUND_ANUBIS_HS512_SECRET''']
