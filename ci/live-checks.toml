# Every Live check (ADR 0064; TESTING.md, Live checks) and its owning area,
# numbered as ADR 0037's table numbers the V1 areas. A Live check reports to
# the results store under the `live` tier: its ID is its JUnit test case's,
# as the ingest names it, and a skipped test case is an inconclusive result.
#
# The scan (`xtask results scan`) opens or updates a Live check's one
# `live-check` issue on a fail or three inconclusive results in a row, with
# its area in the title, and fails on a Live check this list does not name.
#
# A check a shell job runs also names that `job` ("<workflow file>#<job>")
# and the command it runs (`run`, through `bash -c` from the checkout's
# root). The job's `xtask results live-run --job <job>` runs each of them
# and writes its JUnit file: exit 0 passes, exit 75 (the outside side was
# unavailable) is inconclusive, and any other exit fails. A check written by
# another command, such as `xtask results live-check`, has neither. Each area
# adds its checks in the pull request that adds their jobs:
#
# [[live-check]]
# id = "saas-sinks snowflake"
# area = 6
# job = "nightly.yml#sinks"
# run = "<the command that writes one row and reads it back>"

# The docs site's (ADR 0068; .github/workflows/docs.yml): Playwright tests,
# named by their file and title.
[[live-check]]
id = "website/tests/live/external-links.live.ts › docs-external-links"
area = 1

[[live-check]]
id = "website/tests/live/deploy-smoke.live.ts › docs-deploy-smoke"
area = 1

# OpenSSF Scorecard against ci/scorecard.toml's floors (#146). It blocks
# nothing: a check under its floor opens this check's issue.
[[live-check]]
id = "scorecard"
area = 1
job = "nightly.yml#scorecard"
run = "target/debug/xtask results scorecard --results target/scorecard/results.json"

# Nightly provider shape check against committed Model recordings and models.toml
# (ADRs 0065 and 0076, #417). Stays disabled (exits 0 with zero calls) until M4
# sets GOODFETCH_LIVE_PROVIDER_CHECK.
[[live-check]]
id = "provider-check"
area = 9
job = "live.yml#provider"
run = "node bench/src/cli.ts provider-check"

# Nightly Evaluations on held-out seeds (ADRs 0065 and 0076, #420). Stays
# disabled (exits 0 with zero calls) until M4 sets GOODFETCH_LIVE_EVAL_NIGHTLY.
[[live-check]]
id = "eval-nightly"
area = 9
job = "nightly.yml#models"
run = "node bench/src/cli.ts eval-nightly"

# Skill Evaluations comparing with vs without each Product's skills (ADRs 0065,
# 0076, 0090 and 0094, #423). Stays disabled until M4 sets GOODFETCH_LIVE_SKILLS.
[[live-check]]
id = "skills"
area = 9
job = "nightly.yml#models"
run = "node bench/src/cli.ts skills"

# Clean-up rules daily-channel gate on owned fixtures and the online Proving
# ground (ADRs 0047 and 0064; issue 208). Exit 75 marks inconclusive and
# publishes nothing.
[[live-check]]
id = "clean-up-rules-daily"
area = 1
job = "clean-up-rules-daily.yml#build-and-gate"
run = "ci/release/gate-clean-up-set.sh"

# Nightly adapter peer-range check against npm and PyPI for new majors and
# prereleases (ADRs 0064 and 0070; issue 1382). Reports without blocking.
[[live-check]]
id = "adapters-latest"
area = 11
job = "nightly.yml#releases"
run = "node ci/live/adapters-latest.ts"

# Post-publish verified-node scanner for `@goodfetch/n8n-nodes-collie`
# (ADRs 0064 and 0070; issue 1405). Reports without blocking.
[[live-check]]
id = "n8n-scanner"
area = 11
job = "nightly.yml#releases"
run = "node ci/live/n8n-scanner.ts"
