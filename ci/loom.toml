# The modules loom model-checks (ADR 0060): a module that synchronizes
# threads with locks of its own, through its crate's `sync` module, which
# maps them to loom's under `--cfg goodfetch_loom`. `just loom` builds each
# crate's unit tests with that cfg, in a build folder of its own
# (`target/loom/`), and runs the module's loom tests: every interleaving of
# their threads, up to `preemptions` forced switches each.

# The most forced thread switches loom explores in one interleaving: 2 in
# the Pre-merge and Release suites (ADR 0060; 3 is the nightly-only job's).
preemptions = 2

# The CPU pool's own threads (#2200).
[[module]]
crate = "goodfetch-engine"
filter = "tasks::cpu_pool::loom_tests"   # the libtest filter that selects its loom tests

# The lock and wakers an event stream's call shares with the values it
# opens, whose readers read on several threads (issue 3131).
[[module]]
crate = "goodfetch-collie-client"
filter = "event_stream::opened::loom_tests"
