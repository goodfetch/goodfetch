# The reference build `xtask perf` holds every counted figure to, at most 1.10
# times its figure (`drift.reference`, ADR 0140): #1577's tuned build, the
# merge of #2074, pinned by #2281 (owner, 2026-11-10, grilling of G-09, Q5).
# Each release moves it to that release's tag. A figure over 1.10 times it
# goes to the owner with its cause; the pin is not moved to a later commit to
# pass.
#
# With no revision, the check reports that it has not run yet. `xtask perf build`
# fails when this file is missing.
revision = "5d900125ec3eeaf15cbea22289cee3f3d9e283ef"

# Each figure the owner accepted over 1.10 times the reference, by a note of
# ADR 0140: `xtask perf` holds it to `up_to` instead (with the register's
# 0.5 % for a figure read under Valgrind), fails it past that, and fails the
# entry once the figure is back within 1.10 times its reference. A release's
# pin starts the list again.

