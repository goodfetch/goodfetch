# Every secret a workflow reads, what it is for, and the only jobs that read
# it (ADR 0076). `xtask workflow-policy`, in lint, fails on a job reading a
# secret not listed for it here, on a secret read outside `jobs:` (which
# every job would get) or passed with `secrets: inherit`, and on a job listed
# for a secret it no longer reads. The job's own `GITHUB_TOKEN` is not listed:
# each job's `permissions:` sets its reach.
#
# A secret is added in the pull request that adds the job that reads it, with
# the job; the secret itself is set in the repository's settings by the owner.

# The results store's fine-grained token on the `test-results` repository
# (TESTING.md, Flaky tests and Live checks): the ingest, which pushes, and
# the jobs that read the store.
[[secret]]
name = "TEST_RESULTS_TOKEN"
use = "Reads the results store, and the ingest pushes to it."
jobs = [
  "coverage.yml#budget",
  "diagnostic.yml#select",
  "release-suite.yml#budgets",
  "results.yml#daily",
  "results.yml#ingest",
  "test-health.yml#budget",
  "test-health.yml#report",
]

# The Vercel AI Gateway's key on its free tier (ADR 0076): the model jobs'
# Live checks, which reach the gateway alone.
[[secret]]
name = "AI_GATEWAY_API_KEY"
use = "Calls free-tier models through the Vercel AI Gateway in ADR 0065's model jobs."
jobs = [
  "live.yml#provider",
  "nightly.yml#models",
  "record-models.yml#record",
]

# The Proving ground's online copy (#168; ADRs 0025, 0032 and 0076): the
# `proving-ground-online` environment's secrets, which its one job reads once
# the owner approves a release tag's deployment; proving-ground/deploy/README.md
# lists them.
[[secret]]
name = "PROVING_GROUND_DEPLOY_HOST"
use = "Names the host the Proving ground's online copy deploys to."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "PROVING_GROUND_DEPLOY_SSH_KEY"
use = "Signs in to the deploy host over SSH."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "PROVING_GROUND_DEPLOY_KNOWN_HOSTS"
use = "Holds the deploy host's SSH host keys, so the deploy reaches that host alone."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "PROVING_GROUND_TUNNEL_CREDENTIALS"
use = "Runs the tunnel the online copy is served through."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "PROVING_GROUND_TURNSTILE_SECRET"
use = "The Turnstile challenge's server key, under the name online.toml gives it."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "PROVING_GROUND_RECAPTCHA_SECRET"
use = "The reCAPTCHA challenge's server key, under the name online.toml gives it."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "PROVING_GROUND_HCAPTCHA_SECRET"
use = "The hCaptcha challenge's server key, under the name online.toml gives it."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "PROVING_GROUND_ALTCHA_KEY"
use = "The ALTCHA challenge's HMAC key, under the name online.toml gives it."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "PROVING_GROUND_ANUBIS_HS512_SECRET"
use = "The Anubis challenge's HS512 signing key, under the name online.toml gives it."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "PROVING_GROUND_EDGE_SECRET"
use = "The `[edge]` shared secret between the edge and the Proving ground, under the name online.toml gives it."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "VERCEL_TOKEN"
use = "Deploys `botid/`, the docs site, and the nightly Python index to their Vercel projects on the Hobby plan."
jobs = [
  "docs.yml#deploy",
  "proving-ground-online.yml#deploy",
  "release-nightly.yml#deploy-python-index",
]

[[secret]]
name = "VERCEL_ORG_ID"
use = "Names the Vercel team `botid/` and the nightly Python index deploy under."
jobs = [
  "proving-ground-online.yml#deploy",
  "release-nightly.yml#deploy-python-index",
]

[[secret]]
name = "VERCEL_PROJECT_ID"
use = "Names the Vercel project `botid/` deploys to."
jobs = [
  "proving-ground-online.yml#deploy",
]

[[secret]]
name = "VERCEL_PROJECT_ID_NIGHTLY_INDEX"
use = "Names the Vercel project serving `goodfetch.dev/nightly/simple` (issue 205)."
jobs = [
  "release-nightly.yml#deploy-python-index",
]

# Platform signing credentials in the `release` environment (ADR 0039, ADR 0076,
# issue 142): only the four Platform signing jobs read them; build jobs never
# see them. Paid accounts stay declined until the owner opens them.
[[secret]]
name = "APPLE_DEVELOPER_ID_P12"
use = "Base64-encoded Apple Developer ID Application `.p12` certificate imported into a temporary keychain."
jobs = [
  "release-build.yml#sign-proving-ground-macos",
  "release-build.yml#sign-macos",
]

[[secret]]
name = "APPLE_DEVELOPER_ID_PASSWORD"
use = "Password unlocking `APPLE_DEVELOPER_ID_P12` inside the temporary signing keychain."
jobs = [
  "release-build.yml#sign-proving-ground-macos",
  "release-build.yml#sign-macos",
]

[[secret]]
name = "APPLE_SIGNING_IDENTITY"
use = "Apple Developer ID signing identity name passed to `codesign`."
jobs = [
  "release-build.yml#sign-proving-ground-macos",
  "release-build.yml#sign-macos",
]

[[secret]]
name = "APPLE_NOTARY_KEY"
use = "Base64-encoded App Store Connect API `.p8` key used by `xcrun notarytool`."
jobs = [
  "release-build.yml#sign-proving-ground-macos",
  "release-build.yml#sign-macos",
]

[[secret]]
name = "APPLE_NOTARY_KEY_ID"
use = "App Store Connect API key ID passed to `xcrun notarytool`."
jobs = [
  "release-build.yml#sign-proving-ground-macos",
  "release-build.yml#sign-macos",
]

[[secret]]
name = "APPLE_NOTARY_ISSUER_ID"
use = "App Store Connect API issuer UUID passed to `xcrun notarytool`."
jobs = [
  "release-build.yml#sign-proving-ground-macos",
  "release-build.yml#sign-macos",
]

[[secret]]
name = "AZURE_CLIENT_ID"
use = "Azure Entra application client ID used for OIDC federation with Azure Artifact Signing."
jobs = [
  "release-build.yml#sign-proving-ground-windows",
  "release-build.yml#sign-windows",
]

[[secret]]
name = "AZURE_TENANT_ID"
use = "Azure Entra tenant ID used for OIDC federation with Azure Artifact Signing."
jobs = [
  "release-build.yml#sign-proving-ground-windows",
  "release-build.yml#sign-windows",
]

[[secret]]
name = "AZURE_SIGNING_ENDPOINT"
use = "Azure Artifact Signing regional endpoint URL."
jobs = [
  "release-build.yml#sign-proving-ground-windows",
  "release-build.yml#sign-windows",
]

[[secret]]
name = "AZURE_SIGNING_ACCOUNT"
use = "Azure Artifact Signing account name."
jobs = [
  "release-build.yml#sign-proving-ground-windows",
  "release-build.yml#sign-windows",
]

[[secret]]
name = "AZURE_SIGNING_PROFILE"
use = "Azure Artifact Signing certificate profile name."
jobs = [
  "release-build.yml#sign-proving-ground-windows",
  "release-build.yml#sign-windows",
]

[[secret]]
name = "HOMEBREW_TAP_TOKEN"
use = "Fine-grained token scoped to goodfetch/homebrew-tap contents to update Formula/goodfetch-collie.rb and Formula/goodfetch-foxhound.rb on stable releases (issue 144)."
jobs = [
  "release.yml#publish-homebrew-and-installers",
]
