# Every secret a workflow reads, what it is for, and the only jobs that read
# it (ADR 0076). `xtask workflow-policy`, in lint, fails on a job reading a
# secret not listed for it here, on a secret read outside `jobs:` (which
# every job would get) or passed with `secrets: inherit`, and on a job listed
# for a secret it no longer reads. The job's own `GITHUB_TOKEN` is not listed:
# each job's `permissions:` sets its reach.
#
# A secret is added in the pull request that adds the job that reads it, with
# the job; the secret itself is set in the repository's settings by the owner.

# The results store's fine-grained token on the `test-results` repository
# (TESTING.md, Flaky tests and Live checks): the ingest, which pushes, and
# the jobs that read the store.
[[secret]]
name = "TEST_RESULTS_TOKEN"
use = "Reads the results store, and the ingest pushes to it."
jobs = [
  "coverage.yml#budget",
  "diagnostic.yml#select",
  "release-suite.yml#budgets",
  "results.yml#daily",
  "results.yml#ingest",
  "test-health.yml#budget",
  "test-health.yml#report",
]

# The Vercel AI Gateway's key on its free tier (ADR 0076): the model jobs'
# Live checks, which reach the gateway alone.
[[secret]]
name = "AI_GATEWAY_API_KEY"
use = "Calls free-tier models through the Vercel AI Gateway in ADR 0065's model jobs."
jobs = [
  "live.yml#provider",
  "nightly.yml#models",
]
