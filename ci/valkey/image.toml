# The pinned Valkey image the Politeness store's tests run (ADRs 0053 and
# 0059: a real Valkey container on Linux). Its `digest` is the
# multi-platform index of `repository:tag`, so each Linux architecture runs
# its own image, and the image cannot move.
#
# Read by ci/valkey/fetch.sh (`just fetch`), which pulls it before ADR 0043's
# deny, and by goodfetch-test-support's `Valkey`, which runs it with no
# network.
