# nextest's settings for `just windows` beneath the repository's
# .config/nextest.toml (issue 2767): its store sits in the container's build
# folder, since nextest puts it under the workspace's `target/` by default,
# which in a slot is a link to a folder the container does not mount.
[store]
dir = "/var/tmp/target/nextest"

# A test's child killed under Wine holds the test's output for a while
# after the test has seen it end. Wine's TerminateProcess closes the
# child's handles in wineserver and signals the child ended at once, while
# its Linux process exits only when it next runs Wine's handler for the
# signal wineserver sent it, which on a loaded host comes past the
# profile's 200 ms: nextest then fails the test as leaky, though it passed
# (issue 2916). Windows closes a process's handles before it signals the
# process ended, so a test that waits for its child there holds nothing
# past its end. A test's output held past 2 s is still a leak. An override
# of the default profile, the `ci` profile's parent, sets it, since
# nextest takes an override's setting over a profile's, and the
# repository's overrides come first.
[[profile.default.overrides]]
filter = "all()"
leak-timeout = { period = "2s", result = "fail" }

# Under Wine, every test's processes share one wineserver, so a test's
# Proving ground starts slower the more such tests run at once. The 158
# tests that missed its 30 s start deadline in a full run (issue 2916), run
# on their own once at each count: 25 missed it at 16 at once, none at 8 or
# 4, and 8 took the least time. This group holds their binaries' tests. The
# repository's groups come first, so a test one of them holds keeps that
# group's cap and runs beside these 8.
[test-groups]
"@tool:goodfetch-windows:start-deadline" = { max-threads = 8 }

[[profile.default.overrides]]
filter = """
binary_id(goodfetch-fetch-tier::it) | binary_id(goodfetch-foxhound::it)
| (binary_id(goodfetch-secret-providers::it) & test(/^clouds::/))
| (binary_id(goodfetch-test-support::it) & test(/^canaries::/))
"""
test-group = "@tool:goodfetch-windows:start-deadline"
