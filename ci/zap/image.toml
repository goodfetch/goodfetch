# The pinned ZAP image of the Console's baseline scan (ADR 0067; TESTING.md,
# Endpoints): the Release suite's linux-x64-gnu cell pulls it before the
# egress deny and runs it under the deny, so its Egress canary catches a call
# home. Its `digest` is the Linux x86-64 (amd64) manifest of
# `repository:tag`, so the image cannot move or switch architecture. Read by
# ci/zap.sh (one `key = "value"` a line); `xtask image-pins` checks the
# digest's form.
