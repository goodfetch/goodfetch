# git-cliff, which `xtask release changelog` runs to write a release's entries
# in CHANGELOG.md from Conventional Commits (spec #130). Before git-cliff
# writes them, `xtask release changelog` sets each commit's `extra.reach`:
# `foxhound` when every path it changes is on Foxhound's side, `both`
# otherwise (ADR 0094). It writes the changelog's header itself.

[changelog]
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for reach in ["both", "foxhound"] %}\
{% set reached = commits | filter(attribute="extra.reach", value=reach) %}\
{% if reached %}
### {% if reach == "both" %}Both Products{% else %}Foxhound only{% endif %}
{% for group, commits in reached | group_by(attribute="group") %}
#### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\
{% endif %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^doc", group = "<!-- 3 -->Documentation" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = "^(build|chore|ci|style|test)", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
