  { path = "tokio::runtime::Builder::new_current_thread", reason = "build a runtime through goodfetch-runtime (ADRs 0060 and 0081)", allow-invalid = true },
  { path = "tokio::runtime::Builder::new_multi_thread", reason = "build a runtime through goodfetch-runtime (ADRs 0060 and 0081)", allow-invalid = true },
  { path = "tokio::task::block_in_place", reason = "never block an async worker (ADR 0060)", allow-invalid = true },
  # Only the three writers touch stdout and stderr; stdin only through the transport.
  { path = "std::io::stdout", reason = "only the protocol transport, the CLI's output writer and the tracing writer touch stdout (STYLE.md)" },
  { path = "std::io::stderr", reason = "only the protocol transport, the CLI's output writer and the tracing writer touch stderr (STYLE.md)" },
  { path = "std::io::stdin", reason = "stdin is opened only in the transport module (ADR 0060)" },
  { path = "tokio::io::stdin", reason = "stdin is opened only in the transport module (ADR 0060)", allow-invalid = true },
  { path = "tokio::io::stdout", reason = "stdout is opened only in the transport module (ADR 0060)", allow-invalid = true },
  # A reqwest client opens its own sockets: only the HTTP fetch tier's transport builds one (ADR 0060).
  { path = "reqwest::ClientBuilder::build", reason = "a reqwest client opens its own sockets: only the HTTP fetch tier's transport builds one (ADR 0060)", allow-invalid = true },
  # So does a wreq client: only the stealth HTTP fetch tier's transport builds one (ADR 0060).
  { path = "wreq::ClientBuilder::build", reason = "a wreq client opens its own sockets: only the HTTP fetch tier's `wreq` transport builds one (ADR 0060)", allow-invalid = true },
  # Time, randomness and the environment come from their handles (ADR 0059).
  { path = "std::time::SystemTime::now", reason = "read time through the Clock handle (ADR 0059)" },
  { path = "std::time::Instant::now", reason = "read time through the Clock handle (ADR 0059)" },
  { path = "tokio::time::Instant::now", reason = "read time through the Clock handle (ADR 0059)", allow-invalid = true },
  # Library constructors that read the system clock themselves (STYLE.md).
  { path = "jiff::Timestamp::now", reason = "read time through the Clock handle (ADR 0059)", allow-invalid = true },
  { path = "jiff::Zoned::now", reason = "read time through the Clock handle (ADR 0059)", allow-invalid = true },
  { path = "rustls::pki_types::UnixTime::now", reason = "read time through the Clock handle; build a UnixTime from Clock::wall (ADR 0059)", allow-invalid = true },
  { path = "rustls_pki_types::UnixTime::now", reason = "read time through the Clock handle; build a UnixTime from Clock::wall (ADR 0059)", allow-invalid = true },
  { path = "web_bot_auth::message_signatures::MessageSigner::generate_signature_headers_content", reason = "it dates the signature by the wall clock itself: only an `identified` Session's signer calls it (ADRs 0045 and 0059)", allow-invalid = true },
