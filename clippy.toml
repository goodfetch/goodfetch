  { path = "std::thread::spawn", reason = "spawn through the owner's TaskTracker (STYLE.md)" },
  { path = "std::thread::Builder::spawn", reason = "spawn through the owner's TaskTracker (STYLE.md)" },
  { path = "std::thread::scope", reason = "spawn through the owner's TaskTracker (STYLE.md)" },
