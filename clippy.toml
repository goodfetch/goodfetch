  { path = "dom_query::Document::nip", reason = "this compiles its selector on each call: compile through CountedWork::compile_selector and use select_matcher (ADR 0140)", allow-invalid = true },
  { path = "dom_query::Document::try_select", reason = "this compiles its selector on each call: compile through CountedWork::compile_selector and use select_matcher (ADR 0140)", allow-invalid = true },
  { path = "dom_query::Document::select_single", reason = "this compiles its selector on each call: compile through CountedWork::compile_selector and use select_single_matcher (ADR 0140)", allow-invalid = true },
  { path = "dom_query::Selection::select", reason = "this compiles its selector on each call: compile through CountedWork::compile_selector and use select_matcher (ADR 0140)", allow-invalid = true },
