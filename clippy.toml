# STYLE.md's Clippy lists (Async and concurrency; Lints, formatting and
# toolchain; Cargo features). An exception is an `#[expect(…, reason = "…")]`
# on the one module allowed to use the item, never `#[allow]`.
allow-unwrap-in-tests = true
# Clippy's own list (`..`) plus the registry names and the words in prose the
# docs spell as written.
doc-valid-idents = ["PyPI", "JUnit", "LazyFS", "RustSec", "EasyList", "EasyPrivacy", "DuckDuckGo", "OneTrust", "TrustArc", "TikTok", "BoringSSL", "ClientHello", "AppArmor", "DuckDB", "OpenSpider", "CPython", "XPath", "WebKit", "TDMRep", "StrykerJS", ".."]

