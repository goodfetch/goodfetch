  { path = "std::env::var_os", reason = "only main reads the environment (ADR 0059)" },
  { path = "std::env::vars", reason = "only main reads the environment (ADR 0059)" },
  { path = "std::env::vars_os", reason = "only main reads the environment (ADR 0059)" },
