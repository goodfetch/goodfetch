  { path = "std::os::unix::net::UnixDatagram", reason = "sockets are opened only in the transport module (ADR 0060)", allow-invalid = true },
  { path = "tokio::net::TcpListener", reason = "sockets are opened only in the transport module (ADR 0060)", allow-invalid = true },
  { path = "tokio::net::TcpStream", reason = "sockets are opened only in the transport module (ADR 0060)", allow-invalid = true },
  { path = "tokio::net::TcpSocket", reason = "sockets are opened only in the transport module (ADR 0060)", allow-invalid = true },
  { path = "tokio::net::UdpSocket", reason = "sockets are opened only in the transport module (ADR 0060)", allow-invalid = true },
  { path = "tokio::net::UnixListener", reason = "sockets are opened only in the transport module (ADR 0060)", allow-invalid = true },
