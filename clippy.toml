  { path = "dom_query::Selection::is", reason = "this compiles its selector on each call: compile through CountedWork::compile_selector and use is_matcher (ADR 0140)", allow-invalid = true },
  { path = "dom_query::Selection::filter", reason = "this compiles its selector on each call: compile through CountedWork::compile_selector and use filter_matcher (ADR 0140)", allow-invalid = true },
