disallowed-types = [
  # An HTML parse goes through `CountedWork::parse_html` (ADR 0140). This type,
  # and not `dom_query::Document::from`: that call resolves to the trait's
  # `From::from`, which Clippy cannot single out, and naming the type catches
  # it. A signature names it `goodfetch_counted_work::ParsedHtml`.
  { path = "dom_query::Document", reason = "parse through CountedWork::parse_html and name the tree ParsedHtml (ADR 0140)", allow-invalid = true },
  # A `tokio::fs` file or folder reads and writes on the runtime's own
  # blocking threads, outside the owner's blocking policy (issue 2106).
  { path = "tokio::fs::File", reason = "tokio::fs runs outside the blocking policy: use std::fs inside TaskOwner::blocking (issue 2106)", allow-invalid = true },
  { path = "tokio::fs::OpenOptions", reason = "tokio::fs runs outside the blocking policy: use std::fs inside TaskOwner::blocking (issue 2106)", allow-invalid = true },
  { path = "tokio::fs::DirBuilder", reason = "tokio::fs runs outside the blocking policy: use std::fs inside TaskOwner::blocking (issue 2106)", allow-invalid = true },
  { path = "tokio::fs::ReadDir", reason = "tokio::fs runs outside the blocking policy: use std::fs inside TaskOwner::blocking (issue 2106)", allow-invalid = true },
  { path = "tokio::fs::DirEntry", reason = "tokio::fs runs outside the blocking policy: use std::fs inside TaskOwner::blocking (issue 2106)", allow-invalid = true },
  # Sockets are opened only in the transport modules of goodfetch-engine and,
  # on the client side, goodfetch-collie-client (ADR 0060).
