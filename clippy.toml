  { path = "std::fs::OpenOptions::open", reason = "open through CountedWork::open_file (ADR 0140)" },
  { path = "tokio::fs::OpenOptions::open", reason = "open through CountedWork::open_file on a blocking owner (ADR 0140)", allow-invalid = true },
