# The API breakage checks' input (`xtask api-check` and `just
# semver-checks`, ADR 0030, issue 148).
#
# `previous` is the commit of the previous release of the major, whose
# projections, `--json` output types and Rust crates under semver the checks
# compare with the tree's. Before the first release it is a commit of `main`
# that stands for one; each release's pull request moves it to the release's
# own commit.
#
# Each `[[announced]]` table names a break of a stable entry, announced for
# the next major, by its finding's subject (`<collie|foxhound> <section>
# <name>`, `bundle outputs <command>`, or `rust <crate> <lint>` for a
# cargo-semver-checks lint), and says why for the release notes. Each check
# fails on an announcement of its own that names no break, so the list is
# the one the release's pull request shows the owner.
#
#     [[announced]]
#     entry = "foxhound operations crawl.start"
#     reason = "…"

previous = "c20e03c8ce403cea6572374b31e081f49d990fb6"
