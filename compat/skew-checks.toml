# The checks each released minor of the current major takes against the
# current build in the Release suite (ADR 0066), per Product (ADR 0094).
# `xtask compat jobs` groups each minor's into as few jobs as fit the
# 45-minute job budget and writes `ci/release/skew-jobs.json`; while no older
# minor exists, the current build takes them against itself.
#
# `minutes` estimates a check, and `setup_minutes` what every job spends before
# its first one. Correct an estimate from measured runs; a check is never
# removed for its length.
#
# `journeys` runs the old tag's own Journeys of `product` on `surfaces`,
# against the current executable; `stdio` gives the SDKs that executable
# through their Product's engine-path variable.
#
# `older_engine = true` runs the old tag's published executable of `product`,
# with the current tree's tests, on what the current Foxhound wrote.
#
# `awaiting` is the ticket that gives the check its harness or its first
# Journey test: until that change removes the line, the check runs nowhere and
# the generated file lists it as awaiting, so nothing counts it as passed.

setup_minutes = 25

# Collie's five Clients, and its SDKs over stdio.

[[check]]
id = "collie-sdk-typescript"
product = "collie"
minutes = 4
journeys = { surfaces = ["sdk-typescript"] }
awaiting = 688

[[check]]
id = "collie-sdk-python"
product = "collie"
minutes = 4
journeys = { surfaces = ["sdk-python"] }
awaiting = 688

[[check]]
id = "collie-sdk-rust"
product = "collie"
minutes = 4
journeys = { surfaces = ["sdk-rust"] }
awaiting = 688

[[check]]
id = "collie-cli"
product = "collie"
minutes = 4
journeys = { surfaces = ["cli"] }

[[check]]
id = "collie-mcp"
product = "collie"
minutes = 4
journeys = { surfaces = ["mcp-stdio", "mcp-http"] }
awaiting = 1452

[[check]]
id = "collie-sdk-typescript-stdio"
product = "collie"
minutes = 4
journeys = { surfaces = ["sdk-typescript"], stdio = true }
awaiting = 688

[[check]]
id = "collie-sdk-python-stdio"
product = "collie"
minutes = 4
