# The Client conformance case list (ADR 0069; TESTING.md, SDKs): each case,
# by capability, with the Features it covers (ADR 0072), the surfaces it
# applies to and, where a mode does not have its capability yet, its
# `modes`. Every surface a case lists implements it in each of its modes;
# `xtask clients check` fails on a missing one or an unknown ID. Area 11
# writes the cases; each joins with the ticket whose code satisfies it.
# Bump the version whenever a case changes.
#
# The `sdk-typescript` and `sdk-python` cases below run in the `attached`
# mode only: the Daemon transport (#220 and area 11's Daemon ticket) adds
# `daemon` by removing their `modes` line (agent decision, pending owner
# review).
#
# The `cli` cases below run in the `attached` mode only: the CLI reaches a
# Daemon with area 11's Daemon ticket (#1183), which adds `daemon` by
# removing their `modes` line (agent decision, pending owner review).
#
# A case a platform lacks names the ones it runs on in `platforms`, by Rust's
# `cfg` name (`unix`, `windows`); a test behind any other `cfg`, or
# `#[ignore]`d, implements no case (`xtask clients check`).

[suite]
name = "clients"
version = "16"

[[capability]]
name = "lifecycle"

[[capability.case]]
id = "two-connections-at-once"
covers = ["story:11-15"]
surfaces = ["sdk-typescript", "sdk-python"]
modes = ["attached"]

[[capability.case]]
id = "connect-after-close"
covers = ["story:11-15"]
surfaces = ["sdk-typescript", "sdk-python"]
modes = ["attached"]

[[capability.case]]
id = "closed-after-close"
covers = ["story:11-17"]
surfaces = ["sdk-typescript", "sdk-python"]
modes = ["attached"]

[[capability.case]]
id = "nothing-at-import-or-connect"
covers = ["story:11-15"]
surfaces = ["sdk-typescript", "sdk-python"]
modes = ["attached"]

# The catalog's operations reach the engine through the members generated
# from them (ADR 0099; issues 2399, 1233 and 2793): attached in TypeScript
# and Python, linked in Rust, each surface taking the modes it has.
[[capability]]
name = "catalog-mapping"

[[capability.case]]
id = "catalog-mapping"
covers = ["story:11-178"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

# A program's first pages (issue 2400): opened, navigated, acted on through
# locators, read and closed, on the Proving ground through Collie's
# executable. TypeScript leads; the Python and Rust SDKs join with their
# parts of issues 1236 and 1237.
[[capability]]
name = "page"

[[capability.case]]
id = "page-form-program"
covers = ["story:11-77"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "goto-404-returns-the-response"
covers = ["story:11-84"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "second-new-page-in-the-default-session"
covers = ["story:11-77"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "page-read-fields"
covers = ["story:11-77", "operation:page.read"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "closed-page-raises-closed"
covers = ["story:11-77"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

# A program's crawl (issue 1467): declared on a `Crawl` value, started on
# Foxhound's executable, its handler served on the event loop, and its
# Records judged by the Proving ground's oracle. TypeScript leads; the
# Python SDK joins with issue 1468 and the Rust SDK with issue 2804.
[[capability]]
name = "crawl"

[[capability.case]]
id = "crawl-catalog-program"
covers = ["story:11-1013", "story:11-1015"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

# A handler's attempts (ADRs 0003 and 0093; issue 1467): a Crawl request
# whose attempt failed is delivered again, and only the Records of the
# attempt that commits are kept.
[[capability]]
name = "delivery"

[[capability.case]]
id = "handler-at-least-once"
covers = ["story:3-41"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "handler-exactly-once"
covers = ["story:3-41"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability]]
name = "product-conformance"

[[capability.case]]
id = "collie-accepted-by-foxhound"
covers = ["story:11-8"]
surfaces = ["sdk-typescript", "sdk-python"]
modes = ["attached"]

[[capability]]
name = "time"

[[capability.case]]
id = "interrupt-cancels-the-call"
covers = ["story:11-198"]
surfaces = ["cli"]
modes = ["attached"]
# Its test sends SIGINT; the Windows half, CTRL_BREAK_EVENT, has no test yet
# (spec #326's review, SP-3).
platforms = ["unix"]

# A call's own `timeout` in its three states (ADR 0080; issue 2827): left
# out it is not sent, so the setting's default applies, null sends null, no
# timeout, and a duration sends its milliseconds; one of zero or less is
# refused with `setting_invalid`, its `limit` given as an argument and its
# `fix` naming the null form. Attached in TypeScript and Python, linked in
# Rust, each surface taking the modes it has.
[[capability.case]]
id = "call-timeout-three-states"
covers = ["story:11-40", "story:11-42"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability]]
name = "catalog-mapping"

[[capability.case]]
id = "sequence-follows-until-it-ends"
covers = ["story:11-198"]
surfaces = ["cli"]
modes = ["attached"]

[[capability.case]]
id = "deprecated-command-warns"
covers = ["story:11-204"]
surfaces = ["cli"]
modes = ["attached"]

# A Run's Key-value store outside a handler, on Collie's executable (ADR
# 0103; #791): in TypeScript `tsc` rejects `set(key, null)`, and in Python
# and Rust it fails with `value_invalid`. The Python SDK's Run has no
# Key-value store yet, so `sdk-python` joins these cases with the ticket that
# adds it; `xtask clients check` only notes `sdk-rust` until its runner
# writes a case log (M2).
[[capability]]
name = "key-value-store"

[[capability.case]]
id = "key-value-store-get-absent-answers-null"
covers = ["story:6-28", "story:6-31"]
surfaces = ["sdk-typescript", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "key-value-store-set-null-refused"
covers = ["story:6-29"]
surfaces = ["sdk-typescript", "sdk-rust"]
modes = ["attached", "linked"]

# Bytes with their content type (#792): `getBytes` answers what `setBytes`
# stored, and neither reader answers the other's type (S2).
[[capability.case]]
id = "key-value-store-bytes-round-trip"
covers = ["story:6-30"]
surfaces = ["sdk-typescript", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "key-value-store-read-of-the-other-type-refused"
covers = ["story:6-30"]
surfaces = ["sdk-typescript", "sdk-rust"]
modes = ["attached", "linked"]

# Limits in code (ADR 0080; issue 2830): `connect()` and a Run's start take
# typed Limits, a price as an exact `Money`, which only lower. TypeScript
# implements them first; Rust (issue 2835) joins in `linked`, the one mode of
# both lists, and Python (#2834) by adding its surface. Rust's `daemon` mode
# joins with the TypeScript and Python Daemon transport, which takes their
# `modes` line away; so does `limit-reached-stops-the-run` for Rust, whose
# Run stops only on a Limit charged mid-run, which a linked engine without a
# browser never charges: the client crate plays its script as a Daemon.
[[capability]]
name = "limits"

[[capability.case]]
id = "limits-sent-in-millionths"
covers = ["story:11-51"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "money-inexact-refused-before-sending"
covers = ["story:11-51"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "connect-limit-refused-closes"
covers = ["story:11-51"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "limits-lowered-never-raised"
covers = ["story:11-51"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "limit-reached-stops-the-run"
covers = ["story:11-52"]
surfaces = ["sdk-typescript", "sdk-python"]
modes = ["attached"]
