covers = ["story:11-51"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "limits-lowered-never-raised"
covers = ["story:11-51"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "limit-reached-stops-the-run"
covers = ["story:11-52"]
surfaces = ["sdk-typescript", "sdk-python"]
modes = ["attached"]

# Typed data (ADR 0082): a value typed by a schema in the language's own
# types, or a hand-written JSON Schema, round-trips through the Key-value
# store; results keep unknown fields; a value that is not JSON is refused
# before sending. Python and Rust join the Key-value cases with their
# Key-value surface (#1284).
[[capability]]
name = "typed-data"

[[capability.case]]
id = "typed-value-round-trip"
covers = ["story:11-66", "story:11-69"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "result-keeps-unknown-fields"
covers = ["story:11-68"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = { sdk-typescript = ["attached"], sdk-python = ["attached"], sdk-rust = ["daemon"] }

[[capability.case]]
id = "non-json-value-refused"
covers = ["story:11-68"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

# The host's logger (ADR 0078; issue 1269): the level of the engine's logs a
# Connection receives follows what the program's logger records, sent in
# `hello` and again by `connection.set_log_level` when a Run starts and the
# level changed, never by polling; and each `$/log` event reaches the logger
# at its level. TypeScript leads; Python (issue 2903) and Rust (issue 2904)
# join by adding their surfaces. Rust also plays both cases' scripts as a
# Daemon's client (`goodfetch-collie-client`'s `logging` tests): Rust's
# `daemon` mode, which the cases list for `sdk-rust` alone while their other
# surfaces run `attached` only. In `linked` mode the engine's own events
# reach the program's subscriber directly, under their own targets, and none
# is re-emitted.
[[capability]]
name = "logging"

[[capability.case]]
id = "log-level-follows-the-logger"
covers = ["story:11-26"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = { sdk-typescript = ["attached"], sdk-python = ["attached"] }

[[capability.case]]
id = "engine-logs-reach-the-logger"
covers = ["story:11-25"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = { sdk-typescript = ["attached"], sdk-python = ["attached"] }

# The program's Trace context (ADR 0132; issue 1558): a call made inside the
# program's active span sends that span's `traceparent`, and its
# `tracestate` when set, in `_meta`, never Baggage, and a call made outside
# any span sends no `_meta`; against the Scripted engine. Rust leads, behind
# its `opentelemetry` feature, played as a Daemon's client: its `daemon`
# mode. TypeScript, Python (asyncio, Trio and the sync API) and Rust's
# `linked` mode join with issue 1558's follow-up.
[[capability]]
name = "trace-context"

[[capability.case]]
id = "trace-context"
covers = ["story:11-138"]
surfaces = ["sdk-rust"]
modes = ["daemon"]
