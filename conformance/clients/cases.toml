# `CDPURLUnauthorizedError` (a `RefusedError` naming each header sent and
# its Secret reference, never its value) and `CDPURLNotAllowedError` (a
# `RefusedError` naming ADR 0056's rule), each naming the address and the
# settings layer that gave it, with its `fix`. Played by the Scripted
# engine: attached in TypeScript and Python (asyncio, Trio and the sync
# API), and as the Daemon Rust's client crate reaches.
[[capability.case]]
