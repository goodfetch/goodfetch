# The Client conformance case list (ADR 0069; TESTING.md, SDKs): each case,
# by capability, with the Features it covers (ADR 0072), the surfaces it
# applies to and, where a mode does not have its capability yet, its
# `modes`. Every surface a case lists implements it in each of its modes;
# `xtask clients check` fails on a missing one or an unknown ID. Area 11
# writes the cases; each joins with the ticket whose code satisfies it.
# Bump the version whenever a case changes.
#
# The `sdk-typescript` cases below run in the `attached` mode only: the
# Daemon transport (#220 and area 11's Daemon ticket) adds `daemon` by
# removing their `modes` line (agent decision, pending owner review).
#
# The `cli` cases below run in the `attached` mode only: the CLI reaches a
# Daemon with area 11's Daemon ticket (#1183), which adds `daemon` by
# removing their `modes` line (agent decision, pending owner review).
#
# A case a platform lacks names the ones it runs on in `platforms`, by Rust's
# `cfg` name (`unix`, `windows`); a test behind any other `cfg`, or
# `#[ignore]`d, implements no case (`xtask clients check`).

[suite]
name = "clients"
version = "8"

[[capability]]
name = "lifecycle"

[[capability.case]]
id = "two-connections-at-once"
covers = ["story:11-15"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "connect-after-close"
covers = ["story:11-15"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "closed-after-close"
covers = ["story:11-17"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "nothing-at-import-or-connect"
covers = ["story:11-15"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

# The catalog's operations reach the engine through the members generated
# from them (ADR 0099; issue 2399). TypeScript leads; the Python and Rust
# SDKs join with the rest of issue 1233.
[[capability]]
name = "catalog-mapping"

[[capability.case]]
id = "catalog-mapping"
covers = ["story:11-178"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

# A program's first pages (issue 2400): opened, navigated, acted on through
# locators, read and closed, on the Proving ground through Collie's
# executable. TypeScript leads; the Python and Rust SDKs join with their
# parts of issues 1236 and 1237.
[[capability]]
name = "page"

[[capability.case]]
id = "page-form-program"
covers = ["story:11-77"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "goto-404-returns-the-response"
covers = ["story:11-84"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "second-new-page-in-the-default-session"
covers = ["story:11-77"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "page-read-fields"
covers = ["story:11-77", "operation:page.read"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability.case]]
id = "closed-page-raises-closed"
covers = ["story:11-77"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability]]
name = "product-conformance"

[[capability.case]]
id = "collie-accepted-by-foxhound"
covers = ["story:11-8"]
surfaces = ["sdk-typescript"]
modes = ["attached"]

[[capability]]
name = "time"

[[capability.case]]
id = "interrupt-cancels-the-call"
covers = ["story:11-198"]
surfaces = ["cli"]
modes = ["attached"]
# Its test sends SIGINT; the Windows half, CTRL_BREAK_EVENT, has no test yet
# (spec #326's review, SP-3).
platforms = ["unix"]

[[capability]]
name = "catalog-mapping"

[[capability.case]]
id = "sequence-follows-until-it-ends"
covers = ["story:11-198"]
surfaces = ["cli"]
modes = ["attached"]

[[capability.case]]
id = "deprecated-command-warns"
covers = ["story:11-204"]
surfaces = ["cli"]
modes = ["attached"]

# A Run's Key-value store outside a handler, on Collie's executable (ADR
# 0103; #791): in TypeScript `tsc` rejects `set(key, null)`, and in Python
# and Rust it fails with `value_invalid`. The Python and Rust SDKs have no
# Connection yet, so `xtask clients check` only notes their surfaces until
# area 11 builds them (M2).
[[capability]]
name = "key-value-store"

[[capability.case]]
id = "key-value-store-get-absent-answers-null"
covers = ["story:6-28", "story:6-31"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "key-value-store-set-null-refused"
covers = ["story:6-29"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

# Bytes with their content type (#792): `getBytes` answers what `setBytes`
# stored, and neither reader answers the other's type (S2).
[[capability.case]]
id = "key-value-store-bytes-round-trip"
covers = ["story:6-30"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "key-value-store-read-of-the-other-type-refused"
covers = ["story:6-30"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]
