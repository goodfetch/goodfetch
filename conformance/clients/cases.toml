modes = ["attached", "linked"]

# Limits in code (ADR 0080; issue 2830): `connect()` and a Run's start take
# typed Limits, a price as an exact `Money`, which only lower. TypeScript
# implements them first; Rust (issue 2835) joins in `linked`, the one mode of
# both lists, and Python (#2834) by adding its surface. Rust's `daemon` mode
# joins with the TypeScript and Python Daemon transport, which takes their
# `modes` line away; so does `limit-reached-stops-the-run` for Rust, whose
# Run stops only on a Limit charged mid-run, which a linked engine without a
# browser never charges: the client crate plays its script as a Daemon.
[[capability]]
name = "limits"

