[[capability.case]]
id = "runtime-errors-in-the-callers-form"
covers = ["story:11-31", "story:11-192"]
surfaces = ["sdk-python", "sdk-rust", "sdk-typescript"]
modes = { sdk-python = ["attached"], sdk-rust = ["daemon"] }

