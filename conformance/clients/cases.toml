# What a Collie engine lacks and a browser build it cannot fetch (ADRs 0087,
# 0090, 0095, 0098 and 0115; issue 1263): Foxhound's operation and setting
# raise `NotInProductError` (`UnavailableError`, not retryable), whose
# details name the engine's Product and version, the Product needed, what
# was asked and Foxhound's install command on the engine's channel, which
# `fix` names; a page whose build is missing raises
# `BrowserNotInstalledError` (not retryable), `ArtifactUnavailableOfflineError`
# (a `RefusedError` whose `limit` names `egress.offline`) or
# `ArtifactDownloadFailedError` (retryable, its `failure` `http_status`,
# `network` or `digest_mismatch`), each naming the build, the Product
# version that pins it and, in `fix`, that Product's `browser install`.
# Played by the Scripted engine attached in TypeScript and Python (asyncio,
# Trio and the sync API), the engine from npm and PyPI, and as a Daemon in
# all three, each from another channel: the archive installer for
# TypeScript, the OCI image for Python, crates.io for Rust's client crate.
# Rust's `linked` mode plays the case's Collie part, Foxhound's operation
# and setting, on the real linked engine, from crates.io; its provisioning
# part joins with the real engine's provisioning errors (issue 3100).
[[capability.case]]
id = "product-and-provisioning-errors"
covers = ["story:11-10", "story:11-13", "story:11-189", "story:11-294"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]

