# The Client conformance case list (ADR 0069; TESTING.md, SDKs): each case,
# by capability, with the Features it covers (ADR 0072), the surfaces it
# applies to and, where a mode does not have its capability yet, its
# `modes`: one list for every surface, or a table giving a surface modes of
# its own, as `modes = { sdk-rust = ["daemon"] }`, where a surface the table
# leaves out takes every mode it has. Every surface a case lists implements
# it in each of its modes; `xtask clients check` fails on a missing one or an
# unknown ID. Area 11 writes the cases; each joins with the ticket whose code
# satisfies it. Bump the version whenever a case changes.
#
# The `sdk-typescript` and `sdk-python` cases below run in the `attached`
# mode only: the Daemon transport (#220 and area 11's Daemon ticket) adds
# `daemon` by removing their `modes` line (agent decision, pending owner
# review).
#
# The `cli` cases below run in the `attached` mode only: the CLI reaches a
# Daemon with area 11's Daemon ticket (#1183), which adds `daemon` by
# removing their `modes` line (agent decision, pending owner review).
#
# A case a platform lacks names the ones it runs on in `platforms`, by Rust's
# `cfg` name (`unix`, `windows`); a test behind any other `cfg`, or
# `#[ignore]`d, implements no case (`xtask clients check`).

[suite]
name = "clients"
version = "43"

[[capability]]
name = "lifecycle"

[[capability.case]]
id = "two-connections-at-once"
covers = ["story:11-15"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "connect-after-close"
covers = ["story:11-15"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "closed-after-close"
covers = ["story:11-17"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

# A guest program (ADR 0078): importing the SDK reads no variable, import
# and connect add no handler, hook or global and write nothing to stdout or
# stderr, and after them the SDK writes only its catalog markers' run-time
# warnings (ADR 0030), each once, through the host's warning channel, and
# nothing to stdout (issue 2989).
[[capability.case]]
id = "nothing-at-import-or-connect"
covers = ["story:11-15"]
surfaces = ["sdk-typescript", "sdk-python"]
modes = ["attached"]

# Closing the tree Connection, Run, Session, page (ADR 0078; issue 1266):
# each value closes its children first, a running Run's close aborts it,
# resumable by its Run ID, while an ended Run's frees only the value, the
# Connection's close cancels its calls in flight and waits for its Attached
# engine, and a failed close raises its typed error, a `SuppressedError`
# under `await using` and an exception chained to the one `async with` or
# `with` was unwinding from in Python (issue 2927). The Rust SDK joins with
# issue 2928, linked, where a real engine plays every case but the failed
# close, which only the Scripted engine plays, reached by Rust as a Daemon:
# Rust's `daemon` mode, which the other cases' other surfaces do not list
# yet. In Rust only a Daemon fails a close, so the failed close lists
# `sdk-rust` in `daemon` mode alone (issue 2974).
[[capability.case]]
id = "children-close-with-their-parent"
covers = ["story:11-16"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "close-stops-a-running-run"
covers = ["story:11-18"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "connection-close-stops-its-engine"
covers = ["story:11-19"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

[[capability.case]]
id = "failed-close-raises-a-typed-error"
covers = ["story:11-20"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = { sdk-typescript = ["attached"], sdk-python = ["attached"], sdk-rust = ["daemon"] }

# An Attached engine that ends before its Connection's close (ADRs 0078, 0079
# and 0122; issue 1267): the call in flight fails with `engine_exited`, not
# retryable, carrying the exit code, the signal and the last 64 KiB of the
# engine's stderr, cut where a character starts; each stderr line reached
# the host's logger at warning, and the SDK wrote nothing to its own stdout
# or stderr. Rust plays it linked, where the evidence holds no exit code,
# signal or stderr; its client crate's Attached transport plays the Attached
# part on the Scripted engine, as the Rust surface starts no Attached engine.
[[capability.case]]
id = "engine-exited-carries-its-evidence"
covers = ["story:11-24", "story:11-27", "error:engine_exited"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = { sdk-typescript = ["attached"], sdk-python = ["attached"], sdk-rust = ["linked"] }

# Ctrl+C reaches only the host (ADRs 0078 and 0093; issues 1267 and 3063):
# the Attached engine runs in a process group of its own, so SIGINT sent to
# the host's group leaves it running, and the host's unwinding, Python's
# `KeyboardInterrupt` or the handler a TypeScript or Rust program installs,
# closes the running Run, which stops with a Checkpoint, then the
# Connection. `sdk-rust` runs it linked, where the engine inside the host
# outlives the signal, and through the Rust Client's Attached transport,
# which `sdk-rust` has no mode for. Its test sends SIGINT; the Windows half,
# CTRL_C_EVENT, has no test yet.
[[capability.case]]
id = "interrupt-reaches-only-the-host"
covers = ["story:11-22"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = { sdk-typescript = ["attached"], sdk-python = ["attached"], sdk-rust = ["linked"] }
platforms = ["unix"]

# A Connection, and every value under it, belongs to the process that
# opened it (ADR 0078; issue 1267): used in a child created by `fork`, it
# fails with `connection_forked` and the fix "connect in the child process",
# and writes nothing to the parent's engine, while a Connection the child
# opens works. Node has no `fork`. `sdk-rust` runs it linked, and through
# the Rust Client's Attached transport, which `sdk-rust` has no mode for
# (issue 3062). Windows has no `fork`.
[[capability.case]]
id = "connection-used-after-fork"
covers = ["story:11-23", "error:connection_forked"]
surfaces = ["sdk-python", "sdk-rust"]
modes = { sdk-python = ["attached"], sdk-rust = ["linked"] }
platforms = ["unix"]

