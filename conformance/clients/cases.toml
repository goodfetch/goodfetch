# A call's own `timeout` in its three states (ADR 0080; issue 2827): left
# out it is not sent, so the setting's default applies, null sends null, no
# timeout, and a duration sends its milliseconds; one of zero or less is
# refused with `setting_invalid`, its `limit` given as an argument and its
# `fix` naming the null form. Attached in TypeScript and Python, linked in
# Rust, each surface taking the modes it has.
[[capability.case]]
id = "call-timeout-three-states"
covers = ["story:11-40", "story:11-42"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

# `connect()`'s own `timeout` in its three states (ADR 0083; issue 2931):
# left out, `timeout.connect`'s 30 s bounds the wait for `hello`'s answer,
# no timeout waits as long as it takes, and a duration past which `hello`
# is unanswered fails the connect with `deadline_exceeded`, its `limit`
# naming `timeout.connect` at the run layer, given as an argument; one of
# zero or less is refused with `setting_invalid`. The engine of the case
# never answers `hello`: the Scripted engine in TypeScript and Python, a
# scripted peer at the Rust client, whose linked engine always answers.
[[capability.case]]
id = "connect-timeout-three-states"
covers = ["story:11-41", "story:11-42"]
surfaces = ["sdk-typescript", "sdk-python", "sdk-rust"]
modes = ["attached", "linked"]

