# The Console conformance suite's case list (ADRs 0031, 0068 and 0096;
# TESTING.md, The Console conformance suite): what the Console needs from
# its target, by capability, with the Features each case covers (ADR 0072).
# Each case is a test of this folder titled with its ID and annotated with
# its capability; the Playwright reporter writes one `conformance` document
# per target. Its targets: Collie's Daemon serving Collie's build, every
# case but Foxhound's screens and routing; Foxhound's Daemon serving
# Foxhound's build, Foxhound's screens; and the Stub gateway, the whole
# suite (spec #593). Step-up's join with the step-up ticket, and the
# routing of a Recipe's run with a start that carries its manifest (#1691).
# Bump the version whenever a case changes.

[suite]
name = "console"
version = "2"

[[capability]]
name = "runs.list"

[[capability.case]]
id = "the-runs-screen-lists-every-run-of-the-index"
covers = ["story:12-10"]

[[capability]]
name = "events.resumption"

[[capability.case]]
id = "a-resubscription-resumes-after-the-last-position-read"
covers = ["story:12-123"]

[[capability.case]]
id = "a-position-the-engine-no-longer-holds-answers-a-snapshot"
covers = ["story:12-123"]

[[capability]]
name = "events.lossless"

[[capability.case]]
id = "every-lossless-event-reaches-the-page-in-position-order"
covers = ["story:12-14"]

[[capability]]
name = "needs-you"

[[capability.case]]
id = "needs-you-lists-an-item-as-it-comes-and-drops-it-once-dismissed"
covers = ["story:12-23", "story:12-32"]

[[capability]]
name = "bodies"

[[capability.case]]
id = "a-large-file-arrives-by-handle-to-a-sign-in-only"
