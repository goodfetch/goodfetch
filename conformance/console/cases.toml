[[capability]]
name = "event-stream-fallback"

[[capability.case]]
id = "with-websockets-refused-the-console-works-over-server-sent-events-plus-post"
covers = ["story:12-124", "story:12-110"]

[[capability]]
name = "reconnection"

[[capability.case]]
id = "a-dropped-connection-turns-the-page-read-only-until-it-reconnects"
covers = ["story:12-125"]

[[capability]]
name = "content-origin"

[[capability.case]]
id = "a-file-is-shown-only-from-the-content-origin-sandboxed"
covers = ["story:12-127"]

[[capability]]
name = "security-headers"

[[capability.case]]
id = "every-route-carries-the-console-security-headers"
