# The page suite's case list (spec #577, tickets #695, #698 and #700): a
# Collie program's pages and their locator actions over the protocol, run by
# `goodfetch-conformance`'s engine harness against an Attached engine of
# Collie's executable on the local Proving ground (ADR 0094), each case on a
# Run of its own whose `network.resolve`
# maps the Proving ground's host names to its address (ADR 0059). The
# engine finds its browser in the Browser cache its environment names. Bump
# the version whenever a case changes.

product = "collie"

[suite]
name = "page"
version = "3"

[[capability]]
name = "sessions.default"

[[capability.case]]
id = "pages-open-in-the-runs-default-session"
covers = ["story:5-61", "operation:run.new_page"]

[[capability]]
name = "navigation"

[[capability.case]]
id = "goto-answers-the-documents-response"
covers = ["story:5-61", "operation:run.new_page", "operation:page.goto"]

[[capability.case]]
id = "an-error-status-is-the-documents-response"
covers = ["story:5-23", "operation:page.goto", "operation:page.reload"]

[[capability.case]]
id = "back-and-forward-across-sites-answer-the-documents-response"
covers = ["story:5-23", "operation:page.goto", "operation:page.go_back", "operation:page.go_forward"]

[[capability]]
name = "navigation.back_forward_cache"

[[capability.case]]
id = "going-back-loads-the-document-again"
covers = ["story:5-24", "operation:page.go_back"]

[[capability]]
name = "navigation.failures"

[[capability.case]]
id = "a-name-that-does-not-resolve-fails-apart-from-a-refused-connection"
covers = ["story:5-26", "operation:page.goto", "error:navigation_failed"]

[[capability.case]]
id = "a-navigation-superseded-before-it-committed-is-interrupted"
covers = ["operation:page.goto", "error:navigation_interrupted"]

[[capability]]
name = "locators.guard"

[[capability.case]]
id = "a-click-on-a-covered-target-lands-once-the-cover-leaves"
covers = ["story:5-2", "operation:locator.click"]

[[capability.case]]
id = "an-ambiguous-target-that-becomes-unique-is-acted-on"
covers = ["story:5-3", "operation:locator.click"]

[[capability.case]]
id = "a-locator-survives-a-re-render-that-replaces-its-element"
covers = ["story:5-18", "operation:locator.click"]

[[capability.case]]
id = "a-target-still-ambiguous-raises-target-not-unique"
covers = ["story:5-3", "operation:locator.click", "error:target_not_unique", "setting:timeout.action"]

[[capability.case]]
id = "a-target-never-actionable-raises-deadline-exceeded-naming-the-step"
covers = ["story:5-2", "operation:locator.click", "error:deadline_exceeded", "setting:timeout.action"]

[[capability]]
name = "locators.input"

[[capability.case]]
id = "typed-text-reaches-a-controlled-field-as-trusted-input"
covers = ["story:5-10", "operation:locator.fill", "operation:locator.click"]

[[capability.case]]
id = "a-pressed-key-reaches-a-field-as-a-trusted-key"
covers = ["story:5-10", "operation:locator.press"]
