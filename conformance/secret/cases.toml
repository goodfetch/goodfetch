# The Secret provider's suite (spec #596, ticket 996): the Plugin kind
# `secret`, whose one primitive, `secret.resolve`, resolves a Secret reference
# under the Plugin's declared scheme (ADRs 0015, 0033, 0092 and 0129). The
# harness runs it against a process Plugin as it runs every kind's suite
# (`run_plugin_suite`), and against an implementation called in process
# (`PluginSuite::checks_in_process`). `product` is the smallest Product that
# carries the kind. Each case ID names an exchange the harness runs. Bump the
# version whenever a case changes.

product = "collie"
kind = "secret"

[suite]
name = "secret"
version = "1"

[[capability]]
name = "resolve"

[[capability.case]]
# `secret.resolve` for a reference answers `{ value }` and no other field,
# with a non-empty string value.
id = "a-secret-reference-is-resolved-in-the-kinds-shape"
covers = ["story:7-90"]

[[capability.case]]
# `secret.resolve` whose params carry a field a newer engine adds is
# answered as without it (ADRs 0077 and 0082).
id = "params-from-a-newer-engine-are-read-without-their-unknown-field"
covers = ["story:7-90"]
