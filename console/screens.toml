# How each Console screen's keyboard walk opens it (ADR 0073; TESTING.md,
# Accessibility). `screens.spec.ts` gives every `screen:` Feature of the
# inventory one served case; area 12 gives each screen here its route and
# sign-in state, as one `[[screen]]` entry:
#
#   [[screen]]
#   feature = "screen:/runs/$run"   # the screen's Feature
#   route = "/runs/r-1"             # where it opens, every parameter filled
#   sign_in = "signed-in"           # or "signed-out"
#   walk = ["link Runs", "button Start a run"]  # each stop's role and name, in Tab order
#
# A screen with no route, sign-in state or walk here fails its case with
# `screen_setup_missing`, naming it; it is never skipped. A walk that moves
# fails with `keyboard_walk_changed`: fix the screen, or record the new one.

[[screen]]
feature = "screen:/needs-you"
route = "/needs-you"
sign_in = "signed-in"
walk = ["link Overview", "link Needs you", "link Runs", "link Engine & settings"]

[[screen]]
feature = "screen:/settings"
route = "/settings"
sign_in = "signed-in"
walk = ["link Overview", "link Needs you", "link Runs", "link Engine & settings", "button Project configuration", "textbox Run values", "button Explain"]

[[screen]]
feature = "screen:/runs"
route = "/runs"
sign_in = "signed-in"
walk = ["link Overview", "link Needs you", "link Runs", "link Engine & settings", "searchbox Search", "combobox Lifecycle", "combobox Verdict", "combobox Completeness", "textbox Tags", "combobox Sort by", "combobox Order", "button More filters", "button Apply"]
