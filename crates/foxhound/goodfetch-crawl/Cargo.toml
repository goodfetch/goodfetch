[package]
name = "goodfetch-crawl"
description = "A Foxhound crawl's Run: its start from seeds, its work items in run state, their leases, and their delivery to the program's handler, committed once (ADRs 0003, 0087 and 0093)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `join_all`: the delivery settles the attempts that ended together, so
# their run-state writes queue as one group. `catch_unwind` (`std`): an
# attempt's watch ends the attempt that panicked (ADR 0148).
futures-util = { workspace = true, features = ["alloc", "std"] }
goodfetch-counted-work.workspace = true
goodfetch-dataset.workspace = true
goodfetch-engine.workspace = true
goodfetch-extractor.workspace = true
goodfetch-fetch-tier.workspace = true
goodfetch-frontier.workspace = true
goodfetch-protocol.workspace = true
goodfetch-session-pool.workspace = true
icu_normalizer.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
goodfetch-workspace-hack.workspace = true

[dev-dependencies]
# The body of the in-memory site a test's fetch tiers serve (src/start/tests/sent_from.rs).
bytes.workspace = true
goodfetch-test-support.workspace = true
# The work-item metrics' test reads what a crawl records through the SDK and
# the Prometheus exporter the executables use (src/start/tests/metrics.rs).
opentelemetry = { workspace = true, features = ["metrics"] }
opentelemetry_sdk = { workspace = true, features = ["metrics"] }
opentelemetry-prometheus.workspace = true
prometheus.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
rstest.workspace = true
# The staging's tests read the statements an admission runs (trace_v2).
rusqlite = { workspace = true, features = ["trace"] }
tokio = { workspace = true, features = ["io-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
