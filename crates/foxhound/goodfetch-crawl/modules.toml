# Which of goodfetch-crawl's top-level modules may import which (ADR 0126).
[modules]
code_free = ["enqueue", "serving", "work_items"]
completeness = ["report", "work_items"]
dataset_list = ["report"]
delivery = ["code_free", "completeness", "enqueue", "labels", "lease", "policy", "progress", "serving", "tier_choice", "tier_race", "work_items"]
enqueue = ["labels", "serving", "staging", "work_items"]
intake = ["work_items"]
labels = []
lease = ["staging", "work_items"]
outcomes = ["work_items"]
policy = []
progress = ["report", "work_items"]
push = ["serving", "staging"]
redeclare = ["code_free", "serving"]
report = ["work_items"]
retry = ["intake", "serving", "work_items"]
seeding = ["intake", "serving", "staging", "work_items"]
servable = []
serving = ["intake", "staging"]
staging = ["work_items"]
start = ["code_free", "completeness", "dataset_list", "delivery", "enqueue", "labels", "outcomes", "policy", "progress", "push", "redeclare", "report", "retry", "seeding", "servable", "serving", "tier_choice", "work_items"]
tier_choice = ["tier_race"]
tier_race = []
work_items = ["labels"]

[submodules.enqueue]
links = []

[submodules.delivery]
attempt = []
politeness = ["attempt"]

[submodules.tier_choice]
weighing = []

[submodules.code_free]
fields = []
