# Which of goodfetch-crawl's top-level modules may import which (ADR 0126).
[modules]
completeness = ["report", "work_items"]
delivery = ["completeness", "labels", "lease", "policy", "progress", "serving", "tier_choice", "tier_race", "work_items"]
enqueue = ["labels", "serving", "staging", "work_items"]
labels = []
lease = ["staging", "work_items"]
outcomes = ["work_items"]
policy = []
progress = ["report", "work_items"]
push = ["serving", "staging"]
redeclare = ["serving"]
report = ["work_items"]
seeding = ["serving", "staging", "work_items"]
servable = []
serving = ["staging"]
staging = ["work_items"]
start = ["completeness", "delivery", "enqueue", "labels", "outcomes", "policy", "progress", "push", "redeclare", "report", "seeding", "servable", "serving", "tier_choice", "work_items"]
tier_choice = ["tier_race"]
tier_race = []
work_items = ["labels"]

[submodules.enqueue]
links = []

[submodules.delivery]
attempt = []
politeness = ["attempt"]
