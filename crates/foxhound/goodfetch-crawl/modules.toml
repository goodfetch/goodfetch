# Which of goodfetch-crawl's top-level modules may import which (ADR 0126).
[modules]
attempt_outcome = ["lease", "tier_choice", "work_items"]
code_free = ["enqueue", "serving", "work_items"]
completeness = ["report", "work_items"]
dataset_list = ["report"]
