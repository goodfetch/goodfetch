[package]
name = "goodfetch-fetch-tier"
description = "Foxhound's fetch tiers: the HTTP transports, the fetch driver above them, the decoding of a document's content codings, and the pages Foxhound hands a crawl's handlers (ADRs 0020, 0087, 0093, 0118, 0119 and 0129)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
brotli-decompressor.workspace = true
bytes.workspace = true
dom_query.workspace = true
flate2.workspace = true
goodfetch-engine.workspace = true
goodfetch-frontier.workspace = true
goodfetch-page.workspace = true
goodfetch-protocol.workspace = true
http.workspace = true
hyper.workspace = true
reqwest = { workspace = true, features = ["http2", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
thiserror.workspace = true
url.workspace = true
zstd.workspace = true

[dev-dependencies]
goodfetch-test-support.workspace = true
rstest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }

[lints]
workspace = true
