# goodfetch-fetch-tier's cargo-fuzz targets (ADR 0067; TESTING.md, Fuzzing),
# outside the workspace: each target's body is a plain function of the
# fetch-tier crate, whose seeds and past crashers `fuzz_replay!` replays
# from `fuzz/<target>/` on every OS. Build and run with the pinned nightly,
# the git-ignored corpus first so a run never grows the committed seeds:
# `cargo fuzz run refresh fuzz/corpus/refresh fuzz/refresh/seeds
# -- -dict=fuzz/refresh/dictionary.dict`, and likewise `prescan`.
[package]
name = "goodfetch-fetch-tier-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
goodfetch-fetch-tier = { path = ".." }
libfuzzer-sys = "0.4.10"

[[bin]]
name = "prescan"
path = "fuzz_targets/prescan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "refresh"
path = "fuzz_targets/refresh.rs"
test = false
doc = false
bench = false

# Goodfetch's forks of `reqwest`, `wreq`, `wreq-util`, `dom_smoothie`,
# `rs-trafilatura` and the two crates rs-trafilatura reads trees with, as the
# workspace's `[patch.crates-io]` carries them.
[patch.crates-io]
dom_smoothie = { path = "../../../../vendor/dom_smoothie" }
html-cleaning = { path = "../../../../vendor/html-cleaning" }
quick_html2md = { path = "../../../../vendor/quick_html2md" }
reqwest = { path = "../../../../vendor/reqwest" }
rs-trafilatura = { path = "../../../../vendor/rs-trafilatura" }
wreq = { path = "../../../../vendor/wreq" }
wreq-util = { path = "../../../../vendor/wreq-util" }
