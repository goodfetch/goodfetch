[package]
name = "goodfetch-foxhound"
description = "Foxhound, Goodfetch's Product for crawling, which contains Collie: its executable and its composition of the engine (ADRs 0087, 0090 and 0094)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# benches/scenarios.rs would be a module of the bench targets, not a target.
autobenches = false

[features]
# The executable's own dependencies (ADR 0094), with Collie's executable
# entry, which Foxhound's starts from.
# Its own commands, which take the command line's and the Export's
# dependencies.
executable = ["dep:clap", "dep:data-encoding", "dep:mimalloc", "dep:schemars", "goodfetch-collie/executable"]
# The program's OpenTelemetry context in each request it sends (ADR 0132),
# read as Collie's SDK reads it, whose connection Foxhound's opens.
opentelemetry = ["goodfetch-collie/opentelemetry"]

[dependencies]
# Its own commands' flags (`crawl start`, `run export`).
clap = { workspace = true, optional = true }
# The bytes of the `$/chunk` notifications `run export --out` writes.
data-encoding = { workspace = true, optional = true }
goodfetch-collie.workspace = true
# The values a connection hands out and their blocking twins (ADRs 0095
# and 0117), which the SDK re-exports.
goodfetch-collie-client.workspace = true
goodfetch-crawl.workspace = true
goodfetch-frontier.workspace = true
goodfetch-dataset.workspace = true
goodfetch-engine.workspace = true
goodfetch-fetch-tier.workspace = true
# A crawl's serve (ADR 0112): its handlers' futures, polled inside it, each
# caught at a panic.
futures-util = { workspace = true, features = ["alloc", "std"] }
goodfetch-protocol.workspace = true
goodfetch-session-pool.workspace = true
goodfetch-sql-tab.workspace = true
mimalloc = { workspace = true, optional = true }
# The params' JSON Schemas `crawl start`'s flags take their values from.
schemars = { workspace = true, optional = true }
# A crawl's Payloads and Records, and the params of its calls.
serde.workspace = true
serde_json.workspace = true
# The Crawl requests a connection's Runs share, handed to each Run's serve
# (ADR 0112).
tokio = { workspace = true, features = ["macros", "sync"] }
# A crawl's serve's answer that no longer reaches the engine; and the test
# subscriber an in-process engine's dispatch records reach the exercise
# record through (tests/it/code_free_resume.rs and
# tests/it/tier_race/scripted.rs; ADR 0072).
tracing.workspace = true
goodfetch-workspace-hack.workspace = true

[dev-dependencies]
# Its own executable, for the integration tests and the startup benchmarks
# (CARGO_BIN_EXE_goodfetch-foxhound, ADRs 0059 and 0062).
goodfetch-foxhound = { path = ".", features = ["executable"] }
# A library that takes the Collie client crate by a semver range, as a
# library serving both Products does (tests/it/sdk.rs, story 11-180).
connection-library = { path = "tests/libraries/connection-library" }
goodfetch-test-client.workspace = true
goodfetch-runtime.workspace = true
goodfetch-test-support.workspace = true
# The clean-up's removal, which B4's counts example runs once more per page
# as the plant of its instructions (examples/counts-extraction.rs).
goodfetch-clean-up-rules.workspace = true
# The robots.txt URLs the run state's corpus writer keeps copies of
# (examples/compat-run-state.rs).
url.workspace = true
# The Exports' bytes the tests decode and digest (tests/it/exports.rs).
data-encoding.workspace = true
sha2.workspace = true
# The readers the table Exports are read back with: a CSV reader, an
# XLSX workbook's ZIP and XML, an HTML parser and a Markdown parser
# (tests/it/exports.rs; pitfall D07). No spreadsheet library: calamine
# turns on flate2's zlib-rs backend, which changes the Proving ground's
# compressed bodies in a shared build.
csv.workspace = true
pulldown-cmark.workspace = true
quick-xml.workspace = true
scraper.workspace = true
zip = { workspace = true, features = ["deflate-flate2"] }
# The readers the other Exports are read back with (tests/it/export_formats.rs):
# Arrow IPC and Parquet through arrow-rs, Avro through apache-avro, the gzip
# and zstd forms through flate2 and zstd, XML and feeds through quick-xml.
apache-avro.workspace = true
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
bytes.workspace = true
flate2.workspace = true
parquet.workspace = true
zstd.workspace = true
# The counts cell's and its tests' reads of the crawl's Counted work
# (examples/counts.rs).
goodfetch-counted-work.workspace = true
# The Audit log's prune pass a counts cell plants (benches/plants.rs), and
# the moment a benchmark's Limit is set at (benches/scenarios.rs).
jiff.workspace = true
gungraun.workspace = true
# The instruction benchmarks' allocator, as the executable ships (benches/instructions.rs).
mimalloc.workspace = true
# The refusals' messages through the executables (tests/it/daemon.rs).
insta.workspace = true
# The run-state and Politeness file corpus writers (examples/compat-*.rs):
# their runtime, in-memory Client, home and SQL dump.
# The multi-process writer-lock test's named seed cases (tests/it/writer_lock.rs).
rstest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
# The Journey files a Journey variant's document is read back against
# (tests/it/journeys/).
toml.workspace = true
tempfile.workspace = true
# The Payload wiring mistakes that must not compile (tests/it/compile_fail/).
trybuild.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "macros", "time"] }
# The tier race on a scripted browser (tests/it/tier_race/scripted.rs): the
# `BrowserPages` seam its fetch tiers are handed.
goodfetch-page.workspace = true

[package.metadata.cargo-shear]
# The dev-dependency on itself only turns its executable on for its tests.
ignored = ["goodfetch-foxhound"]

[[bin]]
name = "goodfetch-foxhound"
path = "src/main.rs"
required-features = ["executable"]

# Both Products' command lines, which `xtask codegen` commits (ADR 0072).
[[example]]
name = "command-lines"
required-features = ["executable"]

# ADR 0071: the startup benchmarks of Foxhound's executable.
[[bench]]
name = "startup"
harness = false

# ADR 0134: the bytes a crawled page allocates, a crawl fed from memory.
[[bench]]
name = "heap"
harness = false

# ADR 0071: the instructions of a crawl's seed admission (#2167).
[[bench]]
name = "instructions"
harness = false

# Its tests start the Proving ground through the test tool manifest, so a
# change to it runs them (TESTING.md, Commands).
[package.metadata.goodfetch]
runs = ["goodfetch-proving-ground"]

[lints]
workspace = true
