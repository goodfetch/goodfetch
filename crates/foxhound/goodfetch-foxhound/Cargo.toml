[package]
name = "goodfetch-foxhound"
description = "Foxhound, Goodfetch's Product for crawling, which contains Collie: its executable and its composition of the engine (ADRs 0087, 0090 and 0094)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# benches/scenarios.rs would be a module of the bench targets, not a target.
autobenches = false

[features]
# The executable's own dependencies (ADR 0094), with Collie's executable
# entry, which Foxhound's starts from.
executable = ["dep:mimalloc", "goodfetch-collie/executable"]

[dependencies]
goodfetch-collie.workspace = true
goodfetch-crawl.workspace = true
goodfetch-frontier.workspace = true
goodfetch-dataset.workspace = true
goodfetch-engine.workspace = true
goodfetch-fetch-tier.workspace = true
goodfetch-protocol.workspace = true
goodfetch-session-pool.workspace = true
mimalloc = { workspace = true, optional = true }

[build-dependencies]
# Reads the Console build's routes, `routes.json` (ADR 0072).
serde_json.workspace = true

[dev-dependencies]
# Its own executable, for the integration tests and the startup benchmarks
# (CARGO_BIN_EXE_goodfetch-foxhound, ADRs 0059 and 0062).
goodfetch-foxhound = { path = ".", features = ["executable"] }
goodfetch-test-support.workspace = true
# The Exports' bytes the tests decode and digest (tests/it/exports.rs).
data-encoding.workspace = true
sha2.workspace = true
gungraun.workspace = true
# The refusals' messages through the executables (tests/it/daemon.rs).
insta.workspace = true
# The run-state and Politeness file corpus writers (examples/compat-*.rs):
# their runtime, in-memory Client, home and SQL dump.
# The multi-process writer-lock test's named seed cases (tests/it/writer_lock.rs).
rstest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "macros", "time"] }

[package.metadata.cargo-shear]
# The dev-dependency on itself only turns its executable on for its tests.
ignored = ["goodfetch-foxhound"]

[[bin]]
name = "goodfetch-foxhound"
path = "src/main.rs"
required-features = ["executable"]

# ADR 0071: the startup benchmarks of Foxhound's executable.
[[bench]]
name = "startup"
harness = false

[lints]
workspace = true
