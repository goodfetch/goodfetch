# Limits in code (ADR 0080): `ConnectOptions::limits` and `Start::limits`
# are Collie's, re-exported with `Limits`, `Money` and `UsageKind`; Foxhound
# adds the Usage kind only it counts.
[[member]]
crate = "goodfetch-foxhound"
receiver = "(crate)"
member = "PAID_FETCHES"
entry = "none"
reason = "The `paid_fetch` Usage kind a Limit caps, which only Foxhound counts (ADR 0087), for `Limits::count` and `Limits::price`; a value, no catalog entry, which a Collie engine refuses with `not_in_product`."
words = ["paid", "fetches"]
form = "read"
