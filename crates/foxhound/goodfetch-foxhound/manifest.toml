# The manifest of Foxhound's Rust SDK's hand-written public members (ADR
# 0099; STYLE.md, Protocol and SDKs): each names the catalog entry it serves,
# or `entry = "none"` with its reason, and the canonical words and form it is
# spelled from, in the forms of `sdks/typescript/manifest.toml`, whose header
# says what `xtask sdk-manifests` refuses. The values a connection hands out
# are the Collie client crate's, re-exported, and listed with it. A
# `blocking::` receiver is its async receiver's twin. `xtask sdk-exports`
# matches it to what the crate exports, read from its source: each item its
# public modules declare or re-export from its own modules, on `(crate)` at
# the root or on the module's path, as `blocking`, and each `pub` member of
# such a type's inherent `impl`s; another crate's item it re-exports is that
# crate's to list.
#
# Each `[[target]]` is a `tracing` target the SDK crates emit under (ADR
# 0078), with the public constant that names it, or `constant = "none"`
# with its reason: part of the SDK's contract as names, never as message
# text, as Python's `[[logger]]` lines are.

