# Which of goodfetch-foxhound's top-level modules may import which (ADR 0126).
# `settings` is Collie's settings with Foxhound's own typed keys beside
# them, which `xtask codegen` writes from Foxhound's catalog (ADR 0083).
[modules]
blocking = ["crawl", "crawl_requests", "foxhound"]
composition = ["sample"]
crawl = ["crawl_requests", "foxhound", "sync"]
crawl_requests = ["sync"]
executable = []
foxhound = ["composition", "crawl_requests"]
sample = []
settings = []
sync = []
