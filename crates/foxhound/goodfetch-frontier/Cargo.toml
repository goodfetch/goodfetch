[package]
name = "goodfetch-frontier"
description = "The Frontier of a Foxhound crawl: its domain keys and its per-domain queues, which fill the engine's gate in admission (ADRs 0004 and 0087)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# benches/scenarios.rs is a module of the bench targets, not a target.
autobenches = false

[dependencies]
data-encoding.workspace = true
# A link's query is encoded in its document's encoding (ADR 0120).
encoding_rs.workspace = true
goodfetch-counted-work.workspace = true
goodfetch-engine.workspace = true
goodfetch-page.workspace = true
goodfetch-protocol.workspace = true
# Each Label's Payload is checked against its JSON Schema at enqueue (ADR
# 0082); no remote or file reference is resolved.
jsonschema.workspace = true
psl.workspace = true
# A sitemap seed's sitemaps are XML (ADR 0093).
quick-xml.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# The tests write `.gz` sitemaps.
flate2.workspace = true
goodfetch-test-support.workspace = true
gungraun.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
# The learned rules' tests read the statements a re-keying runs (trace_v2).
rusqlite = { workspace = true, features = ["trace"] }
rstest.workspace = true
# The Frontier at scale keeps its run file on disk, in a folder of its own.
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

# ADR 0071: instruction counts under Callgrind, heap metrics under DHAT.
[[bench]]
name = "instructions"
harness = false

[[bench]]
name = "heap"
harness = false

[lints]
workspace = true
