# goodfetch-frontier's cargo-fuzz targets (ADR 0067; TESTING.md, Fuzzing),
# outside the workspace: each target's body is a plain function of the
# Frontier, whose seeds and past crashers `fuzz_replay!` replays from
# `fuzz/<target>/` on every OS. Build and run with the pinned nightly:
# `cargo fuzz run url_key fuzz/url_key/seeds`, and `sitemap` alike.
[package]
name = "goodfetch-frontier-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
goodfetch-frontier = { path = ".." }
libfuzzer-sys = "0.4.10"

[[bin]]
name = "url_key"
path = "fuzz_targets/url_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sitemap"
path = "fuzz_targets/sitemap.rs"
test = false
doc = false
bench = false

# Goodfetch's forks of `dom_smoothie`, `rs-trafilatura` and the two crates
# rs-trafilatura reads trees with, as the workspace's `[patch.crates-io]`
# carries them.
[patch.crates-io]
dom_smoothie = { path = "../../../../vendor/dom_smoothie" }
html-cleaning = { path = "../../../../vendor/html-cleaning" }
quick_html2md = { path = "../../../../vendor/quick_html2md" }
rs-trafilatura = { path = "../../../../vendor/rs-trafilatura" }
