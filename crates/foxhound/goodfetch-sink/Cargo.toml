[package]
name = "goodfetch-sink"
description = "Foxhound's Sinks: the delivery contract every Sink keeps (a delivery ID and the run epoch on every write, ADRs 0003, 0008 and 0026), the delivery driver above every Sink (ADR 0129) and the in-binary SQLite Sink."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
