[package]
name = "goodfetch-sql-tab"
description = "Foxhound's SQL tab: a read-only DuckDB connection over the runs a query selects, each run's tables registered as table functions reading its run file through rusqlite, with external access off, its configuration locked and time, memory and row limits (ADRs 0031, 0057 and 0127)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# DuckDB built from its bundled sources, with the `vtab` table functions that
# read run files (ADR 0057), and its JSON functions linked in, which read
# Records and check that a statement is one read; no extension is fetched.
duckdb = { workspace = true, features = ["bundled", "json", "vtab"] }
# Where each run table is in the run file: the Datasets' tables, which it
# describes.
goodfetch-dataset.workspace = true
goodfetch-engine.workspace = true
goodfetch-protocol.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tracing.workspace = true
goodfetch-workspace-hack.workspace = true

[dev-dependencies]
goodfetch-test-support.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
