[package]
name = "goodfetch-clean-up-rules"
description = "The Clean-up rules a Session's interception matches each request against: the embedded Filter lists, the never-block list and the redirect stand-ins, and the Consent prompt runner's bundle (spec #577; ADRs 0047, 0048 and 0057)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
adblock.workspace = true
cssparser.workspace = true
data-encoding.workspace = true
dom_query.workspace = true
goodfetch-counted-work.workspace = true
moka.workspace = true
selectors.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zstd.workspace = true
goodfetch-workspace-hack.workspace = true

[build-dependencies]
# The embedded rules are compiled with the binary's own `adblock` version
# (ADR 0047), from the texts under `rules/`; no build step downloads
# anything.
adblock.workspace = true
serde.workspace = true
serde_json.workspace = true
# The embedded part's digest, by the Browser cache's tree rule (ADR 0024).
sha2.workspace = true
toml.workspace = true
zstd.workspace = true

[dev-dependencies]
goodfetch-test-support.workspace = true
proptest.workspace = true
rstest.workspace = true
# Its tests read the never-block list's file, as the build does.
serde.workspace = true
toml.workspace = true
ureq.workspace = true

# Its tests start the Proving ground through the test tool manifest, so a
# change to it runs them (TESTING.md, Commands).
[package.metadata.goodfetch]
runs = ["goodfetch-proving-ground"]

[lints]
workspace = true

[package.metadata.cargo-shear]
# The build script's `build/consent.rs`, a module it reaches by path, reads
# autoconsent's rules with `serde_json`, which cargo-shear does not follow.
ignored = ["serde_json"]
