# Goodfetch's snippet table (ADR 0048), under MIT: the world each of
# autoconsent's `eval` snippets (`lib/eval-snippets.ts` of the pinned
# version) runs in.
#
# - `isolated`: it reads or changes only the DOM, cookies, `localStorage` or
#   history, which the guard's isolated world reaches; a `.click()` there goes
#   through the runner's override to the guard's trusted input.
# - `main`: it reads or calls a page global, such as a vendor's own object,
#   and runs in the frame's main world through `DOM.resolveNode` and
#   `Runtime.callFunctionOn`, with `Runtime` off.
# - `dropped`: it clicks through a synthetic event, or clicks from the main
#   world, so no trusted input could make the click; every rule that names
#   it is dropped, when the bundle is built and in the runner.
#
# The build refuses a snippet the library has that this table does not
# class, and one this table classes that the library no longer has.

[snippets]
EVAL_0 = "isolated"
EVAL_DIDOMI_OPT_OUT = "main"
EVAL_DIDOMI_TEST = "main"
EVAL_CONSENTMANAGER_1 = "main"
