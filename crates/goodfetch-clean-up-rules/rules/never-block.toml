# The never-block list (ADR 0047): Goodfetch's own, under MIT. Each entry is
# one network rule in Adblock Plus syntax whose requests load whatever every
# Filter list (the user's own included) and `browser.block_resources` say:
# challenge and CAPTCHA providers, anti-bot sensors and the endpoints they
# report to, anti-fraud and payment scripts. An entry is scoped to what the
# challenge or the payment needs, so a vendor's analytics stay blocked
# (Stripe's `r.stripe.com` telemetry is no entry; its `m.stripe.com` fraud
# signals are). `example` is a request the entry must keep loading, which the
# crate's tests check against the embedded Filter lists.
#
# Sources: each vendor's own documentation of the hosts and paths its script
# loads from; uBlock Origin's unbreak list and Spider's network blocker name
# the same vendors (ADR 0047). Add a vendor when a run's Provenance flags it.

# Challenge and CAPTCHA providers.

[[entry]]
vendor = "Cloudflare Turnstile and challenge pages"
kind = "challenge"
rule = "||challenges.cloudflare.com^"
example = "https://challenges.cloudflare.com/turnstile/v0/api.js"

[[entry]]
vendor = "Cloudflare challenge platform"
kind = "challenge"
rule = "/cdn-cgi/challenge-platform/"
example = "https://shop.example/cdn-cgi/challenge-platform/h/b/orchestrate/chl_page/v1"

[[entry]]
vendor = "Google reCAPTCHA"
kind = "challenge"
rule = "||www.google.com/recaptcha/"
example = "https://www.google.com/recaptcha/api.js"

[[entry]]
vendor = "Google reCAPTCHA (static files)"
kind = "challenge"
rule = "||www.gstatic.com/recaptcha/"
example = "https://www.gstatic.com/recaptcha/releases/abc/recaptcha__en.js"

[[entry]]
vendor = "Google reCAPTCHA (recaptcha.net)"
kind = "challenge"
rule = "||www.recaptcha.net/recaptcha/"
example = "https://www.recaptcha.net/recaptcha/api.js"

[[entry]]
vendor = "hCaptcha"
kind = "challenge"
rule = "||hcaptcha.com^"
example = "https://a.hcaptcha.com/checksiteconfig?v=1"

[[entry]]
vendor = "Arkose Labs (FunCaptcha)"
kind = "challenge"
rule = "||arkoselabs.com^"
example = "https://client-api.arkoselabs.com/metrics/ui"

[[entry]]
vendor = "Friendly Captcha"
kind = "challenge"
rule = "||friendlycaptcha.com^"
example = "https://api.friendlycaptcha.com/api/v1/puzzle"

[[entry]]
vendor = "DataDome CAPTCHA"
kind = "challenge"
rule = "||captcha-delivery.com^"
example = "https://geo.captcha-delivery.com/captcha/?initialCid=1"

