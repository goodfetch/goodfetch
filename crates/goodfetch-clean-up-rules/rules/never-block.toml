# The never-block list (ADR 0047): Goodfetch's own, under MIT. Each entry is
# one network rule in Adblock Plus syntax whose requests load whatever every
# Filter list (the user's own included) and `browser.block_resources` say:
# challenge and CAPTCHA providers, anti-bot sensors and the endpoints they
# report to, anti-fraud and payment scripts, and Consent prompts' scripts and
# messages, which Consent prompt rules need to see (ADR 0048). An entry is
# scoped to what the challenge, the payment or the prompt needs, so a
# vendor's analytics stay blocked (Stripe's `r.stripe.com` telemetry is no
# entry; its `m.stripe.com` fraud signals are). `example` is a request the entry must keep loading, which the
# crate's tests check against the embedded Filter lists.
#
# Sources: each vendor's own documentation of the hosts and paths its script
# loads from; uBlock Origin's unbreak list and Spider's network blocker name
# the same vendors (ADR 0047). Add a vendor when a run's Provenance flags it.

# Challenge and CAPTCHA providers.

[[entry]]
vendor = "Cloudflare Turnstile and challenge pages"
kind = "challenge"
rule = "||challenges.cloudflare.com^"
example = "https://challenges.cloudflare.com/turnstile/v0/api.js"

