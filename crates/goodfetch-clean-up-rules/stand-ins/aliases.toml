# The stand-ins' alias table (ADR 0047): Goodfetch's own, under MIT. Filter
# lists name a redirect's stand-in by uBlock Origin's resource names (and
# Adblock Plus's `abp-resource:` ones); each entry maps those names to a
# file of DuckDuckGo's tracker surrogates in this folder (Apache-2.0, with
# MPL-2.0 parts, unmodified), or to an inline body for the plain stand-ins
# (an empty script, text, style sheet, frame or JSON, a transparent image).
# A redirect whose name no entry lists blocks its request instead, as
# adblock-rust does.

[[stand_in]]
file = "noop.js"
mime = "application/javascript"
names = ["noopjs", "noop.js", "blank-js", "abp-resource:blank-js"]

