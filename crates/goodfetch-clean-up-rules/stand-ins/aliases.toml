[[stand_in]]
body = ""
mime = "text/plain"
names = ["nooptext", "noop.txt", "blank-text", "abp-resource:blank-text"]

[[stand_in]]
body = "{}"
mime = "application/json"
names = ["noopjson", "noop.json"]

[[stand_in]]
body = ""
