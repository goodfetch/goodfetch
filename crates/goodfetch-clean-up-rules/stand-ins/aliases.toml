# A transparent 1x1 GIF, in Base64.
[[stand_in]]
base64 = "R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
mime = "image/gif"
names = ["1x1.gif", "1x1-transparent.gif", "abp-resource:1x1-transparent-gif"]

# A transparent 2x2 PNG, in Base64.
[[stand_in]]
base64 = "iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAC0lEQVQI12NgQAcAABIAAe+JVKQAAAAASUVORK5CYII="
mime = "image/png"
names = ["2x2.png", "2x2-transparent.png", "abp-resource:2x2-transparent-png"]
