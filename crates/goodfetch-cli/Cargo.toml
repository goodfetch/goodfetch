[package]
name = "goodfetch-cli"
description = "The CLI both Products' executables carry: the commands generated from the catalog, the engine they run on, the output writer and the exit codes (ADRs 0069, 0090 and 0099)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Owned names and help, which the catalog gives at run time.
clap = { workspace = true, features = ["string"] }
goodfetch-engine.workspace = true
goodfetch-protocol.workspace = true
# The params' JSON Schemas, from which each generated command takes its flags.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread"] }
tracing.workspace = true

[lints]
workspace = true
