[package]
name = "goodfetch-cli"
description = "The CLI both Products' executables carry: the commands generated from the catalog, the engine they run on, the output writer and the exit codes (ADRs 0069, 0090 and 0099)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Owned names and help, which the catalog gives at run time.
clap = { workspace = true, features = ["string"] }
# The bytes of the `$/chunk` notifications `run export --out` writes.
data-encoding.workspace = true
goodfetch-engine.workspace = true
goodfetch-protocol.workspace = true
# Human output's times in the local zone `TZ` names (ADR 0073): the system's
# zone database, bundled on Windows, which has none.
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
# The params' JSON Schemas, from which each generated command takes its flags.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "signal"] }
tracing.workspace = true

[dev-dependencies]
goodfetch-test-support.workspace = true
proptest.workspace = true
rstest.workspace = true
# The files `crawl start`'s `--seeds-file` and `--fields` read in a test.
tempfile.workspace = true

[lints]
workspace = true
