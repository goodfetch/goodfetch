# The manifest of the Collie client crate's hand-written public members, the
# values every Product's connection hands out (ADR 0099; STYLE.md, Protocol
# and SDKs): each names the catalog entry it serves, or `entry = "none"` with
# its reason, and the canonical words and form it is spelled from, in the
# forms of `sdks/typescript/manifest.toml`, whose header says what `xtask
# sdk-manifests` refuses. A `blocking::` receiver is its async receiver's
# twin. `xtask sdk-exports` matches it to what the crate exports, read from
# its source: each item its public modules declare or re-export from its own
# modules, on `(crate)` at the root or on the module's path, as `blocking` or
# `settings`, and each `pub` member of such a type's inherent `impl`s.
#
# A re-exported item is listed once, by the manifest of the crate that
# declares it. An item `goodfetch-protocol` declares, such as `RunId`,
# `StartedAs` or `SettingsExplanation`, is a contract type the generators
# emit each SDK's from (ADR 0038), so no manifest lists it. An item one SDK
# crate re-exports from another, as `goodfetch-collie` and
# `goodfetch-foxhound` re-export this crate's `Error`, `Limits` and
# `Response`, is listed here, in its declaring crate's manifest, and in
# neither of theirs.

