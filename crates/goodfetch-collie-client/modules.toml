# Which of goodfetch-collie-client's top-level modules may import which (ADR
# 0126), one concern each (spec #606): `transport` opens every socket and
# child process, `rpc` frames and correlates the messages, `call` holds the
# builders every call goes through, and `connection` ties them to the
# Connection's runtime. Credits, cancellation, event resumption, bodies and
# `blocking` join as their own modules with the tickets that add them.
[modules]
call = ["error", "rpc"]
connection = ["call", "error", "rpc", "transport"]
error = []
rpc = ["error", "transport"]
transport = []
