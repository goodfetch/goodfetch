# Which of goodfetch-collie-client's top-level modules may import which (ADR
# 0126), one concern each (spec #606): `transport` opens every socket and
# child process, `rpc` frames and correlates the messages, `call` holds the
# builders every call goes through, `connection` ties them to the
# Connection's runtime, `handler` hands the engine's requests to the
# program's streams and writes their answers, `run` holds the Runs a
# Connection starts, above it, and `blocking` gives them all a face that
# blocks. `sync` names the crate's locks. Credits, cancellation, event resumption and bodies join as their
# own modules with the tickets that add them.
[modules]
blocking = ["call", "connection", "error", "run"]
call = ["error", "rpc"]
connection = ["call", "error", "handler", "rpc", "sync", "transport"]
error = []
handler = ["error", "sync"]
rpc = ["error", "handler", "transport"]
run = ["call", "connection", "error", "sync"]
sync = []
transport = []
