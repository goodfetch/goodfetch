# Which of goodfetch-collie-client's top-level modules may import which (ADR
# 0126), one concern each (spec #606): `transport` opens every socket and
# child process, `rpc` reads and correlates the messages, `line` encodes each
# as one line, `call` holds the builders every call goes through,
# `connection` ties them to the Connection's runtime, `handler` hands the
# engine's requests to the program's streams and writes their answers, `run`
# holds the Runs a Connection starts, above it, and `blocking` gives them all
# a face that blocks. `sync` names the crate's locks. Credits, cancellation,
# event resumption and bodies join as their own modules with the tickets that
# add them.
[modules]
blocking = ["call", "connection", "error", "run"]
call = ["error", "rpc"]
connection = ["call", "error", "handler", "rpc", "sync", "transport"]
error = []
handler = ["error", "line", "sync"]
line = []
rpc = ["error", "handler", "line", "transport"]
run = ["call", "connection", "error", "sync"]
sync = []
transport = []
