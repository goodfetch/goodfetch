# Which of goodfetch-collie-client's top-level modules may import which (ADR
# 0126), one concern each (spec #606): `transport` opens every socket and
# child process, `rpc` reads and correlates the messages, `line` encodes each
# as one line, `call` holds the builders every call goes through,
# `connection` ties them to the Connection's runtime, `handler` hands the
# engine's requests to the program's streams and writes their answers, `host`
# is what every handle reaches its engine through, `generated` holds the
# handles `xtask codegen` writes from the catalog (ADR 0099), `run` starts and
# closes the Runs a Connection drives, and `blocking` gives them all a face
# that blocks, with the twins of the generated handles as its own submodule.
# `file_saving` writes a file to the program's path whole or not at all (ADR
# 0116), which `connection` drives. `sync` names the crate's locks. `limits`
# types the Limits a connection and a Run's start take, a price as an exact
# `Money` (ADR 0080). `response` is the Response a page's request got, whose
# body it reads and decodes (ADRs 0085 and 0119), and `field_values` reads a
# page's fields into a program's type (ADR 0147). `connection_type` declares
# the Connection both Products' connections implement (ADRs 0095 and 0099),
# and `blocking` its blocking twin. `markers` warns once per process of a
# deprecated or Experimental entry `generated` calls (ADRs 0030 and 0099).
# Credits, cancellation and event resumption join as their own modules with
# the tickets that add them.
[modules]
blocking = ["call", "connection", "error", "field_values", "generated", "limits", "response", "run"]
call = ["error", "rpc"]
connection = ["call", "error", "file_saving", "handler", "rpc", "sync", "transport"]
connection_type = ["error", "run"]
error = []
field_values = ["call", "error"]
file_saving = ["error"]
generated = ["call", "host", "markers", "response"]
handler = ["error", "line", "sync"]
host = ["call", "connection", "error", "sync"]
limits = []
line = []
markers = ["sync"]
response = ["call", "connection", "error", "host"]
rpc = ["error", "handler", "line", "transport"]
run = ["connection", "error", "generated", "host", "limits"]
sync = []
transport = []
