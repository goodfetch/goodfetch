# Which of goodfetch-collie-client's top-level modules may import which (ADR
# 0126), one concern each (spec #606): `transport` opens every socket and
# child process, `rpc` frames and correlates the messages, `call` holds the
# builders every call goes through, `connection` ties them to the
# Connection's runtime, `host` is what every handle reaches its engine
# through, `generated` holds the handles `xtask codegen` writes from the
# catalog (ADR 0099), `run` starts and closes the Runs a Connection drives,
# and `blocking` gives them all a face that blocks, with the twins of the
# generated handles as its own submodule. `sync` names the crate's locks. Credits, cancellation, event resumption and bodies join as their
# own modules with the tickets that add them.
[modules]
blocking = ["call", "connection", "error", "generated", "run"]
call = ["error", "rpc"]
connection = ["call", "error", "rpc", "sync", "transport"]
error = []
generated = ["call", "host"]
host = ["call", "connection", "error", "sync"]
rpc = ["error", "transport"]
run = ["connection", "error", "generated", "host"]
sync = []
transport = []
