[package]
name = "goodfetch-collie"
description = "Collie, Goodfetch's Product for browser automation: its executable and its composition of the engine (ADRs 0087, 0090 and 0094)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"

[features]
# The executable's own dependencies (ADR 0094): `cargo install
# goodfetch-collie --locked --features executable` builds Collie's
# executable; a program embedding the crate never compiles them.
executable = ["dep:clap", "dep:jiff", "dep:mimalloc", "dep:schemars", "dep:secrecy", "dep:serde", "dep:tempfile", "dep:thiserror", "dep:libc", "dep:windows-sys", "dep:tracing-subscriber", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:opentelemetry-prometheus", "dep:prometheus", "dep:tracing-opentelemetry", "dep:async-trait", "dep:bytes", "dep:http", "tokio/io-util", "tokio/macros", "tokio/rt-multi-thread", "tokio/signal"]

[dependencies]
# The command line both executables carry (ADR 0090): owned names and help,
# which the catalog gives at run time.
clap = { workspace = true, optional = true, features = ["string"] }
# Goodfetch home in the OS's data folder when `GOODFETCH_HOME` is unset.
dirs.workspace = true
# The Rust SDK's connection to its linked engine (ADRs 0078 and 0081).
goodfetch-collie-client.workspace = true
goodfetch-engine.workspace = true
goodfetch-page.workspace = true
# The runtimes the executables and a linked engine build (ADR 0081).
goodfetch-runtime.workspace = true
goodfetch-protocol.workspace = true
# The built-in external Secret providers (spec #564).
goodfetch-secret-providers.workspace = true
# Human output's times in the local zone `TZ` names (ADR 0073): the system's
# zone database, bundled on Windows, which has none.
jiff = { workspace = true, optional = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
mimalloc = { workspace = true, optional = true }
# The params' JSON Schemas, from which each generated command takes its flags.
schemars = { workspace = true, optional = true }
# The log writers zero each line they masked, as the buffer a thread keeps
# would otherwise hold the value a Mask replaced.
secrecy = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
# The pinned builds' digests, `src/pins.json`.
serde_json.workspace = true
# The Browser cache's write check before a Daemon's copy goes in it.
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time"] }
# A linked engine's task, and the foreground Daemon's drain (ADR 0049).
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true, features = ["env-filter", "json"] }
# The opt-in OTLP export of the engine's spans (RT-18, ADR 0132), and the
# foreground Daemon's metrics (ADR 0050): the SDK whose meter the engine
# records on, the Prometheus exporter its ops listener serves, and the
# OTLP/HTTP exports in protobuf, sent through the engine's own HTTP client,
# the collector an Operator-configured endpoint, from the batch processor's
# and the periodic reader's own threads.
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true, features = ["logs", "metrics"] }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = ["logs", "metrics"] }
opentelemetry-prometheus = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = ["logs", "metrics"] }
prometheus = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
goodfetch-workspace-hack.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The foreground Daemon's reaper: the subreaper, `waitpid` and `kill` (ADR 0049).
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# `daemon start` keeps its own standard handles from the Daemon it starts,
# which would otherwise inherit them and hold its caller's pipes open.
windows-sys = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
# The static musl executables have one allocator (#2208): Collie's, and
# Foxhound's, which turns on this crate's `executable` feature. `override`
# routes the C and C++ code's `malloc` and its siblings (SQLite, BoringSSL,
# zstd, DuckDB) to mimalloc in place of Zig's libc allocator, whose `malloc`
# is weak; this crate's and Foxhound's tests built for that target do the
# same. The gnu builds, where the tests and heap benchmarks count on the
# system's allocator, and macOS and Windows keep their `malloc`.
mimalloc = { workspace = true, optional = true, features = ["override"] }

[dev-dependencies]
# Its own executable, for the integration tests and the startup benchmarks
# (CARGO_BIN_EXE_goodfetch-collie, ADRs 0059 and 0062).
goodfetch-collie = { path = ".", features = ["executable"] }
# The embedded Clean-up rules' digest and manifest, which a Run holds to by
# default (tests/it/clean_up_rules.rs).
goodfetch-clean-up-rules.workspace = true
goodfetch-test-client.workspace = true
goodfetch-test-support.workspace = true
gungraun.workspace = true
# The Clean-up rules sources' HTTPS stand-in, its authority and its
# listener (tests/it/clean_up_rules/stand_in.rs).
rcgen = { workspace = true, features = ["pem", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
# A stored body's ID, the SHA-256 of its bytes, for `page body --follow`,
# and the stand-in registry's blob digests.
sha2.workspace = true
# The relay authority's key hash, in base64, as its Provenance entry gives it.
data-encoding.workspace = true
# An identified Session's Ed25519 key, whose public half and RFC 7638
# thumbprint the key directory publishes (tests/it/identified.rs).
ed25519-dalek.workspace = true
insta.workspace = true
# The clean-up's time in the page tests, and the pins' lever
# (examples/pin-chrome-for-testing.rs), which downloads and unpacks the
# pinned archives.
jiff.workspace = true
# `config explain --json` is validated against its schema in the bundle (TESTING.md, CLI).
jsonschema.workspace = true
# The settings flags' duration reader, over generated durations.
proptest.workspace = true
rstest.workspace = true
# The program's type a page's fields are read into (tests/it/sdk/page.rs).
serde.workspace = true
# The corpus writers' dumps of run state and the Run index (examples/compat-run-index.rs), and a
# test report part's signature (src/linked/tests.rs).
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# `block_detection`'s check of its rules' sources against its `third-party.toml`.
toml.workspace = true
# The tests' HTTP Client, and the pins' lever's download.
ureq.workspace = true
# The SSRF table runners' URLs as the WHATWG parser writes them
# (tests/it/navigation_egress.rs, tests/it/borrowed_browser.rs).
url.workspace = true
# The OTLP collector stand-in of the trace and metrics exports' tests
# (tests/it/log.rs, tests/it/ops.rs).
opentelemetry-proto = { workspace = true, features = ["logs", "metrics"] }
prost.workspace = true
# The corpus writer's in-memory Client (examples/compat-protocol.rs).
tokio = { workspace = true, features = ["io-util", "macros"] }
# A WebSocket Client of `daemon run` (tests/it/websocket.rs).
tungstenite.workspace = true
zip = { workspace = true, features = ["deflate-flate2"] }
# The Secret tests plant a value through each provider's real interface
# (tests/it/secrets.rs): an age file for the encrypted local file, and the
# engine's own keychain, whose values are `SecretString`s.
age = { workspace = true, features = ["armor"] }
secrecy.workspace = true

# `cargo binstall goodfetch-collie` installs the executable from its
# archive on the GitHub Release of the same version (ADRs 0090 and 0094).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
pkg-fmt = "txz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.cargo-shear]
# The dev-dependency on itself only turns its executable on for its tests.
ignored = ["goodfetch-collie"]

[[bin]]
name = "goodfetch-collie"
path = "src/main.rs"
required-features = ["executable"]

# ADR 0071: the startup benchmarks of Collie's executable.
[[bench]]
name = "startup"
harness = false

# Its tests start the Proving ground through the test tool manifest, so a
# change to it runs them (TESTING.md, Commands).
[package.metadata.goodfetch]
runs = ["goodfetch-proving-ground"]

[lints]
workspace = true
