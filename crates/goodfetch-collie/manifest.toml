# The manifest of Collie's Rust SDK's hand-written public members, its
# connection, engine choice and executable (ADR 0099; STYLE.md, Protocol and
# SDKs), in the forms of `sdks/typescript/manifest.toml` and read as
# `crates/goodfetch-collie-client/manifest.toml`'s header says: a module's
# items sit on the module's path, such as `executable::output`.
#
# A re-exported item is listed once, by the manifest of the crate that
# declares it: the `Error`, `Limits` or `Response` this crate re-exports
# from `goodfetch-collie-client` is that crate's to list, and a contract type
# it re-exports from `goodfetch-protocol`, such as `RunId`, no manifest's
# (ADR 0038). `goodfetch-foxhound` re-exports this crate's `ConnectOptions`
# and `EngineChoice`, which this manifest lists and its own does not.

