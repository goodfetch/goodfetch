# The captured pages `block_detection`'s tests classify (TESTING.md, Fixtures
# and data files): each file is the body the Proving ground served for one
# page, recorded over plain HTTP; its status and the headers a rule reads are
# in the test's table. Every page but `protection-challenge` is a page of
# the block-detection corpus (`5.access.test/corpus/<name>`, access/5), one
# per rule; `protection-challenge` is the tier-move site's challenge page
# (`1.protection.test/articles`, protection/1).
generator = "goodfetch-proving-ground serve"
version = "0.0.0+ee9d454a"
seed = 158
date = "2026-10-21"
command = """
cargo run -p goodfetch-proving-ground -- serve --seed 158 --copy local \
  --address 127.0.0.1:0 --network-profile none
# with the printed port as PORT, from this folder:
for page in interstitial captcha rate-limit ip-block press-and-hold \
  cloudflare-block incapsula-block sucuri-block vendor-script article not-found; do
  curl -s -D - -o "$page.html" --resolve "5.access.test:$PORT:127.0.0.1" \
    "http://5.access.test:$PORT/corpus/$page"
done
curl -s -D - -o protection-challenge.html --resolve "1.protection.test:$PORT:127.0.0.1" \
  "http://1.protection.test:$PORT/articles"
"""
