[package]
name = "goodfetch-confinement"
description = "Plugin confinement (ADR 0033): the policy generated from a Plugin manifest, the fixed deny list, the seccomp lists and their probes, and each OS's applier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Nothing of the engine: the `goodfetch-sandbox` helper and the filter broker
# link this crate and must never link the engine (spec #596, crate reason 2).
[dependencies]
data-encoding.workspace = true
ed25519-dalek.workspace = true
goodfetch-protocol.workspace = true
serde.workspace = true
# The probe executable's request, its one argument.
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
goodfetch-workspace-hack.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The applier (ADR 0033): Landlock, then the stacked seccomp filters.
landlock.workspace = true
seccompiler.workspace = true

[target.'cfg(unix)'.dependencies]
# Raw system calls on Linux and macOS (rlimits, fd closing, probe calls).
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows confinement (ADR 0033, issues 873 and 879): AppContainer, restricted
# token, Job Object, alternate desktop, ACL grants, I/O completion port
# monitoring, and filter broker named-pipe client.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
goodfetch-dev-workspace-hack.workspace = true

[lints]
workspace = true
