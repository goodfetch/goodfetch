# macOS Seatbelt probes at the `proxy_tcp` network level (ADR 0067, issue 867):
# outgoing TCP is allowed to the instance's loopback proxy port alone; every
# other destination, inbound/bind, Unix socket, DNS Mach lookup, signal outside,
# and deny-list path is refused with `EPERM`.
# Mechanism: seatbelt (`sandbox_check(pid, NULL, SANDBOX_FILTER_NONE) == 1`).

operation = [
    { rule = "network.outbound_proxy", operation = "network_outbound_proxy", unconfined = "ok", confined = "ok" },
    { rule = "network.outbound_ip", operation = "network_outbound_ip", unconfined = "ok", confined = "EPERM" },
    { rule = "network.inbound", operation = "network_inbound", unconfined = "ok", confined = "EPERM" },
    { rule = "network.bind", operation = "network_bind", unconfined = "ok", confined = "EPERM" },
    { rule = "network.unix_socket", operation = "network_unix_socket", unconfined = "ok", confined = "EPERM" },
    { rule = "mach.dns", operation = "mach_lookup_dns", unconfined = "ok", confined = "EPERM" },
    { rule = "process.fork", operation = "process_fork", unconfined = "ok", confined = "ok" },
    { rule = "signals.outside", operation = "signal_outside", unconfined = "ok", confined = "EPERM" },
]

