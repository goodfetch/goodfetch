# Windows AppContainer probes at the `none` network level (ADR 0067, issue 873):
# one case per Windows confinement rule, signal/process-isolation rule, Windows
# deny-list entry and policy file rule, positive control first.
# Mechanism: app_container (`GetTokenInformation(..., TokenIsAppContainer, ...) != 0`).

operation = [
    { rule = "network.outbound_ip", operation = "network_outbound_ip", unconfined = "ok", confined = "EACCES" },
    { rule = "network.inbound", operation = "network_inbound", unconfined = "ok", confined = "EACCES" },
    { rule = "network.bind", operation = "network_bind", unconfined = "ok", confined = "EACCES" },
    { rule = "desktop.default", operation = "desktop_escape", unconfined = "ok", confined = "EACCES" },
    { rule = "signals.outside", operation = "process_open_parent", unconfined = "ok", confined = "EACCES" },
]

