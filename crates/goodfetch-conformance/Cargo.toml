[package]
name = "goodfetch-conformance"
description = "The conformance harness (ADR 0032): runs a suite against a target and a running Proving ground and writes one result document, and turns a case log into one (ADR 0069)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only goodfetch-protocol among Goodfetch's crates: the harness tests through
# the interface, never engine internals (STYLE.md, crate reason 2).
[dependencies]
data-encoding.workspace = true
goodfetch-protocol.workspace = true
regex.workspace = true
# The Politeness file a case reads for what an engine wrote to it.
rusqlite.workspace = true
# The Proving ground's interface (`proving-ground/src/interface.rs`), whose
# source the harness compiles to read the observations' requests.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# A gateway's WebSocket, which the gateway target reaches by address
# (ADR 0096): `ws` over TCP, or `wss` under rustls, which checks the
# gateway's certificate against Mozilla's roots as ureq's rustls does.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
secrecy.workspace = true
tungstenite.workspace = true
url.workspace = true
webpki-roots.workspace = true
# The Proving ground's HTTP API.
ureq.workspace = true
goodfetch-workspace-hack.workspace = true

[dev-dependencies]
goodfetch-test-support.workspace = true
jsonschema.workspace = true
rstest.workspace = true

[lints]
workspace = true

[package.metadata.cargo-shear]
# The Proving ground's interface, a module the harness reaches by path,
# derives `schemars::JsonSchema`, which cargo-shear does not follow.
ignored = ["schemars"]

# Its tests run the Proving ground's and each Product's executables through
# the test tool manifest, so a change to any of them runs them (`xtask
# affected`).
[package.metadata.goodfetch]
runs = ["goodfetch-proving-ground", "goodfetch-collie", "goodfetch-foxhound"]
