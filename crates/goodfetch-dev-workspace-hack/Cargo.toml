# The dev workspace-hack (ADR 0094's note of 2026-11-27): every workspace
# member (except `goodfetch-protocol`, `goodfetch-workspace-hack` and this
# crate) takes it in `[dev-dependencies]` only, so every test and
# `--all-targets` selection builds the code side with one feature set per
# shared dependency, while release and `--bin` builds stay untouched under
# Cargo's resolver 3 (ADRs 0087 and 0094).
# `ci/workspace-hack.sh generate` writes the section below from
# cargo-hakari's code-side tables; `just lint` checks it is current. Never
# edit the section by hand.
[package]
name = "goodfetch-dev-workspace-hack"
description = "One feature resolution of the code side for dev and test selections (ADR 0094); written by ci/workspace-hack.sh."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

