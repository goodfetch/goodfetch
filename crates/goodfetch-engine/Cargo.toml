[package]
name = "goodfetch-engine"
description = "The engine both Products' executables compose from the values their domain crates export (ADR 0087)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# benches/scenarios.rs is a module of the bench targets, not a target.
autobenches = false

[dependencies]
chacha20.workspace = true
# The Base64 of the page-body chunks `page.body` sends.
data-encoding.workspace = true
# Only names the inflate backend (miniz_oxide) for zip's DEFLATE.
flate2.workspace = true
getrandom.workspace = true
goodfetch-protocol.workspace = true
hickory-resolver = { workspace = true, features = ["tokio", "system-config"] }
# The Browser cache's pinned downloads (ADR 0043): HTTPS GETs over HTTP/1.1.
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff.workspace = true
rusqlite.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# The settings files (ADR 0028): read, and rewritten with every other byte kept (ADR 0098).
toml_edit.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "io-std", "sync", "macros", "time", "fs", "net"] }
tokio-rustls = { workspace = true, features = ["ring"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
ulid.workspace = true
webpki-roots.workspace = true
zip = { workspace = true, features = ["deflate-flate2"] }

[dev-dependencies]
goodfetch-test-support.workspace = true
gungraun.workspace = true
# The pinned downloads' HTTPS stand-in (tests/it/downloads.rs).
hyper = { workspace = true, features = ["server"] }
rcgen = { workspace = true, features = ["ring"] }
insta.workspace = true
mimalloc.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
rstest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

# ADR 0071: instruction counts under Callgrind, heap metrics under DHAT.
[[bench]]
name = "instructions"
harness = false

[[bench]]
name = "heap"
harness = false

[package.metadata.cargo-shear]
# flate2 is never named: it only picks the backend zip inflates with.
ignored = ["flate2"]

[lints]
workspace = true
