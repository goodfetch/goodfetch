# goodfetch-engine's cargo-fuzz targets (ADR 0067; TESTING.md, Fuzzing),
# outside the workspace: each target's body is a plain function of the
# engine, whose seeds and past crashers `fuzz_replay!` replays from
# `fuzz/<target>/` on every OS. Build and run with the pinned nightly:
# `cargo fuzz run json_rpc_framing fuzz/json_rpc_framing/seeds
# -- -dict=fuzz/json_rpc_framing/dictionary.dict`, and likewise
# `settings_file`, `checkpoint`, `secret_reference`, `address_classification`,
# `certificate_file`, `robots_txt` and `audit_jsonl`.
[package]
name = "goodfetch-engine-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
goodfetch-engine = { path = ".." }
libfuzzer-sys = "0.4.10"

[[bin]]
name = "json_rpc_framing"
path = "fuzz_targets/json_rpc_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings_file"
path = "fuzz_targets/settings_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint"
path = "fuzz_targets/checkpoint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "run_state_import"
path = "fuzz_targets/run_state_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secret_reference"
path = "fuzz_targets/secret_reference.rs"
test = false
doc = false
bench = false

[[bin]]
name = "address_classification"
path = "fuzz_targets/address_classification.rs"
test = false
doc = false
bench = false

[[bin]]
name = "certificate_file"
path = "fuzz_targets/certificate_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "robots_txt"
path = "fuzz_targets/robots_txt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit_jsonl"
path = "fuzz_targets/audit_jsonl.rs"
test = false
doc = false
bench = false
