# Which of goodfetch-engine's top-level modules may import which (ADR 0126).
[modules]
browser_cache = ["composition", "transport"]
composition = ["product"]
engine = ["composition", "product", "rpc", "tasks", "transport"]
info = ["composition"]
product = []
rpc = ["composition", "product", "tasks", "transport"]
tasks = []
transport = []

# Which of `rpc`'s own modules may import which.
[submodules.rpc]
connection = ["framing", "handshake"]
framing = []
handshake = []

# Which of `browser_cache`'s own modules may import which.
[submodules.browser_cache]
artifact = []
clean_up = ["store"]
download = ["artifact"]
extract = []
platform = ["artifact"]
store = []
