[modules]
body = []
browser_cache = ["composition", "transport"]
client = []
clock = []
composition = ["client", "events", "product", "run_state", "runs"]
dns = ["composition"]
engine = ["clock", "composition", "entropy", "events", "home", "product", "rpc", "run_state", "runs", "tasks", "transport"]
entropy = []
