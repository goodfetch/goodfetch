# Browser sandbox startup probe cases (ADR 0049, ADR 0067; #642 -> #429),
# generated by `xtask probes generate`: one case per SandboxEnvironment
# and NoSandboxPlatform variant, each paired with the `starts` positive control.

[[case]]
rule = "browser_sandbox.starts"
mechanism = "user_namespace"
positive_control = "starts"
user_namespace = "created"
seccomp_filtered = false
apparmor_restricts = false
expected_probed = "starts"

[[case]]
rule = "browser_sandbox.environment.docker_default_seccomp"
mechanism = "user_namespace"
positive_control = "starts"
user_namespace = "refused"
seccomp_filtered = true
apparmor_restricts = false
expected_probed = "refused"
expected_environment = "docker_default_seccomp"
expected_error_code = "browser_sandbox_unavailable"

[[case]]
rule = "browser_sandbox.environment.kubernetes_runtime_default"
mechanism = "user_namespace"
positive_control = "starts"
user_namespace = "refused"
seccomp_filtered = true
apparmor_restricts = false
env_var = "KUBERNETES_SERVICE_HOST"
env_value = "10.96.0.1"
expected_probed = "refused"
expected_environment = "kubernetes_runtime_default"
expected_error_code = "browser_sandbox_unavailable"

[[case]]
rule = "browser_sandbox.environment.apparmor_userns"
mechanism = "user_namespace"
positive_control = "starts"
user_namespace = "unmapped"
seccomp_filtered = false
apparmor_restricts = true
expected_probed = "restricted"

[[case]]
rule = "browser_sandbox.environment.unknown"
mechanism = "user_namespace"
positive_control = "starts"
user_namespace = "refused"
seccomp_filtered = false
apparmor_restricts = false
expected_probed = "unknown"
expected_error_code = "browser_sandbox_unavailable"

[[case]]
rule = "browser_sandbox.platform.aws_lambda"
mechanism = "user_namespace"
positive_control = "starts"
user_namespace = "refused"
seccomp_filtered = true
apparmor_restricts = false
env_var = "AWS_LAMBDA_FUNCTION_NAME"
env_value = "probe"
expected_probed = "no_sandbox"
expected_platform = "aws_lambda"

[[case]]
rule = "browser_sandbox.platform.fargate"
mechanism = "user_namespace"
positive_control = "starts"
user_namespace = "refused"
seccomp_filtered = true
apparmor_restricts = false
env_var = "AWS_EXECUTION_ENV"
env_value = "AWS_ECS_FARGATE"
expected_probed = "no_sandbox"
expected_platform = "fargate"

[[case]]
rule = "browser_sandbox.platform.eks_fargate"
mechanism = "user_namespace"
positive_control = "starts"
user_namespace = "refused"
seccomp_filtered = true
apparmor_restricts = false
env_var = "GOODFETCH_EKS_FARGATE_PROFILE"
env_value = "probe"
expected_probed = "no_sandbox"
expected_platform = "eks_fargate"

[[case]]
rule = "browser_sandbox.platform.azure_container_apps"
mechanism = "user_namespace"
positive_control = "starts"
user_namespace = "refused"
seccomp_filtered = true
apparmor_restricts = false
env_var = "CONTAINER_APP_NAME"
env_value = "probe"
expected_probed = "no_sandbox"
expected_platform = "azure_container_apps"

