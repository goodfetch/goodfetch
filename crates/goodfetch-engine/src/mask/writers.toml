# Every writer the Products' crates hold, listed with how it meets the `Mask`
# (spec #564): each file whose code opens a file, writes one whole, gives the
# `tracing` subscriber a writer, takes stdout or stderr, creates a SQLite table
# or writes a Connection's lines, how many of those it holds, and whether what
# they write is masked, where it says, or holds no resolved value, for the
# reason it says. `xtask mask-writers` finds them in the source and fails on
# any this list does not hold as it finds it, so a new writer cannot skip the
# `Mask` unseen.

[[writer]]
path = "crates/foxhound/goodfetch-crawl/src/code_free.rs"
count = 1
how = "holds no value: a code-free crawl's extraction, the formats it asks for and which links it follows, as the program gave them"

[[writer]]
path = "crates/foxhound/goodfetch-crawl/src/hooks.rs"
count = 1
how = "holds no value: the Hooks in code a crawl's latest start declared, in order, as the program gave them (names, stages and scopes, never their code)"

[[writer]]
path = "crates/foxhound/goodfetch-crawl/src/labels.rs"
count = 2
how = "holds no value: the Labels a crawl declares, their Payloads' schemas and their `fetch.tier`, and whether the Run and each Label keep URL fragments"

[[writer]]
path = "crates/foxhound/goodfetch-crawl/src/tier_choice.rs"
count = 1
how = "holds no value: each Label's tier on each domain key, its samples' path segments and whether they matched"

[[writer]]
path = "crates/foxhound/goodfetch-crawl/src/work_items.rs"
count = 6
how = "masked: a handler's failure is masked as `Scope::Kept` where the delivery receives it, a refused Record's `record_invalid` too; work items and outcomes hold URLs and the program's own data, and the reserved positions only a number; the request and Record counts hold an outcome's kind, its skip reason, Error code or Block cause (a code, never its message) and numbers"

[[writer]]
path = "crates/foxhound/goodfetch-dataset/src/lib.rs"
count = 3
how = "masked: the Records a crawl commits, their Provenance and the rejection table's rejected Records with the check's reason and issues are written with every value the Run resolved as its `%name%` (`Scope::Kept`, in `records.rs`, #972); the Datasets a crawl declares (names, schemas, keys) are the program's own declarations"

