[package]
name = "goodfetch-extractor"
description = "The page formats read from a serialized document: its main content found by the extractor and written as Markdown, pure over its input (spec #580; ADRs 0007, 0033 and 0088)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# benches/scenarios.rs is a module of the bench targets, not a target.
autobenches = false

[dependencies]
dom_query.workspace = true
goodfetch-counted-work.workspace = true
dom_smoothie.workspace = true
ego-tree.workspace = true
goodfetch-protocol.workspace = true
htmd.workspace = true
html5ever.workspace = true
lol_html.workspace = true
markup5ever_rcdom.workspace = true
phonenumber.workspace = true
scraper.workspace = true
rs-trafilatura.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
goodfetch-workspace-hack.workspace = true

[dev-dependencies]
goodfetch-test-support.workspace = true
gungraun.workspace = true
mimalloc.workspace = true
proptest.workspace = true
rstest.workspace = true

# ADR 0071: instruction counts under Callgrind, heap metrics under DHAT.
[[bench]]
name = "instructions"
harness = false

[[bench]]
name = "heap"
harness = false

[lints]
workspace = true
