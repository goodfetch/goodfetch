# goodfetch-extractor's cargo-fuzz target (ADR 0067; TESTING.md, Fuzzing),
# outside the workspace: its body is `goodfetch_extractor::fuzz_formats`,
# whose seeds and past crashers `fuzz_replay!` replays from `fuzz/formats/`
# on every OS. A page's HTML is input from a site. Build and run with the
# pinned nightly, the git-ignored corpus first so a run never grows the
# committed seeds: `cargo fuzz run formats fuzz/corpus/formats
# fuzz/formats/seeds`.
[package]
name = "goodfetch-extractor-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
goodfetch-extractor = { path = ".." }
libfuzzer-sys = "0.4.10"

[[bin]]
name = "formats"
path = "fuzz_targets/formats.rs"
test = false
doc = false
bench = false

# Goodfetch's forks of `dom_smoothie`, `rs-trafilatura` and the two crates
# rs-trafilatura reads trees with, as the workspace's `[patch.crates-io]`
# carries them.
[patch.crates-io]
dom_smoothie = { path = "../../../vendor/dom_smoothie" }
html-cleaning = { path = "../../../vendor/html-cleaning" }
quick_html2md = { path = "../../../vendor/quick_html2md" }
rs-trafilatura = { path = "../../../vendor/rs-trafilatura" }
