[package]
name = "goodfetch-mcp"
description = "The Model Context Protocol server shared by Collie and Foxhound (spec #608; ADRs 0070, 0087 and 0095)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
goodfetch-protocol.workspace = true
rmcp = { workspace = true, features = ["server", "transport-async-rw", "transport-io"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
goodfetch-workspace-hack.workspace = true

[dev-dependencies]
goodfetch-runtime.workspace = true
insta.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
goodfetch-dev-workspace-hack.workspace = true

[lints]
workspace = true
