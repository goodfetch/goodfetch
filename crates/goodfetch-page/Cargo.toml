[package]
name = "goodfetch-page"
description = "Collie's pages, Sessions and the browsers behind them: the driver over CDP, the Session-level driver and the page API's operation handlers (spec #577; ADRs 0085, 0087 and 0129)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# benches/scenarios.rs is a module of the bench targets, not a target.
autobenches = false

[dependencies]
# The egress relay's terminating mode (ADRs 0042 and 0124): BoringSSL
# through the fork `wreq` uses, upstream with a ClientHello rebuilt from the
# browser's and toward the browser with the in-memory authority's leaf.
btls.workspace = true
# The BoringSSL functions `btls` has no method for: the browser's
# `trust_anchors` request, the ALPS payload and resuming a session.
btls-sys.workspace = true
foreign-types.workspace = true
# The certificates the browser's ClientHello may ask compressed (RFC 8879):
# Brotli and zlib, decoded only.
brotli-decompressor.workspace = true
# Bodies are `Bytes`, read once and never copied (STYLE.md).
bytes.workspace = true
bytestring.workspace = true
data-encoding.workspace = true
flate2.workspace = true
# Drives a Borrowed browser's CDP WebSocket's stream of messages and its
# sink (ADR 0056).
futures-util.workspace = true
goodfetch-cdp.workspace = true
goodfetch-clean-up-rules.workspace = true
goodfetch-counted-work.workspace = true
goodfetch-engine.workspace = true
goodfetch-extractor.workspace = true
goodfetch-protocol.workspace = true
# The egress relay's request heads (the `egress_relay` module).
httparse.workspace = true
jiff.workspace = true
# A domain as ADR 0004 keys it, which blocking is learned off for (ADR 0047).
psl.workspace = true
# The relay's certificate authority, made at each Run's first launch and
# held in memory only, name-constrained to the listed hosts (ADR 0042).
rcgen = { workspace = true, features = ["ring"] }
regex.workspace = true
regex-syntax.workspace = true
rusqlite.workspace = true
# The relay's TLS to an `https://` upstream proxy, verified as an
# Operator-configured endpoint's under the engine's `Trust` (ADR 0042).
# Tests also prove the relay's authority name-constrained with its verifier.
rustls = { workspace = true, features = ["ring", "std"] }
tokio-rustls = { workspace = true, features = ["ring"] }
# A Session's proxy password, held until the Session's proxy goes.
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# The name of a Session's sticky session at a Proxy provider: a digest of
# its Session ID, so the provider never sees the Run's own ID.
sha2.workspace = true
thiserror.workspace = true
# The release table the version check reads (ADR 0035).
toml.workspace = true
# `net` and `io-util` for the per-Session SOCKS5 relay (the `proxy` module).
tokio = { workspace = true, features = ["io-util", "net", "process", "sync", "time", "macros"] }
tokio-btls.workspace = true
# A Borrowed browser's CDP WebSocket at its `cdp_url` (ADRs 0056 and 0115).
tokio-tungstenite.workspace = true
# The relay's stop, when its Session's proxy goes; a browser of the pool
# closes on its own token, a child of its Run's.
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
goodfetch-workspace-hack.workspace = true

[target.'cfg(unix)'.dependencies]
# The child's descriptors 3 and 4, set between fork and exec (ADR 0017).
libc.workspace = true
# The engine's ends of the browser's debugging pipe.
tokio = { workspace = true, features = ["net"] }

[target.'cfg(windows)'.dependencies]
# The browser's debugging pipe's random name (ADR 0017).
getrandom.workspace = true

[dev-dependencies]
# The integration tests' adapter of the page's value and response observer
# (ADR 0125); never the unit tests', which would link two copies of this
# crate.
goodfetch-recording-gate.workspace = true
goodfetch-test-client.workspace = true
goodfetch-runtime.workspace = true
goodfetch-test-support.workspace = true
gungraun.workspace = true
mimalloc.workspace = true
proptest.workspace = true
# The counts cell's Goodfetch home.
tempfile.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["io-util", "rt"] }

# ADR 0071: instruction counts under Callgrind, heap metrics under DHAT.
[[bench]]
name = "instructions"
harness = false

[[bench]]
name = "heap"
harness = false

# Its tests start the Proving ground through the test tool manifest, so a
# change to it runs them (TESTING.md, Commands).
[package.metadata.goodfetch]
runs = ["goodfetch-proving-ground"]

[lints]
workspace = true
