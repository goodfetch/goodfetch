# Which of goodfetch-page's top-level modules may import which (ADR 0126).
[modules]
browser_fetch = ["driver", "errors", "interception", "proxy"]
consent = ["driver", "guard"]
driver = ["errors", "launch", "proxy", "trace"]
errors = []
guard = ["driver", "hiding"]
hiding = ["driver", "interception", "trace"]
interception = ["driver", "page_events", "proxy", "url_pattern"]
launch = []
page_events = ["driver", "url_pattern"]
pages = ["browser_fetch", "driver", "guard", "interception", "page_events", "sessions", "trace", "url_pattern"]
pool = ["driver", "proxy", "trace"]
proxy = []
sessions = ["consent", "driver", "hiding", "interception", "page_events", "pool", "proxy"]
robots_txt = []
trace = []
url_pattern = []

# Which of `driver`'s own modules may import which.
[submodules.driver]
carry = ["world"]
identity = []
navigation = []
targets = ["world"]
world = []

# Which of `interception`'s own modules may import which.
[submodules.interception]
answers = ["steps"]
clean_up = ["steps"]
pipeline = ["answers", "routes", "steps"]
routes = []
steps = []

# Which of `pool`'s own modules may import which.
[submodules.pool]
rules = []

# Which of `proxy`'s own modules may import which.
[submodules.proxy]
party = []
relay = []

# Which of `launch`'s own modules may import which.
[submodules.launch]
arguments = []
pipe = []
preferences = []

# Which of `consent`'s own modules may import which.
[submodules.consent]
frames = []
log = ["messages"]
messages = []

# Which of `guard`'s own modules may import which.
[submodules.guard]
check = []
keys = []
target = []

# Which of `pages`'s own modules may import which.
[submodules.pages]
clean_up = []
