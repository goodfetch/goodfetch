# Which of goodfetch-page's top-level modules may import which (ADR 0126).
[modules]
browser_fetch = ["driver", "errors", "interception", "page_value", "proxy"]
consent = ["driver", "guard"]
driver = ["errors", "launch", "page_value", "proxy", "trace"]
errors = ["page_value"]
guard = ["driver", "hiding"]
hiding = ["driver", "interception", "trace"]
interception = ["driver", "errors", "page_events", "page_value", "proxy", "url_pattern"]
launch = []
page_events = ["driver", "url_pattern"]
page_value = ["url_pattern"]
pages = ["browser_fetch", "driver", "guard", "interception", "page_events", "page_value", "sessions", "trace", "url_pattern"]
pool = ["driver", "proxy", "trace"]
proxy = ["proxy_provider"]
proxy_provider = []
sessions = ["consent", "driver", "errors", "hiding", "interception", "page_events", "page_value", "pool", "proxy"]
robots_txt = []
trace = []
url_pattern = []

# Which of `driver`'s own modules may import which.
[submodules.driver]
carry = ["world"]
encoding = []
ending = ["navigation"]
identity = []
navigation = []
permit_waits = []
service_workers = []
targets = ["world"]
world = []

# Which of `interception`'s own modules may import which.
[submodules.interception]
answers = ["steps"]
clean_up = ["steps"]
navigations = []
pipeline = ["answers", "routes", "steps"]
routes = []
steps = []

# Which of `sessions`' own modules may import which.
[submodules.sessions]
ends = ["life", "lifecycle"]
life = ["lifecycle"]
lifecycle = []

# Which of `pool`'s own modules may import which.
[submodules.pool]
rules = []

# Which of `proxy`'s own modules may import which.
[submodules.proxy]
party = []
relay = []

# Which of `proxy_provider`'s own modules may import which.
[submodules.proxy_provider]
list = []

# Which of `launch`'s own modules may import which.
[submodules.launch]
arguments = []
pipe = []
preferences = []

# Which of `consent`'s own modules may import which.
[submodules.consent]
frames = []
log = ["messages"]
messages = []

# Which of `guard`'s own modules may import which.
[submodules.guard]
check = []
keys = []
target = []

# Which of `pages`'s own modules may import which.
[submodules.pages]
clean_up = []
