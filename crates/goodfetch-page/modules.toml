# Which of goodfetch-page's top-level modules may import which (ADR 0126).
[modules]
driver = ["errors", "launch", "trace"]
errors = []
guard = ["driver"]
launch = []
pages = ["driver", "guard"]
trace = []

# Which of `driver`'s own modules may import which.
[submodules.driver]
navigation = []
world = []

# Which of `launch`'s own modules may import which.
[submodules.launch]
pipe = []

# Which of `guard`'s own modules may import which.
[submodules.guard]
check = []
keys = []
target = []
