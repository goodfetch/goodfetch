# Which of goodfetch-protocol's top-level modules may import which (ADR 0126).
[modules]
browser_cache = ["catalog", "connection"]
case_log = ["result_document"]
catalog = []
connection = ["catalog", "jsonrpc"]
emit = ["case_log", "catalog", "connection", "entries", "formats", "journey", "releases", "result_document"]
engine = ["catalog", "connection"]
entries = ["browser_cache", "catalog", "connection", "engine", "foxhound", "sample"]
formats = ["browser_cache", "catalog", "jsonrpc"]
foxhound = ["catalog", "sample"]
foxhound_names = []
journey = ["catalog", "releases"]
jsonrpc = ["catalog"]
releases = []
result_document = ["catalog", "journey", "releases"]
routing = ["catalog", "foxhound_names"]
sample = ["catalog"]
