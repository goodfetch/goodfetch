[package]
name = "goodfetch-schedule"
description = "Schedules (ADR 0036; spec #589): what starts a Run on its own, kept in the per-user, per-major Schedule store of the Daemon, and the `schedule.*` operations that create, list, read and delete them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Cron expression parsing and DST evaluation (ADR 0036; #864).
croner.workspace = true
goodfetch-engine.workspace = true
goodfetch-protocol.workspace = true
# A Schedule's IANA time zone, checked against the zone database (ADR 0073).
jiff = { workspace = true, features = ["tzdb-zoneinfo", "tzdb-bundle-platform"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# A generated Schedule ID: `s` and a lowercase ULID (ADR 0059).
ulid.workspace = true
goodfetch-workspace-hack.workspace = true

[dev-dependencies]
goodfetch-test-support.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
