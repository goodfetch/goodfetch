[package]
name = "goodfetch-secret-providers"
description = "The built-in external Secret providers: 1Password (`op://`), Bitwarden and Vaultwarden (`bw:`), and HashiCorp Vault and OpenBao (`vault:`), each filling the Secret-provider driver's two primitives (spec #564; ADRs 0015, 0033 and 0129)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
goodfetch-engine.workspace = true
goodfetch-protocol.workspace = true
hyper.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
goodfetch-test-support.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true, features = ["ring"] }
rstest.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["rt", "time", "net"] }
tokio-rustls = { workspace = true, features = ["ring"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
