description = "The built-in external Secret providers: 1Password (`op://`) and Bitwarden and Vaultwarden (`bw:`), each filling the Secret-provider driver's two primitives (spec #564; ADRs 0015, 0033 and 0129)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
goodfetch-engine.workspace = true
goodfetch-protocol.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true

[dev-dependencies]
goodfetch-test-support.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
