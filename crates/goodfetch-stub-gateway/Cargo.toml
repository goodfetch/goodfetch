[package]
name = "goodfetch-stub-gateway"
description = "The Stub gateway: a test-only stand-in of Goodfetch Cloud's gateway that serves Foxhound's Console build and runs each run on the executable of its Product (spec #593; ADRs 0096 and 0125); never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A test adapter under ADR 0125 whose only reason to be a crate is its
# executable. It takes both Products' executables by path and depends on no
# Foxhound crate (ADR 0096).
[dependencies]
clap.workspace = true
goodfetch-engine.workspace = true
goodfetch-protocol.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "sync", "macros", "fs", "process", "signal", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
goodfetch-workspace-hack.workspace = true

[dev-dependencies]
# The Cloud-readiness conformance suite's gateway cases, which its tests run
# against the gateway's executable (tests/it/cloud_readiness.rs), the
# token as a Secret.
goodfetch-conformance.workspace = true
goodfetch-test-support.workspace = true
rstest.workspace = true
secrecy.workspace = true
# The TLS terminator the suite reaches the gateway through over `https`
# (tests/it/cloud_readiness.rs), its certificate signed by an authority of
# its own.
rcgen = { workspace = true, features = ["ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }
tokio-rustls = { workspace = true, features = ["ring"] }
# The gateway's HTTP Client in its tests (tests/it/gateway.rs).
ureq.workspace = true
# The Console's WebSocket Client in its tests (tests/it/gateway.rs).
tungstenite.workspace = true

[lints]
workspace = true

# Its tests run both Products' executables through the test tool manifest,
# so a change to either runs them (`xtask affected`).
[package.metadata.goodfetch]
runs = ["goodfetch-collie", "goodfetch-foxhound", "goodfetch-proving-ground"]

[[bin]]
name = "goodfetch-stub-gateway"
path = "src/main.rs"
