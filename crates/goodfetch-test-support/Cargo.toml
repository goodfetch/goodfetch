[package]
name = "goodfetch-test-support"
description = "Goodfetch's shared Rust test helpers (ADR 0062); only ever a dev-dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Values only: no Goodfetch crate, not even in its own tests (ADR 0062).
[dependencies]
assert_cmd.workspace = true
chacha20.workspace = true
clap.workspace = true
jiff.workspace = true
proptest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# `test-util` pauses the runtime's clock, so callers need no feature of their own.
tokio = { workspace = true, features = ["rt", "time", "test-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
jsonschema.workspace = true
rstest.workspace = true

[lints]
workspace = true
