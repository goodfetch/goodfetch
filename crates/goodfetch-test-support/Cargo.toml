[package]
name = "goodfetch-test-support"
description = "Goodfetch's shared Rust test helpers (ADR 0062); only ever a dev-dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Values only: no Goodfetch crate, not even in its own tests (ADR 0062).
[dependencies]
assert_cmd.workspace = true
chacha20.workspace = true
clap.workspace = true
insta = { workspace = true, features = ["filters"] }
jiff.workspace = true
proptest.workspace = true
regex.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
sqlite-plugin.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
# `test-util` pauses the runtime's clock, so callers need no feature of their own.
tokio = { workspace = true, features = ["rt", "time", "test-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# `JourneyRun` submits a tool's result to the Proving ground's oracle.
ureq.workspace = true

# Never used here: it turns on bindgen's `runtime` feature for sqlite-plugin's
# build script, so that script loads libclang where the OS keeps it (Xcode,
# /usr/lib/llvm-*, C:\Program Files\LLVM) instead of linking it at a path the
# script cannot then find when it runs.
[build-dependencies]
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }

# Its integration tests start the Proving ground through the test tool
# manifest, so a change to it runs them (TESTING.md, Commands).
[package.metadata.goodfetch]
runs = ["goodfetch-proving-ground"]

[package.metadata.cargo-shear]
ignored = ["bindgen"]

[dev-dependencies]
jsonschema.workspace = true
rstest.workspace = true

[lints]
workspace = true
