[package]
name = "goodfetch-test-support"
description = "Goodfetch's shared Rust test helpers (ADR 0062); only ever a dev-dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Values only: no Goodfetch crate but `goodfetch-runtime`, which builds its
# runtimes, not even in its own tests (ADR 0062).
[dependencies]
assert_cmd.workspace = true
chacha20.workspace = true
clap.workspace = true
data-encoding.workspace = true
expectrl.workspace = true
# The crates.io side of the install harness unpacks a `.crate` file, a gzipped tar.
flate2.workspace = true
insta = { workspace = true, features = ["filters"] }
jiff.workspace = true
# Protocol fuzzing checks each generated call and each answer against the
# committed JSON Schema bundle (ADR 0067).
jsonschema.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
regex.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
sqlite-plugin.workspace = true
# `refused_matches` reads a transition table's source to show it matches
# with no wildcard (ADR 0128).
syn = { workspace = true, features = ["visit"] }
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
# `test-util` pauses the runtime's clock, so callers need no feature of their own.
tokio = { workspace = true, features = ["rt", "time", "test-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
# The endpoint table's runner opens a WebSocket listener's handshakes, a
# foreign `Host` or no `Origin` among them (ADR 0067).
tungstenite.workspace = true
# `JourneyRun` submits a tool's result to the Proving ground's oracle, and
# `Canaries` plants and reads Secret canaries through it.
ureq.workspace = true
# Builds its runtimes (ADR 0081).
goodfetch-runtime.workspace = true
goodfetch-workspace-hack.workspace = true

# `NoExec`'s seccomp filter and its child's start (ADR 0067), and the
# process's peak resident memory (`peak_resident_bytes`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# Never used here: it turns on bindgen's `runtime` feature for sqlite-plugin's
# build script, so that script loads libclang where the OS keeps it (Xcode,
# /usr/lib/llvm-*, C:\Program Files\LLVM) instead of linking it at a path the
# script cannot then find when it runs.
[build-dependencies]
bindgen.workspace = true

# Its integration tests start the Proving ground and both Products'
# executables through the test tool manifest, so a change to any runs them
# (TESTING.md, Commands).
[package.metadata.goodfetch]
runs = ["goodfetch-collie", "goodfetch-foxhound", "goodfetch-proving-ground"]

[package.metadata.cargo-shear]
ignored = ["bindgen"]

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
