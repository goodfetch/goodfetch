# cargo-deny's workspace-wide configuration (STYLE.md, Dependencies; ADRs
# 0018, 0062 and 0087). `just lint` checks the licenses, bans and sources
# offline; `just audit` checks the advisories, which need RustSec's database.
# What each Product's executable ships is checked against `ci/deny/`'s own
# configurations (`ci/deny/products.sh`).
#
# `xtask codegen` writes two marked regions: the licenses, from ADR 0018's
# allowlist in `license-allowlist.toml`, and the `wrappers` list of
# Foxhound's crates at the end. Each Foxhound crate lists every Foxhound crate
# and `xtask` as its allowed parents, most of which never depend on it, so the
# checks run with `-A unused-wrapper`: an unmatched wrapper is the rule's
# shape, not a finding.

[graph]
all-features = true

# xtask codegen: begin, ADR 0018's license allowlist, from license-allowlist.toml. Never edit by hand; run `xtask codegen`.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "MIT-0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "MPL-2.0",
]

# xtask codegen: end

# RustSec's advisories (ADR 0067): every vulnerability and unsound advisory
# fails, and so does a yanked version or an unmaintained crate anywhere in the
# graph (STYLE.md: maintained, or deliberately stable). An advisory is ignored
# only with its ID, a reason and the issue that removes it.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

# Only crates.io; a git or other registry source fails until it is listed
# here with its reason (STYLE.md, Dependencies).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# No mocking of owned code (ADR 0062, TESTING.md); httpmock stays allowed
# for true externals.
[[bans.deny]]
crate = "mockall"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "mockito"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "wiremock"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "faux"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "mry"
reason = "mocks owned code (ADR 0062)"

# xtask codegen: begin, the crates under crates/foxhound/ (ADR 0087). Never edit by hand; run `xtask codegen`.
[[bans.deny]]
crate = "goodfetch-foxhound"
wrappers = ["goodfetch-foxhound", "goodfetch-frontier", "goodfetch-sink", "xtask"]
reason = "only Foxhound's crates and xtask depend on a crate under crates/foxhound/ (ADR 0087)"

[[bans.deny]]
crate = "goodfetch-frontier"
wrappers = ["goodfetch-foxhound", "goodfetch-frontier", "goodfetch-sink", "xtask"]
reason = "only Foxhound's crates and xtask depend on a crate under crates/foxhound/ (ADR 0087)"

[[bans.deny]]
crate = "goodfetch-sink"
wrappers = ["goodfetch-foxhound", "goodfetch-frontier", "goodfetch-sink", "xtask"]
reason = "only Foxhound's crates and xtask depend on a crate under crates/foxhound/ (ADR 0087)"

# xtask codegen: end
