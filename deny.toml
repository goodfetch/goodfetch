# cargo-deny's configuration. #132 adds the mocking bans of ADR 0062, checked
# with `cargo deny check bans`; #133 adds the licence allowlist (ADR 0018), the
# advisories, the sources and ADR 0087's two boundary checks. `xtask codegen`
# writes the `wrappers` list of Foxhound's crates into its region at the end.

[graph]
all-features = true

# No mocking of owned code (ADR 0062, TESTING.md); httpmock stays allowed
# for true externals.
[[bans.deny]]
crate = "mockall"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "mockito"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "wiremock"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "faux"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "mry"
reason = "mocks owned code (ADR 0062)"

# xtask codegen: begin, the crates under crates/foxhound/ (ADR 0087). Never edit by hand; run `xtask codegen`.
[[bans.deny]]
crate = "goodfetch-frontier"
wrappers = ["goodfetch-frontier", "goodfetch-sink", "xtask"]
reason = "only Foxhound's crates and xtask depend on a crate under crates/foxhound/ (ADR 0087)"

[[bans.deny]]
crate = "goodfetch-sink"
wrappers = ["goodfetch-frontier", "goodfetch-sink", "xtask"]
reason = "only Foxhound's crates and xtask depend on a crate under crates/foxhound/ (ADR 0087)"

# xtask codegen: end
