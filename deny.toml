# cargo-deny's workspace-wide configuration (STYLE.md, Dependencies; ADRs
# 0018, 0062 and 0087). `just lint` checks the licenses, bans and sources
# offline; `just audit` checks the advisories against RustSec's pinned commit.
# What each Product's executable ships is checked against `ci/deny/`'s own
# configurations (`ci/deny/products.sh`).
#
# `xtask codegen` writes two marked regions: the licenses, from ADR 0018's
# allowlist in `license-allowlist.toml`, and the `wrappers` list of
# Foxhound's crates at the end. Each Foxhound crate lists every Foxhound crate
# and `xtask` as its allowed parents, most of which never depend on it, so the
# checks run with `-A unused-wrapper`: an unmatched wrapper is the rule's
# shape, not a finding.

[graph]
all-features = true

# xtask codegen: begin, ADR 0018's license allowlist, from license-allowlist.toml. Never edit by hand; run `xtask codegen`.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "MIT-0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "MPL-2.0",
]

# xtask codegen: end

# RustSec's advisories (ADR 0067): every vulnerability and unsound advisory
# fails, and so does a yanked version or an unmaintained crate anywhere in the
# graph (STYLE.md: maintained, or deliberately stable). An advisory is ignored
# only with its ID, a reason and the issue that removes it.
#
# ci/audit.sh names the database's folder: the gate's reads the commit
# ci/advisories.toml pins, offline, and the live audit cargo-deny's own clone
# (ADR 0064). By hand, from the repository root, the pinned one. The age
# cargo-deny measures offline is that of the local checkout, not of the
# data, so a pinned commit never goes stale here; the daily live audit reads
# the newest.
[advisories]
db-path = "${GOODFETCH_ADVISORY_DBS:-target/advisories/rustsec}"
maximum-db-staleness = "P36500D"
unmaintained = "all"
unsound = "all"
yanked = "deny"
# `.cargo/audit.toml` lists the same IDs for cargo-audit.
ignore = [
  # basic-toml, unmaintained: only age's localization macro reads it, at build
  # time (i18n-embed-fl through i18n-config), for the encrypted local file
  # (spec #564). cargo-i18n replaced it with toml in
  # https://github.com/kellpossible/cargo-i18n/pull/176 (merged 2026-09-26,
  # unreleased); removed with the release that carries it. Agent decision of
  # #616, pending owner review.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, through age's i18n-embed-fl; removed by cargo-i18n#176's release" },
  # atomic-polyfill, unmaintained: heapless 0.7's `cas` feature, which
  # postcard 1.1's default `heapless-cas` turns on, and postcard is how the
  # phonenumber crate stores libphonenumber's metadata (#787, the page
  # formats' E.164). On every target the Products build for, which all have
  # native atomics, atomic-polyfill only re-exports `core`'s atomics. Removed
  # when phonenumber's postcard leaves heapless 0.7 or its `cas` feature.
  # Agent decision of #787, pending owner review.
  { id = "RUSTSEC-2023-0089", reason = "re-exports core atomics on every Product target; through phonenumber's postcard default heapless-cas; removed when that drops heapless 0.7's cas" },
]

# Only crates.io; a git or other registry source fails until it is listed
# here with its reason (STYLE.md, Dependencies).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# No mocking of owned code (ADR 0062, TESTING.md); httpmock stays allowed
# for true externals.
[[bans.deny]]
crate = "mockall"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "mockito"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "wiremock"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "faux"
reason = "mocks owned code (ADR 0062)"

[[bans.deny]]
crate = "mry"
reason = "mocks owned code (ADR 0062)"

# xtask codegen: begin, the crates under crates/foxhound/ (ADR 0087). Never edit by hand; run `xtask codegen`.
[[bans.deny]]
crate = "goodfetch-crawl"
wrappers = ["goodfetch-crawl", "goodfetch-dataset", "goodfetch-fetch-tier", "goodfetch-foxhound", "goodfetch-frontier", "goodfetch-session-pool", "goodfetch-sink", "goodfetch-sql-tab", "xtask"]
reason = "only Foxhound's crates and xtask depend on a crate under crates/foxhound/ (ADR 0087)"

[[bans.deny]]
crate = "goodfetch-dataset"
wrappers = ["goodfetch-crawl", "goodfetch-dataset", "goodfetch-fetch-tier", "goodfetch-foxhound", "goodfetch-frontier", "goodfetch-session-pool", "goodfetch-sink", "goodfetch-sql-tab", "xtask"]
