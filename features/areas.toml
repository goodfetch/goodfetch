# The owning area of each generated Feature (ADR 0072): every Feature of
# `kind` whose ID, after `<kind>:`, starts with `prefix` belongs to the area
# `number` of ADR 0037's table. The Feature check fails on a generated
# Feature no entry owns, or two do. Schema: `areas.schema.json`.

# The sample entries that carry `xtask codegen`'s pipeline (spec #130).
[[area]]
number = 1
kind = "operation"
prefix = "sample."

[[area]]
number = 1
kind = "event"
prefix = "sample."

[[area]]
number = 1
kind = "error"
prefix = "sample_"

[[area]]
number = 1
kind = "setting"
prefix = "sample."

[[area]]
number = 1
kind = "setting"
prefix = "crawl.sample_"

# Area 3, the engine runtime (spec #213): the engine's own operations, the
# Connection's Error codes and the formats it registers.
[[area]]
number = 3
kind = "operation"
prefix = "engine."

[[area]]
number = 3
kind = "error"
prefix = "protocol_version_unsupported"

[[area]]
number = 3
kind = "error"
prefix = "not_in_product"

[[area]]
number = 3
kind = "error"
prefix = "call_cancelled"

# The engine's own DNS resolver and Smart App Control's refusal (#260).
[[area]]
number = 3
kind = "error"
prefix = "name_not_resolved"

[[area]]
number = 3
kind = "error"
prefix = "name_lookup_failed"

[[area]]
number = 3
kind = "error"
prefix = "executable_blocked_by_smart_app_control"

[[area]]
number = 3
kind = "format"
prefix = "protocol"
