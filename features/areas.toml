# The owning area of each generated Feature (ADR 0072): every Feature of
# `kind` whose ID, after `<kind>:`, starts with `prefix` belongs to the area
# `number` of ADR 0037's table. The Feature check fails on a generated
# Feature no entry owns, or two do. Schema: `areas.schema.json`.

# The sample entries that carry `xtask codegen`'s pipeline (spec #130).
[[area]]
number = 1
kind = "operation"
prefix = "sample."

[[area]]
number = 1
kind = "event"
prefix = "sample."

[[area]]
number = 1
kind = "error"
prefix = "sample_"

[[area]]
number = 1
kind = "setting"
prefix = "sample."

[[area]]
number = 1
kind = "setting"
prefix = "crawl.sample_"

# Area 3, the engine runtime (spec #213): the engine's own operations, the
# Connection's Error codes and the formats it registers.
[[area]]
number = 3
kind = "operation"
prefix = "engine."

[[area]]
number = 3
kind = "error"
prefix = "protocol_version_unsupported"

[[area]]
number = 3
kind = "error"
prefix = "not_in_product"

[[area]]
number = 3
kind = "error"
prefix = "call_cancelled"

# The engine's own DNS resolver and Smart App Control's refusal (#260).
[[area]]
number = 3
kind = "error"
prefix = "name_not_resolved"

[[area]]
number = 3
kind = "error"
prefix = "name_lookup_failed"

[[area]]
number = 3
kind = "error"
prefix = "executable_blocked_by_smart_app_control"

[[area]]
number = 3
kind = "format"
prefix = "protocol"

# Area 3's Runs (spec #213, #215): the run operations, a crawl's start, their
# Error codes, run state's location and the run-state and Run index formats.
[[area]]
number = 3
kind = "operation"
prefix = "run."

[[area]]
number = 3
kind = "operation"
prefix = "crawl.start"

[[area]]
number = 3
kind = "error"
prefix = "run_"

[[area]]
number = 3
kind = "error"
prefix = "handler_"

[[area]]
number = 3
kind = "setting"
prefix = "run_state."

[[area]]
number = 3
kind = "format"
prefix = "run-"

# Area 3's Browser cache (#259): a missing build's Error codes, the download's
# progress event, the clean-up's setting and the cache's entry format.
[[area]]
number = 3
kind = "error"
prefix = "browser_not_installed"

[[area]]
number = 3
kind = "error"
prefix = "artifact_"

[[area]]
number = 3
kind = "event"
prefix = "browser_cache."

[[area]]
number = 3
kind = "setting"
prefix = "browser_cache."

[[area]]
number = 3
kind = "format"
prefix = "browser-cache"

# The Browser cache's commands (#259): `browsers install` and `browsers clean`.
[[area]]
number = 3
kind = "command"
prefix = "browsers."

# The hidden Attached-engine entry of both executables, which an SDK starts
# (spec #213).
[[area]]
number = 3
kind = "command"
prefix = "attached-engine"
