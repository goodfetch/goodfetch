# The owning area of each generated Feature (ADR 0072): every Feature of
# `kind` whose ID, after `<kind>:`, starts with `prefix` belongs to the area
# `number` of ADR 0037's table. The Feature check fails on a generated
# Feature no entry owns, or two do. Schema: `areas.schema.json`.

# The sample entries that carry `xtask codegen`'s pipeline (spec #130).
[[area]]
number = 1
kind = "operation"
prefix = "sample."

[[area]]
number = 1
kind = "event"
prefix = "sample."

[[area]]
number = 1
kind = "error"
prefix = "sample_"

[[area]]
number = 1
kind = "setting"
prefix = "sample."

[[area]]
number = 1
kind = "setting"
prefix = "crawl.sample_"

# Area 3, the engine runtime (spec #213): the engine's own operations, the
# Connection's Error codes and the formats it registers.
[[area]]
number = 3
kind = "operation"
prefix = "engine."

[[area]]
number = 3
kind = "error"
prefix = "protocol_version_unsupported"

[[area]]
number = 3
kind = "error"
prefix = "not_in_product"

[[area]]
number = 3
kind = "error"
prefix = "call_cancelled"

[[area]]
number = 3
kind = "format"
prefix = "protocol"

# Area 3's Runs (spec #213, #215): the run operations, a crawl's start, their
# Error codes, run state's location and the run-state and Run index formats.
[[area]]
number = 3
kind = "operation"
prefix = "run."

[[area]]
number = 3
kind = "operation"
prefix = "crawl.start"

[[area]]
number = 3
kind = "error"
prefix = "run_"

[[area]]
number = 3
kind = "error"
prefix = "handler_"

[[area]]
number = 3
kind = "setting"
prefix = "run_state."

[[area]]
number = 3
kind = "format"
prefix = "run-"

# Area 3's Browser cache (#259): a missing build's Error codes, the download's
# progress event, the clean-up's setting and the cache's entry format.
[[area]]
number = 3
kind = "error"
prefix = "browser_not_installed"

[[area]]
number = 3
kind = "error"
prefix = "artifact_"

[[area]]
number = 3
kind = "event"
prefix = "browser_cache."

[[area]]
number = 3
kind = "setting"
prefix = "browser_cache."

[[area]]
number = 3
kind = "format"
prefix = "browser-cache"

# Area 3's settings (#225): `config.explain`, the refusals of a setting, the
# Operator policy's and user configuration's formats, and the keys the
# runtime itself waits on or resolves (ADR 0059).
[[area]]
number = 3
kind = "operation"
prefix = "config."

[[area]]
number = 3
kind = "error"
prefix = "setting_"

[[area]]
number = 3
kind = "format"
prefix = "operator-policy"

[[area]]
number = 3
kind = "format"
prefix = "user-configuration"

[[area]]
number = 3
kind = "setting"
prefix = "network."

[[area]]
number = 3
kind = "setting"
prefix = "timeout."

[[area]]
number = 3
kind = "setting"
prefix = "crawl.retry."

[[area]]
number = 3
kind = "setting"
prefix = "crawl.handler."

# The keys #225 declares for the areas that build what they shape, each with
# its area first (ADR 0083): Security and egress (4), Site access (5),
# Collection (6).
[[area]]
number = 4
kind = "setting"
prefix = "tls."

[[area]]
number = 4
kind = "setting"
prefix = "secrets."

[[area]]
number = 5
kind = "setting"
prefix = "consent."

[[area]]
number = 5
kind = "setting"
prefix = "wall."

[[area]]
number = 5
kind = "setting"
prefix = "filter_lists."

[[area]]
number = 5
kind = "setting"
prefix = "session."

[[area]]
number = 5
kind = "setting"
prefix = "paid_fetch."

[[area]]
number = 6
kind = "setting"
prefix = "delivery."

[[area]]
number = 6
kind = "setting"
prefix = "webhook."
