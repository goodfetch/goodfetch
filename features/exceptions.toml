# Features no pinned test proves (ADR 0072; TESTING.md, Exceptions): each is
# excepted, never tested, with its evidence (`manual`, `live`, `check` or
# `none`), the reason, and a link to where it is checked. A `check` exception
# is a story met by repository configuration and checked by a named CI job or
# gate step; its link names the workflow file and the job id, or the gate's
# script (ci/pre-merge.sh, which `just merge` runs, ADR 0135).

[[exception]]
feature = "story:1-37"
evidence = "check"
reason = "The workspace's `rust-version` is the latest stable minus two, and the full gate's msrv step builds the workspace with that toolchain (`just msrv`); the Pre-merge suite proves the build refuses an API stabilized after it."
link = "ci/pre-merge.sh"

[[exception]]
feature = "story:1-49"
evidence = "check"
reason = "One repository holding every surface is its layout; lint and cargo metadata run over the whole workspace in every gate, in the hosted tier's lint job or on the gate host."
link = ".github/workflows/pull-request.yml#lint"

[[exception]]
feature = "story:1-50"
evidence = "check"
reason = "`just` is the entry point for every suite and gate CI runs: `just merge` gates through `just pre-merge`, and the hosted tier's lint and quick jobs run each step they are given through `just pre-merge quick`. The plan and all-green jobs call the `xtask` commands those recipes call, since each reads the run's own context."
link = ".github/workflows/pull-request.yml#quick"

[[exception]]
feature = "story:1-59"
evidence = "check"
reason = "Lint runs formatting, Clippy, cargo-deny (licenses, bans, sources, each Product's bans), cargo-shear, typos, zizmor, oxlint and ruff; the gate's audit step runs cargo-deny's and cargo-audit's advisories and OSV-Scanner over npm's and PyPI's, and the full gate the MSRV build; the Pre-merge suite runs cargo-nextest and proves each gate on a fixture that breaks it."
link = "ci/pre-merge.sh"

[[exception]]
feature = "story:1-60"
evidence = "check"
reason = "The full gate runs cargo-hack over every feature combination of `goodfetch-collie` and `goodfetch-foxhound` (`just feature-combinations`), once they exist; the Pre-merge suite proves it refuses two features that break together."
link = "ci/pre-merge.sh"

[[exception]]
feature = "story:1-61"
evidence = "check"
reason = "The full gate runs Miri on the modules ci/miri.toml opts in (`just miri`); none opts in yet, so it runs nothing, and the first opt-in adds Miri's toolchain to the CI image and a proof."
link = "ci/pre-merge.sh"

[[exception]]
feature = "story:1-63"
evidence = "check"
reason = "Only the cache-warming job on `main` mounts the cache folder writable; pull-request jobs mount it read-only (ADR 0135)."
link = ".github/workflows/cache-warming.yml#warm"

[[exception]]
feature = "story:1-66"
evidence = "check"
reason = "rnd/README.md carries the archive banner, and the lab job runs only when rnd/ changes and is not among the required checks."
link = ".github/workflows/lab.yml#lab"

[[exception]]
feature = "story:1-71"
evidence = "check"
reason = "zizmor's hash-pin policy runs on every workflow in lint, and the Pre-merge suite proves it refuses an Action pinned by tag."
link = "ci/pre-merge.sh"

[[exception]]
feature = "story:1-77"
evidence = "check"
reason = "ci/repository-files.sh, in lint, checks SECURITY.md's required sections and terms."
link = ".github/workflows/pull-request.yml#lint"

[[exception]]
feature = "story:1-100"
evidence = "check"
reason = "ci/repository-files.sh, in lint, checks that both licence files name the Goodfetch contributors and the trademark policy exists."
link = ".github/workflows/pull-request.yml#lint"

[[exception]]
feature = "story:1-105"
evidence = "check"
reason = "`just quick`, `just pre-merge` and `just release` list the parts they could not run on their host, with the reason, even when a part fails; the hosted tier runs each gate step as its own job, which lists the parts it skipped."
link = ".github/workflows/pull-request.yml#quick"

[[exception]]
feature = "story:1-106"
evidence = "none"
reason = "Not built: no M1 ticket runs a pull request's new and changed tests 20 times yet (TESTING.md, Before merge). The order is already random and seeded from the tree under test; the 20 runs need their own ticket under spec #130."
link = "https://github.com/goodfetch/goodfetch/issues/130"

[[exception]]
feature = "story:1-109"
evidence = "none"
reason = "Not built yet: the Feature check and the in-diff mutation report are #321's."
link = "https://github.com/goodfetch/goodfetch/issues/321"

[[exception]]
feature = "story:2-41"
evidence = "manual"
reason = "A review rule no test reaches: the pull request that adds a feature also adds the Proving ground page or task its test needs, which the review checklist's item 20 asks of every pull request (ADR 0032)."
link = "docs/testing/review-checklist.md"

[[exception]]
feature = "error:browser_host_outdated"
evidence = "none"
reason = "Declared for ADR 0069's exit-code table (#1188), but nothing raises it yet: the engine settles on the lower minor with a Browser host, and fails a Session that needs more with this code, in #755, whose Browser host cases test it and remove this exception."
link = "https://github.com/goodfetch/goodfetch/issues/755"

[[exception]]
feature = "error:browser_host_unreachable"
evidence = "none"
reason = "Declared with the missing Error codes (#2949), but nothing raises it yet: an operator's hosted Browser host whose link is lost fails the call with this code in #756, whose test removes this exception."
link = "https://github.com/goodfetch/goodfetch/issues/756"

[[exception]]
feature = "error:challenge_unsolved"
