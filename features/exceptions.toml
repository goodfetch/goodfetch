# Features no pinned test proves (ADR 0072; TESTING.md, Exceptions): each is
# excepted, never tested, with its evidence (`manual`, `live`, `check` or
# `none`), the reason, and a link to where it is checked. A `check` exception
# is a story met by repository configuration and checked by a named CI job;
# its link names the workflow file and the job id.

[[exception]]
feature = "story:1-49"
evidence = "check"
reason = "One repository holding every surface is its layout; the Quick job's lints and cargo metadata run over the whole workspace on every pull request."
link = ".github/workflows/pull-request.yml#quick"

[[exception]]
feature = "story:1-50"
evidence = "check"
reason = "`just` is the entry point CI calls: every job of the pull-request tier runs a `just` recipe."
link = ".github/workflows/pull-request.yml#quick"

[[exception]]
