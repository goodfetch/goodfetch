# Features no pinned test proves (ADR 0072; TESTING.md, Exceptions): each is
# excepted, never tested, with its evidence (`manual`, `live`, `check` or
# `none`), the reason, and a link to where it is checked. A `check` exception
# is a story met by repository configuration and checked by a named CI job;
# its link names the workflow file and the job id.

[[exception]]
feature = "story:1-37"
evidence = "check"
reason = "The workspace's `rust-version` is the latest stable minus two, and the supply-chain job builds the workspace with that toolchain on every pull request (`just msrv`); the Pre-merge job proves the build refuses an API stabilized after it."
link = ".github/workflows/pull-request.yml#supply-chain"

[[exception]]
feature = "story:1-49"
evidence = "check"
reason = "One repository holding every surface is its layout; the Quick job's lints and cargo metadata run over the whole workspace on every pull request."
link = ".github/workflows/pull-request.yml#quick"

[[exception]]
feature = "story:1-50"
evidence = "check"
reason = "`just` is the entry point for every suite and gate CI runs: the Quick, Pre-merge, visual and supply-chain jobs run `just` recipes (the Quick job `just quick all` in its two parts around the egress deny). The affected, perf and all-green jobs call the `xtask` commands those recipes call, since each splits a check around the deny or reads the run's own context."
link = ".github/workflows/pull-request.yml#quick"

[[exception]]
feature = "story:1-59"
evidence = "check"
reason = "The Quick job's lints run formatting, Clippy, cargo-deny (licenses, bans, sources, each Product's bans), cargo-shear, typos, zizmor, oxlint and ruff; the supply-chain job runs cargo-deny's and cargo-audit's advisories, pnpm audit, pip-audit and the MSRV build; the Pre-merge job runs cargo-nextest and proves each gate on a fixture that breaks it."
link = ".github/workflows/pull-request.yml#supply-chain"

[[exception]]
feature = "story:1-60"
evidence = "check"
reason = "The supply-chain job runs cargo-hack over every feature combination of `goodfetch-collie` and `goodfetch-foxhound` (`just feature-combinations`), once they exist; the Pre-merge job proves it refuses two features that break together."
link = ".github/workflows/pull-request.yml#supply-chain"

[[exception]]
feature = "story:1-61"
evidence = "check"
reason = "The supply-chain job runs Miri on the modules ci/miri.toml opts in (`just miri`); none opts in yet, so it runs nothing, and the first opt-in adds Miri's toolchain to the CI image and a proof."
link = ".github/workflows/pull-request.yml#supply-chain"

[[exception]]
feature = "story:1-63"
evidence = "check"
reason = "Only the cache-warming job on `main` mounts the cache folder writable; pull-request jobs mount it read-only (ADR 0135)."
link = ".github/workflows/cache-warming.yml#warm"

[[exception]]
feature = "story:1-66"
evidence = "check"
reason = "rnd/README.md carries the archive banner, and the lab job runs only when rnd/ changes and is not among the required checks."
link = ".github/workflows/lab.yml#lab"

[[exception]]
feature = "story:1-71"
evidence = "check"
reason = "zizmor's hash-pin policy runs on every workflow in the Quick job, and the Pre-merge job proves it refuses an Action pinned by tag."
link = ".github/workflows/pull-request.yml#pre-merge"

[[exception]]
feature = "story:1-77"
evidence = "check"
reason = "ci/repository-files.sh, in the Quick job's lints, checks SECURITY.md's required sections and terms."
link = ".github/workflows/pull-request.yml#quick"

[[exception]]
feature = "story:1-100"
evidence = "check"
reason = "ci/repository-files.sh, in the Quick job's lints, checks that both licence files name the Goodfetch contributors and the trademark policy exists."
link = ".github/workflows/pull-request.yml#quick"

[[exception]]
feature = "story:1-105"
evidence = "check"
reason = "`just quick`, `just pre-merge` and `just release` list the parts they could not run on their host, with the reason, even when a part fails; CI runs their parts as separate steps and jobs, and its Quick job lists the parts it skipped."
link = ".github/workflows/pull-request.yml#quick"

[[exception]]
feature = "story:1-106"
evidence = "none"
reason = "Not built: no M1 ticket runs a pull request's new and changed tests 20 times yet (TESTING.md, Before merge). The order is already random and seeded from the tree under test; the 20 runs need their own ticket under spec #130."
link = "https://github.com/goodfetch/goodfetch/issues/130"

[[exception]]
feature = "story:1-109"
evidence = "none"
reason = "Not built yet: the Feature check and the in-diff mutation report are #321's."
link = "https://github.com/goodfetch/goodfetch/issues/321"

[[exception]]
feature = "story:2-41"
evidence = "manual"
reason = "A review rule no test reaches: the pull request that adds a feature also adds the Proving ground page or task its test needs, which the review checklist's item 20 asks of every pull request (ADR 0032)."
link = "docs/testing/review-checklist.md"

[[exception]]
feature = "error:browser_host_outdated"
evidence = "none"
reason = "Declared for ADR 0069's exit-code table (#1188), but nothing raises it yet: the engine settles on the lower minor with a Browser host, and fails a Session that needs more with this code, in #755, whose Browser host cases test it and remove this exception."
link = "https://github.com/goodfetch/goodfetch/issues/755"

[[exception]]
feature = "error:secret_unbound"
evidence = "none"
reason = "Declared with the Secret-provider driver (#615), but nothing raises it yet: a Secret placeholder with no binding raises it once placeholders are bound to Secret references and domains, in #654, whose test removes this exception."
link = "https://github.com/goodfetch/goodfetch/issues/654"

[[exception]]
feature = "exit:verdict_not_verified"
evidence = "none"
reason = "No engine path ends a Run with a Verdict other than `verified` yet, and a generated Run command cannot reach a Scripted Daemon that answers one, so the binary never exits `21`; Collie's executable's `exit_codes` unit tests map such a report to it in process. #1183 lets a generated command reach a Daemon, whose Scripted engine then answers `run.finish` with a `needs_review` report for a binary case that removes this exception."
link = "https://github.com/goodfetch/goodfetch/issues/1183"

[[exception]]
feature = "error:sample_crawl_refused"
evidence = "none"
reason = "A sample entry of `goodfetch-protocol`, which carries `xtask codegen`'s pipeline and has no behaviour to test; the area that defines the real contracts removes it, and this exception with it."
link = "https://github.com/goodfetch/goodfetch/issues/130"

