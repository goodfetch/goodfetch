# Area 1's user stories (spec #130), the declared `story:1-<id>` Features of
# ADR 0072. Each story's milestone is that of the ticket that finishes it; a
# story without a Journey carries ADR 0075's reason (`actor`, `part` or
# `reach`). The spec's issue keeps the full text; this copy is the one the
# Feature check reads. Never renumber or reuse an ID: a removed story stays
# with `status = "retired"` and a `reason`.

[[story]]
id = 1
title = "As a TypeScript developer, I want `npm install @goodfetch/collie` (or `@goodfetch/foxhound`) to install its Product's engine for my platform with no install script, so that `--ignore-scripts` and offline mirrors work."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 2
title = "As a Python developer, I want `pip install goodfetch-collie` (or `goodfetch-foxhound`) to give me a `py3-none` platform wheel holding its Product's engine, so that every supported CPython, free-threaded builds included, uses one wheel."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 3
title = "As a Rust developer, I want `cargo add goodfetch-collie` (or `goodfetch-foxhound`) to give me its Product's embeddable crate at the Product version, so that I use the same release as the SDK users."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 4
title = "As a Rust developer, I want the crate to fetch its Product's executable of its exact version from the release, pinned by digest, so that the Script sandbox works without V8 in my build."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 5
title = "As a user of any surface, I want every package of a release, both Products' included, to carry one Product version, so that I never need a compatibility matrix between the SDK, the executable and the Plugins, nor between Collie and the Foxhound that contains it (ADR 0090)."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 6
title = "As a macOS user who downloads a release archive in a browser, I want each Product's executable signed with Developer ID and notarized, with no `allow-jit` entitlement, so that Gatekeeper opens it without a quarantine workaround and the engine asks for no more than it needs."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 7
title = "As a Windows user with Smart App Control on, I want `goodfetch-collie.exe`, `goodfetch-foxhound.exe`, the filter broker, the Proving ground binary, every first-party Plugin executable and every file of the Goodfetch Chromium signed with Authenticode and timestamped, so that Windows runs them."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 8
title = "As a security-minded user, I want each artifact to carry a GitHub artifact attestation and Sigstore signature, so that I can check which workflow built it."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 9
title = "As a user of any binary channel (npm, PyPI, OCI, GitHub Release, installers, Homebrew), I want every channel to carry the same signed bytes, so that a digest I checked once holds everywhere."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 10
