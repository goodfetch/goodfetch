# Area 11's user stories (spec #604, Client surfaces, Collie, parts 1 and 2),
# the declared `story:11-<id>` Features of ADR 0072: every story of Collie's
# part, 1 to 299, with the flag the spec gives it inline. Each story's
# milestone is that of the earliest ticket that makes it tested; a story
# without a Journey carries ADR 0075's reason (`actor`, `part` or `reach`).
# The spec's issue keeps the full text; this copy is the one the Feature
# check reads. Foxhound's part adds its stories from 1001. Never renumber or
# reuse an ID: a removed story stays with `status = "retired"` and a
# `reason`.

[[story]]
id = 1
title = "As a developer, I want one package per language (`@goodfetch/collie` on npm, `goodfetch-collie` on PyPI, the `goodfetch-collie` crate) with `goodfetch_collie` as the Python and Rust module, so that I start with one install, no install script and no browser download until a call first needs one (ADRs 0024, 0090; SDK-01; P24, P51, K09)."
milestone = "M3 Browser automation"
journey = true
status = "active"

[[story]]
id = 2
title = "As a developer, I want `Collie.connect()` with no options to find or start the engine and finish `hello` before it returns, so that a missing binary or a refused version fails there with a message that names the fix (ADR 0078; P24, K09; G6)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 3
title = "As a developer, I want the connection to be the Product (`collie.start(…)`, `AsyncCollie` beside the sync `Collie` in Python, `goodfetch_collie::Collie` and `goodfetch_collie::blocking` in Rust), so that what I type matches the executable I installed and Foxhound's connection adds members under the same names (ADRs 0078, 0090, 0095; SDK-01, SDK-02)."
milestone = "M2 Client surfaces"
journey = false
not_journey = "part"
status = "active"

