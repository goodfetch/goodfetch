title = "As a Rust developer, I want `crawl.serve(&run).await` to answer the Run's Crawl requests with my handlers until the Run ends and return the Run report, and dropping that future to be my own stop (requests return to pending, no attempt counted), so that Rust has no loop of mine to pump (ADRs 0093, 0102)."
milestone = "M2 Client surfaces"
journey = false
not_journey = "part"
product = "foxhound"
status = "active"

[[story]]
id = 1101
title = "As a Rust developer, I want a handler to be `FnOnce(CrawlContext<P>) -> Fut + Clone + Send + Sync + 'a` with `Fut: Send` returning `Result<(), BoxError>`, `?` on any error ending the attempt as `handler_failed` while an SDK `Error` keeps its code, so that a crawl serves inside a multi-threaded web server (ADRs 0109, 0112; SDK-06)."
milestone = "M2 Client surfaces"
journey = false
not_journey = "part"
product = "foxhound"
status = "active"

[[story]]
id = 1102
title = "As a Rust developer, I want a panic in a handler to be caught by `serve` as `handler_failed` and a Hook's or login step's panic to be that function's own error, so that one bad handler never takes the process down (ADRs 0093, 0109)."
milestone = "M2 Client surfaces"
journey = false
