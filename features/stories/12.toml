title = "As a user, I want a crawl run's page to show its progress live: requests in flight with their phase, tier and attempt; why due requests wait, per reason, with the domains held, when each is next admitted and the setting behind the wait with its value and layer; each sitemap seed's progress; whether a keep-alive crawl is idle; the handlers running against their concurrency and the governor's level; and the program's status message, so that a slow crawl explains itself (ADRs 0102, 0118; ADR 0037 / RT-15)."
milestone = "M1 Core"
journey = true
status = "retired"
reason = "The Console left both Products (ADR 0137), and this story was its alone."
product = "foxhound"

[[story]]
id = 219
title = "As a user, I want a live, filterable log of request outcomes, read from committed state without slowing the crawl, each with its `attempts` and the error of each failed attempt, a `handler_failed` or `hook_failed` showing my exception's type, message and stack (none from Rust, whose type reads `BoxError` or `panic`) and, for `hook_failed`, its stage, Hook, Label and wrapped code, so that I watch failures as they happen and fix my handler (ADRs 0079, 0102, 0104, 0109, 0117)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
product = "foxhound"

