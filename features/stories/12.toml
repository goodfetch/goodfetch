# Area 12's user stories (specs #591 and #592, Console, Collie), the
# declared `story:12-<id>` Features of ADR 0072. Each story's milestone is
# that of the ticket that finishes it; a story without a Journey carries ADR
# 0075's reason (`actor`, `part` or `reach`). The spec's issue keeps the full
# text; this copy is the one the Feature check reads. It holds the stories a
# test declares so far; the others join with the tickets that declare them.
# Never renumber or reuse an ID: a removed story stays with
# `status = "retired"` and a `reason`.

[[story]]
id = 1
title = "As a user, I want `goodfetch-collie console` to start my major's Daemon if none runs, open my browser on the Console and sign me in once through a token passed in the URL fragment and swapped for an `HttpOnly` cookie, so that I see my runs with no sign-in step on my own machine (ADR 0024; ADR 0037 / CN-03; J-001)."
milestone = "M1 Core"
journey = true
status = "active"

[[story]]
id = 3
title = "As a user with two majors installed, I want each major's Console on its own port, so that a 1.x and a 2.x project never share or restart each other's Console (area 3 story 22)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 5
title = "As a user, I want my Console sign-in to survive Daemon restarts and expire after 30 idle days, revocable, so that I am not asked to sign in at every restart (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 10
title = "As a user, I want the Runs screen to list every run of my user and major from the Run index, whichever engine or Product ran it, so that one place shows all my work (ADRs 0031, 0098; ADR 0037 / CN-03)."
milestone = "M1 Core"
journey = true
status = "active"

[[story]]
id = 11
title = "As a user, I want each run's Lifecycle, Verdict and Completeness shown as three separate values, so that \"finished but needs review\" or \"verified but incomplete\" reads as it is (ADR 0029)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 12
title = "As a user, I want to filter and sort runs by tags, Recipe, Schedule and occurrence, trigger, Product, each axis, start and end time, and a text match on Run ID, tags and Recipe, Watch runs hidden unless the filter asks for them, with the filter kept in the address, so that I find a run and share the view (ADRs 0036, 0117; ADR 0037 / CN-04)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 13
title = "As a user, I want a row whose run file is gone shown as missing and a run discarded on purpose shown as erased, never dropped, so that the list never lies about what existed (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 14
title = "As a user, I want a live run's row and page to update as its axes, progress and status message change, without reloading, so that I follow it as it runs (ADRs 0031, 0102; ADR 0037 / RT-15)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 16
title = "As a developer, I want the `consoleUrl` of a Run report to open that run's page, so that a CI log links straight to what happened (ADR 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 18
title = "As a user, I want a run marked *uncapped* when it can spend money with nothing capping it, whether or not a Model allowance is set, so that unbounded spending is visible (ADRs 0041, 0107)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 19
title = "As a user, I want a run's page to show its writer (live or none), its run epoch and last Checkpoint, each Human pause waiting, and the worst storage level among the filesystems it writes to, with that folder and its free space, so that a slow run explains itself (ADRs 0102, 0122)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 20
title = "As a user, I want a live run's page to offer stop and checkpoint, and an interrupted run's page to show the resume command, so that I act on a run from where I see it (ADRs 0031, 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 23
title = "As a user, I want one \"Needs you\" list across every run in the index and the stores beside it, counted in the side menu, so that nothing waiting for me is missed (ADR 0031; pain 18)."
milestone = "M1 Core"
journey = true
status = "active"

[[story]]
id = 25
title = "As a user, I want \"Needs you\" to list a filesystem at the `low` or `critical` storage level with its folder, and each run stopped by storage, so that I free space and resume (ADR 0122; pitfall O03)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 26
title = "As a user, I want \"Needs you\" to list the domains that showed a consent wall or a Wall, offering to add them to `consent_domains` or `wall_domains` for the next run with a plain warning of what I take on, never offering a domain in `wall_denied_domains` for `wall_domains` and never offering `wall_refetch_domains`; and I want a consent-wall or Wall Human pause to offer \"for this run\" or \"always for this domain\", and both \"read past\" and \"accept\" when one pause covers both, on a Daemon with accounts only the operator role giving either answer and \"always\" asking for step-up, so that I decide knowingly (ADRs 0048, 0052)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 32
title = "As a user, I want \"Needs you\" items to disappear as they are resolved, by me, by another person or by the run, so that the list is never stale (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 94
title = "As a user, I want Engine & settings to show every effective value with its layer and lock, as `config explain` does, so that I see where each value comes from (ADR 0031; J-009; ADR 0037 / RT-22)."
milestone = "M1 Core"
journey = true
status = "active"

[[story]]
id = 99
title = "As a user, I want Usage against each Limit by scope (install, Daemon, person, named token, Client connection), each Limit showing who set it, and replayed responses counted apart from fetches, so that I see what is left (ADRs 0041, 0105)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 100
title = "As a user, I want to raise a Limit only in the Console or an interactive CLI prompt, raising a run's Limit resuming a Recipe run in the Daemon or marking an SDK script's run as waiting for its script, with **Copy resume command**, so that an agent stopped by a cap cannot lift it (ADRs 0029, 0041, 0102)."
milestone = "M1 Core"
journey = true
status = "active"

[[story]]
id = 102
title = "As a user, I want a setting only Foxhound honours listed as Foxhound's, never hidden, on a Collie engine, so that a shared configuration file reads honestly (ADR 0087)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 109
title = "As a user of a single-user local Daemon, I want my OS user to be the person, with no sign-in beyond the cookie, and the Audit log to record that user and the surface, so that one person's machine needs no account (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 110
title = "As a person, I want sign-in rate-limited, cookies `SameSite=Strict` and the `POST` fallback carrying a CSRF token, so that the Console resists the usual web attacks (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 111
title = "As an operator, I want rotating the Console key to sign everyone out, and each sign-in revocable, so that a lost laptop's sign-in ends (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 123
title = "As a user, I want the Console to resubscribe from its last position after a reconnect, and to get a fresh snapshot when the engine no longer holds it, never missing a Record, an axis change or a \"Needs you\" item, so that a dropped connection loses nothing (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 124
title = "As a user behind a proxy that blocks WebSockets, I want the Console to fall back to Server-Sent Events plus `POST`, so that it works on any network (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 125
title = "As a user, I want the tab read-only under a banner while disconnected, reconnecting by itself, so that I never act on a stale view (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 127
title = "As a user, I want scraped HTML, screenshots and DOM snapshots served from a separate origin in sandboxed frames with no cookies, so that a hostile page can never act as the Console (ADR 0031)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 128
title = "As a user, I want the Console under a strict Content Security Policy (its own scripts only, no inline code or `eval`, Trusted Types, no third-party or telemetry call), `frame-ancestors 'none'` except the embed endpoint for granted origins, `Referrer-Policy: no-referrer`, COOP and CORP, so that the Console is hard to attack and calls nowhere (ADRs 0031, 0043)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 129
title = "As a security reviewer, I want every Console route's headers checked in CI and the Proving ground's pages that try to escape the content origin run against it, so that the protections hold (ADRs 0031, 0067)."
milestone = "M1 Core"
journey = false
not_journey = "actor"
status = "active"
