# Area 14's user stories (spec #586, Cloud-readiness contracts), the declared
# `story:14-<id>` Features of ADR 0072. Each story's milestone is that of the
# ticket that finishes it; a story without a Journey carries ADR 0075's
# reason (`actor`, `part` or `reach`). The spec's issue keeps the full text;
# this copy is the one the Feature check reads. It holds the stories a test
# declares so far; the others join with the tickets that declare them. Never
# renumber or reuse an ID: a removed story stays with `status = "retired"`
# and a `reason`.

[[story]]
id = 15
title = "As a Foxhound developer, I want my program's runs to land on Foxhound's engine, since my program may call Foxhound's operations at any point (ADR 0096)."
milestone = "M1 Core"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 17
title = "As a Console user, I want a run I start from the Console to land on Foxhound's engine when its target names anything only Foxhound carries (an operation, a setting key, a Plugin kind or a Hook stage), and on Collie's otherwise, so that I never pick a Product by hand (ADR 0096)."
milestone = "M1 Core"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 18
title = "As a Recipe author, I want my Recipe's manifest, not its settings or steps, to decide its Product wherever it is started, a Recipe that names Foxhound landing on Foxhound's engine whoever starts it, so that a Recipe runs on the Product it was written for (ADR 0096)."
milestone = "M1 Core"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 21
title = "As Goodfetch Cloud's maintainers, I want the routing rule as one function in `goodfetch-protocol` that my gateway calls, so that my gateway and the Stub gateway cannot route differently."
milestone = "M1 Core"
journey = false
