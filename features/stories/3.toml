[[story]]
id = 154
title = "As a developer or a person reading a Run, I want its Run report to hold its three axes with their reasons, its stop reason with its details (a Limit with its scope, scope ID and period reset, `timeout`, `abort` with who, `engine_lost`, `resources` with the resource and folder), its Usage, every setting that weakened it, its Plan, Operator policy version, settings, Plugins, warnings, recording, Checkpoint, uncertain Effects and times, and for a crawl how its requests ended, its Records, Sinks, learned rules and sitemaps, a part no area supplied being absent rather than zero, so that nobody has to recompute what a Run did (ADR 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 155
title = "As a user, I want each warning an area hands over (a fingerprint, browser build, human input, proxy exit or filter vendor of area 8, Foxhound's trap links off, throttled CPU, low storage, a degraded Politeness store, Clean-up rules older than 14 days, a failed write of the Plan file or recording at the Run's end, an unavailable baseline, a Plugin's figures) in the Run report with the Sessions or folder it concerns, and a code a newer engine sends kept as it is, so that every weakening I did not choose is in front of me (ADRs 0102 and 0116)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 156
title = "As a developer, I want the Run report to say why the call did nothing (`nothingDone`): the start found the Run ended, no seed of a crawl reached a handler, or a resume found nothing left, so that I never mistake an empty Run for a done one (ADR 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 157
title = "As a developer, I want `run.usage` to give my Run's model Usage, browser time, proxy bytes, paid solves and Paid fetches, the Limits that apply to it with what is left of each and the uncapped mark, a Collie engine keeping a Foxhound scope it receives as an unknown value, so that my program reads its spending while it runs (ADR 0101)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 158
title = "As a site owner, I want a domain's backoff drawn with decorrelated jitter, each wait between `politeness.backoff.initial` and three times the previous one (the first between `initial` and three times it), never below `initial` nor above `politeness.backoff.max`, so that domains behind one origin that back off together come back apart (ADR 0118)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 159
title = "As a site owner, I want my `Retry-After`, in seconds or as an HTTP-date measured against my response's `Date`, waited out by every run on my domain key, past `politeness.backoff.max` and up to `politeness.retry_after.max`, a value that does not parse, `0` or a date already past adding no wait, so that a crawl sends me nothing before the time I asked (ADR 0118)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 160
title = "As a user, I want a request that a site's `Retry-After` holds further away than `politeness.retry_after.max`, the request whose response asked and each one admitted to the domain meanwhile, to end `failed` with `response_unavailable`, unsent and never waited for, its error carrying `retryAfter` and a `fix` naming the setting, a Collie engine refusing the key with `not_in_product`, so that one site's maintenance window never holds my crawl for hours and `run.retry_failed` re-admits those requests once the site is back (ADR 0118)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 161
title = "As a developer, I want `run.progress` to answer my Run's progress at once, with its writer, run epoch, last Checkpoint time, Human pauses and status message, then the latest value after each change, a flood of changes coalesced, until a last value that says how the Run ended, so that I follow a Run without polling or a periodic status line (ADR 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 162
title = "As a crawl developer, I want my crawl's progress to say why due requests wait, one group per reason (`domain_concurrency`, `domain_delay`, `crawl_delay`, `backoff`, `robots_txt`, `handler_concurrency`, `governor`, `session`, `human_pause`) with its count, a fixed number of the domains it holds with when each is next admitted, and the setting behind the wait with its value and layer, a reason a newer engine sends kept, so that a slow crawl is never a count with no reason (ADRs 0102 and 0118)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 163
title = "As a developer, I want a Human pause beginning and ending each to give my Run's progress a new value, the pause showing its Session and page, its reason, its `until`, whether the program or the engine raised it (and the engine's step), since when and its deadline, so that a waiting person is never a silent hang (ADRs 0092 and 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 164
title = "As a developer, I want the progress of a Run whose engine died to say `writer: none`, and a start with its Run ID to resume it, so that I know a Run waits for me rather than for its engine (ADR 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 165
title = "As a developer holding only a Run's ID, I want its progress, its report, its Run trace, its Key-value store's reads and a crawl's outcomes and Records read through the engine the Run index names as its owner, or from its run state when no engine works it, never taking or blocking its writer lock, a live Run's report arriving at its end without ending it and an interrupted one's raising `run_interrupted`, so that a monitoring program or an export reads another program's Run safely (ADR 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 166
title = "As a developer starting a Run under an ID I used before, I want the start to begin it when no such Run exists (`new`), resume an interrupted one from its committed state (`resumed`) and answer a finished one as it ended with no handler called (`ended`), so that a retried script never gets a second Run nor restarts one by accident (ADR 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 167
title = "As a developer, I want a start under a Run ID to fail with `run_in_use` while a writer runs that Run, with `run_conflict` listing each difference when it began with other inputs or another caller, with `limit_reached` naming the Limit while a Limit that stopped it stays used up, and with `run_state_unavailable` when the Run index lists it but its state is missing or unreadable, never starting it afresh, so that a refused start tells me why (ADR 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 168
title = "As a developer, I want each Record my handler is about to commit, those it pushed and then those it answered, to go through the crawl's `before_record_commit` Hooks in code its Label and Dataset reach, in the order I declared them, so that one place checks or stamps every Record before it commits (ADR 0104)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 169
title = "As a developer, I want each Hook call bounded by `timeout.hook`, which a Label may set for its requests, and a Hook past it cancelled and its attempt failed with `deadline_exceeded` naming the setting and the stage, so that a stuck Hook never holds a request (ADR 0104)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 170
title = "As a developer, I want a Hook that raises to fail its attempt with `hook_failed` naming the stage, the Hook and the Label, its own exception retried only under `crawl.retry.handler_failed`, which a Label may set, and a Goodfetch Error code raised inside retried as its flag says, both drawing on `crawl.retry.max`, so that a Hook's failure is retried as a handler's is (ADR 0104)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 171
title = "As a developer, I want a `before_record_commit` Hook that fails to discard everything its attempt staged, its Records, enqueues and Key-value store writes, so that a refused Record never commits part of an attempt (ADRs 0003 and 0104)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 172
title = "As a developer, I want a start under my Run's ID or a resume that changes a key the settings schema fixes for the Run's life, such as `crawl.scope.*` or `crawl.keep_url_fragment`, refused with `setting_not_applicable` naming the key and a new Run, while a resume that leaves the key out goes on, so that a Run's committed results never mix two scopes (ADRs 0102 and 0120)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 173
title = "As a user, I want a start from any Client that carries a Schedule's reserved tag, `goodfetch.schedule`, `occurrence`, `trigger`, `creator` or `role`, refused with `invalid_params` naming the tag before any Run begins, so that the Runs list never shows a Schedule that did not start the Run (ADR 0036)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 174
title = "As a developer, I want a `detached` start on an Attached or linked engine, or of a Run the program serves by a handler or a Hook, refused with `detach_unsupported` whose `fix` names `engine: daemon` or the key that gives the Run its handler, and a code-free crawl started detached on the Daemon to go on after my Connection ends, so that work meant to outlive my program never dies with it, nor waits on a program gone (ADRs 0078 and 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 175
title = "As a developer, I want a resume that changes a setting the Run ran with, set to another value or left out to fall back to a lower layer, to apply it from the resume on and record it in the Run trace with its key, layer and the resume's run epoch, and with no value a credential could hide in, so that the trace says which settings each part of a resumed Run ran under (ADR 0102)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 176
title = "As a developer, I want a resume to count each attempt its committed state shows in flight as `handler_lost` against `crawl.retry.max`, and none that my program's own stop returned to pending, at whichever Durability level the Run uses: every attempt in flight at `full`, `fast` and `periodic`, only those a written batch holds at `batch`, and none at `off`, where a crash discards the run file and the Run starts again, so that a crash costs a request a retry only for an attempt it lost (ADRs 0093, 0102 and 0142)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 177
title = "As a developer, I want a start under a Run's ID to answer as the start table says whatever came before it: `new` for a Run with no state, `run_conflict` for other inputs, `setting_not_applicable` for another value of a key its run file keeps fixed, then `run_in_use`, `resumed` or `ended` for a live, interrupted or finished Run, and `run_state_unavailable` for state it cannot read, through pauses, finishes, clean stops, crashes and power cuts, so that a crash never turns a Run into another one or starts it twice (ADRs 0060, 0102 and 0138)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
