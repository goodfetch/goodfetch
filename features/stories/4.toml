# Area 4's user stories (specs #563 and #564, Security and egress, Collie,
# and #565, Foxhound's part, its stories numbered after Collie's), the
# declared `story:4-<id>` Features of ADR 0072, every story of the specs as
# their Further Notes give them: each story's milestone is that of the
# ticket that finishes it, and a story without a Journey carries ADR 0075's
# reason (`actor`, `part` or `reach`). The specs' issues keep the full text;
# this copy is the one the Feature check reads. Never renumber or reuse an
# ID: a removed story stays with `status = "retired"` and a `reason`.

[[story]]
id = 1
title = "As a developer, I want every request a page makes (navigations, subresources, workers, service workers, WebSockets, WebRTC and `javascript:` URLs) judged by my run's domain policy in the engine, a request the policy cannot judge being blocked, so that no page, script or model reaches a site I did not allow (ADR 0014, SC-04, P15)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 2
title = "As a developer, I want the policy as two settings, `egress.allowed_domains` (every host by default) and `egress.blocked_domains`, each entry matching its host and their subdomains, a blocked entry winning, so that I state it once for a run (shape)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 3
title = "As a developer, I want a call whose navigation or request the policy refuses to raise `egress_refused`, naming the URL, the rule that refused it and the setting that would allow it, and a refused request no call waits on to be a `requestfailed` event recorded in the Run trace, so that a refusal is never a timeout (G1, G6) (shape)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 4
title = "As the person behind an agent, I want a Client acting for a model, and a Recipe, able only to narrow the domain policy that lower layers set, so that a prompt-injected agent cannot widen where it may go (G5) (shape)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 5
title = "As a developer, I want a redirect of any status or kind re-checked at every hop, and one to `file:`, `data:`, `javascript:` or `gopher:` always refused, so that a redirect cannot carry a page past the policy (ADR 0017)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 6
title = "As a developer on my own machine, I want my own code's `goto` to a `file:` URL to work on a local engine, and the same refused for a Client acting for a model, a Recipe run and any Daemon with accounts, so that a model never reads my files through a page (ADRs 0056, 0089) (shape)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 7
title = "As a developer, I want a site's service workers on Chromium attached before they run and their own requests judged like a page's subresources, and no service worker registered on Firefox or WebKit, where nothing could judge them, so that a service worker never slips past the policy (ADR 0121)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 8
title = "As a developer running Collie on a cloud VM, I want addresses a page can reach refused when they fall in a private, loopback, link-local, cloud-metadata, IPv4-mapped or other IANA special-purpose block that is not globally reachable, judged on the address the connection uses, so that no page reaches my intranet or the metadata service (ADR 0017, SC-04)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 9
title = "As a developer, I want IPv6 forms that embed an IPv4 address (IPv4-mapped, NAT64, 6to4, Teredo) judged by the address they embed, and a zone ID refused, so that an encoding never hides a private address (ADR 0067)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 10
title = "As a developer, I want every browser Session the engine launches to reach the network through the engine's egress relay, which checks the address it connects to, so that a DNS answer that changes between the check and the connection (rebinding) cannot reach a private address (ADR 0017) (shape)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 11
title = "As a developer testing against a local site or an intranet, I want `egress.private_ranges` to allow the ranges and hosts I list, recorded in the Audit log and the Run report, a metadata address reached only when listed by its exact address, so that a wide range never opens the metadata service by accident (ADRs 0016, 0017) (shape)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 12
title = "As a developer using an upstream proxy, I want the engine to check the host and any literal address, resolve the name itself before sending and refuse a private answer, so that the proxy is not a way around the check (ADR 0017)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 13
title = "As a developer, I want `resolve`'s mapping applied before every lookup and the mapped address still judged by the check, so that pointing a host at a test server never bypasses it (ADR 0059)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 14
title = "As a developer, I want a Borrowed browser held to the policy by interception, each host resolved in the engine and private ranges refused, and the rebinding gap that remains recorded in Provenance, so that I know what a browser I lent the engine is protected from (ADR 0056)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 15
title = "As a developer, I want a `cdp_url` from my own code or the CLI allowed on loopback except on an Exposed Daemon, one set in Operator policy or configuration treated as an operator-configured endpoint, and any other private address refused with `cdp_url_not_allowed`, so that a model cannot point the engine at an internal debugging port (ADRs 0056, 0115)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 16
title = "As an operator, I want endpoints I configure (Model providers on localhost, Secret providers, proxies, Notification webhooks) allowed on private ranges locally, and `egress.no_private_endpoints`, set in Operator policy, to refuse them where tenants share a network, so that a tenant's webhook URL never reaches a cloud's internal network (ADR 0017) (shape)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 17
title = "As a developer measuring speed, I want to switch the resolved-address check off for one run, recorded in the Audit log, the Run report and one warning, and lockable by Operator policy, so that a benchmark can measure its cost without hiding that it ran unprotected (ADR 0016)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 18
title = "As a developer, I want a page with a raw CDP session attached, a Lent page, or a page of a Borrowed browser other code drives to refuse every secret with `secret_input_refused`, its results marked unguarded, and each attach recorded in the Audit log under its own token, so that code outside the engine never receives what the engine types (ADRs 0017, 0089, 0092)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 19
title = "As a developer lending a page to Playwright, Puppeteer or Browser Use, I want the endpoint to refuse a new browser context, the `Extensions` domain, ignoring certificate errors, crashing the browser and exposing the protocol to the page, with `cdp_command_refused`, so that the library can neither bypass the egress relay nor break the engine's browser (ADR 0089)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 20
title = "As an operator of a Daemon with accounts, I want a raw CDP client or a Lent page refused any command that reads a file on the browser's machine by path, so that one person's program never reads another's files (ADR 0089)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 21
title = "As a developer, I want every endpoint the engine opens (the Daemon's socket and WebSocket, the HTTP listener, MCP over HTTP, the Live view, raw CDP, the Attached engine's private endpoint) bound to loopback by default, checking `Host` and `Origin`, and requiring a random token that never travels in a query string, so that a web page I visit cannot drive my engine (ADR 0017)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 22
title = "As a developer, I want raw CDP and Lent page tokens issued per attach, short-lived and revoked when the attach ends, so that a token a library logged cannot reconnect later (ADRs 0017, 0089)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 23
title = "As a developer, I want the engine to reach the browsers it launches over a pipe, never a debugging port, so that no local process can read my cookies through one (ADR 0017)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 24
title = "As an operator, I want every refused token, `Host` or `Origin` recorded in the Audit log, so that I see who tried (ADR 0016)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 25
title = "As an operator exposing a Daemon, I want it to terminate TLS itself from certificate files it reloads when they change, and `daemon run` refused on an address other than loopback until TLS or upstream termination is configured, so that no token crosses a network in clear (ADR 0049) (shape)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 26
title = "As an operator behind an ingress, I want to opt in to TLS terminated upstream, the Daemon still requiring tokens and checking `Host` and `Origin`, trusting `X-Forwarded-*` only from the proxy addresses I list, and recording the choice in the Audit log, so that a mesh can terminate TLS without opening the Daemon (ADR 0049)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 27
title = "As an operator, I want an Exposed Daemon to refuse every request with `setup_required` until its first operator completes setup through a one-time link, whose token comes from a Secret reference or is printed once to the logs and expires after 24 hours, so that a fresh Daemon is never open to whoever finds it first (ADR 0049) (shape)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 28
title = "As an operator using GitOps, I want program tokens declared in configuration with their values as Secret references, so that Helm values create them without a secret in the chart (ADR 0049)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 29
title = "As an operator, I want the ops listener's `/livez` and `/readyz` to answer without a token and with no body, and `/metrics` to require a scoped read-only token, so that probes need no secret and metrics reveal nothing to strangers (ADR 0050)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 30
title = "As a team operator, I want the Daemon group's peer link to refuse another group's certificate authority, a revoked Group member and an expired certificate, so that nobody joins a group by copying a certificate (ADR 0055)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 31
title = "As a developer, I want every certificate verified on every path, with no switch to turn verification off, so that one broken site never exposes my other logins (ADRs 0016, 0042, SC-06)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 32
title = "As a developer, I want a certificate that fails verification to raise `certificate_invalid`, naming the host, the failure and the setting that makes an exception, so that I know what to change (G6) (shape)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 33
title = "As an operator, I want `tls.trusted_cas` to add certificate authorities per domain, set only in configuration or Operator policy, so that an internal CA is trusted where I say and nowhere else (ADR 0042)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 34
title = "As a developer, I want `tls.client_certificates` per domain, from configuration, a Recipe or my run, their keys as Secret references, so that a site needing mutual TLS works without installing anything on my machine (ADR 0042)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 35
title = "As a developer, I want a domain listed in `tls.accept_invalid_certs` to accept its invalid certificate once and pin its public key, recorded in the Audit log, so that a broken site works and a later attacker on its path does not (ADR 0042)."
milestone = "M1 Core"
journey = true
status = "active"

[[story]]
id = 36
title = "As a developer, I want a pinned host whose key changed stopped with `certificate_changed`, carrying both hashes, until a person accepts the new key with `certs accept` in an interactive prompt, which no agent, Recipe or `--json` command can do, so that a substitution never passes silently (ADR 0042)."
milestone = "M1 Core"
journey = true
status = "active"

[[story]]
id = 37
title = "As a test author, I want the value `any` for a fixture that regenerates its certificate, from configuration only, recorded on each run and never overriding a pin, which only `certs forget` removes, so that tests run without weakening real pins (ADR 0042)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 38
title = "As a developer, I want no secret typed and no Session cookie sent to a host reached through an invalid-certificate exception, and every result fetched under an exception marked in Provenance with its kind and the certificate hash, so that an accepted certificate never receives my login (ADR 0042)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 39
title = "As a developer, I want a browser Session with an exception to reach the listed hosts through the engine's TLS relay, which shows the site the browser's own ClientHello and HTTP/2 settings (a host only `tls.trusted_cas` lists; a host an invalid-certificate exception lists is reached over HTTP/1.1 alone, so that no Session cookie reaches it), and the hosts it terminated reported on the Session, so that the exception does not change what the site sees (ADR 0042)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 40
title = "As a developer, I want the relay's certificate authority generated at each browser launch, held only in memory and constrained to the listed hosts, so that nothing on disk can ever forge a certificate for another site (ADR 0042)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 41
title = "As an operator, I want endpoints I configure to take only their own trusted CA and client certificate and never accept an invalid one, so that an exception for a site never weakens my vault or model connection (ADR 0042)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 42
title = "As a developer, I want a Session with an exception refused with `certificate_exception_unsupported` on a third-party CDP browser and on a Borrowed browser, and served by the relay a Browser host runs beside its browser, so that an exception is never silently ignored (ADRs 0042, 0056)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 43
title = "As a person on a shared Daemon, I want my pins kept apart from other people's, readable by every engine major, and an unreadable pin row treated as a changed key, so that an older engine never trusts a pinned host as unpinned (ADRs 0042, 0066)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 44
title = "As an operator with several addresses, I want `egress.local_addresses` to take a list of addresses, an interface name or an IPv6 prefix, and each Session to bind one address per family for its life, so that I spread traffic over my own addresses without buying proxies (ADR 0044, SA-25)."
