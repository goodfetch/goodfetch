milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 47
title = "As an operator, I want new Sessions spread round-robin across /24 and /64 blocks, sizes I can set, so that my own Sessions do not cluster in one block (ADR 0044) (shape)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 48
title = "As a developer, I want a local address refused on a Browser host, a third-party CDP browser and a Borrowed browser with `local_address_unavailable`, so that an address of my machine is never claimed for another (ADRs 0044, 0056)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
