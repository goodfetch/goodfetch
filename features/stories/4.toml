# Area 4's user stories (specs #563 and #564, Security and egress, Collie),
# the declared `story:4-<id>` Features of ADR 0072. Each story's milestone is
# that of the ticket that finishes it; a story without a Journey carries ADR
# 0075's reason (`actor`, `part` or `reach`). The spec's issue keeps the full
# text; this copy is the one the Feature check reads. It holds the stories a
# test declares so far; the others join with the tickets that declare them.
# Never renumber or reuse an ID: a removed story stays with
# `status = "retired"` and a `reason`.

[[story]]
id = 80
title = "As a user, I want no telemetry at all, with no setting that could turn it on, so that my URLs, accounts and tasks never leave my machine unless I configured where (ADR 0043, SC-10, P13)."
milestone = "M1 Core"
journey = true
status = "active"

[[story]]
id = 81
title = "As a user, I want the only connections nobody configured to be digest-pinned downloads, sent as plain HTTPS GETs with no cookie, no identifier, no query beyond the pinned path and no user agent naming my install, so that a download says nothing about me (ADR 0043)."
milestone = "M1 Core"
journey = true
status = "active"

[[story]]
id = 82
title = "As a user in an air-gapped network, I want `egress.offline`, which Operator policy can lock, to turn each of those downloads into `artifact_unavailable_offline`, naming the command that supplies it beforehand, so that nothing even tries to connect (ADRs 0043, 0115)."
milestone = "M1 Core"
journey = true
status = "active"
