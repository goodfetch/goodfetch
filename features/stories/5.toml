title = "As a crawl user, I want a handler's page past its work item's lease to send nothing more, so that a zombie attempt never reaches the site (ADRs 0003, 0087)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 136
title = "As a crawl user, I want a Label that sets `session.source`, `session.http_credentials`, `secrets.*` or a `login` step to get a Session pool of its own apart from the Run's, so that a logged-in section and a public section of one site never share cookies (ADR 0093)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 137
title = "As a crawl user, I want a page that fails its Label's `expectedPage` on a non-browser tier escalated to the browser instead of failing, and a page that fails it on the browser tier or under a forced tier to fail with `page_check_failed`, so that a JavaScript page fetched over HTTP never passes as an empty success (ADR 0093)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 138
title = "As a crawl user, I want a Block cause on a pool's Session to retire it and open its replacement at the escalation ADR 0021 picks (one proxy tier up for a 401, 403 or 429 without a challenge; the browser for a challenge page), so that a blocked domain recovers without my code (ADRs 0021, 0088; area 6 builds the pool)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 139
title = "As a crawl user calling an API behind a Bearer token, I want a crawl request to carry `Authorization` only as a Secret placeholder, from its enqueue or a before-request Hook, dropped at every cross-origin hop and checked against the request's URL on every other hop, so that the token never passes through my code or follows a redirect (ADRs 0092, 0104)."
milestone = "M2 Client surfaces"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 140
title = "As a crawl user, I want a route's override of a crawl request's own fetch held to a Hook's rules (no method, body or `Cookie` change; `Authorization` only as a placeholder; a new URL checked as a rewrite), so that a route cannot step around the Frontier, robots.txt or Politeness (ADR 0104)."
milestone = "M2 Client surfaces"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 141
title = "As a crawl user, I want the responses my Label names in `fetch.kept_responses.urls` kept with their bodies from the start of the request's navigation, service workers' included, up to `fetch.kept_responses.max_size`, so that my handler reads a page's JSON with no reload (ADRs 0110, 0121)."
milestone = "M2 Client surfaces"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 142
title = "As a site owner selling access, I want a crawl to pay me through Cloudflare's pay-per-crawl headers or x402 instead of evading my 402, only on domains a person put in `pay_domains`, so that I am paid rather than merely blocked (ADR 0045; pain 6)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 143
title = "As a crawl user, I want a Paid fetch made only in an `identified` Session, under `max_price_per_page` and a currency Limit a person or a managed policy set, its worst case reserved before sending and journaled as an Effect, so that a resume never pays twice and an agent never approves its own spending (ADR 0045)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 144
title = "As a crawl user, I want an interrupted payment proved settled, still able to settle or unable to settle from the chain's finalized state, through an RPC endpoint from my configuration, and left an uncertain Effect only a person reconciles when it cannot be proved, so that no page is paid twice (ADR 0045)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 145
title = "As a crawl user, I want pages left at `payment_required` listed and the Run's Completeness `unverified`, so that a paywalled page is never mistaken for a reached one (ADR 0045)."
