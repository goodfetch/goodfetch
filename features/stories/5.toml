journey = false
not_journey = "part"
status = "active"

[[story]]
id = 23
title = "As a developer, I want `goto`, `reload`, `goBack` and `goForward` to return the document's `Response`, with a 404 or a 500 as a value when no Page check is declared, so that an error page is an answer I can read (ADR 0085)."
