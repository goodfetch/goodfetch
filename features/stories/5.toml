milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 28
title = "As a developer, I want a browser process that exits abnormally reported apart from a browser a person quit, so that a crash is never read as a close (ADR 0113)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
