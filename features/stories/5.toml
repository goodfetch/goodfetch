journey = false
not_journey = "part"
status = "active"

[[story]]
id = 20
title = "As a developer, I want a waiter armed when I call it, not when I await it, so that the response a click triggers is never missed (ADR 0080; pitfall B04; pain P02)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 21
