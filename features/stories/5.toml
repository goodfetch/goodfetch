journey = false
not_journey = "part"
status = "active"

[[story]]
id = 25
title = "As a developer, I want a page activated from a Speculation Rules prerender to pass `waitForURL`, a Page check and Foxhound's navigation gate as a navigation does, or prerendering to be off, so that no document arrives without the events my waits rely on (ADR 0121)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 26
title = "As a developer, I want an unreachable site to raise `navigation_failed` carrying the browser's network error (`net::ERR_NAME_NOT_RESOLVED` included), retryable, and a failing proxy of my own to raise an `UnavailableError` instead, so that a DNS failure, a site failure and my proxy's failure are told apart (ADR 0085; pitfalls H01, H12)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 27
