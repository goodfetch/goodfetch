journey = false
not_journey = "part"
status = "active"

[[story]]
id = 22
title = "As a developer of a single-page app, I want `waitForURL` to pass on a `pushState` or a hash change as on a new document, so that client-side routing is waited for like a navigation (pitfall B02)."
