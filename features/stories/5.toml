# Area 5's user stories (specs #576 to #579, Site access: Collie's 1 to 113
# and Foxhound's 114 to 145, one numbering), the declared `story:5-<id>`
# Features of ADR 0072, every story of the specs as their Further Notes give
# them: each story's milestone is that of the ticket that finishes it, and a
# story without a Journey carries ADR 0075's reason (`actor`, `part` or
# `reach`). The specs' issues keep the full text; this copy is the one the
# Feature check reads. Never renumber or reuse an ID: a removed story stays
# with `status = "retired"` and a `reason`.

[[story]]
id = 1
title = "As a developer, I want Collie's page API to keep Playwright's names where the meaning is the same (`goto`, `locator`, `getByRole`, `click`, `fill`, `evaluate`, `waitForResponse`), so that what I and my coding agent already know works (ADR 0085, S3; K01, K11)."
milestone = "M3 Browser automation"
journey = true
status = "active"

[[story]]
id = 2
title = "As a developer, I want every locator action to wait until its target is unique, visible, enabled, stable and receiving the event, cancel a gesture that lands on another element and replay it until the deadline, so that a click never lands on the wrong element (ADR 0019; pitfall B06; ADR 0037 / SA-13)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 3
title = "As a developer, I want an ambiguous target that becomes unique before the deadline acted on, and one still ambiguous at the deadline to raise `target_not_unique` listing every match rendered in my language, its `limit` naming the timeout's setting, so that a re-render's transient duplicate never fails my click (ADR 0085; pain P41)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 4
title = "As a developer, I want a question that never waits (`isVisible()`) on an ambiguous locator to raise `target_not_unique` at once, with `first()`, `last()` and `nth()` as the visible opt-outs, so that strictness has no silent exception."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 5
title = "As a developer, I want an action on a target of the wrong kind (`fill` on a `<div>`, `selectOption` on an `<input>`, `setInputFiles` on a button) to fail at once with `target_unsupported` naming what it accepts and what it found, after a `<label>` is followed to its control, so that I fix the locator instead of waiting out a timeout."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 6
title = "As a developer, I want `force` to skip the actionability checks and the replay while keeping uniqueness, marked unguarded in Provenance, so that I can act on a page I trust and the results say so (ADR 0023; `action.force`)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 7
title = "As a developer, I want two Gestures sent at once on one page never to interleave their keystrokes or pointer moves, while reads, waits, `evaluate` and route answers run beside them, so that `Promise.all` over reads costs one round trip and concurrent `fill`s never race for focus (ADR 0085)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 8
title = "As a developer, I want a Gesture that waits on my program (a locator handler's turn, a route handler's answer, a scripted login step) to give up the page's turn, so that a handler that clicks never deadlocks the action it interrupted (ADR 0085)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 9
title = "As a developer, I want `page.keyboard`, `page.mouse` and `page.touchscreen` for input with no target, each call marked unguarded, so that I can drive a canvas or a map (pitfall B14)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 10
title = "As a developer, I want input to be trusted browser input, so that controlled inputs, hover menus, drag and Enter behave as they do for a person (pain P52)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 11
title = "As a developer, I want a driven page never throttled as a background tab when another page of its Session is in front, so that timers and animations on my page keep running (ADR 0085's background-tab question)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 12
title = "As a developer, I want Playwright's locator constructors and matching rules (`getByRole`, `getByText`, `getByLabel`, `getByPlaceholder`, `getByAltText`, `getByTitle`, `getByTestId`, case-insensitive substring by default, `exact` to match whole), so that the defaults my agent assumes are the real ones (ADR 0085)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
