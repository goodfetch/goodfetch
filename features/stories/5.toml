journey = false
not_journey = "part"
status = "active"

[[story]]
id = 17
title = "As a developer on Chromium, I want locators, the guard and `ariaSnapshot` to reach closed author shadow roots without changing the page, so that a target a person sees is never hidden from my program; on Firefox and WebKit I want the deadline error's `observed` to name the closed root and say that Chromium reaches it (ADR 0121; pitfall B13)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 18
title = "As a developer, I want locators resolved again at each use and no element handles, so that a re-render never leaves me a stale reference (pitfall B05; pain P29)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 19
title = "As a developer, I want `waitForURL`, `waitForResponse`, `waitForRequest`, `waitForRequestFinished`, `waitForLoadState`, `waitForFunction`, `locator.waitFor({ state })` and `locator.waitForCount`, each under one deadline, so that I wait for the application state my next step needs rather than for an element (ADR 0080; pain P01; ADR 0037 / SA-14)."
