[[story]]
id = 229
title = "As a crawl developer, I want `crawl.path_budgets` to cap the requests admitted under URL path patterns, as Spider's `with_budget`, with a URL past its budget not added with `path_budget` and the Run ending `incomplete`, so that one section of a site cannot use the whole crawl (CO-08) **(shape)**."
