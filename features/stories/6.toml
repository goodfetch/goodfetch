[[story]]
id = 228
title = "As a crawl developer, I want `crawl.max_url_length` (2,083), `crawl.max_path_segments` (20) and `crawl.max_segment_repeats` (2) on by default, a refused URL making a finished Run `unverified`, so that traps the learned rules miss still end (ADR 0120; pitfall U10)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
