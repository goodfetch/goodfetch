# Area 6's user stories, the declared `story:6-<id>` Features of ADR 0072:
# spec #580 (Collection, Collie's part) numbers its stories from 1, all 66
# of them here; specs #581 and #582 (Foxhound's part) number theirs from
# 201, those a test declares so far, the others joining with the tickets
# that declare them. Each story's milestone is that of the last ticket that
# makes it tested; Collie's stories 13, 50 and 65, which no ticket of its
# spec names, take their surface's milestone. A story without a Journey
# carries ADR 0075's reason (`actor`, `part` or `reach`). The specs' issues
# keep the full text; this copy is the one the Feature check reads. Never
# renumber or reuse an ID: a removed story stays with `status = "retired"`
# and a `reason`.

[[story]]
id = 1
title = "As a developer, I want `page.formats({ markdown: true })` to return the page's main content as Markdown, through dom-smoothie and htmd, so that I can hand a page to a model or a store without writing a converter (CO-18, pain 14)."
milestone = "M3 Browser automation"
journey = true
status = "active"

[[story]]
id = 2
title = "As a developer, I want the Markdown's content chosen as `main` (the default), `full` (the whole cleaned body) or `fit` (main content with navigation, link lists and images removed), so that I pick how much of the page a model reads (CO-18, #71's \"fit-markdown\")."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 3
title = "As a developer, I want `html` as `raw` (the document as served or as the DOM stands), `cleaned` (after the Clean-up rules) or `main` (the extracted main content), and `text` as the main content's text, so that every form #71 names comes from one call (CO-18)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 4
title = "As a developer, I want `links`, `images` and `media`, each URL resolved against the document's base URL as the HTML standard resolves it, with its text, `rel` or `alt`, so that I read a page's outgoing references without a selector (#71; pitfall U08)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

