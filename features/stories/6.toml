[[story]]
id = 226
title = "As a crawl developer, I want the scope to ignore one leading `www.` label, and an `http` seed under `same_origin` to admit its host's `https` origin, so that the scope does not wait for evidence (ADR 0120)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
