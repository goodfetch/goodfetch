[[story]]
id = 225
title = "As a crawl developer, I want `crawl.scope.include` and `crawl.scope.exclude` patterns to narrow the strategy and never replace it, and `enqueueLinks`'s own `include` and `exclude` to narrow further, so that patterns never widen a crawl (ADR 0093)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
