title = "As a crawl developer, I want `priority` within a domain and `forefront` ahead of the domain's pending requests, so that I order work as Crawlee and Spider let me (CO-04)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
product = "foxhound"

[[story]]
id = 216
title = "As a crawl developer, I want no-effect query parameters learned by page signature, trap paths closed and cursor pagination preferred to offset, each rule reported with its evidence and the URLs it merged, and never across a registrable domain, so that traps end without my rules (ADR 0005; pitfalls U01, U03)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
product = "foxhound"

[[story]]
id = 217
title = "As a crawl developer, I want the `www`, scheme, trailing-slash and index-file forms merged per host only on evidence (a redirect, matching page signatures, `rel=canonical`), reported as `equivalent_form`, so that a site where they differ keeps both pages (ADR 0120; pitfall U06)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
product = "foxhound"

[[story]]
id = 218
title = "As a crawl developer, I want a learned rule that later meets a contradicting pair to stop merging and say so in the report, so that a wrong rule is visible and stops costing pages **(shape)**."
