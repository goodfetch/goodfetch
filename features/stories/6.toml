# Area 6's user stories (spec #581 and #582, Collection, Foxhound: stories
# from 201), the declared `story:6-<id>` Features of ADR 0072. Each story's
# milestone is that of the ticket that finishes it; a story without a
# Journey carries ADR 0075's reason (`actor`, `part` or `reach`). The spec's
# issue keeps the full text; this copy is the one the Feature check reads.
# It holds the stories a test declares so far; the others join with the
# tickets that declare them. Never renumber or reuse an ID: a removed story
# stays with `status = "retired"` and a `reason`.

[[story]]
id = 201
title = "As a crawl developer, I want each seed answered as an enqueue is (added with its ID, or not added with `duplicate`, `domain_policy`, `unsupported_scheme`, `invalid_url` or a cap's name) and listed by `run.seeds()`, so that a crawl that does nothing says why (ADR 0102; G1)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 202
title = "As a crawl developer, I want a relative seed refused with `invalid_url`, so that a seed never depends on a base I did not give (ADR 0120)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 211
title = "As a crawl developer, I want every URL a crawl meets (seeds, enqueues, `href`s, sitemap entries, `Location`s, Hook rewrites) parsed once by the WHATWG URL Standard on every tier, so that the crawl sees the links a browser sees (ADR 0120; pitfall U07)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 212
title = "As a crawl developer, I want a request's identity to be its method, its URL's key and its body's hash, so that a POST to one URL with two bodies is two requests (ADR 0093)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 213
title = "As a crawl developer, I want the key made by RFC 3986's safe rules, the fragment dropped, `utm_*`, `gclid` and `fbclid` dropped, the parameters sorted stably, empty pairs dropped and `;jsessionid=` dropped, while the request is fetched at its own URL, so that tracking parameters never split a page and the server sees the URL the page linked (ADRs 0005, 0120; pitfalls U04, U06)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 214
title = "As a crawl developer, I want `key` on an enqueue to replace the identity, so that my own canonicalization always wins (ADR 0005)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 220
title = "As a crawl developer, I want a redirect reaching a key admitted for another request to end `skipped` with `duplicate` and run no handler, so that one page is never handled twice (ADR 0120)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 231
title = "As a crawl developer, I want `ctx.enqueue(url, label, payload?, options)` to resolve a relative URL against the document's base URL and answer added or not added with its reason, so that \"enqueued nothing\" says why (ADRs 0093, 0120; pitfall U08)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
