journey = false
not_journey = "part"
status = "active"
product = "foxhound"

[[story]]
id = 219
title = "As a crawl developer, I want `rel=canonical` used as evidence only, a canonical to another path or registrable domain ignored, so that a mis-templated site never drops every page but one (ADR 0120; pitfall U09)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
product = "foxhound"

[[story]]
id = 220
title = "As a crawl developer, I want a redirect reaching a key admitted for another request to end `skipped` with `duplicate` and run no handler, so that one page is never handled twice (ADR 0120)."
