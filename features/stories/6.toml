[[story]]
id = 227
title = "As a crawl developer, I want `crawl.max_depth` and `crawl.max_requests` to refuse further enqueues with their reasons and end the Run `incomplete`, so that a bounded crawl never reads as complete (CO-07, CO-08; pitfall U01)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
