journey = false
not_journey = "part"
status = "active"
product = "foxhound"

[[story]]
id = 222
title = "As a crawl developer, I want a pending request that a rule learned later merges to end `skipped` with `duplicate`, so that the count of pages handled stays honest (ADR 0093)."
