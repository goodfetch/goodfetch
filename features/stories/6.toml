[[story]]
id = 224
title = "As a crawl developer, I want `crawl.scope.strategy` (`same_hostname` by default, or `same_domain`, `same_origin` or `all`) measured against every seed and checked on every enqueue, redirect and Hook rewrite, so that a crawl never leaks off-site (CO-05, ADRs 0093, 0104; pitfall U15)."
milestone = "M1 Core"
journey = false
not_journey = "part"
status = "active"
