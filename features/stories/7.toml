# Area 7's user stories (spec #595 and #596, Plugin protocol, Collie,
# parts 1 and 2: stories 1 to 115; spec #597, Foxhound's part: stories from
# 201), the declared `story:7-<id>` Features of ADR 0072, every story of both
# Products' specs as their User Stories give them: each story's milestone is
# that of the ticket that finishes it (every ticket of both specs is M4), and
# a story without a Journey carries ADR 0075's reason (`actor`, `part` or
# `reach`). The specs' issues keep the full text; this copy is the one the
# Feature check reads. Never renumber or reuse an ID: a removed story stays
# with `status = "retired"` and a `reason`.

[[story]]
id = 1
title = "As a user, I want to search the Plugin index with `plugin search`, seeing each Plugin's kinds, signer identity and conformance results, so that I choose a Plugin by what it has proved, not by its name."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 2
title = "As a user, I want `plugin add` to download the Plugin's OCI artifact for my platform, verify its digest and provenance and unpack it into the Plugin store without running npm, pip, a build or any script, and without touching my `node_modules` or virtualenv, so that installing a Plugin can never run code (ADR 0033)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 3
title = "As a user, I want `plugin add` to show me the manifest's kinds, network level, permissions, environment variables, files, processes, browsers and spend prices before anything is approved, so that I see what I grant."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 4
title = "As a user, I want `plugin add` to fetch the Plugin's declared language runtime (a Node or Python version) by digest into the runtime cache, so that a Plugin never depends on what happens to be installed and an `offline` engine never downloads one later (ADRs 0033, 0043)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 5
title = "As a user, I want `plugin add` to record the Plugin's digest in a lockfile and the engine to refuse a mismatch with `plugin_digest_mismatch`, so that a project runs the Plugins it was tested with (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 6
title = "As a user, I want a name close to an index entry refused unless I give an exact digest, so that a look-alike Plugin cannot be installed by a typo (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 7
title = "As a user, I want a third-party Plugin's artifact refused unless its provenance attestation matches the signer the index records, or Operator policy allows its exact digest, so that I know which repository and workflow built every byte it ships (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 8
title = "As a user, I want the engine to refuse an index older than the last one it saw or past its expiry, and to stop running instances of a revoked Plugin at once, so that a revocation reaches me and an attacker cannot replay an old index (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 9
title = "As a user on an air-gapped host, I want `plugin index import <file>` to import a fresh signed index, verified offline against the trust root my release bundles, so that revocation still works without network access (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 10
title = "As a user, I want `plugin update` to show the new digest, the signer and a permission diff, and to ask me to approve any new permission or wider value, so that an update never grants more silently (ADR 0033)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 11
title = "As a user, I want an update whose signer identity changed refused until the operator approves it again, so that a release from another repository or workflow is caught (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 12
title = "As a user, I want Plugins never updated automatically, so that a hijacked repository cannot reach my runs between two of my approvals (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 13
title = "As a user, I want `plugin list` to show each installed Plugin with its kinds, digest, signer, network level, approvals and conformance results, and Plugins of a kind my Product lacks listed but marked, so that one Goodfetch home serves Collie and Foxhound (ADR 0098)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 14
title = "As a user with both Products, I want one Plugin store shared by both, Collie keeping and never deleting a Sink or Fetch backend Plugin and refusing it with `not_in_product` when a run asks for it, so that installing Foxhound later finds my Plugins (ADRs 0094, 0098)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 15
title = "As a user, I want `plugin remove` to delete a Plugin from the store, its lockfile entry and its approvals, and to be refused while a live run uses it, so that removal never breaks a run in flight."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 16
title = "As an operator, I want a third-party Plugin to load only when Operator policy allows it, Goodfetch's first-party Plugins allowed by default and a Private component never treated as first-party, so that nothing third-party runs without my decision (ADRs 0033, 0035)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 17
title = "As an operator, I want to allow, deny or pin each Plugin to a digest in Operator policy, so that every machine of a team runs what I approved (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 18
title = "As an operator, I want each permission (`effects` per domain, `page_script` per domain, `session_credentials` per domain, each Secret reference, `needs_secret_value` per reference, a declared browser per digest, `direct`) approved separately, with each approval stating in plain words what it lets the Plugin do and what the engine cannot check, so that I approve exactly what I understand (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 19
title = "As an operator, I want the spend prices a Plugin declares shown when I allow it and overridable, so that a currency Limit reserves against prices I accept (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 20
title = "As an operator, I want every approval, release of a Secret value, release of session credentials, browser allowance, reduced confinement and `--accept-plugin-change` recorded in the Audit log, so that I can audit what third parties were given (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 21
title = "As an operator on a host that cannot confine (WSL1, a container under Docker's default seccomp profile on a kernel before 6.12), I want third-party Plugins refused with `confinement_unavailable` and first-party ones refused by default unless I allow reduced confinement, with the run report and the Audit log naming what was not confined, so that nothing is weakened silently (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 22
title = "As an operator, I want confinement to be no switchable control: no run, Recipe or setting turns it off, and there is no `unconfined` mode, so that the guarantee holds for exactly the Plugins that would ask to escape it (ADRs 0016, 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 23
title = "As an operator on Ubuntu 23.10 or later, I want an elevated `plugin setup` to install the root-owned `goodfetch-sandbox` helper and its AppArmor profile only after verifying their attestation, so that `proxy_tcp` works where AppArmor restricts user namespaces (ADRs 0033, 0039)."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 24
title = "As an operator on Windows, I want an elevated `plugin setup` to install the filter broker only after verifying its attestation, with every filter change in the Windows event log, so that `proxy_tcp` and `direct` work there (ADRs 0033, 0039)."
milestone = "M4 Everything else"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 25
title = "As an operator, I want each run's report to state which Plugins ran, at which network level and confinement, and which figures came from a Plugin, so that a run's result says what extended it (ADR 0016)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 26
title = "As an operator of a Daemon group, I want the last Plugin index the Lead Daemon saw to be what every Group member compares against, and placement to consider installed Plugins, so that a group never runs a revoked Plugin on one member (ADRs 0033, 0055)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 27
title = "As an operator running a container (ADR 0049), I want the engine's startup probe of user namespaces to decide Plugin confinement too, with the refusal naming the fix for the detected environment, so that one probe explains both the browser's sandbox and Plugins' (ADR 0049)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 28
title = "As a user, I want each process Plugin instance to belong to one run, started with the run or when it first needs it and killed when the run stops, finishes or is discarded, so that nothing of one run survives in a Plugin process (ADRs 0001, 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 29
title = "As a user, I want work outside a run (a probe, `plugin test`, a Notification after a run ends) to get its own instance scoped to that task and killed after it, so that such work shares no process with a run."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 30
title = "As a user, I want a Plugin started with an empty environment holding only the variables its manifest declares, valued from its settings, with no loader variable allowed, no inherited handle beyond stdio and its proxy socket, and a private temporary folder deleted when it stops, so that `AWS_SECRET_ACCESS_KEY` or `GITHUB_TOKEN` never leak in (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 31
title = "As a user, I want a Plugin started by hand to refuse to run (the environment cookie), and an instance whose `hello` differs from its approved manifest stopped with `plugin_manifest_mismatch`, so that a Plugin cannot claim more than was approved (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 32
title = "As a user, I want calls to a Plugin held to the manifest's maximum concurrency with ADR 0024's credits, nothing dropped and callers waiting under their lease, and its calls back into the engine drawing on a separate pool, so that a Plugin at its limit cannot deadlock (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 33
title = "As a user, I want every call to carry a deadline, abandoned past it with `$/cancel`, its result refused, and an abandoned Effect-class call reported uncertain at once, so that a hung Plugin never stalls a run or repeats an Effect (ADRs 0029, 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 34
title = "As a user, I want a crashed Plugin restarted with backoff, in-flight reads and idempotent writes failed with `plugin_crashed` and retried under their lease, and in-flight Effects reported uncertain for Reconciliation, never retried blindly (ADRs 0010, 0029, 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 35
title = "As a user, I want repeated crashes to quarantine a Plugin for the rest of the run with `plugin_quarantined` and a Notification, so that a broken Plugin is visible, not retried forever (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 36
title = "As a user, I want a heartbeat on the same channel, and an instance restarted when it stops answering, when it holds more abandoned calls than its concurrency, or when a call is abandoned while it has a proxied stream open, so that a stuck Plugin is replaced (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 37
title = "As a user, I want a Plugin that exceeds its memory, CPU time, process count or open-file limit killed with `plugin_limit_exceeded` under the crash rules, so that one Plugin cannot exhaust my machine (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 38
title = "As a user, I want every call into a Plugin of any form counted in Usage (calls and time) and recorded in the Run trace by Plugin and method, so that I see what extended my run and how long it took (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 39
title = "As a user, I want the engine to class each call itself from the kind's method and what it carries, never from the Plugin's word, so that a Plugin cannot pass an Effect off as a read (ADR 0033). A crawl request is a read whatever its method, also when a Fetch backend carries it (ADR 0106; Foxhound's part)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 40
title = "As a user, I want every Model provider and Decision provider call journaled in the Effect journal, Effect-class calls journaled, and a Secret provider's or Code source's answers never recorded (only the reference, the outcome and the time), so that the journal is complete and never holds a secret (ADRs 0010, 0012, 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 41
title = "As a user, I want everything a Plugin returns treated as page content under ADR 0014, so that text a Plugin returns cannot instruct a model, except a Model or Decision provider's answer, which is the model's decision, and a Secret provider's or Code source's answer, which never reaches a model (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 42
title = "As a user whose Plugin spends outside the engine (a solving service, a hosted browser, a search API), I want its raw units reported in Usage, the declared maximum times the price reserved against my currency Limit before each call, a call that would cross the Limit refused, a unit with no price treated as unbounded under a currency Limit and refused with `plugin_price_unknown`, and a quantity above the declared maximum recorded in full, flagged in the report and stopping the run if it crosses the Limit, so that third-party spend is capped as model spend is (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 43
title = "As a user, I want a Plugin to name a Secret only by reference in a dedicated field of a `net.fetch` request (a header or query parameter, with an optional template such as `Bearer {}`, or a form field the operator set), inserted by the engine only toward the domains the run binds it to, so that the value never enters the Plugin (ADRs 0015, 0033, 0092)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 44
title = "As a user, I want a Secret value removed from a response before the Plugin sees it, raw and in base64, URL, hex and JSON-escaped forms, and a value inserted in a query parameter masked in the Run trace, Usage and the journal, so that a site's echo cannot hand it back (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 45
title = "As a user, I want a Plugin that needs a value itself (a database password over `direct`, a TLS stream it opens) to declare `needs_secret_value` per reference, released only when Operator policy allows it for that Plugin, with each release in the Audit log, so that a released value is a decision someone made (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 46
title = "As a user with a logged-in Session (through a Secret, an import, a Profile directory or a Borrowed browser, ADR 0056), I want a third-party Plugin to reach its requests, pages and responses only through `session_credentials` approved for that Plugin and domain, so that no third party sees my account by default (ADRs 0033, 0056)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 47
title = "As a user, I want, without that approval, a browser a third-party Plugin supplies not used for that Session, and a third-party proxy carrying its requests only inside a TLS tunnel, a plain-HTTP or WS request refused with `proxy_requires_tls`, so that a proxy never reads my session in clear (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 48
title = "As a user, I want a Plugin's `net.fetch` never to carry a Session's cookies, and a page-stage Hook never to set cookies on a logged-in domain, so that no Plugin can switch my Session into another account (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 49
title = "As a user, I want a Plugin's `page.*` calls unable to run script, read form values, storage or cookies unless `page_script` is approved for that domain, and every navigation or approved script on a logged-in Session journaled as a possible Effect, so that a `GET` that changes state is still accounted for (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 50
title = "As a user, I want a `page.*` action that changes the page, a navigation while logged in, and a `net.fetch` other than `GET` or `HEAD` toward the run's sites performed only on the domains a Plugin's `effects` permission names, through the Effect journal, so that a Plugin's writes are journaled as mine are (ADRs 0010, 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 51
title = "As a user, I want a third-party Secret provider unable to claim a built-in's or another installed provider's reference scheme, so that it never answers for references meant for another provider (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 52
title = "As a user, I want no Plugin answer able to turn off certificate checks or add a trusted authority for a Session, so that no proxy can read my typed Secrets (ADRs 0033, 0042)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 53
title = "As a user, I want a Plugin's calls back into the engine accepted only during a call the engine made to it, carrying that call's ID and acting within that call's run, lease, Session and the Plugin's permissions, never reaching the Run index, settings, Operator policy or accounts, so that a Plugin cannot act on its own (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 54
title = "As an operator, I want a Plugin at `none` (the default) to create no network socket at all, reaching the outside only through `net.fetch` and `net.connect` on its stdio channel, so that every byte it sends passes the engine's checks (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 55
title = "As an operator, I want a Plugin at `proxy_tcp` to reach only what `net.connect` may reach, through a proxy the engine runs for that instance with credentials generated for it, so that clients that only speak `HTTP_PROXY` or SOCKS5 still work confined (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 56
title = "As an operator, I want `direct` allowed only to Plugins whose kinds are all among Sink, Notification channel, Secret provider, Model provider, Decision provider and Code source, and for a third-party one only when Operator policy names it, with the run report and Audit log marking it and the approval stating what is not checked, so that drivers that cannot use a proxy still run, knowingly (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 57
title = "As an operator, I want a Plugin's operator-configured endpoints (layers 2 and 3, or a Recipe or run value whose host Operator policy allows) to be the only destinations that may resolve to private or loopback ranges, and every other destination checked as a page's, including the domains its manifest declares and the defaults it ships, so that a Plugin's author cannot point it at my network through DNS (ADRs 0017, 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 58
title = "As an operator, I want a run's private-range allowlist and a switched-off resolved-IP check never applied to a Plugin's destinations, and link-local and cloud-metadata ranges refused for every destination the engine carries for a Plugin, so that a Plugin cannot reach my cloud credentials through the engine (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 59
title = "As an operator, I want a returned endpoint (a Browser backend's CDP URL, a Proxy provider's proxy) treated as operator-configured only when it matches an operator-configured value, so that a Plugin cannot launder an address by returning it (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 60
title = "As a user, I want a Plugin's navigations held to the registrable domain of the page it was called for and, only while the Session is not logged in, the domains it declares, which narrow and never widen the run's domain policy, so that a Plugin cannot take my page elsewhere (ADRs 0014, 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 61
title = "As a user, I want `net.connect` streams opaque to the engine to be counted in Usage by bytes and time, recorded in the Run trace by destination and closed when the lease they were opened under ends, so that streams stay accounted though their content is not (ADRs 0003, 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 62
title = "As a Recipe author, I want to carry a Hook as a Script Hook in my Recipe or settings, a JavaScript function with only its stage's catalog calls, so that CLI, MCP and Recipe users get Hooks without an SDK or a process Plugin (ADRs 0033, 0051)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 63
title = "As a CLI or MCP user, I want Hooks named in settings run in the order their layers declare them, Operator policy's first and the run layer's last, with no integers and no priorities, so that I know which Hook sees what another changed (ADR 0104)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 64
title = "As a Collie user, I want `before_navigation`, `after_navigation` and `page_ready` Hooks from settings to run around each navigation of my Run's pages, so that an operator can set a cookie or block a resource on every page an Agent visits (ADRs 0088, 0104)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 65
title = "As an operator, I want observe-only lifecycle Hooks (`run_started`, `checkpoint_taken`, `run_migrated`, `limit_reached`, `run_ended`) for process Plugins and Script Hooks, so that a Plugin can report a run's life to my own systems without a program listening (ADRs 0033, 0104)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 66
title = "As a user, I want a Script Hook's permissions declared inline beside it and approved by Operator policy like a Plugin's, and one supplied at the run layer (which an agent or a workflow may fill) given none of `effects`, `page_script`, `session_credentials` or Secret references unless Operator policy allows them for it, so that a prompt-injected agent cannot plant a privileged Hook (ADR 0033)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 67
title = "As a user, I want a Script Hook's failure reported as `hook_failed` naming its `script_*` code, retried only when that code's flag says so, and a quarantined Script Hook failing its stage with `hook_failed` naming `script_quarantined`, never skipped silently (ADR 0051)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 68
title = "As a user, I want a Hook that only observes never to change a run's or a request's outcome when it fails, its failure recorded in the Run trace and the report's warnings, so that a reporting Plugin cannot fail my work."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 69
title = "As a user, I want every Hook stage named once, by the catalog's snake_case name, in Plugin manifests, Script Hooks, settings, the Run trace and the SDKs, so that one name means one stage everywhere (ADR 0104)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 70
title = "As a developer, I want to register my own implementation of any Collie kind on my connection by name, one option per kind (`proxyProviders`, `browserBackends`, `extractors`, `decisionProviders`, `challengeSolvers`, `searchProviders`, `codeSources`, `notificationChannels`, with ADR 0101's `modelProviders` and ADR 0092's `resolveSecret`), so that injecting a component is one option, as ADR 0101 registers a model (ADR 0104)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 71
title = "As a developer, I want my handler chosen by its name wherever settings choose an installed Plugin, and the only handler of a kind that one setting chooses to become that setting's value with the origin `registered`, so that a proxy pool I register is used without restating it (ADRs 0083, 0104)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 72
