journey = false
not_journey = "part"
status = "active"

[[story]]
id = 19
title = "As an operator, I want the fingerprint-chromium and Clearcote binaries refused unless my Operator policy allows each by digest, the allowance off by default, recorded in the Audit log and marking every result, so that a build behind on security fixes never runs by surprise (ADR 0035)."
milestone = "M3 Browser automation"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 20
title = "As a user with a licensed browser of my own (a CloakBrowser, another Chromium build), I want to run it under `engine` through a Browser backend Plugin, with the warning that Goodfetch cannot vouch for the build or its licence, and a browser the Plugin declares as a download allowed only per digest by Operator policy, off by default, so that I can use it without Goodfetch shipping it (ADRs 0033, 0035; ST-05)."
