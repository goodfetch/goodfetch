# Area 8's user stories (spec #598 and #599, Stealth and Challenge solving,
# Collie, parts 1 and 2: stories 1 to 112; spec #600, Foxhound's part:
# stories from 201), the declared `story:8-<id>` Features of ADR 0072, every
# story of both Products' specs as their Further Notes give them: each
# story's milestone is that of the ticket that finishes it, and a story
# without a Journey carries ADR 0075's reason (`actor`, `part` or `reach`).
# The specs' issues keep the full text; this copy is the one the Feature
# check reads. Never renumber or reuse an ID: a removed story stays with
# `status = "retired"` and a `reason`.

[[story]]
id = 1
title = "As a developer, I want every Session to open in `standard` by default, presenting a real browser's identity with no automation leak, so that I get a consistent identity without opting into anything (ST-02; pitfalls S07, B19)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 2
title = "As a developer, I want to open a Session in `stealth` with one setting, `browser.access_mode: \"stealth\"`, so that the whole catalog turns on at once and I switch items off rather than on (ADR 0035; ST-01)."
milestone = "M3 Browser automation"
journey = true
status = "active"

[[story]]
id = 3
title = "As a developer, I want choosing any Fingerprint method other than `none` to make the Session a `stealth` Session, with the items I set keeping their values and `stealth`'s defaults filling the rest, so that one choice never leaves a half-masked Session."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 4
title = "As a developer, I want each catalog item (`stealth.fingerprint_method`, `stealth.generated_identity`, `browser.headless`, `stealth.human_input`) switchable off under `stealth`, so that I keep what a site needs and drop what it does not."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 5
title = "As a developer, I want a stealth item set explicitly where a `standard` Session opens refused with `setting_not_applicable`, an explicit `standard` beside a non-`none` Fingerprint method at the same scope refused with `setting_invalid` naming both keys, and an inherited stealth item to yield, so that an option that cannot take effect is never silently ignored (ADR 0077's G3; ADR 0083)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 6
title = "As a developer, I want an `identified` Session that sets a masking item or `challenge.solve` explicitly refused with `setting_invalid` naming both keys, and an inherited masking item to yield to `identified` with `explainSettings()` saying so, so that a signed agent never spends its key's reputation by masking (ADR 0035; ADR 0021)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 7
title = "As a developer, I want the Access mode, Identity profile and proxy fixed for a Session's life, and changing any of them to mean opening a new Session, so that no Identity profile or IP changes under the same cookies (ADR 0021; pitfall S05)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 8
title = "As a developer, I want a `browser.locale`, `browser.timezone_id` or `browser.geolocation` set where a `stealth` Session opens and conflicting with its Identity profile refused with `setting_locked` whose `limit` names the Access mode, and an inherited value to yield, with `explainSettings()` saying what fixed it, so that I can keep defaults above `stealth` Sessions without breaking them (ADR 0083, which gives area 8 these refusals)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 9
title = "As a developer, I want `stealth` on a WebKit Session refused with `capability_unavailable` naming `browser.access_mode`, so that WebKit never claims to be Safari (ADR 0035)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 10
title = "As a developer, I want a Session on a Borrowed browser to stay `standard` with the browser's own identity, and `stealth` set where it opens refused with `setting_not_applicable`, so that the person's own browser is never changed (ADRs 0056, 0083)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 11
title = "As a developer, I want `stealth` chosen for an import or a Profile directory used in place to run on the Goodfetch Chromium for a Chromium-family source (on a directory the Goodfetch Chromium created) or Camoufox for a Firefox source, refused for a Safari source, and to keep the source's language and time zone, with a warning that the identity changes under the same cookies, so that a login's identity follows ADR 0056's binding."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 12
title = "As a developer, I want the four Fingerprint methods, `none`, `js_injection`, `basic` and `engine` (ADR 0038's snake_case makes ADR 0035's `js-injection` `js_injection` on the wire; the word is this spec's), each with its stated warning, so that I know what each one leaves visible."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 13
title = "As a developer, I want `basic` to change user agent, client hints, time zone, locale, geolocation, screen and core count through the CDP Emulation domain and launch flags, and to say that graphics, canvas, audio and fonts stay the machine's own, so that I choose it knowing Sessions on one machine stay linkable."
