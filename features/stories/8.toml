milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 24
title = "As a user, I want the Goodfetch Chromium built from fingerprint-chromium's open patch series on ungoogled-chromium's pipeline, on every Chrome Stable major, for Linux, Windows and macOS on x64 and arm64, so that the Goodfetch Chromium is current and runs where I do (ADR 0035)."
