journey = false
not_journey = "part"
status = "active"

[[story]]
id = 14
title = "As a developer, I want `js_injection` to warn that detectors can see the injected values and to be marked in Provenance as a main-world action, so that the opt-in departs from `standard`'s no-injection identity openly (ADRs 0019, 0048)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 15
title = "As a developer, I want `engine` to run the Goodfetch Chromium, which changes the Identity profile's values inside the browser engine, so that no page-visible override exists (ST-02, ST-05)."
milestone = "M3 Browser automation"
journey = true
status = "active"

[[story]]
id = 16
title = "As a developer on a musl host, I want `engine` to fall back to `basic` on the distribution's Chromium with that method's warning, so that the run goes on and says what it lost."
milestone = "M3 Browser automation"
journey = false
not_journey = "reach"
status = "active"

[[story]]
id = 17
title = "As a developer, I want a Firefox `stealth` Session to run Camoufox, through Playwright's driver, with Firefox identities only and the warning of a smaller crowd, so that Firefox stealth is a real Firefox (ADR 0035; ST-05)."
milestone = "M3 Browser automation"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 18
title = "As a developer, I want a `stealth` Camoufox Session to refuse service-worker registration through Firefox's own `dom.serviceWorkers.enabled` preference, never a page-visible stub, and the Run report to say a site can see the difference from real Firefox, so that the engine's interception still sees every request (ADR 0121). This preference is how `browser.service_workers` is `block`, its default on Firefox: an explicit `allow` set where the Session opens is refused with `capability_unavailable` whose `fix` names `block`, and an inherited `allow` yields."
