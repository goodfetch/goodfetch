journey = false
not_journey = "part"
status = "active"

[[story]]
id = 32
title = "As a developer, I want a write of the Plan file that fails to raise `path_not_writable` or `file_write_failed` from the call during which it happens (the Run's own error instead when the Run failed, the write then a warning) and leave the file as it was, its versions staying pending, so that a full disk never truncates my Plan (ADR 0116)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 33
