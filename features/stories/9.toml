journey = false
not_journey = "part"
status = "active"

[[story]]
id = 42
title = "As a developer, I want a Run with Success checks, Grounding or the Target fingerprint check before the first Effect switched off (ADR 0023), or with an Effect left uncertain, to read `needs-review`, never success, so that a switched-off control is visible (ADR 0029)."
