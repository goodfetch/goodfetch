journey = false
not_journey = "part"
status = "active"

[[story]]
id = 63
title = "As a developer, I want `agent.domains` (by default the registrable domain of the start page; `[\"*\"]` to lift it) enforced by the engine on every navigation of the task and its tabs, a refusal given back to the model, so that a page cannot lead the Agent off site (P15)."
