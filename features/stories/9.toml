journey = false
not_journey = "part"
status = "active"

[[story]]
id = 35
title = "As a developer, I want a Decision provider, when I configure one whose threshold a campaign has measured, to sit between the Target fingerprint check and the model, choosing or abstaining, journaled and counted, so that cheap choices skip the large model (ADR 0009)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 36
title = "As a person, I want the recorder to turn what I do in the Console's Live view into a Plan in this format, preferring a discovered API route with the browser as fallback, together with the matching TypeScript or Python code, so that I can start an automation by showing it (ADR 0009, pain 9)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 37
