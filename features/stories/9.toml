journey = false
not_journey = "part"
status = "active"

[[story]]
id = 23
title = "As a developer, I want a drifted step to get exactly one Repair, checked again, reported as `repair` with what drifted, and a Drift that remains to fail with `plan_drift`, so that only the drifted step goes back to the model (AI-13, pain 11)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 24
title = "As a developer, I want `plan.frozen` to replay only, call no Model provider (Decision providers included) and write nothing, a missing entry failing with `plan_step_missing` and `extract` in model mode with `setting_not_applicable`, so that CI and production runs make no model call (P03)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 25
title = "As a developer, I want two calls for the same entry and layout at once to compile it once, the second replaying the first's result, so that concurrent handlers never pay twice (golden scenario 08)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 26
title = "As a developer, I want a first compile and a Repair to be promoted only after the Run finishes `verified`, and otherwise kept pending for a person, so that a plausible wrong step is never kept for good (scenario 03's first failure point)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 27
title = "As a developer, I want a Plan with Effects to produce a reviewable diff before promotion unless the Recipe opts into auto-approval, so that an unreviewed new step never acts on the wrong control (ADR 0009)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 28
title = "As a developer, I want promotion to merge by entry, an entry two Runs both changed kept pending and never overwritten, so that parallel runs of one program do not lose each other's steps."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 29
title = "As a developer, I want the Run report's `PlanReport` to name the file, the version used, its status (`unchanged`, `promoted`, `pending_review`, `frozen`) and the steps changed, so that I see what became of my Plan (ADR 0102)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 30
title = "As a developer, I want a Plan file that cannot be read or does not match its format to fail with `plan_invalid` naming the file and the problem, and a Plan from a newer format to be refused with the upgrade message, so that an old library never misreads it (ADRs 0030, 0066)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 31
title = "As a developer, I want the Plan file written in JSON, snake_case, in a stable order, so that its diffs stay small and reviewable (P36)."
