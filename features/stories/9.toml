milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 34
title = "As a developer, I want Plans never to hold steps for Consent prompts a rule recognises, and a target hidden by newer Clean-up rules to be lifted before its check rather than read as Drift, so that cookie banners never make replay fail (ADRs 0047, 0048)."
