journey = false
not_journey = "part"
status = "active"

[[story]]
id = 60
title = "As a developer, I want the output's values held to Grounding (a page the task observed, one of my Agent tools' results, or a Value transform), an ungrounded value fed back once and then leaving `needs-review` naming the field, so that a made-up price is never `verified`."
