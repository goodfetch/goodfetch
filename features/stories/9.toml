journey = false
not_journey = "part"
status = "active"

[[story]]
id = 39
title = "As a developer, I want a Run whose program called `act` or `observe` to be `verified` only when a Success check evaluated after the last such call passed, and `needs-review` otherwise, so that an earlier check never vouches for a later action."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 40
title = "As a developer, I want a Run whose only AI steps are `extract` to be judged by Grounding, so that a pure extraction can be `verified` without a Success check."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 41
title = "As a developer, I want no model ever to judge a Success check, so that \"done\" is never proof (ADR 0013)."
