# Area 9's user stories (specs #601 and #602, AI and agent, Collie, parts 1
# and 2: stories 1 to 118), the declared `story:9-<id>` Features of ADR 0072,
# every story of spec #601's User Stories: each story is Collie's and due at
# M4 (ADRs 0058, 0094), and a story without a Journey carries ADR 0075's
# reason (`actor`, `part` or `reach`). The specs' issues keep the full text;
# this copy is the one the Feature check reads. Never renumber or reuse an
# ID: a removed story stays with `status = "retired"` and a `reason`.

[[story]]
id = 1
title = "As a developer, I want `page.act(\"click the love tag\")` to perform one action through the guard and return the action with its target as a locator and its `code` in my language, so that I can see and later hand-write what the model chose (AI-01, P36)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 2
title = "As a developer, I want the same three verbs on a locator, its element bounding what the model sees and may target, so that I scope an instruction without a second object (AI-01)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 3
title = "As a developer, I want `observe(instruction)` to return candidates, each with a plain locator, the model's description and its code, and an empty list when nothing fits, so that a question never throws (AI-02)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 4
title = "As a developer, I want `act` to fail with `target_not_found` when nothing fits, so that a missing control is never a silent no-op."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 5
title = "As a developer, I want `extract(instruction, schema)` to return my schema's output type, read in compiled mode by default, so that values are copied from the page with locators the model wrote once (AI-03, P03)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 6
title = "As a developer, I want `mode: \"model\"` on `extract`, or `extract.mode`, to read every page with the model, every value still held to Grounding and nothing kept in the Plan, so that per-page model extraction is an explicit choice (AI-03, ADR 0013)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 7
title = "As a developer, I want a required field not on the page to fail with `extraction_incomplete` naming each missing path and its reason and carrying the fields found, so that a missing price never reads as an empty one (P04, pitfall D02)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 8
title = "As a developer, I want answers that never pass my JSON Schema, my own validators or Grounding within the bounded retries to fail with `extraction_invalid`, carrying each field's issue, the model and the strategy, so that I know which field and which model failed (P19)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 9
title = "As a developer, I want my schema's own validators (a `.refine()`, a `@field_validator`, a custom `Deserialize`) run on each candidate inside the retry loop, the errors fed back to the model, and a validator that throws stopping the call with `schema_validator_failed`, so that my rules hold too (ADR 0082)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 10
title = "As a developer, I want `act(\"type %query% into the search box\", { variables })` to keep values out of the model, the Plan, logs and the Run trace, with the engine typing them at input, so that one Plan step serves every value (ADR 0091, ADR 0014)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 11
title = "As a developer, I want a placeholder that no variable fills to be a Secret placeholder bound by `secrets.<name>`, and a mismatch (an unfilled placeholder, an unused variable, a name that is both) to fail with `variables_mismatch` before any request, so that a typo never sends a literal `%name%` (ADR 0092)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 12
title = "As a developer, I want a Secret placeholder never typed on a browser other code may read, failing with `secret_input_refused`, so that a borrowed browser never sees my password typed by Collie (ADR 0092)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 13
title = "As a developer, I want `model` and `timeout` on every verb, `timeout.ai` (120 s) bounding the whole call, model calls and a Repair included, so that a first compile does not time out at the guard's 30 s (ADR 0091)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 14
title = "As a developer, I want each verb's result to carry `step.source` (`plan`, `model`, `repair` or `journal`), with the Drift on a repaired step, so that I know whether a model ran and why."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 15
title = "As a developer, I want an `act` whose Effect was sent before a failure to raise `effect_uncertain` and never be re-sent, so that a retried booking never books twice (ADR 0010)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 16
title = "As a developer, I want an `act` the Effect journal already holds to return `journal` without acting again, so that a resumed program skips what the site already received."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 17
title = "As a developer, I want a verb that would send a page to a model while `site_preferences.respect_use_signals` is on and the page's AI-use signal refuses my Purpose to fail with `site_preferences_refused` (`use_signals`) before anything is sent, while a replayed step runs, so that I honour site preferences without losing replay (ADRs 0085, 0086)."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 18
title = "As a developer, I want the verbs on a Borrowed page and on a popup as on any page, the Run holding their Plan, Limits and Usage, so that I add AI to a page I did not open (V3-01, ADR 0078)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 19
title = "As a developer, I want starting a Run with `plan: \"quotes.plan.json\"` to name a local file the SDK reads and writes next to my program, so that what my AI steps learned is a file I commit, on a local engine, a Daemon or Goodfetch Cloud alike (AI-12, V3-02, P26)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 20
title = "As a developer, I want each verb call to be one Plan entry keyed by the verb, the instruction with its placeholders, the scope locator and, for `extract`, the schema's hash, with one variant per page layout, so that branches and loops never break replay as positional keys do."
milestone = "M4 Everything else"
journey = false
not_journey = "part"
status = "active"

[[story]]
id = 21
title = "As a developer, I want a step the Plan holds to replay with no model call and say `plan`, so that a second run costs nothing (golden scenario 03)."
milestone = "M4 Everything else"
journey = true
status = "active"

[[story]]
id = 22
title = "As a developer, I want each target kept as a ladder of locators (role and name, test id, CSS, XPath) judged by its Target fingerprint, never one selector, so that a renamed class does not break the step and a look-alike is never clicked (pain 20, S09)."
