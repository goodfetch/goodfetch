#:schema ./journey.schema.json
id = "J-001"
title = "Start the Daemon and see it stop on its own once idle"
goal = """
A person starts the Daemon and leaves it unused. The Daemon MUST stop on its \
own once it has been idle for its idle time, so that it costs nothing when \
unused."""
area = 3
product = "collie"
status = "active"
covers = ["story:3-18"]

[surfaces]
cli = "M1"

[[steps]]
text = "Shorten the Daemon's idle time through its `daemon.idle_timeout` setting"
on = "cli"

[[steps]]
text = "Start the Daemon"
on = "cli"

[[steps]]
text = "Wait past the idle time with no Client connected"

[[expect]]
text = "The Daemon stops on its own once no Client has been connected for its idle time"
