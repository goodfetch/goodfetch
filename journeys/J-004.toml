#:schema ./journey.schema.json
id = "J-004"
title = "Follow a running Crawl in the Console: Runs, the run's drawer with its three axes, Datasets, Engine & settings"
goal = """
A person starts a Crawl with a run label and follows it in the local Console \
while it runs. The Console MUST list the run in Runs and find it by its \
label, show in the run's drawer its Lifecycle, Verdict and Completeness and \
its progress as they change and its Run report when it ends, list its Dataset \
in Datasets with the Records the Crawl committed, and show the engine's \
effective settings in Engine & settings; the Crawl MUST return every product \
of the site's catalog."""
area = 12
product = "foxhound"
status = "active"
covers = ["row:CN-03", "row:CN-04", "row:RT-15", "story:12-204", "story:12-205"]

[proving_ground]
seed = 4
tasks = [
  { id = "catalog/1", digest = "bc95f8eac3da924ce9035106311010a7236cbdc134bbeddab56ff6f20f9fc1fc" },
]

[surfaces]
console = "M1"

[[steps]]
text = "Start a Crawl of the catalog with a run label"
on = "cli"

[[steps]]
text = "Open Runs in the local Console and find the run by its label"

[[steps]]
text = "Open the run's drawer and follow the run until the Crawl ends"

[[steps]]
text = "Open the run's Dataset in Datasets"

[[steps]]
text = "Open Engine & settings"

[[expect]]
text = "Runs lists the run, and filtering by its label keeps it"

[[expect]]
text = "The run's drawer shows the run's Lifecycle, Verdict and Completeness and what is in flight and what waits as the Crawl goes on, then its Run report when it ends"

[[expect]]
text = "Datasets lists the run's Dataset with every Record the Crawl committed"

[[expect]]
text = "Engine & settings shows each effective setting's value"

[[expect]]
text = "The oracle verifies the Crawl's Records"
task = "catalog/1"
