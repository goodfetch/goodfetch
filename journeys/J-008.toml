#:schema ./journey.schema.json
id = "J-008"
title = "Crawl through a proxy, see a Block cause reported and the Session pool react"
goal = """
A person crawls a site through proxies, each reaching the site from an address \
of its own, and the site flags each address after ten pages. The run MUST \
report the Block cause of each flagged address, the Session pool MUST retire \
the Session that met it and go on through another proxy, and the Crawl MUST \
return every item of the site's list."""
area = 5
product = "foxhound"
status = "active"
covers = ["row:SA-22", "row:ST-08", "row:CO-12"]

[proving_ground]
seed = 8
tasks = [
  { id = "limits/2", digest = "772776900bc45fbb9db30810acc793e4c0dd7989880bdff0319a5bb55e382e32" },
]

[surfaces]
cli = "M1"

[[steps]]
text = "Give the Session pool three of the Proving ground's forward proxies, each reaching the site from an address of its own"

[[steps]]
text = "Crawl the site's list through the proxies"

[[expect]]
text = "The run reports the Block cause of each address the site flagged"

[[expect]]
text = "The Session pool retires each Session that met a flagged address and the Crawl goes on through another proxy"

[[expect]]
text = "The oracle verifies the Crawl's Records"
task = "limits/2"
