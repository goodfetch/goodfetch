#:schema ./journey.schema.json
id = "J-009"
title = "See where each setting's value comes from"
goal = """
A person sets settings at several layers and asks where each value comes \
from. For each effective value, `config explain` MUST show the value, the \
layer that set it and the layer that locked it, if any, so that the person \
can tell why a value applies."""
area = 3
product = "collie"
status = "active"
covers = ["row:RT-22", "story:3-89"]

[surfaces]
cli = "M1"

[[steps]]
text = "Set one setting in the user configuration, and set it and a second setting in the project configuration"
on = "cli"

[[steps]]
text = "Ask where each effective value comes from"

[[expect]]
text = "Each effective value is shown with the layer that set it and the layer that locked it, or none: the project configuration for the setting both configurations set, and the built-in default for a setting no layer set"

[[expect]]
text = "The setting both configurations set shows the project configuration's value, since no lower layer locked it"
