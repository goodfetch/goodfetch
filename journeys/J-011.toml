[[steps]]
text = "Crawl the product pages, extracting each product's fields from its text, its JSON-LD and its Open Graph metadata"

[[steps]]
text = "Extract the products the shop's script loads from its API"

[[steps]]
text = "Crawl the product pages whose class names churn, and those whose layout changes, extracting the same fields from each"

[[steps]]
text = "Extract every product of the huge page"

[[steps]]
text = "Crawl the product's regional pages, extracting each region's price as a plain decimal"

