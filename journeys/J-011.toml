#:schema ./journey.schema.json
id = "J-011"
title = "Extract fields and page metadata (JSON-LD, Open Graph) from product pages into Records"
goal = """
A person extracts each product's fields and page metadata from product pages \
into Records. The Records MUST hold every field the pages state, in their \
text, their schema.org JSON-LD and their Open Graph metadata, and they MUST \
stay right when the pages' class names churn, their layout changes, their \
products load from a hidden API, a page is huge, or a price is written in \
another region's format."""
area = 6
product = "foxhound"
status = "active"
covers = ["row:CO-14", "row:CO-19", "row:data-extraction-quality"]

[proving_ground]
seed = 11
