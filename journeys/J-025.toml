#:schema ./journey.schema.json
id = "J-025"
title = "Keep reading the Console through a stopped Daemon and offline, then reconnect"
goal = """
A person reads a run in the Console when the Daemon stops and the browser \
goes offline. The Console MUST keep showing what it showed, read-only under a \
banner with its actions disabled, while it has no connection, and MUST \
reconnect by itself once the Daemon starts again, taking the engine's \
snapshot where it no longer holds the Console's position, so that a dropped \
connection never loses a run's change or lets the person act on a stale \
view."""
area = 12
product = "collie"
status = "active"
covers = ["story:12-123", "story:12-125", "story:12-126"]

[proving_ground]
seed = 25

[surfaces]
console = "M1"

[[steps]]
text = "Start a run that reads the catalog"
on = "cli"

[[steps]]
text = "Open the run in the Console"

[[steps]]
text = "Stop the Daemon"
on = "cli"

[[steps]]
text = "Keep reading the run in the Console with the browser offline"

[[steps]]
text = "Bring the browser back online and start the Daemon again"
on = "cli"

[[expect]]
text = "While the Daemon is stopped, the Console shows a banner saying the page is read-only, and its actions are disabled"

[[expect]]
text = "The run's summary stays readable while the browser is offline"

[[expect]]
text = "Once the Daemon runs again, the Console reconnects by itself, the banner goes, and the run shows its latest state"
