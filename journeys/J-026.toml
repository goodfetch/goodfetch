#:schema ./journey.schema.json
id = "J-026"
title = "Raise a run's Limit from \"Needs you\", see it wait for its script, then start the program again with its Run ID and see it resume"
goal = """
A person's program reads the catalog until a Limit stops its run. The \
stopped run MUST appear in "Needs you" with the Limit that stopped it while \
that Limit has nothing left; a person MUST be able to raise the Limit there, \
and no program or agent MUST be able to raise it; once it is raised, the run \
MUST leave "Needs you" and the Console MUST say that the run waits for its \
script, offering its resume command to copy; and starting the program again \
with the run's Run ID MUST resume the run, which then finishes under the \
raised Limit."""
area = 12
product = "collie"
status = "active"
covers = ["story:12-23", "story:12-100"]

[proving_ground]
seed = 26
tasks = [
  { id = "catalog/1", digest = "9ceab2dcf0770b419ec84d94d31973dc3f3edfca5b55ee57d3175a08b2141026" },
]

[surfaces]
console = "M3"

[[steps]]
text = "Set a monthly Limit on the install's requests too small for reading the whole catalog"
on = "cli"

[[steps]]
text = "Run a program that reads every product of the catalog under a Run ID of its own, until the Limit stops its run"
on = "sdk-typescript"

[[steps]]
text = "Find the stopped run in \"Needs you\" and raise its Limit"

[[steps]]
text = "Copy the run's resume command"

[[steps]]
text = "Start the program again with the run's Run ID"
on = "sdk-typescript"

[[expect]]
text = "The Limit stopped the run, `stopped` and `incomplete`, and \"Needs you\" listed it with the Limit that stopped it"

[[expect]]
text = "The program could not raise the Limit itself: its call was refused with `person_required`"

[[expect]]
text = "Once the Limit was raised, the run left \"Needs you\", and the Console said it waits for its script and offered its resume command"

[[expect]]
text = "The program's second start answered `resumed`, and the run finished under the raised Limit"

[[expect]]
text = "The oracle verifies the resumed run's result"
task = "catalog/1"
