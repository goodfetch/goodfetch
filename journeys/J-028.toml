#:schema ./journey.schema.json
id = "J-028"
title = "Open a failed run from its consoleUrl, replay its Timeline and find its failure group"
goal = """
A developer's program fails a run in CI and prints the run's Run report. \
The report's `consoleUrl` MUST open that run's page in the Console, which \
MUST show the Run report as the engine produced it, with the reasons the \
run is not `verified` or not `complete` and the error that failed it; the \
developer MUST be able to replay the run's Run trace on its Timeline to the \
failing step, and to find the group of runs that failed for the same \
cause, so that a CI failure leads straight to what happened and how often \
it happens."""
area = 12
product = "collie"
status = "active"
covers = ["story:12-15", "story:12-16", "row:CN-02", "row:RT-16"]

[proving_ground]
seed = 28

[surfaces]
console = "M3"

[[steps]]
text = "Run a program that fails its run on a page of the catalog, under a Run ID of its own"
on = "sdk-typescript"

[[steps]]
text = "Open the run's consoleUrl from its Run report"

[[steps]]
text = "Read the run's Run report"

[[steps]]
text = "Replay the run's Timeline to its failing step"

[[steps]]
text = "Open the failure group the run belongs to"

[[expect]]
text = "The run's page shows its Run report: failed, with the reasons it is not verified and not complete, and the error that failed it in the Console's words"

[[expect]]
text = "The Timeline shows the failing step with the page as it was at that step"

[[expect]]
text = "The failure group lists the run among the runs that failed for the same cause"
