#:schema ./journey.schema.json
id = "J-031"
title = "Crawl with robots.txt turned off and find it in the Run report, the Audit log and the Records' Provenance"
goal = """
A person runs a crawl from a program with `site_preferences.respect_robots_txt` \
turned off, over a site whose robots.txt disallows part of it, then reads the \
Run report, exports the Audit log and reads the crawl's Records. Turning \
robots.txt off MUST be explicit and recorded: the Run report MUST list it in \
`weakened` with the layer that set it, the Audit log MUST hold one \
`politeness_weakened` entry for the run naming the key, its value, its \
built-in default and that layer, and each Record fetched from a URL the \
site's robots.txt disallows MUST carry `robots_txt: "ignored"` in its \
Provenance while a Record from an allowed URL carries no mark, so that who \
pressed a site, and which results were taken against its stated \
preferences, can be shown and removed (ADR 0086)."""
area = 4
product = "foxhound"
status = "active"
covers = [
  "row:SC-01",
  "row:compliance-site-owner-politeness",
  "story:4-117",
  "story:4-118",
]

[proving_ground]
seed = 31

[surfaces]
cli = "M1"
sdk-rust = "M2"
sdk-typescript = "M2"
sdk-python = "M2"

[[steps]]
text = "Run a crawl from a program over a page the site's robots.txt allows and one it disallows, with `site_preferences.respect_robots_txt` turned off for the run, each page's handler pushing a Record"

[[steps]]
text = "Read the run's report"

[[steps]]
text = "Export the Audit log"

[[steps]]
text = "Read the crawl's Records"

[[expect]]
text = "The Run report lists `site_preferences.respect_robots_txt` in `weakened`, set by the run"

[[expect]]
text = "The Audit log holds one `politeness_weakened` entry for the run, naming `site_preferences.respect_robots_txt`, its value `false`, its built-in default `true` and the run's layer"

[[expect]]
text = "The Record of the disallowed page carries `robots_txt: \"ignored\"` in its Provenance, and the Record of the allowed page carries no mark"
