#:schema ./journey.schema.json
# Golden scenario 03, area 9's spec (#602). The variants it makes proved, and
# the tickets that make each one proved:
# - sdk-typescript, sdk-python, sdk-rust: the Plan tracer (#865), a Run that
#   names a Plan file (#870), compiled `extract` (#902) and one Repair for a
#   drifted step (#893), with the Run's Verdict (#858) and Usage (#951).
# The CLI and MCP join once area 11 gives them a Plan file (spec #604).
id = "J-035"
title = "Repeat a program's AI steps from its Plan file with no model call, and repair only the step that drifted"
goal = """
A developer's program reads the Pro plan's monthly price with an AI step in a Run that names a Plan file next to the program, then runs again as the page changes. A step the Plan holds MUST replay with no model call and be reported as `plan`; where the page drifted, only the drifted step MUST go back to the model, for exactly one Repair, checked again and reported as `repair` with what drifted; every price read MUST be the page's price at that time; and each Run's report MUST name the Plan file, the version it used and what became of it."""
area = 9
product = "collie"
status = "active"
covers = ["story:9-19", "story:9-21", "story:9-23", "story:9-29", "row:AI-02", "row:AI-12", "row:AI-13", "row:V3-02"]

[proving_ground]
seed = 35
tasks = [
  { id = "agent/2", digest = "e956725a363fa4141955881ac348dccaf34d060eabbf1de67f1813dfac226407" },
]

[surfaces]
sdk-typescript = "M4"
sdk-python = "M4"
sdk-rust = "M4"

[[steps]]
text = "Point the Model provider setting at the Fake model through this variant's surface: the provider's base URL at the Proving ground's `model.test`"

[[steps]]
text = "Run a program that reads the Pro plan's monthly price with `extract` in a Run started with `plan: \"demo.plan.json\"`, a Plan file next to the program, at time step 0"

[[steps]]
text = "Start the Proving ground again from the same seed, keeping the Plan file"

[[steps]]
text = "Run the program again at each of the task's time steps in turn, 0 to 3"

[[expect]]
text = "The oracle verifies the price each run after the restart read at its time step"
task = "agent/2"

[[expect]]
text = "The first run compiled its step through the model, ended with the Verdict `verified`, and its `PlanReport` named `demo.plan.json` with the status `promoted`"

[[expect]]
text = "The run at time step 0 after the restart replayed its step from the Plan file with no model call: the step reported `plan`, and the Fake model served no call during it"

[[expect]]
text = "Where a later time step's page drifted, the drifted step got exactly one Repair, checked again and reported as `repair` with what drifted, and every step that had not drifted replayed as `plan`"

[[expect]]
text = "Each run's `PlanReport` named the file, the version it used, its status and the steps changed, and each run ended with the Verdict `verified`"

[[expect]]
text = "Each run's Usage equals the Fake model's own count of the calls it served during that run (`GET /model-calls`)"
