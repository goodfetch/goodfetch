#:schema ./journey.schema.json
id = "J-046"
title = "Develop against the Response cache, then test offline from a recording"
goal = """
A developer builds an automation against a live product page of a site \
under `cache.mode: "replay"`, re-runs it against the same Response cache \
so the site is fetched once, then records a Response recording of the \
program and runs it again offline with `recording.mode: "replay"`. The \
first run, the second cached run and the offline replayed run MUST each \
answer the product's fields verified by the oracle; the second run under \
cache replay MUST send the Proving ground no request; and the offline \
run from the Response recording MUST send the Proving ground no request \
and MUST list no miss in its Run report."""
area = 6
product = "collie"
status = "active"
covers = ["story:6-36", "story:6-52", "row:CO-31"]

[proving_ground]
seed = 43
tasks = [
  { id = "catalog/2", digest = "39d58a3a9d525d1f51a644f31f656b1fa22bbd9526dd2e6df3fdd30ffb521f5b" },
]

[surfaces]
sdk-typescript = "M2"
sdk-python = "M2"
sdk-rust = "M2"

[[steps]]
