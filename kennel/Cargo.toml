# The Kennel's workspace (ADR 0141): a tool of its own, apart from the
# Products, with its own lockfile and toolchain pin. The root workspace
# excludes this folder, and this `[workspace]` table stops Cargo's search
# for a parent one. Its only path dependency is `goodfetch-protocol`, whose
# `.workspace = true` fields resolve through the root workspace.
#
# - `goodfetch-kennel`: every module that needs no graphical toolkit (the
#   Client, the State, the settings, the Daemon start), built and tested on
#   every host, the display-less Linux gate's included;
# - `goodfetch-kennel-app`: the executable, `goodfetch-kennel`, with the
#   Tray on `tray-icon`, `muda` and `winit` (on Linux, on GTK's main loop),
#   which the Linux gate only lints, for macOS and for Linux (`just lint`'s
#   `ci/clippy-excluded.sh`), and does not test.
#
# Clippy reads the root `clippy.toml`, the nearest in a parent folder of
# each crate's manifest, so the Products' disallowed methods and types hold
# here too. Cargo passes no `[workspace.lints]`, `[workspace.package]` or
# `[workspace.dependencies]` to a nested workspace: the root's lints, its
# `rust-version` and the versions of the dependencies both declare are
# copied below, and `xtask kennel-manifest` (`just lint`) fails when one
# drifts from the root's.
[workspace]
resolver = "3"
members = ["crates/goodfetch-kennel", "crates/goodfetch-kennel-app"]

[workspace.package]
# The Kennel's own version (ADR 0141), not the Products'.
version = "0.0.0"
edition = "2024"
# The root's MSRV (ADR 0030): the Kennel builds goodfetch-protocol, which
# takes it.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goodfetch/goodfetch"
publish = false

[workspace.dependencies]
goodfetch-kennel = { path = "crates/goodfetch-kennel" }
goodfetch-protocol = { path = "../crates/goodfetch-protocol" }

anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
dirs = { version = "7.0.0", default-features = false }
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
rstest = { version = "0.27.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
# The Kennel settings view's edits, which keep the file's other keys and
# comments as written.
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt"] }
# The Tray (ADR 0141), at the versions #1915 checked on the owner's Mac.
tray-icon = { version = "=0.26.1" }
# Without its default `wayland-csd-adwaita`: the Tray opens no `winit`
# window, and the font parser those decorations bring (`ttf-parser`,
# RUSTSEC-2026-0192) is unmaintained. The event loop keeps both Linux
# backends, Wayland loaded at run time. The details window draws no
# decorations of its own either: on Wayland it takes the compositor's,
# where the compositor offers them (#2077).
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
# The details window (ADR 0141): glow, default features off, at the
# version #1915 measured on the owner's Mac; `x11` and `wayland` reach only
# Linux. No `default_fonts`: the window draws with the system's own fonts,
# read at its start, so no font file ships in the executable.
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "x11", "wayland"] }
# The Run controls' confirmations, a native message dialog on macOS and
# Windows, and "Copy resume command"'s clipboard, text only. On Linux the
# Tray's own GTK thread asks instead, so `rfd` starts no GTK thread beside it.
rfd = { version = "0.17.2", default-features = false }
# GTK 3 on Linux, whose main loop the Tray runs on a thread of its own:
# `tray-icon`'s AppIndicator backend and its `muda` menu are built on it, at
# the version they lock (#2077).
gtk = { version = "0.18.2", default-features = false }
arboard = { version = "3.7.0", default-features = false }
# The menu's closing on macOS, from AppKit's notification, at the versions
# `tray-icon` already locks.
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSButton", "NSControl", "NSMenu", "NSResponder", "NSRunningApplication", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSBundle", "NSError", "NSNotification", "NSOperation", "NSString"] }
# The desktop notices (ADR 0141): on macOS, `UNUserNotificationCenter` from
# the `.app`, at the versions #1915 checked on the owner's Mac; on Linux
# and Windows, `notify-rust`. On Linux it talks to the notification
# service through the system's libdbus (`d`), not its default `zbus` 5,
# whose `zvariant` crates RustSec lists as unmaintained since they merged
# into `zbus` 6, which no `notify-rust` release takes yet; and `zbus`'s
# own executor would start a thread outside the Kennel's runtime.
notify-rust = { version = "4.18.2", default-features = false, features = ["d"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# The root workspace's `[workspace.lints]`, copied (see above).
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(goodfetch_callgrind_names)", "cfg(goodfetch_loom)", "cfg(goodfetch_without_opentelemetry)", "cfg(tokio_unstable)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
exit = "deny"
iter_over_hash_type = "deny"
undocumented_unsafe_blocks = "deny"

# One executable of at most 6 MB, stripped, with LTO (ADR 0141's
# Performance targets); #1915 measured this profile at 4.77 MB.
[profile.release]
lto = true
codegen-units = 1
strip = true
