[package]
name = "automan-lab-http"
version = "0.1.0"
edition = "2024"
publish = false

# One adapter, two HTTP stacks: build with --features reqwest or --features wreq.
[features]
default = []
reqwest = ["dep:reqwest"]
wreq = ["dep:wreq"]

[dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"], optional = true }
wreq = { version = "=6.0.0-rc.31", optional = true }

[workspace]
