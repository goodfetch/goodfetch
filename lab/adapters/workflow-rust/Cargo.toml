[package]
name = "automan-workflow-rust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.53.2", features = ["full"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
regex = "=1.13.1"
sha2 = "=0.10.9"
uuid = { version = "=1.27.0", features = ["v4"] }
libc = "0.2"

[workspace]

[profile.release.build-override]
strip = false
debug = true
