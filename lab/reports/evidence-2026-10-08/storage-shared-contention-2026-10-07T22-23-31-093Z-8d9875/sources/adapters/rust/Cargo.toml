[package]
name = "automan-lab-spider"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
chrome = ["spider/chrome"]
smart = ["spider/smart"]

[dependencies]
spider = { version = "=2.53.9", default-features = false, features = ["basic", "sync"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
scraper = "0.24.0"

[workspace]

# Compile-time dylibs must remain loadable by dyld on macOS 27/Xcode 27.
# This does not change optimization of the benchmark executable.
[profile.release.build-override]
strip = false
debug = true
