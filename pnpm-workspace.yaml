# The one pnpm workspace (ADR 0032; STYLE.md, TypeScript). `rnd/lab` keeps a
# workspace of its own and is not part of this one.
packages:
  - sdks/typescript/*
  - adapters/*/*
  - adapters/*/*/tests/lowest-version
  - integrations/*/*
  - bench
  - website
  - conformance/*
  - test-support/typescript
  # The Collie scenario's sides of `just compare` (issue 2282): Collie's SDK and
  # Playwright, the workspace's own packages, so it needs no lock of its own.
  - xtask/compare-collie
  # The handled scenario's Foxhound program (issue 2317), on Foxhound's own
  # SDK.
  - xtask/compare-foxhound
  # The library Foxhound's tests use (story 11-180), a package of its own so
  # that pnpm reads its peer dependency on the Collie client package.
  - sdks/typescript/foxhound/tests/libraries/*

overrides:
  # The Allure report (`allure`, its `@allurereport/core` and `ci`) takes
  # glob 13, whose aborted walk keeps reading folders (GHSA-3g3m-2fjr-6pw4),
  # fixed in 14.0.2; it has no release that takes glob 14 (#1785). Remove
  # once its range resolves to 14.0.2 or later.
  "glob@>=9.0.0 <14.0.2": 14.0.3
  # StrykerJS 10.1.1 (`@stryker-mutator/core`, its newest) takes minimatch
  # ~10.2.4, and no 10.x fixes GHSA-g3hv-75wg-m249 (fixed in 11.0.1, whose
  # `minimatch` and `Minimatch` it calls are unchanged). Through
  # typed-rest-client ~2.3.0 it takes qs 6.15.1, which has GHSA-4mjr-xmp4-gh2g
  # and three others, fixed in 6.16.1. Remove each once StrykerJS's range
  # resolves to a fixed version.
  "@stryker-mutator/core>minimatch": 11.0.3
  # API Extractor 7.60.1 (`xtask sdk-api`, issue 148) pins minimatch 10.2.3,
  # with the same advisory; it calls only `minimatch`, unchanged in 11.
  # Remove once its pin is 11.0.1 or later.
  "@microsoft/api-extractor>minimatch": 11.0.3
  "typed-rest-client>qs": 6.17.1
  # Docusaurus 3.10.2 (`website/`, issue 149) pulls in older transitive versions
  # of minimatch (via serve-handler), serialize-javascript (via webpack plugins),
  # tinypool, and uuid with OSV advisories. Remove once Docusaurus upgrades them.
  "serve-handler>minimatch": 11.0.3
  "serialize-javascript@<7.0.3": 7.1.4
  "@docusaurus/core>tinypool": 2.2.0
  "uuid@<14.0.0": 14.0.3
  # Framework adapter and integration devDependencies pull older transitive
  # versions with OSV advisories: @mastra/core (1.0.0/1.35.0) and ai@6/7.0.0
  # pull @ai-sdk/provider-utils <3.0.28/<4.0.33/<5.0.1 (GHSA-866g-f22w-33x8);
  # @activepieces/shared@0.95.1 pins expr-eval@2.0.2 (GHSA-q9v2-7m5w-4693 et al.,
  # no upstream fix -> MIT drop-in expr-eval-fork), deepmerge-ts@7.1.0
  # (GHSA-ggr8-5vv4-36mx) and nanoid@3.3.8 (GHSA-28wg-ghj8-5hjv et al.);
  # n8n-workflow, @activepieces/pieces-framework and @mastra/core@1.0.0 pull
  # zod <4.6.6 (GHSA-mrhx-c7xc-m3w5). Remove each once upstream upgrades.
  "@ai-sdk/provider-utils@<3.0.28": 3.0.48
  "@ai-sdk/provider-utils@>=4.0.0 <4.0.33": 4.0.69
  "@ai-sdk/provider-utils@>=5.0.0 <5.0.1": 5.0.85
  "@mastra/core>@ai-sdk/provider-utils-v5": npm:@ai-sdk/provider-utils@3.0.48
  "@mastra/core>@ai-sdk/provider-utils-v6": npm:@ai-sdk/provider-utils@4.0.69
  "undici@<7.0.0": 7.30.2
  "@n8n/node-cli>handlebars": 4.7.10
  "minimatch@<11.0.1": 11.0.3
  "@activepieces/shared>expr-eval": npm:expr-eval-fork@3.0.3
  "@activepieces/shared>deepmerge-ts": 8.0.2
  "@activepieces/shared>nanoid": 3.3.20
  "zod@<4.6.6": 4.6.7

# One version of each shared tool for every package. Playwright's entry is
# shared by Playwright Test and Vitest's browser provider (ADR 0068).
catalog:
  "@playwright/test": 1.64.1
  "@types/node": 26.6.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  allure: 3.20.1
  jscpd: 5.4.3
  oxfmt: 0.73.0
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  playwright: 1.64.1
  typescript: 7.0.2
  vitest: 5.0.5

# Install scripts that never run (STYLE.md, Dependencies: nothing a build
# downloads). esbuild, which Vite brings, only
# checks there its platform binary, which pnpm installs as its optional
# dependency for the host.
allowBuilds:
  esbuild: false
  # Docusaurus's core-js (website/) only prints a funding notice.
  core-js: false
  # Transitive optional/dev dependencies of `@n8n/node-cli` (lint-only) and
  # `@activepieces/pieces-framework`: no native install script runs.
  cpu-features: false
  eslint-plugin-n8n-nodes-base: false
  isolated-vm: false
  ssh2: false
  # `@modelcontextprotocol/inspector` postinstall only tries to install optional clients;
  # its prebuilt CLI (`--cli`) runs directly without running install scripts.
  "@modelcontextprotocol/inspector": false

# Fixes to dependencies, each upstreamable; remove one once a release has it.
# The local search (website/src/search.ts) builds a section's index with the
# root pages, and matches a section in its version (ADR 0097); its search bar
# and search page pass axe (ADR 0073).
# n8n-workflow@2.49.6 uses Zod v3 APIs (`z.string().ip()`), so it imports from
# `zod/v3` while the workspace overrides zod to 4.6.7 (GHSA-mrhx-c7xc-m3w5).
patchedDependencies:
  "@easyops-cn/autocomplete.js@0.38.1": patches/@easyops-cn__autocomplete.js@0.38.1.patch
  "@easyops-cn/docusaurus-search-local@0.55.3": patches/@easyops-cn__docusaurus-search-local@0.55.3.patch
  n8n-workflow@2.49.6: patches/n8n-workflow@2.49.6.patch
