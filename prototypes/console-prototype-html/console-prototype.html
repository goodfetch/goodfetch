function items(){const out=[];for(const r of RUNS){if(st.resolved[r.id])continue;

  if(r.uncertain)out.push({id:r.id+':uncertain',run:r.id,kind:'Uncertain Effect',title:'Did the order go through? '+rname(r),sub:r.uncertain.effect});
  if(r.repair&&!r.repair.auto)out.push({id:r.id+':diff',run:r.id,kind:'Plan diff review',title:'Review '+rname(r)+' Plan '+r.repair.from+' → '+r.repair.to,sub:'Plan has Effects; repaired in a verified run'});
  if(r.limit&&r.life==='stopped')out.push({id:r.id+':limit',run:r.id,kind:'Limit reached',title:'Raise the Limit and resume '+rname(r),sub:r.stopReason});

 }return out}

function lifeChip(r){if(r.life==='running')return r.wait?'<span class="chip warn">Running · 1 Session waiting: '+h(r.wait.kind)+'</span>':'<span class="chip run">Running</span>';

const SCREENS={home:homeScreen,needs:needsScreen,runs:runsScreen,run:runScreen,live:liveScreen,recipes:recipesScreen,recipe:recipeScreen,datasets:datasetsScreen,sessions:sessionsScreen,plans:plansScreen,settings:settingsScreen};

// ---------- Variant F: Drawers (E's menu; details slide in from the right; a pinnable Activity panel) ----------
const findSession=id=>{for(const r of RUNS){const s=r.sessions.find(x=>x.id===id);if(s)return {s,r}}};
function sessionDetail(id){const f=findSession(id);if(!f)return '<p class="muted">This Session no longer exists.</p>';const {s,r}=f;const browser=s.where.includes('Chromium');
 return `<div class="small muted">Session of run <a href="#" data-run="${r.id}">${r.id} ${h(rname(r))}</a></div><div class="row between wrap"><h1 class="mono">${s.id}</h1><span class="chip ${s.state.startsWith('waiting')?'warn':s.state==='active'?'run':''}">${h(s.state)}</span></div>
 ${browser&&r.life==='running'?liveView(r):''}
 <div class="card pad"><dl class="facts"><dt>Access mode</dt><dd>${s.mode} (fixed for the Session's life)</dd><dt>Identity profile</dt><dd>Chrome 141 · macOS · fr-FR · Europe/Paris · TLS and HTTP/2 consistent</dd><dt>Proxy</dt><dd>${s.proxy}</dd><dt>Browser runs in</dt><dd>${s.where}</dd><dt>Page check</dt><dd>${r.id==='R-2042'?'off (results marked unchecked)':'declared: expected page and login page'}</dd><dt>Pool score</dt><dd>${s.state==='retired'?'retired after E_PAGE_CHECK':'0.94 · 0 blocks in 40 pages'}</dd><dt>Cookies</dt><dd>${browser?'23 across 12 domains, kept in run state':'4'}</dd></dl></div>
 <h3>What this Session did</h3><div class="card"><table><tbody>${r.steps.map(x=>`<tr><td class="small">${h(x.op)}</td><td>${clsChip(x.cls)}</td><td class="small muted">${h(x.dur)}</td></tr>`).join('')}</tbody></table></div>
 <div class="row wrap"><button class="btn" data-act="toast" data-msg="Saved as an identity: cookies and login state, reusable by other runs (simulated)">Save as identity</button><button class="btn" data-act="toast" data-msg="Exported as an age-encrypted bundle (simulated)">Export</button>${browser?'<button class="btn" data-act="toast" data-msg="Raw CDP: short-lived token, audited; results marked unguarded while attached (simulated)">Attach raw CDP…</button>':''}<button class="btn danger" data-act="toast" data-msg="Session retired; its work moves to a new Session (simulated)">Retire</button></div>`}
function drawerBody(d){if(d.type==='run'){const r=run(d.id);return runHeader(r)+attentionBanner(r)+runTabs(r)}if(d.type==='session')return sessionDetail(d.id);const it=items().find(i=>i.id===d.id);return it?decision(it):'<h1>Answered</h1><p class="muted">This item no longer needs you. The answer is in the Audit log.</p>'}
const dTitle=d=>d.type==='run'?'Run '+d.id:d.type==='session'?'Session '+d.id:'Needs you';
function drawer(){if(!st.drawers.length)return '';const d=st.drawers[st.drawers.length-1];
 return `<div class="drawer-scrim" data-act="drawer-close-bg"></div><aside class="drawer" role="dialog" aria-label="${h(dTitle(d))}"><div class="row between wrap"><div class="row small wrap">${st.drawers.map((x,i)=>`${i?'<span class="muted">›</span>':''}<a href="#" data-act="drawer-to" data-i="${i}">${h(dTitle(x))}</a>`).join('')}</div><div class="row"><button class="btn quiet" data-act="drawer-full">Open as page</button><button class="btn" data-act="drawer-close">Close</button></div></div>${drawerBody(d)}</aside>`}
const EVENTS=[['10:31:08','R-2051','record #812 committed'],['10:31:07','R-2049','human_pause confirmation (payment €184.20)','w'],['10:31:02','R-2051','frontier rule learned: drop utm_* (12 URLs merged)'],['10:30:55','R-2049','effect add_to_cart x6 journaled'],['10:12:40','R-2050','human_pause mfa (push)','w'],['10:12:31','R-2050','secret used keychain:automan/supplier'],['10:05:12','R-2049','run started by MCP · Claude Code'],['09:58:03','R-2050','run started by Python SDK · workers=4'],['09:41:20','R-2048','plan pricing v8 promoted automatically'],['08:43:00','R-2046','limit reached $2.00 est. · stopped, resumable','w']];
function dockPanel(){const its=items();const t=st.dockTab||'needs';
 return `<aside class="dock"><div class="row between"><b>Activity</b><button class="btn" data-act="dock">Unpin</button></div><div class="tabs"><button class="tab" aria-selected="${t==='needs'}" data-dt="needs">Needs you · ${its.length}</button><button class="tab" aria-selected="${t==='events'}" data-dt="events">Events</button></div>
 ${t==='needs'?its.map(i=>`<button class="qitem" data-act="open-item" data-item="${i.id}"><i style="${i.urgent?'':'background:var(--line)'}"></i><span><span class="small muted">${h(i.kind)}</span><br><b class="small">${h(i.title)}</b></span></button>`).join('')||'<p class="small muted pad">Nothing needs you.</p>'
 :`<div class="stream">${EVENTS.map(([tm,r,e,w])=>`<a href="#" class="ev ${w||''}" data-run="${r}" style="display:block;color:inherit;text-decoration:none"><span style="color:#8a9bb8">${tm}</span> <b>${r}</b><br>${h(e)}</a>`).join('')}</div>`}<p class="small muted">Pinned, it stays open on every screen. Anything you click here opens in the drawer.</p></aside>`}
function handleF(e,t,d){const inDrawer=!!t.closest('.drawer');const push=x=>{if(inDrawer)st.drawers.push(x);else st.drawers=[x];render()};
 if(d.act==='drawer-close'||(d.act==='drawer-close-bg')){st.drawers=[];st.control=false;return render()}
 if(d.act==='drawer-to'){st.drawers=st.drawers.slice(0,+d.i+1);return render()}
 if(d.act==='drawer-full'){const x=st.drawers.pop();st.drawers=[];if(x.type==='run'){st.sel.run=x.id;return go('run')}if(x.type==='session')return go('sessions');st.sel.item=x.id;return go('needs')}
 if(d.act==='dock'){st.dock=!st.dock;return render()}
 if(d.dt){st.dockTab=d.dt;return render()}
 if(d.act==='open-item')return push({type:'item',id:d.item});
 if(d.act==='live')return push({type:'session',id:run(d.run).sessions[0].id});
 if(d.act==='goto-run')return push({type:'run',id:d.run});
 if(d.session)return push({type:'session',id:d.session});
 if(d.run&&!d.act){st.tab='timeline';st.step=-1;return push({type:'run',id:d.run})}
 return handleE(e,t,d)}

// ---------- render & events ----------
function render(){if(st.variant==='E'||st.variant==='F'){$('#app').innerHTML=shell(SCREENS[st.route]());$('#sheet-root').innerHTML=sheet()+(st.variant==='F'?drawer():'');document.body.classList.toggle('docked',st.variant==='F'&&st.dock)}else{$('#app').innerHTML={A:VariantA,B:VariantB,C:VariantC,D:VariantD}[st.variant]();$('#sheet-root').innerHTML=sheet()+itemSheet()}
 $('#swlbl').textContent=st.variant+' ('+VARIANTS[st.variant]+')'}
function setVariant(v){st.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);st.route='home';st.openItem=null;st.sheet=null;st.drawers=[];render();scrollTo(0,0)}
function go(route){st.route=route;st.control=false;render();document.querySelector('.main')?.scrollTo(0,0)}
function handleV1(e,t,d){
 
 if(d.act){e.preventDefault();const a=d.act;
  if(a==='toast')toast(d.msg);
  if(a==='create'){st.sheet='create';st.wiz={step:0,kind:null}}if(a==='settings')st.sheet='settings';if(a==='code')st.sheet='code';
  if(a==='close-sheet'||(a==='close-sheet-bg'&&e.target===t))st.sheet=null;if(a==='close-item'||(a==='close-item-bg'&&e.target===t))st.openItem=null;
  if(a==='kind')st.wiz.kind=d.kind;if(a==='wiz')st.wiz.step=+d.to;
  if(a==='start'){const id='R-'+st.nextId++;RUNS.unshift({id,recipe:'catalog',client:'Console',started:'now',life:'running',verdict:null,comp:null,epoch:1,records:0,progress:.05,marks:[],sessions:[{id:'s-new-'+id,mode:'standard',proxy:'none',where:'HTTP (no browser)',state:'active'}],usage:{requests:3,browser:'0 s',tokens:'—',proxy:'—',solver:0,cost:null},limit:{kind:'currency',used:0,cap:1},steps:[S('Sample comparison of fetch tiers','read','run','running',{facts:[['Pages compared','0 of 5']],code:'tier: comparing'})]});st.sheet=null;st.sel.run=id;st.nav='runs';st.inboxTab='activity';st.tab='timeline';st.step=-1;toast(id+' started from the Console (simulated)')}
  if(a==='open-item'){if(st.variant==='B'){st.inboxTab='needs';st.sel.item=d.item}else st.openItem=d.item}
  if(a==='resolve'){st.resolved[d.run]=true;const r=run(d.run);if(r.wait){r.wait=null;r.sessions[0].state='active'}st.openItem=null;st.control=false;toast(d.msg)}
  if(a==='control')st.control=!st.control;if(a==='live'){st.tab='sessions';toast('Live view: in this prototype it is shown on the pause panel and in variant D')}
  if(a==='goto-run'){st.sel.run=d.run;st.nav='runs';st.inboxTab='activity';st.openItem=null;st.tab='timeline';st.sel.tile=run(d.run).sessions[0].id;if(st.variant==='C'){st.sel.recipe=run(d.run).recipe||'_adhoc';st.rtab='runs'}}
  if(a==='lib-home')st.sel.recipe=null;if(a==='d-backlog')st.dBacklog=!st.dBacklog;
  render();return}
 if(d.nav){st.nav=d.nav;if(d.nav==='needs'){const f=RUNS.find(r=>items().some(i=>i.run===r.id));if(f)st.sel.run=f.id}}
 if(d.tab){st.tab=d.tab;st.step=-1}if(d.step!==undefined)st.step=+d.step;if(d.ib)st.inboxTab=d.ib;if(d.rtab){st.rtab=d.rtab}if(d.tile){st.sel.tile=d.tile;st.tab='timeline';st.step=-1}
 if(d.item&&!d.act)st.sel.item=d.item;
 if(d.run&&!d.act){st.sel.run=d.run;st.tab='timeline';st.step=-1}
 if(d.recipe){st.sel.recipe=d.recipe;st.rtab='overview'}
 render()}
function handleE(e,t,d){
 
 if(d.act){const a=d.act;
  if(a==='toast')toast(d.msg);
  if(a==='create'){st.sheet='create';st.wiz={step:0,kind:null}}if(a==='code')st.sheet='code';
  if(a==='close-sheet'||(a==='close-sheet-bg'&&e.target===t))st.sheet=null;
  if(a==='kind')st.wiz.kind=d.kind;if(a==='wiz')st.wiz.step=+d.to;
  if(a==='start'){const id='R-'+st.nextId++;RUNS.unshift({id,recipe:'catalog',client:'Console',started:'now',life:'running',verdict:null,comp:null,epoch:1,records:0,progress:.05,marks:[],sessions:[{id:'s-new-'+id,mode:'standard',proxy:'none',where:'HTTP (no browser)',state:'active'}],usage:{requests:3,browser:'0 s',tokens:'—',proxy:'—',solver:0,cost:null},limit:{kind:'currency',used:0,cap:1},steps:[S('Sample comparison of fetch tiers','read','run','running',{facts:[['Pages compared','0 of 5']],code:'tier: comparing'})]});st.sheet=null;st.sel.run=id;st.tab='timeline';st.step=-1;toast(id+' started from the Console (simulated)');return go('run')}
  if(a==='open-item'){st.sel.item=d.item;return go('needs')}
  if(a==='resolve'){st.resolved[d.run]=true;const r=run(d.run);if(r.wait){r.wait=null;r.sessions[0].state='active'}st.control=false;st.sel.item=null;toast(d.msg)}
  if(a==='control')st.control=!st.control;if(a==='live'){st.sel.tile=run(d.run).sessions[0].id;return go('live')}
  if(a==='goto-run'){st.sel.run=d.run;st.tab='timeline';st.step=-1;return go('run')}
  return render()}
 if(d.go)return go(d.go);
 if(d.recipe){st.sel.recipe=d.recipe;return go('recipe')}
 if(d.run){st.sel.run=d.run;st.tab='timeline';st.step=-1;return go('run')}
 if(d.hv)st.homeView=d.hv;if(d.item)st.sel.item=d.item;if(d.tab){st.tab=d.tab;st.step=-1}if(d.step!==undefined)st.step=+d.step;if(d.tile)st.sel.tile=d.tile;if(d.filter)st.filter=d.filter;
 render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-sw],[data-go],[data-run],[data-tab],[data-step],[data-nav],[data-item],[data-ib],[data-recipe],[data-rtab],[data-tile],[data-filter],[data-hv],[data-session],[data-dt]');if(!t)return;const d=t.dataset;
 if(d.sw){const k=Object.keys(VARIANTS);const i=k.indexOf(st.variant);if(d.sw==='notes'){const n=$('#notes');n.hidden=!n.hidden;return}setVariant(k[(i+(d.sw==='next'?1:k.length-1))%k.length]);return}
 if(st.variant==='F'){e.preventDefault();return handleF(e,t,d)}
 if(d.session&&!d.act){e.preventDefault();const f=findSession(d.session);st.sel.run=f.r.id;st.tab='sessions';if(st.variant==='E')return go('run');st.nav='runs';st.inboxTab='activity';return render()}
 if(st.variant==='E'){e.preventDefault();return handleE(e,t,d)}return handleV1(e,t,d)});
document.addEventListener('keydown',e=>{const el=document.activeElement;if(el&&(el.matches('input,textarea,select,[contenteditable]')))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const k=Object.keys(VARIANTS);const i=k.indexOf(st.variant);setVariant(k[(i+(e.key==='ArrowRight'?1:k.length-1))%k.length])}if(e.key==='Escape'){st.sheet=null;st.openItem=null;st.drawers.pop();render()}});
$('#notes').innerHTML=`<h3>How to read this prototype</h3>Six variants of the <b>whole Console</b>. Every variant has the same engine state (10 runs, 6 items that need you) and the same flows; they differ in what the Console opens on and how you move around.<br><b>A Workbench</b>: the run is what people open; a rail lists the libraries. <b>B Inbox</b>: the Console opens on what waits for a person. <b>C Library</b>: Recipes are home; runs, Plan, data and Sessions live inside each. <b>D Live</b>: running Sessions and the event stream first. <b>E Side menu</b>: every screen listed (Home, Needs you, Runs, Live, Recipes, Datasets, Sessions &amp; identities, Plans &amp; Repairs, Engine &amp; settings); its Home lets the person switch between Table and Board. <b>F Drawers</b>: E's menu, but a run, a Session (live view, Identity profile, proxy, cookies, raw CDP) or a decision opens in a drawer from the right over the current screen, and drawers stack (run › Session); "Pin Activity" docks Needs you and the event stream on the right of every screen.
<h3>Proposals not in any ADR</h3>Run lifecycle: <code>running</code> (Sessions may wait), <code>stopped</code> (Limit or abort, resumable), <code>finished</code>, <code>failed</code>; the verdict (Verified result / Needs review) and Completeness are separate axes.<br>Reconciling an uncertain Effect: <i>It happened</i> / <i>It did not happen</i> / <i>Leave uncertain</i>, audited.<br>"Needs you" kinds: Human pause (login, MFA, CAPTCHA, confirmation, review), uncertain Effect, Plan diff review, Limit reached, result needs review.<br>Money only as an estimate beside a Limit; Usage stays in units.
<h3>Flows to try in any variant</h3>MFA pause with live view and take control · payment confirmation · uncertain Effect · Plan diff v4→v5 · Limit reached → raise and resume · agent result needs review · New → kind → form → compiled config review → run.
<h3>Left out on purpose</h3>Scheduling (fog on the map), cloud-only screens (ADR 0018), pricing.`;
render();
