[package]
name = "goodfetch-proving-ground"
description = "The Proving ground: Goodfetch's seeded website, its task list and its oracle (ADRs 0025, 0032 and 0063)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Its dependency direction is the Proving ground's reason to be a crate: it
# takes no Goodfetch crate but `goodfetch-test-support`, so it never judges
# with the code it judges (ADR 0032; `xtask dependency-direction`).
[dependencies]
anyhow.workspace = true
brotli.workspace = true
clap.workspace = true
crc32fast.workspace = true
data-encoding.workspace = true
dom_query.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
form_urlencoded.workspace = true
hmac.workspace = true
http-body-util.workspace = true
httparse.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server-auto", "http1", "http2"] }
loona-hpack.workspace = true
p256 = { workspace = true, features = ["ecdsa", "pkcs8", "std"] }
pulldown-cmark.workspace = true
rcgen = { workspace = true, features = ["pem"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
# Describes its interface (`interface.rs`) for the JSON Schemas test support
# commits.
schemars.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha1.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros", "io-util", "time", "sync", "process"] }
tokio-rustls = { workspace = true, features = ["ring"] }
tokio-util = { workspace = true, features = ["rt"] }
url.workspace = true
toml.workspace = true
web-bot-auth.workspace = true
goodfetch-workspace-hack.workspace = true

[dev-dependencies]
data-encoding.workspace = true
ed25519-dalek = { workspace = true, features = ["std"] }
flate2.workspace = true
goodfetch-test-support.workspace = true
indexmap = { workspace = true, features = ["std"] }
h2 = { workspace = true }
hmac.workspace = true
httpdate.workspace = true
proptest.workspace = true
regex.workspace = true
rstest.workspace = true
sha1.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { workspace = true }
ureq.workspace = true

[lints]
workspace = true
