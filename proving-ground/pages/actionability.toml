# Forms: type `Goodfetch` into the name, choose EU, tick the consent box and
# save once; the save reports what the form held and whether the name field
# received a trusted input event.

[[tasks]]
name = "form"
kind = "submit"
description = "Fill the form: type `Goodfetch` as the name, choose the region EU, tick the consent box, then press Save once."
effects = [{ event = "submit", target = "submit", trusted = true, details = { name = "Goodfetch", region = "eu", consent = "true", typed = "true" } }]
[tasks.pages]
"/" = '''<!doctype html><html><body><output id="done"></output><label>Name <input id="name" name="name"></label><select id="region"><option value="us">US</option><option value="eu">EU</option></select><input type="checkbox" id="consent"><button id="submit">Save</button><script src="/effects.js"></script><script>
const events = [];
for (const type of ['input', 'change']) document.addEventListener(type, event => events.push({ type, id: event.target.id, trusted: event.isTrusted }));
document.querySelector('#submit').addEventListener('click', async event => {
  const typed = events.some(e => e.id === 'name' && e.type === 'input' && e.trusted);
  await post({ event: 'submit', target: 'submit', trusted: event.isTrusted, details: { name: document.querySelector('#name').value, region: document.querySelector('#region').value, consent: String(document.querySelector('#consent').checked), typed: String(typed) } });
  done();
});
document.body.dataset.ready = 'true';
</script></body></html>'''

