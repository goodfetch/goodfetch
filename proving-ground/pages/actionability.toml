# The `actionability` family's hand-made pages and their hand-written expected
# results (spec #152, story 29), ported from the lab's actionability,
# primitive and form fixtures for ADR 0019's guard matrix. Each task is served
# on its own host name, `<ordinal>.actionability.test`, where an ordinal is the
# task's place in this file from 1: append a task, never reorder or remove one
# (ADR 0063).
#
# A page's script posts each event that reaches one of its controls to
# `/effects` (the shared `/effects.js`), with the browser's `isTrusted`; the
# Proving ground records it as the task's Effect, and the oracle requires
# exactly the `effects` listed: one trusted event of the right kind on the
# right control, none on a decoy, none twice. A task with `refusal = true` has
# no right Effect: the tool must report a failure and carry out nothing.

[shared]
"/effects.js" = '''
// Posts an event that reached a control to the Proving ground, which records
// it as the task's Effect; `done` marks the page's expected end state.
const post = effect => fetch('/effects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(effect) });
const done = () => { document.querySelector('#done').textContent = 'done'; };
'''

# Actionability: one click on `#target` once it is actionable.

[[tasks]]
name = "normal"
kind = "act"
description = "Click the button labelled Target once."
effects = [{ event = "click", target = "target", trusted = true, details = { ready = "true" } }]
[tasks.pages]
"/" = '''<!doctype html><html><body><output id="done"></output><button id="target">Target</button><script src="/effects.js"></script><script>
let ready = true;
const target = document.querySelector('#target');
target.addEventListener('click', async event => { await post({ event: 'click', target: 'target', trusted: event.isTrusted, details: { ready: String(ready) } }); done(); });
document.body.dataset.ready = 'true';
</script></body></html>'''

[[tasks]]
name = "overlay"
kind = "act"
description = "Click the button labelled Target once. An overlay covers it for a moment after the page loads."
effects = [{ event = "click", target = "target", trusted = true, details = { ready = "true" } }]
[tasks.pages]
"/" = '''<!doctype html><html><body><output id="done"></output><button id="target">Target</button><script src="/effects.js"></script><script>
let ready = false;
const target = document.querySelector('#target');
target.addEventListener('click', async event => { await post({ event: 'click', target: 'target', trusted: event.isTrusted, details: { ready: String(ready) } }); done(); });
const overlay = document.createElement('div');
overlay.id = 'overlay';
overlay.style = 'position:fixed;inset:0;z-index:100;background:#fff8';
overlay.addEventListener('click', event => post({ event: 'click', target: 'overlay', trusted: event.isTrusted, details: { ready: String(ready) } }));
document.body.append(overlay);
setTimeout(() => { overlay.remove(); ready = true; }, 180);
document.body.dataset.ready = 'true';
</script></body></html>'''

