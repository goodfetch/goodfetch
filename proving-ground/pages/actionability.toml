[tasks.pages]
"/" = '''<!doctype html><html><body style="margin:0;font:16px sans-serif"><output id="done"></output><div id="source" style="position:absolute;left:100px;top:100px;width:80px;height:80px;background:#68a;touch-action:none"></div><div id="dropzone" style="position:absolute;left:400px;top:100px;width:120px;height:120px;border:2px dashed #333"></div><script src="/effects.js"></script><script>
let dragging = false, moves = 0;
source.addEventListener('pointerdown', () => { dragging = true; moves = 0; });
document.addEventListener('pointermove', () => { if (dragging) moves++; });
document.addEventListener('pointerup', async event => {
  if (!dragging) return;
  dragging = false;
  if (dropzone.contains(document.elementFromPoint(event.clientX, event.clientY))) { await post({ event: 'drop', target: 'dropzone', trusted: event.isTrusted, details: { moved: String(moves >= 1) } }); done(); }
});
document.body.dataset.ready = 'true';
</script></body></html>'''

[[tasks]]
name = "wheel"
