[tasks.pages]
"/" = '''<!doctype html><html><body style="margin:0;font:16px sans-serif"><output id="done"></output><div id="scroller" style="position:absolute;left:100px;top:100px;width:300px;height:200px;overflow:auto"><div style="height:2000px"></div></div><script src="/effects.js"></script><script>
