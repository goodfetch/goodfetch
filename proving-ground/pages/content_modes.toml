# The `extraction` family's content-mode pages (spec #580, ticket #785):
# pages a program reads in every form `page.formats` gives, each with what
# each form holds, written by hand. `markdown` is the main content's
# Markdown, `markdown_full` the whole body's and `markdown_fit` the main
# content's without its link-dense blocks (more than half their text in
# links), image-only blocks and the navigation lists the page repeats;
# each is judged by structure (`src/markdown.rs`). `html_main` is the main
# content's HTML, judged by its blocks' text (`src/html.rs`), as the page's
# own HTML is for the raw and cleaned HTML, which no cosmetic rule changes
# here. `text` is the main content's text, judged white space aside. Served
# at `/content-modes/<path>` on `extraction.test`, and listed by
# `/content-modes`, task `extraction/8`'s start page. Append a page, never
# reorder or remove one (ADR 0063).

[[pages]]
path = "navigation-and-related"
html = '''
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Kite Journal | Northwind</title></head>
<body>
<header><nav><ul class="site"><li><a href="/">Home</a></li><li><a href="/shop">Shop</a></li><li><a href="/journal">Journal</a></li></ul></nav></header>
<main>
<article>
<h1>Choosing a kite line</h1>
<p>A kite line has to be strong enough for the pull of the kite in the strongest wind you fly in, and light enough that it does not sag between your hand and the kite on a calm day.</p>
<p>Braided polyester is the usual choice for single-line kites: it stretches a little, which softens gusts, and it is cheap enough to replace when it frays on a rough reel.</p>
<p>Read also <a href="/journal/bridle">Setting the bridle</a>, <a href="/journal/reels">Reels and winders</a> and <a href="/journal/knots">Three knots for the field</a>.</p>
<figure><img src="/images/line.jpg" alt=""></figure>
<p>Dyneema lines are thinner for the same strength and barely stretch, so a stunt kite answers your hands at once, but they cut skin and other lines when they rub.</p>
<p>Wherever you fly, wear gloves when the wind rises, and wind the line onto the reel under a little tension so that it does not bite into itself.</p>
<ul class="more"><li><a href="/">Home</a> (start here)</li><li><a href="/shop">Shop</a> (lines and reels)</li><li><a href="/journal">Journal</a> (more articles)</li></ul>
</article>
</main>
<footer><p>Copyright 2026 Northwind Kites. All rights reserved.</p></footer>
</body>
</html>
'''
