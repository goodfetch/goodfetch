<body>
<header><p><a href="/">Northwind Kites</a></p></header>
<article>
<h1>Three reels compared</h1>
<p>A reel holds the line you are not flying and lets you wind it in quickly when the wind drops, so the right one depends on how much line you fly and how hard the kite pulls.</p>
<figure><img src="/images/reels.jpg" alt="Three reels on a bench"><figcaption>The hoop, the winder and the geared reel, left to right.</figcaption></figure>
<table><caption>What each reel holds</caption><thead><tr><th>Reel</th><th>Line</th></tr></thead><tbody><tr><td>Hoop</td><td>100 m</td></tr><tr><td>Winder</td><td>60 m</td></tr><tr><td>Geared</td><td>300 m</td></tr></tbody></table>
<p>A hoop is cheap and light; a geared reel winds in three times as fast but weighs as much as a small kite, which matters on a long walk to the field.</p>
<p><a href="/shop/hoop">Hoop</a> · <a href="/shop/winder">Winder</a> · <a href="/shop/geared">Geared reel</a></p>
</article>
