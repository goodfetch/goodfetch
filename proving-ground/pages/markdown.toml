# The `extraction` family's Markdown pages (ADR 0007; spec #580, ticket
# #783): the 30 hand-written fixtures of the lab's Markdown measurement, six
# categories of five (headings, lists, tables, links, code, mixed), each a
# page and the Markdown a converter must write for it, judged by structure
# (`src/markdown.rs`); then a page with no main content, whose Markdown is
# empty. Served at `/markdown/<path>` on `extraction.test`, and listed by
# `/markdown`, task `extraction/7`'s start page. Append a page, never reorder
# or remove one (ADR 0063).

[[pages]]
path = "headings/levels"
html = '''
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>headings: levels</title></head><body>
<h1>Title one</h1><p>Intro.</p><h2>Second level</h2><p>Text.</p><h3>Third level</h3><h4>Fourth level</h4><h5>Fifth level</h5><h6>Sixth level</h6>
</body></html>
'''
markdown = '''
# Title one

Intro.

## Second level

Text.

### Third level

#### Fourth level

##### Fifth level

###### Sixth level
'''

