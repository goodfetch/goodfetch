# The one uv workspace (ADR 0032; STYLE.md, Python) and the Python tools'
# settings. Members are listed one by one: each SDK, adapter and Integration
# joins in the pull request that adds its `pyproject.toml`. `rnd/` is frozen
# and never read.
[project]
name = "goodfetch-workspace"
version = "0.0.0"
description = "The root of Goodfetch's uv workspace; never built or published."
# Every CPython not past its end of life (ADR 0024).
requires-python = ">=3.11"

[dependency-groups]
# No rerun plugin and no mocking library (ADRs 0062 and 0064); `xtask
# mocking-lockfile` checks uv.lock. datamodel-code-generator is pinned
# exactly: `xtask codegen`'s committed output depends on its version, and
# Griffe too: `xtask sdk-api`'s verdicts depend on its breakage rules. It is
# taken as `griffelib`, its library alone, which installs nothing more.
dev = [
  "anyio>=4.15.1",
  "connection-library",
  # The ed25519 that test support's tests check Standard Webhooks' shared
  # `v2a` vectors with (ADR 0017); the standard library has none.
  "cryptography>=50.0.2",
  "datamodel-code-generator==0.86.0",
  "goodfetch-collie",
  "goodfetch-collie-client",
  "goodfetch-foxhound",
  "goodfetch-test-support",
  "griffelib==2.4.1",
  "hypothesis>=6.170.15",
  "inline-snapshot>=0.36.1",
  # LangChain's own agent loop, which drives Python LangChain tools in tests
  # (ADR 0070); its scripted model is test support's `BindToolsChatModel`.
  "langchain>=1.5.2",
  "mutmut>=3.8.1",
  "mypy>=2.4.0",
  # The spreadsheet library that opens D07's XLSX Export (issue 1679): a Rust
  # one would change the shared build's flate2 backend.
  "openpyxl>=3.1.5",
  "opentelemetry-api>=1.45.2",
  "pip-audit>=2.10.1",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-cov>=7.0.0",
  "pytest-randomly>=5.0.0",
  "pytest-repeat>=0.9.4",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.1",
  "trio>=0.35.0",
  "types-jsonschema>=4.26.0.20261006",
  "types-openpyxl>=3.1.5.20261122",
]

[tool.uv]
package = false
required-version = ">=0.9.28"

[tool.uv.workspace]
members = [
  "sdks/python/collie",
  "sdks/python/collie-client",
  # The library Collie's tests use (story 11-180), a member so that uv
  # resolves its range on the Collie client package.
  "sdks/python/collie/tests/libraries/connection-library",
  "sdks/python/foxhound",
  "test-support/python",
]

[tool.uv.sources]
connection-library = { workspace = true }
goodfetch-collie = { workspace = true }
goodfetch-collie-client = { workspace = true }
goodfetch-foxhound = { workspace = true }
goodfetch-test-support = { workspace = true }

[tool.pytest]
minversion = "9.0"
# strict covers strict_markers, strict_config, strict_xfail and strict
# parametrization IDs; strict_markers is named too, as TESTING.md names it.
strict = true
strict_markers = true
# The case log of Client conformance cases, as `vitest.config.ts` writes
# Vitest's (ADR 0069); its paths are the workspace's.
addopts = [
  "--import-mode=importlib",
  # LangSmith, which langchain-core requires, registers a pytest plugin that
  # adds about 0.7 s of imports to every pytest process; no test uses it.
  "-p",
  "no:langsmith_plugin",
  "--junitxml=target/junit/pytest.xml",
  "--case-log=target/case-logs/pytest.jsonl",
  "--case-list=conformance/clients/cases.toml",
]
# A failed test's captured output goes into the JUnit file, where
# `xtask junit-summary` reads its `goodfetch-test-seed=<n>` line.
junit_logging = "out-err"
junit_log_passing_tests = false
# pytest-timeout: killed at 5 min above the Quick suite; `just test quick`
# passes `--timeout=10`.
timeout = "300"
# Replaces pytest's default list, so hidden folders (other worktrees under
# `.claude/`) and fixture folders (samples xtask runs on purpose) are named.
# The folder of programs both an SDK's unit and integration tests run, as
# TypeScript's `tests/programs/` (ADR 0069); pyright's `extraPaths` names it too.
pythonpath = ["sdks/python/collie/tests/programs"]
norecursedirs = [".*", "rnd", "ci", "fixtures", "node_modules", "target"]

[tool.ruff]
extend-exclude = ["rnd", "ci/proofs", "**/generated", "**/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ARG", "T20", "TID251", "PERF", "RUF", "ANN", "PYI", "TC", "ASYNC", "D"]
ignore = ["D206", "D300"]

# ASYNC109 asks async functions for no `timeout` parameter, which ADR 0080
# gives every SDK call that takes one: the operation's own timeout, sent for
# the engine to apply, as the generated calls take it. F821 reports an
# undefined name, which a crawl's type test writes on purpose: a misspelled
# Label handle is a type error, and its `# type: ignore[name-defined]` says so.
[tool.ruff.lint.per-file-ignores]
"sdks/python/collie-client/src/goodfetch_collie_client/connection.py" = ["ASYNC109"]
"sdks/python/collie-client/src/goodfetch_collie_client/connection_type.py" = ["ASYNC109"]
"sdks/python/collie-client/src/goodfetch_collie_client/raw_call.py" = ["ASYNC109"]
"sdks/python/collie/src/goodfetch_collie/collie.py" = ["ASYNC109"]
"sdks/python/foxhound/src/goodfetch_foxhound/foxhound.py" = ["ASYNC109"]
"sdks/python/foxhound/tests/types/crawl_types.py" = ["F821"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Mocks owned code (ADR 0062); test through the interface with a local stand-in."
"pytest.MonkeyPatch".msg = "Patches globals (ADR 0062); pass the value through an option instead."
"_pytest.monkeypatch".msg = "Patches globals (ADR 0062); pass the value through an option instead."

# Scrapy's side of `just compare` (xtask/compare-scrapy) has its own
# environment, outside the workspace's, so neither type checker can resolve
# its imports; ruff still checks it, as Spider's side is left to rustc.
[tool.pyright]
typeCheckingMode = "strict"
# A `# pyright: ignore[rule]` whose rule no longer fires, or a
# `# type: ignore[code]` on a line pyright finds clean, fails; mypy's
# `warn_unused_ignores` (in `strict`) checks each `type: ignore` code.
reportUnnecessaryTypeIgnoreComment = "error"
# As pytest's `pythonpath`: the folder of programs both an SDK's unit and
# integration tests run.
extraPaths = ["sdks/python/collie/tests/programs"]
exclude = ["rnd", "ci/proofs", "**/node_modules", "target", ".venv", "**/fixtures", "xtask/compare-scrapy"]

[tool.mypy]
strict = true
enable_error_code = ["deprecated"]
exclude = ["^rnd/", "^ci/proofs/", "^target/", "/fixtures/", "^xtask/compare-scrapy/"]
