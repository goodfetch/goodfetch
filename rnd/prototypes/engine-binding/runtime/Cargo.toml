[workspace]
resolver = "2"
members = ["engine-core", "engined", "napi-addon", "pyo3-ext"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net", "process"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No LTO: keeps the clean-build timings representative of a dev loop.
[profile.release]
opt-level = 3
