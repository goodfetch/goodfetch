[package]
name = "automan_engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "automan_engine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
engine-core = { path = "../engine-core" }
pyo3 = { version = "=0.29.3", features = ["extension-module", "abi3-py311"] }
tokio = { workspace = true }
serde_json = { workspace = true }
