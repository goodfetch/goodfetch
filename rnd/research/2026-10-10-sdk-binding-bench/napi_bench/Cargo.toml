[package]
name = "napi_bench"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.14.2", default-features = false, features = ["napi9", "tokio_rt", "async"] }
napi-derive = "=3.6.12"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
opt-level = 3
lto = true
