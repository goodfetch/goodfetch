[package]
name = "pyo3_bench"
version = "0.1.0"
edition = "2021"

[lib]
name = "pyo3_bench"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.3", features = ["extension-module"] }
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[profile.release]
opt-level = 3
lto = true
