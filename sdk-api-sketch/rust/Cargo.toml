# The sketch's golden scenarios and snippets, as examples of one package over the three crates of
# ADR 0095: `goodfetch-collie-client`, `goodfetch-collie` and `goodfetch-foxhound`.
[package]
name = "goodfetch-sdk-sketch"
version = "0.0.0"
edition = "2024"
publish = false

# Test helpers for a program's own tests (STYLE.md: the only kind of feature besides heavy optional dependencies).
[features]
test-util = ["goodfetch-collie/test-util", "goodfetch-foxhound/test-util"]

[dependencies]
goodfetch-collie = { path = "collie" }
goodfetch-foxhound = { path = "foxhound" }
futures-core = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The concurrency snippet drives streams with `futures-util`'s combinators; the golden scenarios run
# on Tokio, the program's own choice of executor (ADR 0081), and scenario 12 serves with axum.
[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal"] }

# The testing kits' snippet and golden scenario 10 use `goodfetch_foxhound::testing`, behind `test-util` (ADR 0069).
[[example]]
name = "snippet_testing"
required-features = ["test-util"]

# Golden scenario 10 is a test file: `cargo test --example s10_offline_crawl_tests`.
[[example]]
name = "s10_offline_crawl_tests"
required-features = ["test-util"]
test = true

# Standalone: not part of any Goodfetch workspace.
[workspace]
members = ["collie-client", "collie", "foxhound"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
futures-core = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
missing_docs = "warn"

[lints]
workspace = true
