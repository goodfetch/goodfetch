[package]
name = "goodfetch-sdk-sketch"
version = "0.0.0"
edition = "2024"
publish = false

# Test helpers for a program's own tests (STYLE.md: the only kind of feature besides heavy optional dependencies).
[features]
test-util = []

# `EventStream` implements `futures_core::Stream` for interop; its own `next()` needs no crate (G7).
# `schemars` and serde carry typed data (#469); `schemars` is re-exported so derives match the SDK's version.
[dependencies]
futures-core = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The concurrency snippet drives streams with `futures-util`'s combinators.
[dev-dependencies]
futures-util = "0.3.34"

# The testing kit's snippet uses `goodfetch::testing`, behind `test-util` (ADR 0069).
[[example]]
name = "snippet_testing"
required-features = ["test-util"]

# Standalone: not part of any Goodfetch workspace.
[workspace]

[lints.rust]
missing_docs = "warn"
