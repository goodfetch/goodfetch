[project]
name = "goodfetch-collie-client"
version = "0.0.0"
description = "The Collie client package both Products' Python SDKs build on (ADR 0095)."
requires-python = ">=3.11"
# Pydantic's supported major range is pinned (ADR 0077, G7). AnyIO runs one
# async core on asyncio and Trio (ADR 0081). websockets' Sans-I/O layer
# frames the protocol over WebSocket to a remote Daemon (ADR 0049) on AnyIO's
# streams, so it runs on both.
dependencies = [
  "anyio>=4.15.1,<5",
  "pydantic>=2.14.1,<3",
  "typing-extensions>=4.16.0",
  "websockets>=17.4,<18",
]
# Nothing is published before the first release (AGENTS.md, Release status).
classifiers = ["Private :: Do Not Upload"]

# mutmut's full run, weekly once the nightly tier is on (ADR 0072; TESTING.md,
# Feature coverage), started here by `just mutants-sdks python`: the
# hand-written runtime, never what `xtask codegen` writes (ADR 0099). pytest
# runs in mutmut's copy, `mutants/`, so the case list is named from there.
# `--mutation-children` makes each Python program a test starts run the
# mutated copy too, and counts what it reaches for the test (test support's
# `mutation_children`).
[tool.mutmut]
source_paths = ["src"]
do_not_mutate = ["src/goodfetch_collie_client/generated/*"]
pytest_add_cli_args = [
  "--case-list=../../../../conformance/clients/cases.toml",
  "--mutation-children",
]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]

[build-system]
requires = ["uv_build>=0.9.28,<0.10"]
build-backend = "uv_build"
