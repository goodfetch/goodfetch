[project]
name = "goodfetch-mcp-frameworks-example-env"
version = "0.0.0"
description = "Isolated uv environment for running the OpenAI Agents SDK, Pydantic AI, CrewAI, LlamaIndex, and Strands model-free MCP examples (issue 1384); never built or published."
requires-python = ">=3.11"
dependencies = [
  "crewai-tools[mcp]>=1.6.0",
  "llama-index-tools-mcp>=0.4.8",
  "mcp>=1.0.0,<2",
  "openai-agents>=0.20.0",
  "pydantic-ai-slim[mcp]>=2.77.0",
  "strands-agents>=1.34.0",
]

[tool.uv]
package = false
