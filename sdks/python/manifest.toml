# The manifest of the Python SDK's hand-written public names (ADR 0099;
# STYLE.md, Protocol and SDKs). Each `[[member]]` line names a public
# hand-written member that an entry, a package's module by its import name,
# exports: the catalog entry it serves, or `entry = "none"` with its reason,
# and the canonical words and form it is spelled from, the forms
# `sdks/typescript/manifest.toml`'s header describes. A method, field or
# function is spelled in snake_case, a keyword with a trailing `_`, and a
# type or class in PascalCase. Everything `xtask codegen` writes is
# generated, never listed. An entry is a module outside `generated` and the
# private modules that declares a literal `__all__`; `xtask sdk-exports`
# reads the packages' sources without importing them and refuses a public
# hand-written member an entry exports that no line lists, and a line
# naming no such member. A dunder, such as `__enter__`, is the language's:
# no line has to list it. `xtask sdk-manifests` checks each line's entry,
# spelling and receiver. The docstring and decorators each line's member
# carries, and the `[[unreached]]` lines, follow the rules of
# `sdks/typescript/manifest.toml`'s header.
#
# Its `[[logger]]` lines list the SDK's logger names (ADR 0078), which are
# SDK API under semver as names, checked as such by `griffe check` once
# #148 adds it, through the constants of
# `goodfetch_collie_client.host_logging`. Message text is not. A logger
# line's `package` is the distribution that ships it, not an import name,
# and neither check reads these lines.
#
# Each logger sits under `goodfetch`, which alone carries a handler, a
# `NullHandler`; `<area>` is an engine log event's target as a dotted path,
# without a leading `goodfetch` segment (`goodfetch::rpc::dispatch` gives
# `goodfetch.engine.rpc.dispatch`), and the areas are Experimental as the
# targets are (ADR 0132).

