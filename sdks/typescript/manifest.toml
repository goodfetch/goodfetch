# The manifest of the TypeScript SDK's hand-written public members (ADR
# 0099; STYLE.md, Protocol and SDKs): each names the catalog entry it serves,
# or `entry = "none"` with its reason, and the canonical words and form it is
# spelled from. Everything `xtask codegen` writes is generated, never listed.
# `xtask sdk-manifests` refuses an entry that is no catalog operation or one
# only a person may call, two members of one receiver for one entry, a
# member with no entry not spelled from its words and form, a line naming a
# member the generator writes, and a member whose words another SDK's
# manifest lacks on a receiver both manifests list unless its `only` says
# why that SDK lacks it. `xtask sdk-exports` refuses a public hand-written
# member a package's entry exports that no line lists on an entry exporting
# it, and a line naming no such member; a member the language's library
# declares, such as `Disposable`'s `[Symbol.dispose]`, may have a line.
#
# Forms: `opener` (a round trip that returns a value the caller closes),
# `round_trip`, `read` (answered by the SDK without a round trip), `closer`
# (the idempotent `close()` and its scoped form), `runtime` (what a
# Product's package builds its Connection on, from
# `@goodfetch/collie-client/runtime`, or a Client in a browser, from
# `@goodfetch/collie-client/browser`, never for programs), `type` (a type
# or class an entry exports) and `constant` (a
# value, its words in capitals). `constructor` is spelled from its
# receiver's words and `[Symbol.asyncDispose]` from `close`.

