# The manifest of the TypeScript SDK's hand-written public members (ADR
# 0099; STYLE.md, Protocol and SDKs): each names the catalog entry it serves,
# or `entry = "none"` with its reason, and the canonical words and form it is
# spelled from. Everything `xtask codegen` writes is generated, never listed.
# The completeness tests that read this file join with area 11's catalog
# mapping ticket; until then a member added by hand gets its line here.
#
# Forms: `opener` (a round trip that returns a value the caller closes),
# `round_trip`, `read` (answered by the SDK without a round trip), `closer`
# (the idempotent `close()` and its scoped form), `runtime` (what a
# Product's package builds its Connection on, from
# `@goodfetch/collie-client/runtime`, never for programs) and `type` (a type
# or class the generated layer builds on and re-exports).

[[member]]
package = "@goodfetch/collie"
receiver = "Collie"
member = "connect"
entry = "none"
reason = "The one factory of ADR 0078: it starts the Attached engine and finishes `hello`, the Connection's own message, which no catalog entry carries."
words = ["connect"]
form = "opener"

[[member]]
package = "@goodfetch/collie"
receiver = "Collie"
member = "engine"
entry = "none"
reason = "Answered from the engine's reply to `hello` (ADR 0095), with no round trip."
words = ["engine"]
form = "read"

[[member]]
package = "@goodfetch/collie"
receiver = "Collie"
member = "start"
entry = "run.start"
words = ["start"]
form = "opener"

[[member]]
package = "@goodfetch/collie"
receiver = "Collie"
member = "close"
entry = "none"
reason = "Closes the Connection's Runs, then ends its Attached engine's input and waits for it (ADR 0078)."
words = ["close"]
form = "closer"

[[member]]
package = "@goodfetch/collie"
receiver = "Collie"
member = "[Symbol.asyncDispose]"
entry = "none"
reason = "The scoped form of `close()` (ADR 0078)."
words = ["close"]
form = "closer"

[[member]]
package = "@goodfetch/collie-client"
receiver = "Connection"
member = "engine"
entry = "none"
reason = "The interface every Product's Connection type implements (ADR 0095); `Collie.engine`'s line holds."
words = ["engine"]
form = "read"

[[member]]
package = "@goodfetch/collie-client"
receiver = "Connection"
member = "start"
entry = "run.start"
words = ["start"]
form = "opener"

[[member]]
package = "@goodfetch/collie-client"
receiver = "Connection"
member = "close"
entry = "none"
reason = "The interface every Product's Connection type implements (ADR 0095); `Collie.close`'s line holds."
words = ["close"]
form = "closer"

[[member]]
package = "@goodfetch/collie-client"
receiver = "Run"
member = "id"
entry = "none"
reason = "The Run ID the start answered, read without a round trip (ADR 0102)."
words = ["id"]
form = "read"

[[member]]
package = "@goodfetch/collie-client"
receiver = "Run"
member = "startedAs"
entry = "run.start"
words = ["started", "as"]
form = "read"

[[member]]
package = "@goodfetch/collie-client"
receiver = "Run"
member = "close"
entry = "run.abort"
words = ["close"]
form = "closer"

[[member]]
package = "@goodfetch/collie-client"
receiver = "Run"
member = "[Symbol.asyncDispose]"
entry = "run.abort"
words = ["close"]
form = "closer"

[[member]]
package = "@goodfetch/collie-client/runtime"
receiver = "ClientConnection"
member = "open"
entry = "none"
reason = "The common Connection each Product's `connect()` builds on (ADR 0095); its `engine`, `start` and `close` are `Connection`'s."
words = ["open"]
form = "runtime"

[[member]]
package = "@goodfetch/collie-client/runtime"
receiver = "AttachedEngine"
member = "start"
entry = "none"
reason = "Starts an Attached engine's process for a Product's `connect()` (ADRs 0024 and 0078); its `stop` and `kill` end it."
words = ["start"]
form = "runtime"

[[member]]
package = "@goodfetch/collie-client/runtime"
receiver = "(module)"
member = "holdInRealm"
entry = "none"
reason = "Refuses a Product's Connection value to other realms (ADR 0081)."
words = ["hold", "in", "realm"]
form = "runtime"

[[member]]
package = "@goodfetch/collie/testing"
receiver = "(module)"
member = "connectOver"
entry = "none"
reason = "Opens `connect()`'s Connection over a transport a test holds, such as the Scripted engine's in-memory player, with no process behind it (ADR 0069)."
words = ["connect", "over"]
form = "opener"

