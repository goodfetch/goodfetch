# The Claude Code release whose `claude plugin validate --strict` checks each
# Product's Claude Code plugin, its executable crate's `generated/` folder
# (story 11-239; TESTING.md, AI features and agent skills).
# ci/claude-code-fetch.sh downloads this machine's platform's executable
# from Anthropic's release bucket into the tests' copy,
# $GOODFETCH_CLAUDE_CODE_DOWNLOADS or ~/.cache/goodfetch/claude-code, as
# `<version>/claude` (`claude.exe` on Windows), and fails on one whose
# SHA-256 differs from its pin below. No npm package is used: the npm one's
# licence is off ADR 0018's allowlist and it installs through a postinstall
# script. The tests run the copy with no network: auto-update, telemetry,
# error reporting and nonessential traffic off, and every proxy variable
# naming a listener that fails the test if anything connects to it.
#
# Licence: Claude Code is Anthropic's proprietary software, "© Anthropic
# PBC. All rights reserved. Use is subject to the Legal Agreements outlined
# here: https://code.claude.com/docs/en/legal-and-compliance" (its package's
# LICENSE.md), under Anthropic's Commercial Terms of Service. Goodfetch
# downloads it for these tests alone: it is never committed, redistributed,
# bundled, cached for others or shipped in a Product, so no Product's
# notices name it.
#
# To move the pin, in one pull request: set `version` to the release, then
# copy each platform's `checksum` and `size` from that release's
# `manifest.json` in the bucket (`<bucket>/<version>/manifest.json`).

version = "2.1.322"
bucket = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases"

