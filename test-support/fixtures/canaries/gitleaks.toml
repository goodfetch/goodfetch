# Generated by `xtask codegen` from goodfetch-test-support's Secret canary
# kinds (ADR 0067); never edited by hand. One rule per kind finds its
# canaries raw, JSON-escaped and URL-encoded, and gitleaks' decoding finds
# them in base64 and hex. CI's gitleaks step reads it.
title = "Goodfetch Secret canaries"

[[rules]]
id = "goodfetch-secret-canary-typed-password"
description = "Goodfetch Secret canary: typed password (ADR 0067)"
regex = '''gfcanary-password-[0-9a-f]{16}'''
keywords = ["gfcanary"]

