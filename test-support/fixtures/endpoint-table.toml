# The endpoint table (ADR 0067; TESTING.md, Endpoints): one `[rule.<name>]`
# row per refusal rule, and in each row one cell per listener the rule
# applies to, which says what that listener must do with the attempt.
# `EndpointRunner` in `goodfetch-test-support` reads this file, applies every
# row of a listener's column to it, and checks each refusal in its Audit log.
# A cell is `{ expect = "closed" }` (a JSON-RPC stream or WebSocket listener
# closes the connection without answering), `{ expect = "status", status =
# <4xx> }` (an HTTP listener refuses the request, or a WebSocket listener its
# handshake, with that status), `{ expect = "status_only" }` (an
# HTTP answer with a status and no body, which is no refusal and has no Audit
# log entry) or `{ expect = "accepted" }` (an HTTP listener accepts the
# attempt with a 2xx, as it does the valid request: no refusal, no Audit log
# entry) or `{ expect = "challenge" }` (an HTTP proxy asks a client
# without credentials for them with a `407`, as it asks every client first,
# the browser included: no refusal, no Audit log entry, no relayed byte).
# The token rows that present a token
# of their own (another listener's, an expired, a revoked and an
# out-of-scope one) take it from the listener's test, which fails the row
# when it gives none; a listener whose tokens cannot expire or be revoked
# has no cell in that row. A Session's proxy relay (`proxy_relay`) takes its
# token as the password of a `CONNECT`'s `Proxy-Authorization: Basic`
# credentials; another listener's token is another Session's relay's. A
# Live view channel (`live_view`) is a WebSocket at its own path, whose
# first message is an `open` carrying the Daemon's token rather than a
# `hello`. A row's `advisories` name the bypasses its
# attempt repeats, whose regression tests run the rows citing them
# (`EndpointRunner::run_advisory`). Every listener of another area (the HTTP
# listener, MCP over HTTP, raw CDP, the peer link) joins as a
# column with its own ticket, wrapped by the engine's `endpoint` module; a
# rule joins with the first listener it applies to. The Quick suite fails
# on a row with no cell, a listener with no row, and a cell its listener
# cannot try.
# Schema: `schemas/endpoint-table.schema.json`.

[rule.token_missing]
summary = "The first message or the request carries no token."
adrs = [17, 24, 50]
advisories = ["CVE-2025-49596"]

[rule.token_missing.listeners]
daemon_socket = { expect = "closed" }
private_endpoint = { expect = "closed" }
ops_listener = { expect = "status", status = 401 }
daemon_websocket = { expect = "closed" }
live_view = { expect = "closed" }
exposed_daemon = { expect = "closed" }
proxy_relay = { expect = "challenge" }

[rule.token_wrong]
summary = "The token is one the listener never issued."
adrs = [17, 24, 50]

[rule.token_wrong.listeners]
daemon_socket = { expect = "closed" }
private_endpoint = { expect = "closed" }
ops_listener = { expect = "status", status = 401 }
daemon_websocket = { expect = "closed" }
live_view = { expect = "closed" }
exposed_daemon = { expect = "closed" }
proxy_relay = { expect = "status", status = 407 }

[rule.token_from_another_listener]
summary = "The token is valid, but for another listener."
adrs = [17, 31, 50, 67]

[rule.token_from_another_listener.listeners]
daemon_socket = { expect = "closed" }
private_endpoint = { expect = "closed" }
ops_listener = { expect = "status", status = 401 }
daemon_websocket = { expect = "closed" }
live_view = { expect = "closed" }
exposed_daemon = { expect = "closed" }
proxy_relay = { expect = "status", status = 407 }

[rule.token_expired]
summary = "The token's life ended with the launch that issued it: the token of the listener's earlier launch."
adrs = [17, 24, 67]

[rule.token_expired.listeners]
daemon_socket = { expect = "closed" }
private_endpoint = { expect = "closed" }

[rule.token_revoked]
summary = "The token was replaced while it was in force: the Daemon's token before `daemon restart`, or the ops token before the operator replaced its file."
adrs = [17, 50, 67]

[rule.token_revoked.listeners]
daemon_socket = { expect = "closed" }
ops_listener = { expect = "status", status = 401 }

[rule.token_scoped_elsewhere]
summary = "A token of the same Daemon whose scope is another: the ops token, read-only on `/metrics`, on the Daemon's socket, or the Daemon's protocol token on `/metrics`."
adrs = [50, 67]

[rule.token_scoped_elsewhere.listeners]
daemon_socket = { expect = "closed" }
ops_listener = { expect = "status", status = 401 }

[rule.token_in_query_string]
summary = "The valid token is sent in the query string (`access_token`) instead of a header or the `hello`."
adrs = [17, 67]
advisories = ["CVE-2025-49596"]

[rule.token_in_query_string.listeners]
ops_listener = { expect = "status", status = 401 }
daemon_websocket = { expect = "closed" }
live_view = { expect = "closed" }

[rule.host_foreign]
summary = "The request or the WebSocket handshake names a foreign `Host`, as a DNS-rebinding page's does."
adrs = [17]
advisories = ["CVE-2025-66414"]

[rule.host_foreign.listeners]
ops_listener = { expect = "status", status = 403 }
daemon_websocket = { expect = "status", status = 403 }
live_view = { expect = "status", status = 403 }

[rule.origin_foreign]
summary = "The request or the WebSocket handshake carries a foreign `Origin`."
adrs = [17]
advisories = ["CVE-2025-49596"]

[rule.origin_foreign.listeners]
ops_listener = { expect = "status", status = 403 }
daemon_websocket = { expect = "status", status = 403 }
live_view = { expect = "status", status = 403 }

[rule.origin_missing]
summary = "The request or the WebSocket handshake carries no `Origin`: accepted only with a header token, which a browser page cannot send cross-site."
adrs = [17, 49, 67]

[rule.origin_missing.listeners]
ops_listener = { expect = "accepted" }
daemon_websocket = { expect = "status", status = 403 }
live_view = { expect = "status", status = 403 }

[rule.origin_missing_without_header_token]
summary = "The request carries no `Origin` and no header token, the valid token only in a cookie, as a browser page's cross-site request could send it."
adrs = [17]
advisories = ["CVE-2025-49596"]

[rule.origin_missing_without_header_token.listeners]
ops_listener = { expect = "status", status = 401 }

[rule.hello_not_first]
summary = "The connection's first message is not a `hello`."
adrs = [17, 24]

[rule.hello_not_first.listeners]
daemon_socket = { expect = "closed" }
private_endpoint = { expect = "closed" }
daemon_websocket = { expect = "closed" }
live_view = { expect = "closed" }
exposed_daemon = { expect = "closed" }

[rule.probes_answer_status_only]
summary = "`/livez` and `/readyz` answer without a token, with a status and no body."
adrs = [50]

[rule.probes_answer_status_only.listeners]
ops_listener = { expect = "status_only" }

