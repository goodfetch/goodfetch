# CR, LF or NUL in header values (ADR 0067): one case per source and
# character, each with the typed error every layer gives, read through
# goodfetch-test-support's `HostileTables::committed()`. A value Goodfetch
# would send is refused with `header_value_invalid` before it reaches the
# wire or CDP; Chromium also refuses one passed through CDP (checked
# 2026-10-20, ADR 0067's note). A page's response head is the Proving
# ground's `headers` family. A layer's runner pairs these with its own
# positive control: the same header with a plain value is sent.

[[cases]]
name = "recipe_header_with_crlf"
input = { source = "recipe", name = "X-Note", value = "a\r\nX-Injected: yes" }
expected = { code = "header_value_invalid" }
served_by = "program_input"

[[cases]]
name = "recipe_header_with_lf"
input = { source = "recipe", name = "X-Note", value = "a\nX-Injected: yes" }
expected = { code = "header_value_invalid" }
served_by = "program_input"

[[cases]]
name = "recipe_header_with_cr"
input = { source = "recipe", name = "X-Note", value = "a\rX-Injected: yes" }
expected = { code = "header_value_invalid" }
served_by = "program_input"

[[cases]]
name = "recipe_header_with_nul"
input = { source = "recipe", name = "X-Note", value = "a\u0000b" }
expected = { code = "header_value_invalid" }
served_by = "program_input"

