# A response head the Proving ground writes as its own bytes. Chromium
# refuses the NUL with this network error; it keeps a bare CR as a line
# break and sets the cookie after it (Chrome for Testing 156.0.8078.4,
# 2026-10-20), so on the browser path Goodfetch must refuse that head itself:
# an owner decision, recorded in ADR 0067's note.
[[cases]]
name = "response_head_with_nul"
input = { source = "response", name = "X-Note", value = "one\u0000two" }
expected = { code = "navigation_failed", network_error = "net::ERR_INVALID_HTTP_RESPONSE" }
served_by = { page = "headers/5" }

[[cases]]
name = "response_head_with_a_bare_cr"
input = { source = "response", name = "X-Note", value = "one\rSet-Cookie: injected=1" }
expected = { code = "navigation_failed" }
served_by = { page = "headers/6" }
