# Decompression bombs, endless bodies, deep nesting and oversized messages,
# each ending in its typed limit error (ADR 0067): `response_limit_exceeded`
# naming the setting for a body the engine reads (area 4's values:
# `network.max_body_size` 64 MiB of decoded bytes, `network.max_decompression_ratio`
# 100 once a decoded body passes 1 MiB, `network.max_json_depth` 128), and
# the JSON-RPC framing's `message_too_large` (16 MiB) and `message_too_deep`
# (64). The decompression-bomb pages are the Proving ground's `bombs` family
# (`bombs/1` to `bombs/5`; the Brotli and zstd ones, `bombs/3` and `bombs/4`,
# over `https://`, where a browser offers those codings, so a runner trusts
# the Proving ground's authority for `bombs.test`), and the huge and endless
# bodies and the deep JSON its `body-limits` family (`body-limits/1` to `body-limits/4`, and
# `body-limits/6`, a gzip body within the ratio that decodes past the 256 MiB
# a browser's pipe frames in one message). A
# layer's runner pairs these with its own positive control: a normal page
# (`bombs/6`, `body-limits/5`), and a message within the limits, pass.

[[cases]]
name = "gzip_bomb"
input = { kind = "decompression_bomb", content_encodings = ["gzip"] }
expected = { code = "response_limit_exceeded", setting = "network.max_decompression_ratio" }
served_by = { page = "bombs/1" }

[[cases]]
name = "deflate_bomb"
input = { kind = "decompression_bomb", content_encodings = ["deflate"] }
expected = { code = "response_limit_exceeded", setting = "network.max_decompression_ratio" }
served_by = { page = "bombs/2" }

[[cases]]
name = "brotli_bomb"
input = { kind = "decompression_bomb", content_encodings = ["br"] }
expected = { code = "response_limit_exceeded", setting = "network.max_decompression_ratio" }
served_by = { page = "bombs/3" }

[[cases]]
name = "zstd_bomb"
input = { kind = "decompression_bomb", content_encodings = ["zstd"] }
expected = { code = "response_limit_exceeded", setting = "network.max_decompression_ratio" }
served_by = { page = "bombs/4" }

[[cases]]
name = "stacked_codings_bomb"
input = { kind = "decompression_bomb", content_encodings = ["gzip", "gzip"] }
expected = { code = "response_limit_exceeded", setting = "network.max_decompression_ratio" }
served_by = { page = "bombs/5" }

[[cases]]
name = "body_past_64_mib"
input = { kind = "oversized_body", bytes = 67108865 }
expected = { code = "response_limit_exceeded", setting = "network.max_body_size" }
served_by = { page = "body-limits/1" }

[[cases]]
name = "coded_body_past_256_mib"
input = { kind = "oversized_body", bytes = 285212672, content_encodings = ["gzip"] }
expected = { code = "response_limit_exceeded", setting = "network.max_body_size" }
served_by = { page = "body-limits/6" }

[[cases]]
name = "endless_chunked_body"
input = { kind = "endless_body", framing = "chunked" }
expected = { code = "response_limit_exceeded", setting = "network.max_body_size" }
served_by = { page = "body-limits/2" }

[[cases]]
name = "endless_close_delimited_body"
input = { kind = "endless_body", framing = "close_delimited" }
expected = { code = "response_limit_exceeded", setting = "network.max_body_size" }
served_by = { page = "body-limits/3" }

[[cases]]
name = "response_json_past_128_deep"
input = { kind = "deep_nesting", channel = "response_json", depth = 129 }
expected = { code = "response_limit_exceeded", setting = "network.max_json_depth" }
served_by = { page = "body-limits/4" }

[[cases]]
name = "json_rpc_message_past_64_deep"
input = { kind = "deep_nesting", channel = "json_rpc_message", depth = 65 }
expected = { code = "message_too_deep" }
served_by = "program_input"

[[cases]]
name = "json_rpc_message_past_16_mib"
input = { kind = "oversized_message", channel = "json_rpc_message", bytes = 16777217 }
expected = { code = "message_too_large" }
served_by = "program_input"

# Chromium refuses a head past its 256 KiB with this network error
# (Chrome for Testing 156.0.8078.4, 2026-10-20).
[[cases]]
name = "response_head_past_256_kib"
input = { kind = "oversized_message", channel = "response_head", bytes = 307200 }
expected = { code = "navigation_failed", network_error = "net::ERR_RESPONSE_HEADERS_TOO_BIG" }
served_by = { page = "headers/1" }
