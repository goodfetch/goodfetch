# Path traversal into every file Goodfetch writes from outside input (ADR
# 0067), with each OS's cases: a name or path that would leave the folder
# Goodfetch writes it in, or that is no safe file name on some OS, is
# refused with `path_unsafe`. `os` names the OSes whose file systems a case
# attacks, which `HostileTable::cases_here()` runs it on. Page-suggested
# download names are not here: a correct tool keeps the file under a safe
# name instead of refusing it, which the Proving ground's `downloads` pages
# judge. A layer's runner pairs these with its own positive control: a plain
# name, and a path to a subfolder where the target takes a path, are written
# where they should be.

[[cases]]
name = "parent_traversal"
input = { targets = ["export_name", "key_value_store_key", "screenshot_path", "run_trace_path", "plan_name", "plugin_bundle_entry"], name = '../../goodfetch-traversal.csv', os = "every", hazard = "parent_traversal" }
expected = { code = "path_unsafe" }
served_by = "program_input"

[[cases]]
name = "parent_traversal_after_a_subfolder"
input = { targets = ["export_name", "key_value_store_key", "screenshot_path", "run_trace_path", "plan_name", "plugin_bundle_entry"], name = 'shots/../../goodfetch-traversal.csv', os = "every", hazard = "parent_traversal" }
expected = { code = "path_unsafe" }
served_by = "program_input"

