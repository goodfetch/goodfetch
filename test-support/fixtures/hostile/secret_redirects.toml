# A Secret bound to a domain never follows a cross-origin redirect (ADRs
# 0067 and 0092): a request carrying a Secret placeholder's value in a header
# or a JSON body string, redirected outside the binding's domains, is
# dropped with `secret_domain_not_allowed`, so neither the header nor a
# resent body reaches the other domain. A JSON body is resent only on 307
# and 308. The Proving ground's `canaries` family plants the values and
# records every place they are seen, but has no page that redirects to
# another domain yet. A layer's runner pairs these with its own positive
# control: the same redirect to a bound domain keeps the value.

[[cases]]
name = "header_across_a_moved_permanently_redirect"
input = { placement = "header", bound_to = ["canaries.test"], url = "https://4.canaries.test/api/record", status = 301, location = "https://elsewhere.test/api/record" }
expected = { code = "secret_domain_not_allowed" }
served_by = { missing_page = "a canaries endpoint that answers 301 to another domain" }

[[cases]]
name = "header_across_a_found_redirect"
input = { placement = "header", bound_to = ["canaries.test"], url = "https://4.canaries.test/api/record", status = 302, location = "https://elsewhere.test/api/record" }
expected = { code = "secret_domain_not_allowed" }
served_by = { missing_page = "a canaries endpoint that answers 302 to another domain" }

