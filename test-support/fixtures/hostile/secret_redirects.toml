# A Secret bound to a domain never follows a cross-origin redirect (ADRs
# 0067 and 0092): a request carrying a Secret placeholder's value in a header
# or a JSON body string, redirected outside the binding's domains, is
# dropped with `secret_domain_not_allowed`, so neither the header nor a
# resent body reaches the other domain. A JSON body is resent only on 307
# and 308. The Proving ground's `canaries/4` plants the values, records
# every place they are seen, and its `/api/redirect/<status>?to=<location>`
# answers each case's redirect. A layer's runner pairs these with its own
# positive control: the same redirect to a bound domain keeps the value.

[[cases]]
name = "header_across_a_moved_permanently_redirect"
input = { placement = "header", bound_to = ["canaries.test"], url = "https://4.canaries.test/api/redirect/301?to=https://elsewhere.test/api/record", status = 301, location = "https://elsewhere.test/api/record" }
expected = { code = "secret_domain_not_allowed" }
served_by = { page = "canaries/4" }

[[cases]]
name = "header_across_a_found_redirect"
input = { placement = "header", bound_to = ["canaries.test"], url = "https://4.canaries.test/api/redirect/302?to=https://elsewhere.test/api/record", status = 302, location = "https://elsewhere.test/api/record" }
expected = { code = "secret_domain_not_allowed" }
served_by = { page = "canaries/4" }

