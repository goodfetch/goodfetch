# The model manifest (ADR 0065): one small and one larger model for each
# format of ADR 0012, by dated or versioned Model reference, each with the
# day its provider retires it, when one is announced, and the page that
# announces it. `xtask models check`, in the daily test-health job, opens or
# updates one `needs-triage` issue for each from 30 days before that day.
#
# Every model comes from the Vercel AI Gateway's free tier (ADR 0076): the
# gateway's models page marks it `availableToFreeTier`, as it does
# `openai/gpt-5.4-nano` and `openai/gpt-5.2` and no Anthropic model, checked
# on 2026-11-24. The Anthropic Messages format reaches them through the
# gateway's Messages endpoint (`https://ai-gateway.vercel.sh/v1/messages`),
# which serves every model of the gateway. OpenAI's `gpt-5`, `gpt-5-mini`
# and `gpt-5-nano` retire on 2026-12-11, so none is pinned.

[openai-compatible]
small = { model = "openai/gpt-5.4-nano", retires = 2027-04-01, source = "https://developers.openai.com/api/docs/deprecations" }
larger = { model = "openai/gpt-5.2", source = "https://developers.openai.com/api/docs/deprecations" }

[anthropic-messages]
small = { model = "openai/gpt-5.4-nano", retires = 2027-04-01, source = "https://developers.openai.com/api/docs/deprecations" }
larger = { model = "openai/gpt-5.2", source = "https://developers.openai.com/api/docs/deprecations" }

[gemini]
waits = "ADR 0076: the Vercel AI Gateway does not serve Gemini's native format, so the Gemini adapter's recordings wait"
