refusal = { code = "egress_refused", rule = "private_address" }

# A Session's upstream proxy whose name rebinds between two lookups (ADR
# 0067's "rebinding; the upstream proxy path"; deep review finding 577-1):
# what a connection is given to dial is the answer that was judged, so the
# private answer is refused on the use after it changed.

[[cases]]
name = "proxy_endpoint_that_rebinds"
family = "operator_endpoint"
url = "http://rebind-proxy.ssrf.test/"
route = { via = "operator_endpoint", kind = "proxy" }
lookups = [
    { name = "rebind-proxy.ssrf.test", answers = ["public"] },
    { name = "rebind-proxy.ssrf.test", answers = ["127.0.0.1"] },
]
fetches = 2
target = "127.0.0.1"
refusal = { code = "egress_refused", rule = "private_address" }

# A Lent page's client: a browser context with its own proxy, or an
# extension, would leave through no relay; the endpoint refuses both (ADR
# 0089).

[[cases]]
name = "browser_context_with_its_own_proxy"
family = "lent_page_client"
url = "http://public.ssrf.test/"
route = { via = "browser_context", proxy_server = "http://10.0.0.9:3128" }
lookups = [{ name = "public.ssrf.test", answers = ["public"] }]
target = "10.0.0.9"
refusal = { code = "cdp_command_refused" }

[[cases]]
name = "browser_context_with_its_own_socks_proxy"
family = "lent_page_client"
url = "http://public.ssrf.test/"
route = { via = "browser_context", proxy_server = "socks5://127.0.0.1:1080" }
lookups = [{ name = "public.ssrf.test", answers = ["public"] }]
target = "127.0.0.1"
refusal = { code = "cdp_command_refused" }

[[cases]]
name = "extension_request"
family = "lent_page_client"
url = "http://127.0.0.1/"
route = { via = "extension" }
target = "127.0.0.1"
refusal = { code = "cdp_command_refused" }

# A Borrowed browser (ADR 0056): no relay can be put under a browser that is
# already running, so the engine judges each of its page's requests at
# interception, resolving the host itself and refusing every answer that is
# not globally reachable, before the browser connects. `lookups` are the
# engine's answers; the browser resolves names itself, so a rebinding
# answer reaches it, the gap Provenance records, and this family holds no
# rebinding case. A layer runs each URL on its public stand-in's port.

[[cases]]
name = "borrowed_to_loopback"
family = "borrowed_browser"
url = "http://127.0.0.1/"
target = "127.0.0.1"
refusal = { code = "egress_refused", rule = "private_address" }

[[cases]]
name = "borrowed_to_an_encoded_loopback"
family = "borrowed_browser"
url = "http://0x7f000001/"
target = "127.0.0.1"
refusal = { code = "egress_refused", rule = "private_address" }

[[cases]]
name = "borrowed_to_an_ipv4_mapped_loopback"
family = "borrowed_browser"
url = "http://[::ffff:127.0.0.1]/"
target = "127.0.0.1"
refusal = { code = "egress_refused", rule = "private_address" }

[[cases]]
name = "borrowed_to_cloud_metadata"
family = "borrowed_browser"
url = "http://169.254.169.254/latest/meta-data/"
target = "169.254.169.254"
refusal = { code = "egress_refused", rule = "private_address" }

[[cases]]
name = "borrowed_to_a_private_name"
family = "borrowed_browser"
url = "http://internal.borrowed.ssrf.test/"
lookups = [{ name = "internal.borrowed.ssrf.test", answers = ["10.0.0.1"] }]
target = "10.0.0.1"
refusal = { code = "egress_refused", rule = "private_address" }

[[cases]]
name = "borrowed_to_mixed_answers"
family = "borrowed_browser"
url = "http://mixed.borrowed.ssrf.test/"
