# The SSRF case table (ADR 0067), which every layer's thin runner applies
# through `goodfetch-test-support`'s `SsrfTable::committed()` and
# `run_cases`. Its format is `SsrfTable`, whose JSON Schema `xtask codegen`
# commits as `../schemas/ssrf-cases.schema.json`. The Quick suite fails when a
# block of the IANA registries (`crates/goodfetch-engine/iana/`) that is not
# globally reachable has no case, when a case names an unknown family or block, or
# when two cases share a name.
#
# Each case gives:
# - `url`, what the run requests, and `route`, how the request leaves it
#   (`direct` when absent);
# - `lookups`, the DNS answers its names get, in order, where `public` is the
#   layer's public stand-in (the Proving ground's address end to end);
# - `redirect`, how the public stand-in answers `url`, when it redirects;
# - `fetches`, how many times the run requests `url` (1 when absent);
# - `domains`, the domain policy it runs under (`allowed`, `["*"]` when
#   absent, and `blocked`), every host allowed when absent;
# - `target`, the address no connection may reach (`public` for the
#   public stand-in), and `block`, the IANA block it lies in;
# - `refusal`, the typed refusal every layer gives.
#
# Host names are under `.test` (RFC 6761), so no case resolves outside its
# script.

# Encodings: spellings of 127.0.0.1 that a URL parser reads as that address.

[[cases]]
name = "dotted_loopback"
family = "encoding"
url = "http://127.0.0.1/"
target = "127.0.0.1"
refusal = { code = "egress_refused", rule = "private_address" }

