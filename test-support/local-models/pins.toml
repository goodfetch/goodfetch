# Pinned local model servers and small CPU GGUF model for the Release suite's
# Linux cell (ADRs 0065 and 0076; issue 427).
#
# `ci/local-models-fetch.sh` downloads these artifacts before ADR 0043's
# outbound-traffic deny into $GOODFETCH_LOCAL_MODELS_DOWNLOADS or
# ~/.cache/goodfetch/local-models, checking every SHA-256 against the pins
# below; `LocalModel::start` in `goodfetch-test-support` verifies the model's
# SHA-256 again before starting any server.
#
# Servers NOT included here (verified for #427):
# - vLLM CPU build requires compiling C++/PyTorch CPU kernels (10-30 min,
#   AVX512/AVX2) unsuitable for standard hosted runners, and a paid GPU host
#   is declined while there is no revenue (ADR 0076), so vLLM waits.
# - LM Studio (`llmster`) supports headless Linux (`lms daemon up` /
#   `lms server start`), but ships proprietary binaries via an unpinned
#   installer script (`https://lmstudio.ai/install.sh`) without a versioned
#   archive SHA-256 pin; awaiting owner decision.

[model]
name = "SmolLM2-135M-Instruct-Q4_K_M"
file = "SmolLM2-135M-Instruct-Q4_K_M.gguf"
url = "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"
sha256 = "2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d"
size = 105454432

