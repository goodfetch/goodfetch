# The lychee release the docs site's tests check the built site's links and
# anchors with, offline (TESTING.md, Docs site). ci/lychee-fetch.sh (part of
# `just fetch`) downloads this machine's platform's `asset` from the
# release's GitHub assets and unpacks its executable into the tests' copy,
# $GOODFETCH_LYCHEE_DOWNLOADS or ~/.cache/goodfetch/lychee, as
# `<version>/lychee` (`lychee.exe` on Windows), before the outbound-traffic
# deny, and fails on an asset whose SHA-256 differs from its pin below.
# `website/tests/links.spec.ts` reads this file for the copy's path; no test
# downloads it.
#
# Licence: MIT or Apache-2.0 (the repository's LICENSE-MIT and
# LICENSE-APACHE). The copy runs in tests alone: it is never committed or
# shipped in a Product, so no Product's notices name it.
#
# To move the pin, in one pull request: set `version` to the release tag of
# lycheeverse/lychee, then each platform's `sha256` to its asset's SHA-256,
# as `gh release view <tag> --repo lycheeverse/lychee --json assets` prints
# each asset's digest.

version = "lychee-v0.24.2"

[platforms.linux-x64]
asset = "lychee-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"

[platforms.linux-arm64]
asset = "lychee-aarch64-unknown-linux-gnu.tar.gz"
sha256 = "91a7bd65685da41b90ccb9bc867a3d649a7818042dae04ff405e55a25bddee4c"

[platforms.mac-arm64]
asset = "lychee-aarch64-apple-darwin.tar.gz"
sha256 = "c9d3740ea2d891854d37116c9fba840f37b6e7c89d330e7db84ac333631c4977"

[platforms.mac-x64]
asset = "lychee-x86_64-apple-darwin.tar.gz"
sha256 = "887503a9cff667d322b8d0892b40bf49976eb9507af8483220a3706cdad55978"

[platforms.windows-x64]
asset = "lychee-x86_64-pc-windows-msvc.zip"
sha256 = "32975d1493ee1a975d6bb41e4fb56fe419cb442ded628bb772ba2e614acfacad"
