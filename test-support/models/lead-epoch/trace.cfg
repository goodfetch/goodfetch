\* The trace validation's configuration (`xtask tlc validate lead-epoch`): the
\* constants come from the trace, and TraceUnmatched breaks once every line
\* matched.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Members <- TraceMembers
    MaxEpoch <- TraceMaxEpoch
INVARIANTS TraceUnmatched TypeOK OneLeadPerEpoch LeadNeverRemoved FencedSawHigher MajorityRecorded
CHECK_DEADLOCK FALSE
