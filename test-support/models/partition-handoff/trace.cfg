\* The trace validation's configuration (`xtask tlc validate partition-handoff`):
\* the constants come from the trace, and TraceUnmatched breaks once every line
\* matched.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Members <- TraceMembers
    Domains <- TraceDomains
    MaxEpoch <- TraceMaxEpoch
INVARIANTS TraceUnmatched TypeOK SingleAdmitter NoConcurrentFetch NewOwnerAdmitsOnlyAfterAck OldOwnerDrainedBeforeSend
CHECK_DEADLOCK FALSE
