\* The nightly job's larger constants: two work items, one a seed and one
\* seeded by a call, at `batches`' level, whose states hold those of
\* `per_attempt`'s (a batch may be written after each lease and outcome),
\* with one resume. small.cfg checks two resumes and both levels.
SPECIFICATION Spec
CONSTANTS
    Copies = {c1, c2}
    Items = {w1, w2}
    Seeds = {w1}
    Levels = {"batches"}
    MaxEpoch = 2
    MaxLease = 1
INVARIANTS TypeOK LeasedNotDone FileBehindMemory NoFetchAfterEnd NoEffectTwice AnsweredKept CheckpointBehind NoStaleWriteLands NoRecordTwice
SYMMETRY CopySymmetry
