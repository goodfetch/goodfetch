\* The trace validation's configuration (`xtask tlc validate run-fencing`):
\* the constants come from the trace, every work item it names is known
\* from the start, at either level, and TraceUnmatched breaks once every
\* line matched.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Copies <- TraceCopies
    Items <- TraceItems
    Seeds <- TraceItems
    Levels = {"per_attempt", "batches"}
    MaxEpoch <- TraceMaxEpoch
    MaxLease <- TraceMaxLease
INVARIANTS TraceUnmatched TypeOK LeasedNotDone FileBehindMemory NoFetchAfterEnd NoEffectTwice AnsweredKept CheckpointBehind NoStaleWriteLands NoRecordTwice
CHECK_DEADLOCK FALSE
