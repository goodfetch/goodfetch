\* A variant that must fail: a resume while the replaced copy lives on
\* makes two writers, the zombie copy the destinations fence.
SPECIFICATION Spec
CONSTANTS
    Copies = {c1, c2}
    Items = {w1}
    Seeds = {w1}
    Levels = {"per_attempt"}
    MaxEpoch = 2
    MaxLease = 1
INVARIANTS OneWriter
