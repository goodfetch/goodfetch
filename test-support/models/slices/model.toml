# Slices and reclaim (ADRs 0041 and 0060): the Usage ledger's Slices taken,
# charged, given back and reclaimed from dead engines' runs, whose
# transitions `ledger` traces under `goodfetch::ledger`.
spec = "Slices.tla"
traces = [
  "crates/goodfetch-engine/src/ledger.rs",
  "crates/goodfetch-engine/src/ledger/",
  "crates/goodfetch-engine/src/runs/slices.rs",
]
# The trace spec, checked with trace.cfg, and the traces of real runs it
# validates: the ledger's trace test writes each one and compares it with
# the committed file.
trace_spec = "TraceSlices.tla"
trace_files = ["crates/goodfetch-engine/src/ledger/tests/trace/two-runs.ndjson"]
