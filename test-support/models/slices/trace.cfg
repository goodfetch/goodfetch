\* The trace validation's configuration (`xtask tlc validate slices`): the
\* constants come from the trace, and TraceUnmatched breaks once every line
\* matched.
INIT TraceInit
NEXT TraceNext
CONSTANTS
    Runs <- TraceRuns
    SliceIds <- TraceSliceIds
    Amount <- TraceAmount
    Share <- TraceShare
    Minimum <- TraceMinimum
    Need <- TraceAmount
    MaxEpoch <- TraceMaxEpoch
INVARIANTS TraceUnmatched WithinLimit UsedWithinSlices NothingEscapes UsedWithinLimit
CHECK_DEADLOCK FALSE
