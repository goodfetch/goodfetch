[project]
name = "goodfetch-test-support"
version = "0.0.0"
description = "Goodfetch's shared pytest plugin (ADR 0062); never published."
requires-python = ">=3.11"
# PyPI refuses an upload that carries this classifier.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "anyio>=4.15.1",
    "jsonschema>=4.26.0",
    "langchain-core>=1.8.4",
    "packaging>=26.3",
    "pydantic>=2.14.1,<3",
    "pytest>=9.1.1",
    "pytest-run-parallel>=0.10.0",
    "trio>=0.35.0",
]

# Every pytest run in the uv workspace loads the plugin.
[project.entry-points.pytest11]
goodfetch_test_support = "goodfetch_test_support.plugin"

# Its tests start the Proving ground, both Products' executables,
# `goodfetch-conformance` and test support's own executables through the test
# tool manifest, so a change to any runs them (`xtask affected`, TESTING.md).
[tool.goodfetch]
runs = [
  "goodfetch-collie",
  "goodfetch-conformance",
  "goodfetch-foxhound",
  "goodfetch-proving-ground",
  "goodfetch-test-support",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10"]
build-backend = "uv_build"
