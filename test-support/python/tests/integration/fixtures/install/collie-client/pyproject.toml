# A fixture wheel of the install harness's tests (spec #326, Seam B): the
# Collie client both fixture Products pin exactly, named as the real one is.
[project]
name = "goodfetch-collie-client"
version = "0.2.0"
description = "A fixture of the install harness's tests; never published."
requires-python = ">=3.11"
