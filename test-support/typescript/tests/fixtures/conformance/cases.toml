# A Console conformance case list in `conformance/console/cases.toml`'s shape
# (ADR 0068), for the reporter's tests: a capability whose case passes, one
# whose case fails, and one that no test runs.

[suite]
name = "console-fixture"
version = "1"

[[capability]]
name = "passing"

[[capability.case]]
id = "the-console-names-the-daemons-product"
covers = []

[[capability]]
name = "failing"

[[capability.case]]
id = "the-console-names-nobody"
covers = []

[[capability]]
name = "untested"

[[capability.case]]
id = "no-test-runs-this-case"
covers = []
