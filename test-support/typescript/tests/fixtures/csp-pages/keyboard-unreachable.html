<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keyboard unreachable</title>
  </head>
  <body>
    <main>
      <h1>Keyboard unreachable</h1>
      <button type="button">Reachable</button>
      <!-- A button by its role that Tab never reaches. -->
      <div role="button">Unreachable</div>
    </main>
  </body>
</html>
