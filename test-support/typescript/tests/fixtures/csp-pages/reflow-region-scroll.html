<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reflow region scroll</title>
    <link rel="stylesheet" href="/reflow.css" />
  </head>
  <body>
    <main>
      <h1>Reflow region scroll</h1>
      <div class="scroller" role="region" aria-label="Summary" tabindex="0">
        <p class="no-wrap">This summary never wraps, so its region scrolls sideways to read it.</p>
      </div>
    </main>
  </body>
</html>
