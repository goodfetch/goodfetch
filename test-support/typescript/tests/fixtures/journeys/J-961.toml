#:schema ../../../../../journeys/journey.schema.json
# A Collie Journey outside the catalog, for the Playwright Journey helper's
# own tests: it touches no page, so its variant starts no Proving ground.
id = "J-961"
title = "Open the Console of Collie's Daemon"
goal = "A person opens the local Console. The Console MUST name the Daemon's Product."
area = 12
product = "collie"
status = "active"
covers = []

[surfaces]
console = "M1"

[[steps]]
text = "Ask the executable for its version"
on = "cli"

[[steps]]
text = "See the system browser open the local Console"
manual = "only a person sees the system browser open on their desktop"

[[steps]]
text = "Open the local Console's address"

[[expect]]
text = "The Console names the Daemon's Product"
