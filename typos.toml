# typos, run by `just lint` on every pull request (STYLE.md). `rnd/` is frozen.
[files]
# `vendor/` holds Goodfetch's forks of crates.io releases (`reqwest`,
# `wreq`, `wreq-util`, `dom_smoothie`, `rs-trafilatura` and the two
# crates it reads trees with),
# kept as their upstreams wrote them but for the changes each marks.
# `journeys/tasks/` holds the Proving ground's task lists, which
# `xtask journeys tasks` writes from seeds (its generated names, such as
# `portal-b6caa2ba`, are no words). `goodfetch-cdp`'s protocol file is
# Chromium's, copied as the pinned build serves it, and its bindings are
# generated from it. The `certificate_file` fuzz seeds are base64 and DER,
# and the `session_bundle` ones base64 of age files.
# The Clean-up rules' Filter lists and stand-ins are their authors' files,
# kept as published (ADR 0047), full of host names and URL fragments.
extend-exclude = ["rnd/", "vendor/", "crates/goodfetch-cdp/protocol.json", "crates/goodfetch-cdp/src/generated/", "Cargo.lock", "pnpm-lock.yaml", "uv.lock", "LICENSE-APACHE", "journeys/tasks/", "crates/goodfetch-engine/fuzz/certificate_file/seeds/", "crates/goodfetch-engine/fuzz/session_bundle/seeds/","crates/goodfetch-clean-up-rules/rules/*.txt", "crates/goodfetch-clean-up-rules/stand-ins/*.js", "crates/goodfetch-clean-up-rules/stand-ins/LICENSE.md", "crates/goodfetch-clean-up-rules/consent/autoconsent/"]

[default]
# Words typos misreads in the ADRs: a vendor's name, "mis-templated",
# "PNGs" and "look-alikes"; and nftables' neighbour-discovery types
# (`nd-router-solicit`) in the egress deny's rules; and TLC's
# `ndJsonDeserialize` operator; and the Proving ground's French and German
# phrases and the "café" its pages spell decomposed, percent-encoded and
# as an HTML entity; and CDP's own misspelt `grantUniveralAccess`, as its
# bindings name it; and the consent pages' German buttons and Cookiebot's
# own element IDs (`…LevelOptinAllowAll`); and the value pages' German date
# (`Februar`) and India's zone abbreviation (`IST`); and ICU4X's
# `writeable` crate and its `Writeable` trait.
# And the rows of ISO 3166-1's country codes `proxy.country` takes
# (`"BA", "BB", …`), no words either. And the owner's words quoted as
# typed in the order of work and ADR 0037's note (« best pratice »), and
# their French answers and options quoted in the ADRs (« Je confirme »,
# « L'ADR 0048 reste tel quel », « fais comme tu recommandes et vas-y »). And the public key of RFC 9421's
# Ed25519 test key (Appendix B.1.4) in Base64url, which tests sign with.
extend-ignore-re = ["ThreatMetrix", "online-metrix", "\\bmis-", "\\bPNGs\\b", "look-alikes", "\\bnd-(router|neighbor)-", "\\bndJson", "(?i)\\bcaf(\\\\u|%C3)", "\\bCaf&eacute;", "für alle", "ses raisons", "\\bgrant_univeral_access\\b", "Alle (akzeptieren|ablehnen)", "LevelOptin", "\\bFebruar\\b", "\\bIST\\b", "\\bwriteable::Writeable\\b", "(?m)^    (\"[A-Z]{2}\", )*\"[A-Z]{2}\",$", "best pratice would build it", "Je confirme", "L'ADR 0048 reste tel quel", "fais comme tu recommandes et vas-y", "JrQLj5P_89iXES9-vFgrIy29clF9CC_oPPsw3c5D0bs"]
