[package]
name = "xtask"
description = "Goodfetch's release and CI tool: the checks and commands the workflows and `just` call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
flate2.workspace = true
glob.workspace = true
# The only Goodfetch crate it builds: the contract types `xtask codegen`
# emits in process. No engine crate (ADR 0072, `xtask
# dependency-direction`): the Products' command lines come from their
# executables' `command-line`.
goodfetch-protocol.workspace = true
jiff.workspace = true
jsonschema.workspace = true
proc-macro2.workspace = true
quick-xml.workspace = true
quote.workspace = true
regex.workspace = true
schemars.workspace = true
serde-saphyr.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
# `xtask release` versions the released manifests in place, keeping their
# comments and layout.
toml_edit.workspace = true
unicode-ident.workspace = true
ureq.workspace = true
goodfetch-workspace-hack.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus"] }

[dev-dependencies]
# The counters `counts`' rows are held to (ADR 0140).
goodfetch-counted-work.workspace = true
# The test tool manifest's Proving ground, for `journeys tasks`' tests.
goodfetch-test-support.workspace = true
insta.workspace = true
# The naming rule's property tests (ADR 0099).
proptest.workspace = true
rstest.workspace = true

# Its tests run the Proving ground and both Products' executables through
# the test tool manifest, so a change to any runs them (TESTING.md, Commands).
[package.metadata.goodfetch]
runs = ["goodfetch-collie", "goodfetch-foxhound", "goodfetch-proving-ground"]

[lints]
workspace = true
