[package]
name = "xtask"
description = "Goodfetch's release and CI tool: the checks and commands the workflows and `just` call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
brotli.workspace = true
clap.workspace = true
flate2.workspace = true
glob.workspace = true
# The namespaces of the generated commands, which `xtask codegen` writes.
goodfetch-cli.workspace = true
# Both Products' command lines, built in process for the `command:`
# Features (ADR 0072).
goodfetch-collie = { workspace = true, features = ["executable"] }
goodfetch-protocol.workspace = true
jiff.workspace = true
jsonschema.workspace = true
proc-macro2.workspace = true
quick-xml.workspace = true
quote.workspace = true
regex.workspace = true
schemars.workspace = true
serde-saphyr.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true
unicode-ident.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus"] }

[dev-dependencies]
# The counters `counts`' rows are held to (ADR 0140).
goodfetch-counted-work.workspace = true
# The test tool manifest's Proving ground, for `journeys tasks`' tests.
goodfetch-test-support.workspace = true
insta.workspace = true
rstest.workspace = true

[lints]
workspace = true
