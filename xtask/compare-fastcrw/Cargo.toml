# fastCRW's side of `just compare` (#2217, spec #2212): one crawl of a
# Proving ground site with fastCRW's server, `crw-server` (AGPL-3.0), run
# as its own process and driven as its users drive it: a crawl job started
# on its HTTP API (`POST /v1/crawl`) and polled until it ends
# (`GET /v1/crawl/{id}`), with each scenario's settings in its
# configuration file. This driver holds no fastCRW code and links none:
# fastCRW is fetched and run locally by the comparison alone, never linked
# into a Product, so no AGPL crate is in this lock or the workspace's.
#
# The pin: crw-server 0.44.2 on crates.io, the newest on 2026-11-14,
# published from tag v0.44.2, commit
# 94621be0f3679cf4b6ca68e31c9badca13abb806 of its repository
# (github.com/fastcrw/crw), with the Cargo.lock it ships, which `--locked`
# holds every crate under it to. Move the pin by changing the version in
# the justfile's `compare` recipe and the version
# `xtask/src/compare/trials.rs` declares (`FASTCRW_VERSION`, which a test
# holds equal to the recipe's).
#
# The build: the repository's pinned toolchain (`rust-toolchain.toml`,
# found above this folder) and, through `server-profile.toml` beside this
# file, the workspace's release profile, as Spider's side is built, so no
# Rust tool has more optimization than Foxhound (fastCRW's own release
# profile is the same, `lto = "fat"` and one codegen unit); with its `cdp`
# feature, the one that drives a Chrome over CDP, for scenario 5. `just
# compare` runs
#
#   cargo --config xtask/compare-fastcrw/server-profile.toml install \
#     --quiet --locked --force crw-server --version =0.44.2 --features cdp \
#     --profile release --target-dir target/compare-spider/fastcrw-server \
#     --root target/compare-spider/fastcrw/release
#   cargo build --locked --manifest-path xtask/compare-fastcrw/Cargo.toml \
#     --profile release --target-dir target/compare-spider/fastcrw
#
# and the comparison runs
# `target/compare-spider/fastcrw/release/goodfetch-compare-fastcrw`, which
# starts `target/compare-spider/fastcrw/release/bin/crw-server` beside it
# (`GOODFETCH_COMPARE_SPIDER_BUILDS` moves the folder, as for Spider's).
[package]
name = "goodfetch-compare-fastcrw"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
# Plain HTTP to the server on the loopback address: no TLS, no compression.
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json = "1"

[workspace]

# The workspace's release profile, so no tool is built with more
# optimization than another.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

# The workspace's `ci` profile, for `just compare ci`'s quicker try.
[profile.ci]
inherits = "release"
lto = "thin"
