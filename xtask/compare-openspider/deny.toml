# cargo-deny's advisory configuration for OpenSpider's side of `just
# compare` (#2216), which `just audit` reads through ci/audit.sh in place of
# the workspace's `deny.toml`, as Spider's side's is, so its exceptions never
# reach the workspace's. Its licenses are checked against the workspace's
# `deny.toml` by `just lint`. The rules are the workspace's; only the ignores
# are its own.

[advisories]
db-path = "${GOODFETCH_ADVISORY_DBS:-target/advisories/rustsec}"
maximum-db-staleness = "P36500D"
unmaintained = "all"
unsound = "all"
yanked = "deny"
# `.cargo/audit.toml` beside this file lists the same IDs for cargo-audit.
# Each crate is unmaintained, comes with OpenSpider v1.0.0-rc.1's crates and
# has no release under them that removes it; each is removed with the
# OpenSpider bump that drops it. The side is run by the comparison alone,
# on loopback, never linked into a Product. Agent decision of issue 2216,
# pending owner review.
ignore = [
  # json: through os-parse's XPath engine (xee-interpreter 0.2.0).
  { id = "RUSTSEC-2022-0081", reason = "through OpenSpider's os-parse and its XPath engine xee-interpreter" },
  # proc-macro-error: a proc-macro run at build time, through xee's xot and
  # its genawaiter.
  { id = "RUSTSEC-2024-0370", reason = "build-time proc-macro, through OpenSpider's os-parse, xee's xot and genawaiter" },
  # zvariant, zbus_names, zvariant_derive: zbus 5's, through os-fetch's
  # keyring and its Secret Service store.
  { id = "RUSTSEC-2026-0370", reason = "zbus 5's, through OpenSpider's os-fetch and keyring's Secret Service store" },
  { id = "RUSTSEC-2026-0371", reason = "zbus 5's, through OpenSpider's os-fetch and keyring's Secret Service store" },
  { id = "RUSTSEC-2026-0372", reason = "zbus 5's, through OpenSpider's os-fetch and keyring's Secret Service store" },
]
