# The license exceptions of Scrapy's side of `just compare` (ADR 0138's
# #1902 note), which `xtask notices --side` reads: every other package of
# this side's `uv.lock` is held to ADR 0018's allowlist, as Spider's side is. Each entry is one package at one version whose metadata
# states its license in no SPDX expression the check can read, or states one
# off the allowlist; its `license` is read from the package's own license
# file, and it is accepted for this side alone, which runs only on the
# machine `just compare` runs on and never ships. A lock update that moves a
# version checks the package again, and an entry no locked package uses
# fails the check. Agent decision, pending owner review.

[[package]]
ecosystem = "python"
name = "aiohappyeyeballs"
version = "2.7.1"
license = "PSF-2.0"
reason = "stated as PSF-2.0, which the allowlist keeps for typing-extensions; permissive, and the side never ships"

