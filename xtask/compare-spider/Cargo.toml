# Spider's side of `just compare` (ADRs 0134 and 0138): one crawl of a
# Proving ground site with Spider, the open-source crate at a pinned
# version, in its HTTP mode, or with its `chrome` feature for the headless
# browser scenario, run locally. It is
# no workspace member, so Spider's dependencies stay out of the Products'
# lock file; its own Cargo.lock pins them, and the recipe builds it with
# `--locked` and the workspace's release settings.
[package]
name = "goodfetch-compare-spider"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
spider = { version = "=2.53.9", default-features = false, features = ["basic", "sync"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
# The allocators Spider's README recommends ("Performance: Global
# Allocator"), each set by the feature of its name below, for the
# sensitivity rows that run Spider on one; mimalloc at the version
# Foxhound's executable links.
tikv-jemallocator = { version = "=0.6.1", optional = true }
mimalloc = { version = "=0.1.52", default-features = false, optional = true }
# The extraction scenario's Main content and title (#2136), set by the
# `extraction` feature below. Spider reads no main content of its own: its
# only path to one is `spider_transformations`, whose readability step is
# `llm_readability`. Both are pinned as that release pairs them, with the
# feature it turns on; the side calls `llm_readability` itself, since
# `spider_transformations`'s text format puts the page's title before its
# text (#2152). `html-escape` decodes the character references Spider's
# page metadata leaves in a title.
spider_transformations = { version = "=2.39.13", optional = true }
llm_readability = { version = "=0.0.17", features = ["tokio"], optional = true }
html-escape = { version = "=0.2.15", optional = true }

# Each executable of the comparison is built apart, with one of these
# features or none, into a target folder of its own (`just compare`), so
# the main row's executable holds no browser code, no other allocator and
# none of the features a sensitivity row turns on.
[features]
# The headless browser scenario's: Spider renders each page in the Chrome
# `CHROME_BIN` names.
chrome = ["spider/chrome"]
# Spider as `cargo add spider` builds it: its default features, io_uring
# among them, on top of the main row's.
defaults = ["spider/default"]
# Spider's `bloom` feature.
bloom = ["spider/bloom"]
# Spider's README's allocator for a pure crawl, and for a crawl that also
# parses.
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
# The extraction scenario's: each page's Main content read by
# `llm_readability`, as `spider_transformations` reads it, and its title
# decoded. Only the extraction scenario's executables are built with it, so
# no other row's Spider is built with what `spider_transformations` turns on.
extraction = ["dep:spider_transformations", "dep:llm_readability", "dep:html-escape"]

# Spider's `basic` features take native TLS for its `disk` feature's
# SQLite (`sqlx`), which is OpenSSL on Linux: built from its source there,
# so no system OpenSSL is needed; macOS's native TLS is the system's own.
# Spider's crawl client is `reqwest`'s rustls, which verifies the
# crawl-like scenario's certificates (#2284) against the platform's roots
# and `SSL_CERT_FILE`.
# Also a build dependency, so the proc-macros Spider's `disk` feature
# builds for the host (sqlx's) link the same vendored OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "=0.10.81", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.build-dependencies]
openssl = { version = "=0.10.81", features = ["vendored"] }

[workspace]

# The workspace's release profile, so neither tool is built with more
# optimization than the other.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

# The workspace's `ci` profile, for `just compare-spider ci`'s quicker try.
[profile.ci]
inherits = "release"
lto = "thin"
