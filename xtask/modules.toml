plan = ["cells", "history", "time"]
time = []
verdict = ["cells", "history"]

# Which of `egress`'s own modules may import which.
[submodules.egress]
canary = ["endpoints", "rules", "windows"]
declarations = ["endpoints"]
endpoints = []
rules = ["endpoints"]
windows = []

# Which of `compat`'s own modules may import which.
[submodules.compat]
coverage = ["registry", "sql", "tree", "writer"]
frozen = ["tree"]
registry = []
sql = []
tag = ["tree"]
tree = []
writer = ["registry", "tree"]

# Which of `notices`'s own modules may import which.
[submodules.notices]
cargo = ["entry"]
entry = []
