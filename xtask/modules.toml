# Which of xtask's top-level modules may import which (ADR 0126).
[modules]
affected = ["foxhound_side", "metadata"]
all_green = ["affected", "check", "github"]
check = ["output"]
codegen = ["check"]
containment = ["check"]
dependency_direction = ["check", "metadata"]
egress = ["check", "workflow"]
fixture_size = ["check", "screenshots"]
foxhound_side = []
github = []
metadata = []
mocking_lockfile = ["check"]
modules = ["check", "metadata"]
no_retry = ["check"]
output = []
quarantine = ["check", "github"]
screenshots = ["check", "output"]
self_hosted = ["check", "workflow"]
size = ["check", "github", "output"]
workflow = []

# Which of `size`'s own modules may import which.
[submodules.size]
budget = []
files = ["budget"]
pull_request = ["budget"]
report = ["budget", "files"]
table = ["budget", "files"]

# Which of `egress`'s own modules may import which.
[submodules.egress]
canary = ["endpoints", "rules"]
declarations = ["endpoints"]
endpoints = []
rules = ["endpoints"]
