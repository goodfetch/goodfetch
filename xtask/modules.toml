# Which of xtask's top-level modules may import which (ADR 0126).
[modules]
affected = ["foxhound_side", "metadata"]
all_green = ["affected", "check", "github"]
allure = ["results"]
ceiling = ["output", "results"]
check = ["output"]
codegen = ["check", "license_allowlist"]
compat = ["check", "metadata", "output"]
containment = ["check"]
dco = ["check"]
dependency_direction = ["check", "metadata"]
egress = ["check", "workflow"]
fixture_size = ["check", "screenshots"]
foxhound_side = []
github = []
license_allowlist = []
metadata = []
mocking_lockfile = ["check"]
modules = ["check", "metadata"]
no_retry = ["check"]
notices = ["check", "license_allowlist", "tree"]
output = []
package_dependencies = ["check", "tree"]
quarantine = ["check", "github"]
release_suite = ["check", "github"]
repeat = ["quarantine"]
results = ["github"]
scan = ["check", "github", "output", "results"]
screenshots = ["check", "output"]
self_hosted = ["check", "workflow"]
size = ["check", "github", "output"]
tree = []
wording = ["check", "tree"]
workflow = []

