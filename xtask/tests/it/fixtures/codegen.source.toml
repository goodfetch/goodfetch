# The codegen fixture's generated files (TESTING.md, Fixtures and data files):
# the marked regions of `deny.toml` and `ci/deny/collie.toml` and every file
# under the `generated/` folders are `xtask codegen`'s output for the
# fixture's `goodfetch-protocol`, crates and `license-allowlist.toml`, and the
# rest is written by hand. Regenerate them after changing the fixture's types
# or `xtask codegen` itself, from the repository root after `just codegen`
# installed the generators.
generator = "xtask codegen"
generators = ["json-schema-to-typescript 16.0.0", "datamodel-code-generator 0.86.0", "ruff 0.17.1"]
date = "2026-10-19"
command = """
cargo build -p xtask && (cd xtask/tests/it/fixtures/codegen && \
  CARGO_TARGET_DIR="$PWD/../../../../../target/fixture-codegen" \
  ../../../../../target/debug/xtask codegen \
    --json2ts "$PWD/../../../../../node_modules/.bin/json2ts" \
    --datamodel-codegen "$PWD/../../../../../.venv/bin/datamodel-codegen")
"""
