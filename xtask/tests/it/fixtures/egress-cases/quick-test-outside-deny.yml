name: pull request
on:
  pull_request:
permissions: {}
jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deny outbound traffic
        run: ci/egress/egress.sh deny
      - name: Refuse the Egress canary
        run: ci/egress/egress.sh canary
      - name: "Test: just test quick"
        run: just test quick
      - name: Check that no other connection was denied
        if: always()
        run: ci/egress/egress.sh check
  all-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Judge the run
        run: cargo run -p xtask -- all-green
