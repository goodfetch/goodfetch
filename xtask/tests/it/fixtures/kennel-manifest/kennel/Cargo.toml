# The Kennel's manifest: the root's lints, `rust-version` and versions of
# the dependencies both declare, with a version, features, dependencies
# and comments of its own.
[workspace]
resolver = "3"
members = []

[workspace.package]
version = "0.1.0"
rust-version = "1.97"

[workspace.dependencies]
goodfetch-protocol = { path = "../crates/goodfetch-protocol" }
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", default-features = false }
toml = { version = "1.1.8", default-features = false }
notify = { version = "8.2.1", default-features = false }

# The root's tables, copied.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
