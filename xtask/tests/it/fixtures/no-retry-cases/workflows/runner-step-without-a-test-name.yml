name: pull request

on:
  pull_request:

env:
  NEXTEST_NO_TESTS: pass

jobs:
  quick:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Downloads before the outbound-traffic deny may retry (ADR 0064).
      - name: Download the pinned toolchain
        run: curl --retry 3 --fail -o toolchain.tar.gz https://example.com/toolchain.tar.gz
      - name: Run the quick suite
        run: cargo nextest run --workspace --profile quick
      - name: Summarize the failed tests
        if: failure()
        continue-on-error: true
        run: ci/junit-summary.sh
