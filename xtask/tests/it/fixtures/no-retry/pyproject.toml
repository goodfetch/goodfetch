[project]
name = "sample"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-timeout>=2.4.0"]

[tool.pytest]
strict = true
addopts = ["--import-mode=importlib", "--junitxml=target/junit/pytest.xml"]
markers = ["slow: takes more than a second"]
timeout = "300"
