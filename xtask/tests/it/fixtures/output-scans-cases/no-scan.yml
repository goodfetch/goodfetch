# An upload with no scan before it.
name: extra

on:
  pull_request:

permissions: {}

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - name: Upload the JUnit files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit
          path: target/junit/
