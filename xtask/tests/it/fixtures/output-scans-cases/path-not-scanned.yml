# The scan covers the JUnit files, but the upload also takes another folder,
# whose name only starts like a scanned one.
name: extra

on:
  pull_request:

permissions: {}

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - name: Scan the job's outputs for secrets
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit
      - name: Upload the reports
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            target/junit/
            target/junit-attachments/
