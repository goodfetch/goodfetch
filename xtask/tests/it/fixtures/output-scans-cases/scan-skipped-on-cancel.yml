# The upload runs after a cancel, but the scan it waits for does not, so
# after a cancel the JUnit files never upload.
name: extra

on:
  pull_request:

permissions: {}

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - name: "Test: just test"
        run: just test
      - name: Scan the job's outputs for secrets
        id: leaks
        if: "!cancelled()"
        run: ci/leaks.sh target/junit/
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit
          path: target/junit/
