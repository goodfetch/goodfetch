# A step writes the uploaded report after the scan ran, so what it wrote
# uploads unscanned.
name: extra

on:
  pull_request:

permissions: {}

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - name: Scan the job's outputs for secrets
        id: leaks
        if: always()
        run: ci/leaks.sh target/report/
      - name: Write the report
        if: always()
        run: just report > target/report/report.md
      - name: Attach the report
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report
          path: target/report/
