# The upload's `if:` names the scan's success, but `|| always()` runs it
# when the scan found a secret too.
name: extra

on:
  pull_request:

permissions: {}

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - name: Scan the job's outputs for secrets
        id: leaks
        if: always()
        run: ci/leaks.sh target/junit/
      - name: Upload the JUnit files
        if: steps.leaks.outcome == 'success' || always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit
          path: target/junit/
