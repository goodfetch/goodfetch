# Every upload follows the job's secret scan of what it uploads, and runs
# only when that scan passed.
name: ci

on:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: "Test: just test"
        run: just test
      - name: Scan the job's outputs for secrets
        id: leaks
        if: always()
        run: ci/vm/exec.sh ci/leaks.sh target/junit/ target/reports
      - name: Upload the JUnit files
        if: always() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit
          path: target/junit/
      - name: Upload the reports
        if: failure() && steps.leaks.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            target/reports/playwright/
            target/junit/nextest.xml

  sizes:
    runs-on: ubuntu-24.04
    steps:
      - name: Measure
        run: just size
      - name: Scan the size reports for secrets
        id: scan
        if: always()
        run: ci/leaks.sh target/size/report-*.json
      - name: Save the size report
        if: steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report
          path: target/size/report-*.json

  # A scan under `!cancelled()` runs after a failed step too.
  archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Build the archive
        run: just archive
      - name: Scan the archive for secrets
        id: leaks
        if: "!cancelled()"
        run: ci/leaks.sh target/archive/
      - name: Upload the archive
        if: "!cancelled() && steps.leaks.outcome == 'success'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive
          path: target/archive/

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Lint
        run: just lint
