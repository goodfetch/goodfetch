[package]
name = "goodfetch-foxhound"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
goodfetch-collie = { path = "../../goodfetch-collie" }

[target.'cfg(unix)'.dependencies]
goodfetch-engine = { path = "../../goodfetch-engine" }

[target.'cfg(unix)'.dev-dependencies]
goodfetch-engine = { workspace = true, features = ["test-util"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
pkg-fmt = "txz"
bin-dir = "{ bin }{ binary-ext }"
