[package]
name = "goodfetch-collie"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
goodfetch-collie-client.workspace = true
goodfetch-engine.workspace = true
goodfetch-workspace-hack.workspace = true

# Stripped by `cargo publish`, so never published.
[dev-dependencies]
goodfetch-test-support = { path = "../goodfetch-test-support" }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
pkg-fmt = "txz"
bin-dir = "{ bin }{ binary-ext }"
