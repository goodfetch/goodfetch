name: pull request
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  quick:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, owner-machine]
    steps:
      - run: just quick all
  hosted:
    runs-on: ubuntu-24.04
    steps:
      - run: echo hosted
  hosted-matrix:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo hosted
