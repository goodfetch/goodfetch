name: after run
on:
  workflow_run:
    workflows: [pull request]
    types: [completed]
permissions: {}
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: echo report
