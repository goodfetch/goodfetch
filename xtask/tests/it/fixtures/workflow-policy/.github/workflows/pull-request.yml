name: pull request
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  quick:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/host-tools
      - uses: docker://alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
      - run: just quick all
  cells:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, windows-2025, macos-15]
        include:
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo hosted
  reused:
    uses: ./.github/workflows/reused.yml
  pinned-call:
    uses: goodfetch/workflows/.github/workflows/check.yml@0123456789abcdef0123456789abcdef01234567
