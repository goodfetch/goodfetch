# zizmor, run on every pull request by `just lint` (STYLE.md; ADR 0067).
rules:
  # Every Action is pinned by a full commit SHA, with its version in a comment
  # (story 1-71). `hash-pin` refuses a tag or branch for every `uses:`.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # The Release suite's cells call the composite action of the commit they
  # check out (`./.github/actions/host-tools`). GitHub's `$/` self-repository
  # syntax would also do, but actionlint 1.7.12 refuses it as an action
  # without a ref, and both linters run in `just lint`.
  self-repository:
    disable: true
